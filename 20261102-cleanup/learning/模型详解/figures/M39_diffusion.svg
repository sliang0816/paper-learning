<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="400" fill="#fff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">扩散模型：学会"去噪"就学会了"生成"</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#6b7280">前向加噪（固定、无参数）↓　反向去噪（U-Net 学习预测噪声）↑</text>

  <!-- forward row -->
  <text x="60" y="92" font-size="11" font-weight="bold" fill="#b91c1c">前向 →</text>
  <g>
    <rect x="100" y="78" width="90" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="145" y="113" text-anchor="middle" font-size="11">x₀ 清晰图</text>
    <rect x="250" y="78" width="90" height="60" rx="6" fill="#bbf7d0" stroke="#16a34a"/><text x="295" y="113" text-anchor="middle" font-size="10">x_t 半噪</text>
    <rect x="400" y="78" width="90" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="445" y="113" text-anchor="middle" font-size="10">更多噪</text>
    <rect x="550" y="78" width="90" height="60" rx="6" fill="#9ca3af" stroke="#6b7280"/><text x="595" y="113" text-anchor="middle" font-size="11" fill="#fff">x_T 纯噪声</text>
  </g>
  <g stroke="#ef4444" stroke-width="1.5" marker-end="url(#r)">
    <line x1="190" y1="108" x2="248" y2="108"/><line x1="340" y1="108" x2="398" y2="108"/><line x1="490" y1="108" x2="548" y2="108"/>
  </g>
  <text x="370" y="70" text-anchor="middle" font-size="9" fill="#b91c1c">每步加少量高斯噪声  xₜ=√ᾱₜ·x₀+√(1−ᾱₜ)·ε</text>

  <!-- reverse row -->
  <text x="60" y="232" font-size="11" font-weight="bold" fill="#1d4ed8">← 反向</text>
  <g>
    <rect x="100" y="218" width="90" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="145" y="253" text-anchor="middle" font-size="11">生成新图</text>
    <rect x="250" y="218" width="90" height="60" rx="6" fill="#bfdbfe" stroke="#3b82f6"/><text x="295" y="253" text-anchor="middle" font-size="10">去噪中</text>
    <rect x="400" y="218" width="90" height="60" rx="6" fill="#93c5fd" stroke="#2563eb"/><text x="445" y="253" text-anchor="middle" font-size="10">去噪中</text>
    <rect x="550" y="218" width="90" height="60" rx="6" fill="#9ca3af" stroke="#6b7280"/><text x="595" y="253" text-anchor="middle" font-size="11" fill="#fff">x_T 纯噪声</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5" marker-end="url(#bl)">
    <line x1="248" y1="248" x2="192" y2="248"/><line x1="398" y1="248" x2="342" y2="248"/><line x1="548" y1="248" x2="492" y2="248"/>
  </g>

  <!-- U-Net box -->
  <rect x="660" y="150" width="120" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="720" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">U-Net</text>
  <text x="720" y="220" text-anchor="middle" font-size="9" fill="#92400e">εθ(xₜ,t)</text>
  <text x="720" y="238" text-anchor="middle" font-size="9" fill="#92400e">预测噪声</text>
  <g stroke="#ca8a04" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#y)">
    <line x1="595" y1="218" x2="690" y2="160"/>
    <line x1="690" y1="262" x2="300" y2="278"/>
  </g>

  <!-- bottom note -->
  <rect x="40" y="306" width="740" height="84" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="328" font-size="10.5" fill="#374151">• 训练目标极简：预测每步混入的噪声，损失 = ‖ε − εθ(xₜ,t)‖²（去噪骨干 = U-Net）。</text>
  <text x="56" y="348" font-size="10.5" fill="#374151">• Stable Diffusion：在 VAE 潜空间(64²)做扩散省算；文本(CLIP 编码)经交叉注意力注入 U-Net → 按文字生成。</text>
  <text x="56" y="368" font-size="10.5" fill="#16a34a">• ControlNet：旁接可训练副本 + 零卷积，输入边缘/掩码等条件图 → 按指定结构生成（本项目用它合成带标注的稀缺类样本）。</text>
  <text x="56" y="384" font-size="9" fill="#6b7280">局限：采样慢（多步）、合成-真实域差距需控制比例。</text>

  <defs>
    <marker id="r" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ef4444"/></marker>
    <marker id="bl" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="y" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ca8a04"/></marker>
  </defs>
</svg>
