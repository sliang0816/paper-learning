<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" font-family="'Microsoft YaHei',sans-serif">
  <rect width="780" height="220" fill="#fff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">LeNet-5：卷积+池化 ×2 → 全连接 ×3</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20"  y="70" width="70" height="70" fill="#e5e7eb" stroke="#9ca3af"/><text x="55" y="108">32×32×1</text><text x="55" y="158" fill="#6b7280">输入</text>
    <rect x="110" y="72" width="62" height="62" fill="#dbeafe" stroke="#3b82f6"/><text x="141" y="106">28×28×6</text><text x="141" y="158" fill="#3b82f6">C1 卷积</text>
    <rect x="192" y="80" width="48" height="48" fill="#bfdbfe" stroke="#3b82f6"/><text x="216" y="107">14×14×6</text><text x="216" y="158" fill="#6b7280">S2 池化</text>
    <rect x="260" y="82" width="44" height="44" fill="#dbeafe" stroke="#3b82f6"/><text x="282" y="107">10×10×16</text><text x="282" y="158" fill="#3b82f6">C3 卷积</text>
    <rect x="324" y="88" width="34" height="34" fill="#bfdbfe" stroke="#3b82f6"/><text x="341" y="109">5×5×16</text><text x="341" y="158" fill="#6b7280">S4 池化</text>
    <rect x="380" y="92" width="22" height="26" fill="#fef3c7" stroke="#f59e0b"/><text x="430" y="109">120</text><text x="430" y="158" fill="#b45309">C5 FC</text>
    <rect x="470" y="92" width="20" height="26" fill="#fef3c7" stroke="#f59e0b"/><text x="510" y="109">84</text><text x="510" y="158" fill="#b45309">F6 FC</text>
    <rect x="560" y="92" width="18" height="26" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="109">10</text><text x="600" y="158" fill="#16a34a">输出</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.4">
    <line x1="92" y1="105" x2="108" y2="105"/><line x1="174" y1="105" x2="190" y2="105"/><line x1="242" y1="105" x2="258" y2="105"/>
    <line x1="306" y1="105" x2="322" y2="105"/><line x1="360" y1="105" x2="378" y2="105"/><line x1="404" y1="105" x2="468" y2="105"/>
    <line x1="492" y1="105" x2="558" y2="105"/>
  </g>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#6b7280">规律：空间尺寸递减（32→28→14→10→5），通道数递增（1→6→16→120）——"通道换分辨率"金字塔</text>
</svg>
