<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="500" fill="#fff"/>
  <text x="410" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">“按 objectness 取 top-N” 怎么取：拉平成一张大表 → 按分数排序 → 截前 N</text>
  <text x="410" y="44" text-anchor="middle" font-size="11" fill="#6b7280">纯排序截断（torch.topk / argsort）——无学习、无阈值、不归一，只按名次砍</text>

  <!-- step1: source of score -->
  <rect x="30" y="62" width="360" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="46" y="82" font-size="12" font-weight="bold" fill="#075985">① 分数从哪来：cls 头的“前景”那一支</text>
  <text x="46" y="102" font-size="10" fill="#374151">每个 anchor 的 cls 头出 2 个 logit（前景/背景）</text>
  <text x="46" y="119" font-size="10" fill="#374151">→ softmax（或 1 个 sigmoid）→ <tspan font-weight="bold" fill="#075985">前景概率 s∈[0,1]</tspan></text>
  <text x="46" y="138" font-size="10" fill="#374151">这个 s = objectness，<tspan font-weight="bold">不是</tspan>背景分、<tspan font-weight="bold">不是</tspan>类别分</text>
  <text x="46" y="153" font-size="9.5" fill="#6b7280">（RPN 类别无关，见 Q60）</text>

  <!-- step2: flatten -->
  <rect x="30" y="172" width="360" height="120" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="46" y="192" font-size="12" font-weight="bold" fill="#1e40af">② 全图拉平成一张大表（不是逐位置各取几个）</text>
  <text x="46" y="210" font-size="10" fill="#374151">所有位置 × 每位置 k 个 anchor 全摊开：</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="50" y="220" width="70" height="20" fill="#fff" stroke="#93c5fd"/><text x="85" y="234">anchor#1  s=.92</text>
    <rect x="50" y="242" width="70" height="20" fill="#fff" stroke="#93c5fd"/><text x="85" y="256">anchor#2  s=.05</text>
    <rect x="50" y="264" width="70" height="20" fill="#fff" stroke="#93c5fd"/><text x="85" y="278">…  ≈ 2 万行</text>
  </g>
  <text x="200" y="240" font-size="10" fill="#374151">每行 = (box, s)。</text>
  <text x="200" y="258" font-size="10" fill="#374151">整张图统一一个候选池，</text>
  <text x="200" y="276" font-size="10" fill="#374151">不为每个位置单独保名额。</text>

  <!-- step3: sort+cut -->
  <rect x="30" y="306" width="360" height="110" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="46" y="326" font-size="12" font-weight="bold" fill="#b45309">③ 按 s 降序排，截前 N（pre-NMS top-N≈6000）</text>
  <text x="46" y="345" font-size="10" fill="#374151">torch.topk(scores, 6000)：取分最高的 N 个，</text>
  <text x="46" y="362" font-size="10" fill="#374151">连带它们的框一起留下，其余直接丢。</text>
  <text x="46" y="382" font-size="9.5" fill="#6b7280">实现上用 topk / argsort，O(M) 或 O(M log N)，GPU 上极快；</text>
  <text x="46" y="397" font-size="9.5" fill="#6b7280">不设分数阈值，纯按名次——保证候选数量稳定。</text>

  <!-- right column: why + funnel position -->
  <rect x="410" y="62" width="380" height="96" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="426" y="82" font-size="12" font-weight="bold" fill="#15803d">为什么 NMS 前先按分数砍一刀</text>
  <text x="426" y="102" font-size="10" fill="#374151">对 2 万框直接 NMS 太慢（两两比 IoU）。</text>
  <text x="426" y="120" font-size="10" fill="#374151">先按 objectness 砍到 6000：高分框几乎都留下，</text>
  <text x="426" y="138" font-size="10" fill="#374151">召回几乎不掉，NMS 却快很多。</text>
  <text x="426" y="153" font-size="9.5" fill="#6b7280">这是“加速”手段，不是“选最终框”。</text>

  <!-- two top-N -->
  <rect x="410" y="172" width="380" height="92" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="426" y="192" font-size="12" font-weight="bold" fill="#6d28d9">两次“取 top-N”都按同一个 objectness 分</text>
  <text x="426" y="212" font-size="10" fill="#374151">· pre-NMS top-N（≈6000）：NMS 之前，给 NMS 减负</text>
  <text x="426" y="230" font-size="10" fill="#374151">· post-NMS top-N（≈300）：NMS 之后，从剩下的里再按分取</text>
  <text x="426" y="250" font-size="9.5" fill="#6b7280">NMS 夹在两次 top-N 之间（见 Q63 漏斗）</text>

  <!-- FPN nuance -->
  <rect x="410" y="278" width="380" height="92" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="426" y="298" font-size="12" font-weight="bold" fill="#b91c1c">细节：带 FPN 时是“逐层各取 top-N 再合并”</text>
  <text x="426" y="318" font-size="10" fill="#374151">多尺度金字塔 P2–P6 上 anchor 太多，</text>
  <text x="426" y="336" font-size="10" fill="#374151">先在<tspan font-weight="bold">每一层</tspan>各取 top-N，再汇总做 NMS，</text>
  <text x="426" y="354" font-size="10" fill="#374151">避免某一层（如大特征图）的框淹没其他层。</text>

  <!-- bottom takeaway -->
  <rect x="30" y="432" width="760" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="410" y="453" text-anchor="middle" font-size="11" fill="#334155">一句话：把全图所有 anchor 的<tspan font-weight="bold" fill="#0369a1">前景概率</tspan>排个序，<tspan font-weight="bold" fill="#b45309">取最高的 N 个</tspan>——是<tspan font-weight="bold">排序截断</tspan>，不是阈值过滤、不是学习、不是 NMS。</text>
  <text x="410" y="472" text-anchor="middle" font-size="10" fill="#6b7280">objectness 高 = 模型觉得“这框里更可能有东西”，所以优先保留它们进入下一步 NMS。</text>
</svg>
