<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 215" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="215" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">20 Faster R-CNN 输入输出实例（RPN 自产候选，端到端）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">图 → CNN 共享特征 → RPN 自产 ~300 候选 → RoI → 检测头 → 框+类别（两阶段标杆）</text>

  <rect x="22" y="70" width="104" height="74" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="74" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入图像</text>
  <text x="74" y="111" text-anchor="middle" font-size="9" fill="#374151">一张图</text>
  <text x="74" y="128" text-anchor="middle" font-size="8" fill="#6b7280">无需外部候选框</text>

  <line x1="126" y1="107" x2="154" y2="107" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="156" y="64" width="120" height="86" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="216" y="84" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#1e40af">CNN 骨干</text>
  <text x="216" y="102" text-anchor="middle" font-size="8.4" fill="#374151">→ 共享特征图</text>
  <text x="216" y="120" text-anchor="middle" font-size="8.4" fill="#374151">两个头共用它</text>
  <text x="216" y="137" text-anchor="middle" font-size="7.8" fill="#6b7280">这是“Faster”的关键</text>

  <line x1="276" y1="107" x2="304" y2="107" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="306" y="64" width="150" height="86" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="381" y="83" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#b45309">① RPN（第一阶段）</text>
  <text x="381" y="101" text-anchor="middle" font-size="8.4" fill="#374151">2 万 anchor → 筛 ~300 候选</text>
  <text x="381" y="117" text-anchor="middle" font-size="8.4" fill="#374151">类别无关：只判“有没有物体”</text>
  <text x="381" y="134" text-anchor="middle" font-size="7.8" fill="#6b7280">替代 Selective Search</text>

  <line x1="456" y1="107" x2="484" y2="107" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="486" y="68" width="158" height="78" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="565" y="87" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#6d28d9">② 检测头（第二阶段）</text>
  <text x="565" y="105" text-anchor="middle" font-size="8.4" fill="#374151">RoI Align → FC → K+1 + 4(K+1)</text>
  <text x="565" y="121" text-anchor="middle" font-size="8.4" fill="#374151">精分类 + 精修框</text>
  <text x="565" y="136" text-anchor="middle" font-size="7.8" fill="#6b7280">= Fast R-CNN 头</text>

  <line x1="644" y1="107" x2="672" y2="107" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="674" y="84" width="118" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="733" y="105" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#15803d">框 + 类别</text>
  <text x="733" y="121" text-anchor="middle" font-size="7.6" fill="#6b7280">NMS → 结果</text>

  <text x="410" y="180" text-anchor="middle" font-size="9.6" fill="#374151">全神经网络、端到端：<tspan font-weight="bold" fill="#b45309">RPN 自产候选</tspan> 替掉慢的 SS，<tspan font-weight="bold" fill="#6d28d9">检测头</tspan> 精修；两阶段精度标杆（本篇 Q14 等深度精读）。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
