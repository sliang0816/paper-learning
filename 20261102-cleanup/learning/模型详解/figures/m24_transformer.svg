<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="620" height="380" fill="#fff"/>
  <text x="310" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Transformer：Encoder–Decoder</text>
  <!-- Encoder -->
  <rect x="60" y="60" width="200" height="270" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Encoder ×N</text>
  <rect x="85" y="100" width="150" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="160" y="118" text-anchor="middle" font-size="11">多头自注意力</text><text x="160" y="133" text-anchor="middle" font-size="9.5" fill="#6b7280">+残差&amp;LayerNorm</text>
  <rect x="85" y="156" width="150" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="160" y="180" text-anchor="middle" font-size="11">前馈网络 FFN</text>
  <text x="160" y="312" text-anchor="middle" font-size="10.5" fill="#6b7280">输入嵌入 + 位置编码</text>
  <!-- Decoder -->
  <rect x="360" y="60" width="200" height="270" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="460" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Decoder ×N</text>
  <rect x="385" y="100" width="150" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="460" y="123" text-anchor="middle" font-size="10.5">掩码自注意力</text>
  <rect x="385" y="148" width="150" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="460" y="171" text-anchor="middle" font-size="10.5">交叉注意力</text>
  <rect x="385" y="196" width="150" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="460" y="219" text-anchor="middle" font-size="10.5">FFN</text>
  <rect x="385" y="266" width="150" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="460" y="287" text-anchor="middle" font-size="11">输出</text>
  <!-- enc->dec -->
  <line x1="260" y1="176" x2="384" y2="166" stroke="#3b82f6" stroke-width="2" marker-end="url(#a17)"/>
  <text x="320" y="160" text-anchor="middle" font-size="10" fill="#3b82f6">K,V</text>
  <line x1="460" y1="232" x2="460" y2="264" stroke="#374151" stroke-width="1.6" marker-end="url(#a17)"/>
  <text x="310" y="355" text-anchor="middle" font-size="11.5" fill="#6b7280">完全并行 + 全局感受野；是 BERT/GPT/ViT/CLIP 的共同底座</text>
  <defs><marker id="a17" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
