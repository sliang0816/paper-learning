<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Microsoft YaHei',sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">感知机：加权求和 + 激活</text>
  <!-- inputs -->
  <g font-size="13">
    <circle cx="80" cy="90" r="20" fill="#dbeafe" stroke="#3b82f6"/><text x="80" y="95" text-anchor="middle">x₁</text>
    <circle cx="80" cy="150" r="20" fill="#dbeafe" stroke="#3b82f6"/><text x="80" y="155" text-anchor="middle">x₂</text>
    <circle cx="80" cy="210" r="20" fill="#dbeafe" stroke="#3b82f6"/><text x="80" y="215" text-anchor="middle">x₃</text>
  </g>
  <!-- weights lines -->
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="100" y1="90" x2="270" y2="150" marker-end="url(#a)"/>
    <line x1="100" y1="150" x2="270" y2="150" marker-end="url(#a)"/>
    <line x1="100" y1="210" x2="270" y2="150" marker-end="url(#a)"/>
  </g>
  <text x="175" y="108" font-size="12" fill="#b45309">w₁</text>
  <text x="180" y="143" font-size="12" fill="#b45309">w₂</text>
  <text x="175" y="195" font-size="12" fill="#b45309">w₃</text>
  <!-- sum -->
  <circle cx="300" cy="150" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="148" text-anchor="middle" font-size="15">Σwᵢxᵢ</text>
  <text x="300" y="165" text-anchor="middle" font-size="12">+b</text>
  <!-- activation -->
  <line x1="330" y1="150" x2="380" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="382" y="120" width="90" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="427" y="146" text-anchor="middle" font-size="13">激活 f</text>
  <text x="427" y="165" text-anchor="middle" font-size="11" fill="#6b7280">(阶跃/ReLU)</text>
  <!-- output -->
  <line x1="472" y1="150" x2="525" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="555" cy="150" r="22" fill="#fce7f3" stroke="#db2777"/><text x="555" y="155" text-anchor="middle" font-size="14">y</text>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#6b7280">多层堆叠（每层后接非线性激活）即多层感知机 MLP；用反向传播训练权重 w、b</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
