<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="500" fill="#fff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q116 为什么 QKV 是投影矩阵得到的，而不是直接用原先的序列</text>

  <!-- 左：不用投影 -->
  <rect x="20" y="44" width="440" height="190" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="240" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">✗ 不用投影：x 同时当 Q、K、V</text>
  <rect x="60" y="84" width="100" height="36" rx="4" fill="#fca5a5" stroke="#ef4444"/>
  <text x="110" y="106" text-anchor="middle" font-size="9" fill="#b91c1c">x₁ = "I"</text>
  <rect x="60" y="130" width="100" height="36" rx="4" fill="#fca5a5" stroke="#ef4444"/>
  <text x="110" y="152" text-anchor="middle" font-size="9" fill="#b91c1c">x₂ = "love"</text>
  <text x="175" y="110" font-size="11" fill="#9ca3af">→</text>
  <rect x="200" y="80" width="240" height="86" rx="5" fill="#fee2e2" stroke="#ef4444"/>
  <text x="320" y="100" text-anchor="middle" font-size="9.5" fill="#b91c1c">同一个 x 同时充当</text>
  <text x="320" y="118" text-anchor="middle" font-size="10" fill="#b91c1c">Q（提问）· K（被查）· V（取值）</text>
  <text x="320" y="138" text-anchor="middle" font-size="9" fill="#b91c1c">→ 角色冲突、非对称信息丢失</text>
  <text x="320" y="156" text-anchor="middle" font-size="8.5" fill="#6b7280">Q·K 退化对称——丢失"提问≠被找方向"</text>
  <text x="40" y="194" font-size="9" fill="#374151">例子："I"作为 Q 要找动词(run)，作为 K 被名词查——两者方向应不同</text>
  <text x="40" y="216" font-size="9" fill="#b91c1c">但用同一个 x，只能比笼统相似度→"Q=I 找什么"和"K=I 被谁查"混一起了</text>

  <!-- 右：用投影 -->
  <rect x="480" y="44" width="440" height="190" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="700" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">✓ 用投影：同一个 x 变成三个"人格"</text>
  <rect x="500" y="84" width="64" height="36" fill="#e5e7eb" stroke="#9ca3af"/><text x="532" y="106" text-anchor="middle" font-size="9" fill="#374151">x</text>
  <text x="570" y="106" font-size="11" fill="#9ca3af">→</text>
  <rect x="588" y="76" width="80" height="22" rx="4" fill="#bfdbfe" stroke="#3b82f6"/><text x="628" y="91" text-anchor="middle" font-size="9" fill="#1e40af">Q = x·W_Q</text>
  <rect x="588" y="104" width="80" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="628" y="119" text-anchor="middle" font-size="9" fill="#b45309">K = x·W_K</text>
  <rect x="588" y="132" width="80" height="22" rx="4" fill="#c7d2fe" stroke="#6366f1"/><text x="628" y="147" text-anchor="middle" font-size="9" fill="#4338ca">V = x·W_V</text>
  <text x="680" y="106" font-size="11" fill="#9ca3af">→</text>
  <rect x="700" y="80" width="190" height="86" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="795" y="100" text-anchor="middle" font-size="9" fill="#15803d">三个方向各干各的：</text>
  <text x="795" y="118" text-anchor="middle" font-size="9" fill="#1e40af">Q 问、K 被查、V 贡献</text>
  <text x="795" y="138" text-anchor="middle" font-size="8.5" fill="#6b7280">可非对称："I如何找run"≠"I如何被找到"</text>
  <text x="795" y="154" text-anchor="middle" font-size="8.5" fill="#15803d">三个投影独立、互不冲突</text>

  <!-- 第四段：两头的好处 -->
  <rect x="20" y="248" width="900" height="130" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="470" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">附加：投影不止给"多人格"，还顺手解决多头降维</text>
  <text x="40" y="296" font-size="9.5" fill="#374151">· 用投影意味着可以控制"打到多少维"——比如 d_model=512 → W_Q=(512×64)、出 64 维</text>
  <text x="40" y="316" font-size="9.5" fill="#374151">· 这正好是多头要的：d_k = d_model / h —— 举 h=8 个头的例子就是把 512 维映射到 64 维子空间</text>
  <text x="40" y="338" font-size="9.5" fill="#15803d">→ 投影"给三种人格 + 顺手降维到多头各管的子空间"，两层一起省掉额外设计</text>

  <rect x="20" y="390" width="900" height="96" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="416" text-anchor="middle" font-size="11" font-weight="bold" fill="#a16207">一句话：不用投影 → 同一向量既提问又做标签又被取值 → 角色冲突、丢失非对称</text>
  <text x="470" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#a16207">用投影 → 三个独立方向(三套参数)各司其职 + 顺手降维供多头</text>
  <text x="470" y="468" text-anchor="middle" font-size="9" fill="#6b7280">所以"W_Q/W_K/W_V 是学好而非写死"——投影给自由度让模型学到：同一 token 的 Q(我要找谁)≠K(谁能找到我)≠V(我贡献什么)</text>
</svg>
