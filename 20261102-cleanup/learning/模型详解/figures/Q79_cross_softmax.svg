<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Microsoft YaHei',sans-serif">
  <rect width="900" height="560" fill="#fff"/>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q79 交叉注意力 road:0.80 是怎么来的（生成“路”那个位置）</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#6b7280">同一套注意力公式：score=Q·K/√d → softmax → 加权求和 V。这里只算“路”位置对 3 个源词的权重</text>

  <!-- step 1 Q and K -->
  <rect x="20" y="60" width="860" height="92" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">① 准备 Q 和 K（都来自向量过投影矩阵）</text>
  <text x="34" y="100" font-size="9.5" fill="#374151"><tspan font-weight="bold">Q</tspan> = “路”位置的解码器向量 × W_Q —— 它已从上下文“我 爱 ___”+查过源句，编码了“接下来要译那个表地点的词”</text>
  <text x="34" y="118" font-size="9.5" fill="#374151"><tspan font-weight="bold">K_I, K_love, K_road</tspan> = 编码器 memory(m_I,m_love,m_road) × W_K（各 512 维）</text>
  <text x="34" y="138" font-size="9" fill="#6b7280">W_Q/W_K 是训练学出来的：让“该对齐的词”方向相近（点积大）。所以 Q 和 K_road 最对齐。</text>

  <!-- step 2 dot products -->
  <rect x="20" y="164" width="420" height="120" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="230" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">② 点积 Q·K_i（512 维逐位相乘再累加）</text>
  <g font-size="10">
    <rect x="40" y="198" width="380" height="22" fill="#fff" stroke="#93c5fd"/><text x="50" y="214" fill="#374151">Q·K_I    ≈  0     （方向几乎不相关）</text>
    <rect x="40" y="224" width="380" height="22" fill="#fff" stroke="#93c5fd"/><text x="50" y="240" fill="#374151">Q·K_love ≈ 25</text>
    <rect x="40" y="250" width="380" height="22" fill="#bfdbfe" stroke="#3b82f6"/><text x="50" y="266" font-weight="bold" fill="#1e40af">Q·K_road ≈ 63   （最对齐→点积最大）</text>
  </g>

  <!-- step 3 scale -->
  <rect x="460" y="164" width="420" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="670" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">③ 除以 √d（=√512≈22.6）缩放</text>
  <text x="474" y="206" font-size="9" fill="#374151">512 维累加值偏大，缩放防 softmax 过尖（梯度稳）</text>
  <g font-size="10">
    <rect x="474" y="216" width="392" height="20" fill="#fff" stroke="#c4b5fd"/><text x="484" y="231" fill="#374151">I    : 0   ÷22.6 = 0</text>
    <rect x="474" y="240" width="392" height="20" fill="#fff" stroke="#c4b5fd"/><text x="484" y="255" fill="#374151">love : 25  ÷22.6 = 1.11</text>
    <rect x="474" y="264" width="392" height="16" fill="#ddd6fe" stroke="#8b5cf6"/><text x="484" y="277" fill="#6d28d9">road : 63  ÷22.6 = 2.79</text>
  </g>

  <!-- step 4 softmax -->
  <rect x="20" y="296" width="860" height="150" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">④ softmax：先取 e^x（放大差距），再归一化成和为 1 的权重</text>
  <g font-size="10">
    <text x="40" y="342" fill="#374151">e^0 = 1.00　　　　 e^1.11 = 3.03　　　　 e^2.79 = 16.3</text>
    <text x="40" y="364" fill="#374151">和 = 1.00 + 3.03 + 16.3 = 20.3</text>
  </g>
  <g font-size="10.5">
    <rect x="40" y="376" width="260" height="24" fill="#fff" stroke="#86efac"/><text x="50" y="393" fill="#374151">I    = 1.00 / 20.3 = <tspan font-weight="bold">0.05</tspan></text>
    <rect x="312" y="376" width="260" height="24" fill="#fff" stroke="#86efac"/><text x="322" y="393" fill="#374151">love = 3.03 / 20.3 = <tspan font-weight="bold">0.15</tspan></text>
    <rect x="584" y="376" width="280" height="24" fill="#bbf7d0" stroke="#16a34a"/><text x="594" y="393" fill="#15803d">road = 16.3 / 20.3 = <tspan font-weight="bold">0.80</tspan></text>
  </g>
  <text x="450" y="422" text-anchor="middle" font-size="9.5" fill="#b91c1c">关键：softmax 的 e^x 把“缩放后差 1.68”（2.79 vs 1.11）放大成“概率约 5 倍”（0.80 vs 0.15）</text>
  <text x="450" y="440" text-anchor="middle" font-size="9" fill="#6b7280">→ 不是 road 点积大一点点就五五开，指数放大让“最对齐者”拿走大头</text>

  <!-- step 5 weighted sum -->
  <rect x="20" y="458" width="860" height="80" rx="8" fill="#f0f9ff" stroke="#93c5fd"/>
  <text x="450" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">⑤ 用这组权重对 V 加权求和 → 该位置吸到的上下文</text>
  <text x="450" y="500" text-anchor="middle" font-size="10" fill="#374151">context = 0.05·V_I + 0.15·V_love + <tspan font-weight="bold" fill="#1e40af">0.80·V_road</tspan> ≈ 以 road 的信息为主</text>
  <text x="450" y="522" text-anchor="middle" font-size="9" fill="#6b7280">→ 再过 FFN、输出投影 512→3万、softmax → “路 0.90” → argmax 取“路”。这就是“路对齐到 road”的全过程</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
