<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="'Microsoft YaHei',sans-serif">
  <rect width="840" height="470" fill="#fff"/>
  <text x="420" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">RNN 的输入输出：进出都是向量；整体输出形态看任务（5 种模式）</text>

  <!-- top: per-step -->
  <text x="420" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">① 每个时间步：输入 xₜ（向量）→ 更新记忆 hₜ →（可选）输出 yₜ</text>
  <g font-size="11" text-anchor="middle">
    <rect x="300" y="64" width="80" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="340" y="82">词/信号</text>
    <rect x="400" y="64" width="90" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="445" y="82">xₜ 向量(嵌入)</text>
    <rect x="510" y="64" width="70" height="26" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="545" y="82">hₜ 记忆</text>
    <rect x="600" y="64" width="80" height="26" rx="4" fill="#bbf7d0" stroke="#15803d"/><text x="640" y="82">yₜ=Wᵧhₜ</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.3" marker-end="url(#b)">
    <line x1="380" y1="77" x2="398" y2="77"/><line x1="490" y1="77" x2="508" y2="77"/><line x1="580" y1="77" x2="598" y2="77"/>
  </g>
  <text x="420" y="106" text-anchor="middle" font-size="9" fill="#6b7280">文字/信号必须先变成向量才能进 RNN；hₜ 是内部记忆，不等于最终输出</text>

  <!-- 5 modes -->
  <text x="420" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">② 整条序列的输入→输出：5 种模式（绿=输出 蓝=输入 灰=隐藏态）</text>

  <!-- helper: each mode mini diagram -->
  <!-- mode1 one-to-one -->
  <g>
    <text x="100" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">一对一</text>
    <rect x="86" y="230" width="28" height="20" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="86" y="196" width="28" height="20" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="86" y="170" width="28" height="18" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="100" y="268" text-anchor="middle" font-size="8" fill="#6b7280">≈MLP</text>
  </g>
  <!-- mode2 one-to-many -->
  <g>
    <text x="240" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">一对多</text>
    <rect x="200" y="230" width="28" height="20" fill="#dbeafe" stroke="#3b82f6"/>
    <g fill="#e5e7eb" stroke="#9ca3af"><rect x="200" y="196" width="28" height="20"/><rect x="234" y="196" width="28" height="20"/><rect x="268" y="196" width="28" height="20"/></g>
    <g fill="#bbf7d0" stroke="#16a34a"><rect x="200" y="170" width="28" height="18"/><rect x="234" y="170" width="28" height="18"/><rect x="268" y="170" width="28" height="18"/></g>
    <text x="248" y="268" text-anchor="middle" font-size="8" fill="#6b7280">看图说话</text>
  </g>
  <!-- mode3 many-to-one -->
  <g>
    <text x="380" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">多对一</text>
    <g fill="#dbeafe" stroke="#3b82f6"><rect x="338" y="230" width="28" height="20"/><rect x="372" y="230" width="28" height="20"/><rect x="406" y="230" width="28" height="20"/></g>
    <g fill="#e5e7eb" stroke="#9ca3af"><rect x="338" y="196" width="28" height="20"/><rect x="372" y="196" width="28" height="20"/><rect x="406" y="196" width="28" height="20"/></g>
    <rect x="406" y="170" width="28" height="18" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="386" y="268" text-anchor="middle" font-size="8" fill="#6b7280">情感分类(取h_T)</text>
  </g>
  <!-- mode4 many-to-many aligned -->
  <g>
    <text x="540" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">多对多(等长)</text>
    <g fill="#dbeafe" stroke="#3b82f6"><rect x="498" y="230" width="28" height="20"/><rect x="532" y="230" width="28" height="20"/><rect x="566" y="230" width="28" height="20"/></g>
    <g fill="#e5e7eb" stroke="#9ca3af"><rect x="498" y="196" width="28" height="20"/><rect x="532" y="196" width="28" height="20"/><rect x="566" y="196" width="28" height="20"/></g>
    <g fill="#bbf7d0" stroke="#16a34a"><rect x="498" y="170" width="28" height="18"/><rect x="532" y="170" width="28" height="18"/><rect x="566" y="170" width="28" height="18"/></g>
    <text x="546" y="268" text-anchor="middle" font-size="8" fill="#6b7280">词性标注</text>
  </g>
  <!-- mode5 seq2seq -->
  <g>
    <text x="710" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">多对多(不等长)</text>
    <g fill="#dbeafe" stroke="#3b82f6"><rect x="662" y="230" width="26" height="20"/><rect x="692" y="230" width="26" height="20"/><rect x="722" y="230" width="26" height="20"/></g>
    <g fill="#e5e7eb" stroke="#9ca3af"><rect x="662" y="200" width="26" height="18"/><rect x="692" y="200" width="26" height="18"/><rect x="722" y="200" width="26" height="18"/></g>
    <rect x="748" y="200" width="14" height="18" fill="#fef9c3" stroke="#ca8a04"/><text x="755" y="213" font-size="7" fill="#a16207">c</text>
    <g fill="#bbf7d0" stroke="#16a34a"><rect x="700" y="170" width="26" height="18"/><rect x="730" y="170" width="26" height="18"/></g>
    <text x="710" y="268" text-anchor="middle" font-size="8" fill="#6b7280">翻译(编码→解码)</text>
  </g>

  <!-- bottom -->
  <rect x="40" y="288" width="760" height="166" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="310" font-size="11.5" font-weight="bold" fill="#374151">小结：</text>
  <text x="56" y="332" font-size="10.5" fill="#374151">• <tspan font-weight="bold" fill="#1d4ed8">输入</tspan>：永远是一串向量 x₁,…,x_T（文字先经嵌入、信号取特征）。长度 T 任意（参数共享，见 Q44）。</text>
  <text x="56" y="354" font-size="10.5" fill="#374151">• <tspan font-weight="bold" fill="#15803d">输出</tspan>：看任务 —— 取最后 h_T 得"一个结果"（多对一），或每步取 yₜ 得"一串结果"（多对多）。</text>
  <text x="56" y="376" font-size="10.5" fill="#374151">• <tspan font-weight="bold">hₜ</tspan> 是沿时间滚动的内部记忆，不是输出本身；yₜ = Wᵧhₜ 才是该步对外的输出。</text>
  <text x="56" y="398" font-size="10.5" fill="#374151">• 语言模型里 yₜ 经 softmax = "下一个词的概率"；分类里只在末端接一个分类头。</text>
  <text x="56" y="424" font-size="10" fill="#6b7280">例"我爱路"：先变 3 个词向量 → 多对一只看 h₃ 出标签；Seq2Seq 编码成 c 再解码出 "I love road"（见第四节）。</text>
  <text x="56" y="444" font-size="10" fill="#6b7280">五模式图源自 Karpathy "The Unreasonable Effectiveness of RNNs"。</text>

  <defs>
    <marker id="b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
