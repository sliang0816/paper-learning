<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="340" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Non-local Networks：CNN 中的全局自注意力（跨越局部感受野）</text>

  <!-- ===== Left: Local conv ===== -->
  <text x="170" y="52" text-anchor="middle" font-size="11.5" fill="#ef4444">局部卷积（感受野有限）</text>
  <rect x="20" y="62" width="300" height="140" rx="6" fill="#fff5f5" stroke="#ef4444" stroke-dasharray="4 2"/>

  <!-- Grid of pixels -->
  <g font-size="8.5" text-anchor="middle" fill="#374151">
    <rect x="40" y="74" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="51" y="90">p₁</text>
    <rect x="66" y="74" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="77" y="90">p₂</text>
    <rect x="92" y="74" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="103" y="90">p₃</text>
    <rect x="118" y="74" width="22" height="22" rx="2" fill="#e5e7eb" stroke="#9ca3af"/><text x="129" y="90">p₄</text>
    <rect x="144" y="74" width="22" height="22" rx="2" fill="#e5e7eb" stroke="#9ca3af"/><text x="155" y="90">p₅</text>

    <rect x="40" y="100" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="51" y="116">p₆</text>
    <rect x="66" y="100" width="22" height="22" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="77" y="116">★</text>
    <rect x="92" y="100" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="103" y="116">p₈</text>
    <rect x="118" y="100" width="22" height="22" rx="2" fill="#e5e7eb" stroke="#9ca3af"/><text x="129" y="116">p₉</text>
    <rect x="144" y="100" width="22" height="22" rx="2" fill="#e5e7eb" stroke="#9ca3af"/><text x="155" y="116">p₁₀</text>

    <rect x="40" y="126" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="51" y="142">p₁₁</text>
    <rect x="66" y="126" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="77" y="142">p₁₂</text>
    <rect x="92" y="126" width="22" height="22" rx="2" fill="#fecaca" stroke="#ef4444"/><text x="103" y="142">p₁₃</text>
    <rect x="118" y="126" width="22" height="22" rx="2" fill="#e5e7eb" stroke="#9ca3af"/><text x="129" y="142">p₁₄</text>
    <rect x="144" y="126" width="22" height="22" rx="2" fill="#e5e7eb" stroke="#9ca3af"/><text x="155" y="142">p₁₅</text>
  </g>
  <rect x="37" y="71" width="82" height="83" rx="3" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 1"/>
  <text x="170" y="96" font-size="9.5" fill="#ef4444">3×3 感受野</text>
  <text x="170" y="110" font-size="9.5" fill="#ef4444">★ 只看红色邻居</text>

  <text x="170" y="170" text-anchor="middle" font-size="9.5" fill="#374151">n 层 3×3 卷积 = n² 像素感受野</text>
  <text x="170" y="186" text-anchor="middle" font-size="9.5" fill="#ef4444">远距离关系需要很多层才能建立</text>
  <text x="170" y="200" text-anchor="middle" font-size="9.5" fill="#ef4444">（视频中：帧间时序关系更难捕捉）</text>

  <!-- ===== Right: Non-local block ===== -->
  <text x="590" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">Non-local Block（全局注意力）</text>

  <rect x="348" y="62" width="450" height="200" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- Input x -->
  <rect x="362" y="76" width="80" height="36" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="402" y="93" text-anchor="middle" font-size="10">输入 x</text>
  <text x="402" y="107" text-anchor="middle" font-size="8.5" fill="#6b7280">T×H×W×C</text>

  <!-- Three branches -->
  <g stroke="#7c3aed" stroke-width="1.2">
    <line x1="402" y1="112" x2="402" y2="130"/>
    <line x1="402" y1="130" x2="468" y2="130"/>
    <line x1="402" y1="130" x2="402" y2="130"/>
    <line x1="402" y1="130" x2="336" y2="130"/>
  </g>
  <!-- Actually we'll do a simpler layout with 3 1x1 conv branches -->
  <g stroke="#7c3aed" stroke-width="1.2" marker-end="url(#av)">
    <line x1="362" y1="130" x2="362" y2="148"/>
    <line x1="402" y1="130" x2="508" y2="148"/>
    <line x1="442" y1="130" x2="620" y2="148"/>
  </g>

  <rect x="330" y="148" width="80" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="370" y="165" text-anchor="middle" font-size="10">θ(x)</text>
  <text x="370" y="179" text-anchor="middle" font-size="8.5" fill="#1d4ed8">1×1 conv</text>

  <rect x="468" y="148" width="80" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="508" y="165" text-anchor="middle" font-size="10">φ(x)</text>
  <text x="508" y="179" text-anchor="middle" font-size="8.5" fill="#1d4ed8">1×1 conv</text>

  <rect x="580" y="148" width="80" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="620" y="165" text-anchor="middle" font-size="10">g(x)</text>
  <text x="620" y="179" text-anchor="middle" font-size="8.5" fill="#15803d">1×1 conv</text>

  <!-- Affinity + softmax -->
  <rect x="380" y="208" width="180" height="36" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="470" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">亲和矩阵 f(θ,φ)</text>
  <text x="470" y="241" text-anchor="middle" font-size="9.5" fill="#b45309">= softmax(θᵀφ) 或 dot product</text>

  <g stroke="#374151" stroke-width="1.3" marker-end="url(#a)">
    <line x1="370" y1="184" x2="430" y2="206"/>
    <line x1="508" y1="184" x2="490" y2="206"/>
  </g>

  <!-- Output -->
  <rect x="560" y="208" width="108" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="614" y="225" text-anchor="middle" font-size="10">y = W·(f·g)</text>
  <text x="614" y="240" text-anchor="middle" font-size="8.5" fill="#15803d">+ 残差加回</text>

  <g stroke="#374151" stroke-width="1.3" marker-end="url(#a)">
    <line x1="560" y1="226" x2="528" y2="226"/>
    <line x1="620" y1="184" x2="620" y2="206"/>
  </g>

  <!-- Formula -->
  <text x="590" y="278" text-anchor="middle" font-size="10.5" fill="#374151">y_i = (1/C(x)) Σⱼ f(xᵢ, xⱼ)·g(xⱼ)</text>
  <text x="590" y="296" text-anchor="middle" font-size="9.5" fill="#6b7280">xᵢ 是查询位置，xⱼ 是所有位置（包括远处）</text>

  <!-- Bottom comparison -->
  <rect x="20" y="278" width="300" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="170" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065f46">Non-local 的关键意义</text>
  <text x="170" y="314" text-anchor="middle" font-size="9.5" fill="#374151">CNN 中第一个全局自注意力操作</text>
  <text x="170" y="328" text-anchor="middle" font-size="9.5" fill="#374151">可插入视频骨干任意位置，时空同时建模</text>

  <!-- Bottom full note -->
  <rect x="20" y="314" width="780" height="20" rx="4" fill="#fff"/>
  <rect x="340" y="302" width="460" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="570" y="318" text-anchor="middle" font-size="9.5" fill="#374151">Non-local → ViT Self-Attention（all tokens）→ CBAM 空间注意力（局部）：三者是"全局→全局→局部"的谱系</text>

  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
    <marker id="av" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
