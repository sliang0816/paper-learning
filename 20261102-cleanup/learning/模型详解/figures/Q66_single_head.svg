<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" font-family="'Microsoft YaHei',sans-serif">
  <rect width="850" height="540" fill="#fff"/>
  <text x="425" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">FC7 之后能不能不分两头、像 YOLOv1 那样一把预测“类别+框”？</text>
  <text x="425" y="44" text-anchor="middle" font-size="11" fill="#6b7280">两种理解 → 两种答案：① 合并末层＝数学等价（白合并）；② 照搬 YOLOv1 架构＝变单阶段（另一种检测器）</text>

  <!-- Reading 1: merge final layer -->
  <rect x="24" y="60" width="800" height="156" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="40" y="82" font-size="13" font-weight="bold" fill="#15803d">理解① “合并 FC7 后那两个线性层” —— 其实你现在就几乎是了，合并＝数学等价</text>

  <!-- current two heads -->
  <rect x="44" y="96" width="78" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="83" y="115" text-anchor="middle" font-size="10" fill="#1e40af">FC7</text>
  <text x="83" y="130" text-anchor="middle" font-size="9" fill="#6b7280">4096 维</text>
  <line x1="122" y1="110" x2="150" y2="100" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="122" y1="128" x2="150" y2="138" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="152" y="84" width="118" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="211" y="103" text-anchor="middle" font-size="9.5" fill="#15803d">线性 → K+1</text>
  <rect x="152" y="122" width="118" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="211" y="141" text-anchor="middle" font-size="9.5" fill="#b45309">线性 → 4(K+1)</text>
  <text x="211" y="166" text-anchor="middle" font-size="9" fill="#6b7280">两个并排线性层</text>

  <text x="300" y="122" text-anchor="middle" font-size="20" fill="#16a34a">≡</text>

  <!-- merged one layer -->
  <rect x="330" y="96" width="78" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="369" y="115" text-anchor="middle" font-size="10" fill="#1e40af">FC7</text>
  <text x="369" y="130" text-anchor="middle" font-size="9" fill="#6b7280">4096 维</text>
  <line x1="408" y1="118" x2="436" y2="118" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="438" y="100" width="150" height="36" rx="5" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="513" y="116" text-anchor="middle" font-size="9.5" fill="#4338ca">一个线性层 →</text>
  <text x="513" y="130" text-anchor="middle" font-size="9.5" fill="#4338ca">(K+1) + 4(K+1)</text>
  <text x="513" y="166" text-anchor="middle" font-size="9" fill="#6b7280">一次 matmul，输出拼接向量</text>

  <rect x="610" y="92" width="200" height="104" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="710" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">为什么等价</text>
  <text x="624" y="128" font-size="8.8" fill="#374151">线性映射到“拼接输出”＝各块</text>
  <text x="624" y="142" font-size="8.8" fill="#374151">独立的线性映射，块间本就没有</text>
  <text x="624" y="156" font-size="8.8" fill="#374151">权重共享。所以“两个头”只是</text>
  <text x="624" y="170" font-size="8.8" fill="#374151">记账分组，算出来一模一样。</text>
  <text x="624" y="186" font-size="8.8" fill="#b91c1c">合并并没有省下任何东西。</text>

  <!-- loss still split -->
  <rect x="24" y="226" width="800" height="74" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="40" y="248" font-size="12" font-weight="bold" fill="#6d28d9">而且：叫一个头还是两个头，都躲不掉“切片 + 两套损失”</text>
  <text x="40" y="270" font-size="10" fill="#374151">输出向量必须切成两段：<tspan font-weight="bold" fill="#16a34a">类别段 → softmax + 交叉熵</tspan>　｜　<tspan font-weight="bold" fill="#d97706">框段 → Smooth L1</tspan>（回归还是类别专属 4(K+1)）</text>
  <text x="40" y="290" font-size="9.5" fill="#6b7280">连 YOLOv1 的“一个张量 7×7×30”也要切成 坐标/置信度/类别 分别算损失（还带 λ_coord、λ_noobj）。一个头 ≠ 一个损失。</text>

  <!-- Reading 2: full YOLOv1 -->
  <rect x="24" y="310" width="800" height="138" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="332" font-size="13" font-weight="bold" fill="#b91c1c">理解② “照搬 YOLOv1 架构” —— 去掉 RoI/两阶段，网格直接出张量 ＝ 变成单阶段检测器</text>
  <text x="40" y="354" font-size="10" fill="#374151">这就不只是合并末层了，而是丢掉 Faster 的两阶段结构（RPN 候选 + RoI 对齐 + 逐区域 FC 精修），</text>
  <text x="40" y="372" font-size="10" fill="#374151">改成“在卷积特征的网格上一把回归 框+类别”。这条路<tspan font-weight="bold">走得通</tspan>——它就是 YOLO 线。</text>

  <g font-size="9" text-anchor="middle">
    <rect x="44" y="384" width="240" height="50" rx="5" fill="#fff" stroke="#fca5a5"/>
    <text x="164" y="402" font-weight="bold" fill="#b91c1c">YOLOv1 的“直接预测”还不一样</text>
    <text x="164" y="417" fill="#374151">框是<tspan font-weight="bold">类别无关</tspan>（每格 B 框各 4 坐标+置信度，</text>
    <text x="164" y="429" fill="#374151">类别概率每格共享 C 个），非 4(K+1)</text>

    <rect x="300" y="384" width="240" height="50" rx="5" fill="#fff" stroke="#fca5a5"/>
    <text x="420" y="402" font-weight="bold" fill="#b91c1c">代价</text>
    <text x="420" y="417" fill="#374151">丢掉 RoI 对齐 + 逐区域精修，</text>
    <text x="420" y="429" fill="#374151">历史上对小/密目标更弱（一阶段 vs 二阶段）</text>

    <rect x="556" y="384" width="254" height="50" rx="5" fill="#fff" stroke="#fca5a5"/>
    <text x="683" y="402" font-weight="bold" fill="#15803d">收益</text>
    <text x="683" y="417" fill="#374151">没有第二阶段逐 RoI 的开销，</text>
    <text x="683" y="429" fill="#374151">更快、更简洁 → 实时（本项目要的）</text>
  </g>

  <!-- irony strip -->
  <rect x="24" y="458" width="800" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="425" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">反讽：你想把 Faster“合得更死”，但真实趋势是“分得更开”</text>
  <text x="425" y="500" text-anchor="middle" font-size="10" fill="#374151">YOLOv1 耦合头（一把出）→ 后来 YOLOX/YOLOv8 反而改用<tspan font-weight="bold" fill="#1e40af">解耦头</tspan>，把分类/回归分到各自卷积分支 → 涨点。</text>
  <text x="425" y="516" text-anchor="middle" font-size="9.5" fill="#6b7280">证据指向：分类要平移不变、回归要平移敏感，“合成一个头一把预测”在精度上不是最优（见 Q65）。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
