<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="360" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">CenterNet：目标中心点热图 + 尺寸偏移回归，无 Anchor 无 NMS</text>

  <!-- Input -->
  <rect x="20" y="60" width="90" height="40" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="65" y="85" text-anchor="middle" font-size="11">输入图像</text>
  <text x="65" y="76" text-anchor="middle" font-size="9" fill="#6b7280">H×W×3</text>

  <!-- Backbone (Hourglass / DLA / ResNet) -->
  <rect x="148" y="60" width="130" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="213" y="76" text-anchor="middle" font-size="11">Backbone</text>
  <text x="213" y="90" text-anchor="middle" font-size="9.5" fill="#1d4ed8">Hourglass/DLA/ResNet</text>

  <!-- Feature Map -->
  <rect x="316" y="60" width="120" height="40" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="376" y="76" text-anchor="middle" font-size="11">特征图</text>
  <text x="376" y="90" text-anchor="middle" font-size="9.5" fill="#6d28d9">(H/4)×(W/4)×256</text>

  <!-- Arrows backbone -->
  <g stroke="#374151" stroke-width="1.5" marker-end="url(#a)">
    <line x1="110" y1="80" x2="146" y2="80"/>
    <line x1="278" y1="80" x2="314" y2="80"/>
  </g>

  <!-- Fan to 3 heads -->
  <g stroke="#7c3aed" stroke-width="1.3">
    <line x1="376" y1="100" x2="376" y2="130"/>
    <line x1="376" y1="130" x2="200" y2="130"/>
    <line x1="376" y1="130" x2="376" y2="130"/>
    <line x1="376" y1="130" x2="580" y2="130"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.3" marker-end="url(#av)">
    <line x1="200" y1="130" x2="200" y2="148"/>
    <line x1="376" y1="130" x2="376" y2="148"/>
    <line x1="580" y1="130" x2="580" y2="148"/>
  </g>

  <!-- Head 1: Heatmap -->
  <rect x="88" y="148" width="224" height="72" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="200" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">热图 Heatmap</text>
  <text x="200" y="184" text-anchor="middle" font-size="10.5" fill="#92400e">(H/4)×(W/4)×C（C 类）</text>
  <text x="200" y="200" text-anchor="middle" font-size="9.5" fill="#6b7280">Gaussian 响应，峰值=中心点</text>
  <text x="200" y="213" text-anchor="middle" font-size="9.5" fill="#6b7280">训练用 Focal Loss 变体</text>

  <!-- Head 2: Offset -->
  <rect x="288" y="148" width="176" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="376" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">本地偏移 Offset</text>
  <text x="376" y="184" text-anchor="middle" font-size="10.5" fill="#15803d">(H/4)×(W/4)×2</text>
  <text x="376" y="200" text-anchor="middle" font-size="9.5" fill="#6b7280">补偿量化误差</text>
  <text x="376" y="213" text-anchor="middle" font-size="9.5" fill="#6b7280">(Δx, Δy)</text>

  <!-- Head 3: Size -->
  <rect x="480" y="148" width="200" height="72" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="580" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">目标尺寸 Size</text>
  <text x="580" y="184" text-anchor="middle" font-size="10.5" fill="#991b1b">(H/4)×(W/4)×2</text>
  <text x="580" y="200" text-anchor="middle" font-size="9.5" fill="#6b7280">每点预测 (w, h)</text>
  <text x="580" y="213" text-anchor="middle" font-size="9.5" fill="#6b7280">L1 Loss 训练</text>

  <!-- Detection assembly -->
  <rect x="160" y="252" width="460" height="60" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="390" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">推理：热图峰值检测 → 组装框</text>
  <text x="390" y="290" text-anchor="middle" font-size="10.5" fill="#0369a1">① 3×3 MaxPool 提取热图峰值（无 NMS）</text>
  <text x="390" y="305" text-anchor="middle" font-size="9.5" fill="#0369a1">② 峰值位置 (x_p, y_p) + Offset → 精确中心；中心 ± Size/2 → (x1,y1,x2,y2)</text>

  <g stroke="#374151" stroke-width="1.3" marker-end="url(#a)">
    <line x1="200" y1="220" x2="320" y2="250"/>
    <line x1="376" y1="220" x2="376" y2="250"/>
    <line x1="580" y1="220" x2="460" y2="250"/>
  </g>

  <!-- Comparison note -->
  <rect x="20" y="328" width="780" height="24" rx="4" fill="#f8fafc"/>
  <text x="410" y="344" text-anchor="middle" font-size="10" fill="#374151">vs anchor-based：无 IoU 阈值，无 anchor 设计；vs FCOS：单尺度特征图（下采样4×）而非 FPN 多层；NMS 变为 MaxPool 峰值提取（更快）</text>

  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
    <marker id="av" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
