<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="600" height="360" fill="#fff"/>
  <text x="300" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">FPN：自底向上 + 自顶向下 + 横向连接</text>
  <text x="150" y="58" text-anchor="middle" font-size="13" fill="#3b82f6">自底向上（骨干）</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#16a34a">自顶向下（FPN）</text>
  <g font-size="12" text-anchor="middle">
    <!-- bottom-up C -->
    <rect x="110" y="80"  width="80" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="150" y="100">C5（深/小）</text>
    <rect x="110" y="140" width="80" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="150" y="161">C4</text>
    <rect x="110" y="204" width="80" height="38" fill="#dbeafe" stroke="#3b82f6"/><text x="150" y="227">C3</text>
    <rect x="110" y="272" width="80" height="44" fill="#dbeafe" stroke="#3b82f6"/><text x="150" y="298">C2（浅/大）</text>
    <!-- top-down P -->
    <rect x="410" y="80"  width="80" height="30" fill="#d1fae5" stroke="#16a34a"/><text x="450" y="100">P5</text>
    <rect x="410" y="140" width="80" height="34" fill="#d1fae5" stroke="#16a34a"/><text x="450" y="161">P4</text>
    <rect x="410" y="204" width="80" height="38" fill="#d1fae5" stroke="#16a34a"/><text x="450" y="227">P3</text>
    <rect x="410" y="272" width="80" height="44" fill="#d1fae5" stroke="#16a34a"/><text x="450" y="298">P2</text>
  </g>
  <!-- bottom up arrows -->
  <g stroke="#3b82f6" stroke-width="1.6">
    <line x1="150" y1="272" x2="150" y2="244" marker-end="url(#a11b)"/>
    <line x1="150" y1="204" x2="150" y2="176" marker-end="url(#a11b)"/>
    <line x1="150" y1="140" x2="150" y2="112" marker-end="url(#a11b)"/>
  </g>
  <!-- lateral 1x1 -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="190" y1="95"  x2="410" y2="95"  marker-end="url(#a11g)"/>
    <line x1="190" y1="157" x2="410" y2="157" marker-end="url(#a11g)"/>
    <line x1="190" y1="223" x2="410" y2="223" marker-end="url(#a11g)"/>
    <line x1="190" y1="294" x2="410" y2="294" marker-end="url(#a11g)"/>
  </g>
  <text x="300" y="90" text-anchor="middle" font-size="9.5" fill="#9ca3af">1×1</text>
  <!-- top down arrows -->
  <g stroke="#16a34a" stroke-width="1.8">
    <line x1="450" y1="110" x2="450" y2="138" marker-end="url(#a11g)"/>
    <line x1="450" y1="174" x2="450" y2="202" marker-end="url(#a11g)"/>
    <line x1="450" y1="242" x2="450" y2="270" marker-end="url(#a11g)"/>
  </g>
  <text x="300" y="338" text-anchor="middle" font-size="11.5" fill="#6b7280">深层语义自上而下灌注到高分辨率浅层；本项目第三章加 P2（更浅一级）专捞小目标</text>
  <defs>
    <marker id="a11b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
    <marker id="a11g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
