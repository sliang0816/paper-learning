<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="'Microsoft YaHei',sans-serif">
  <rect width="640" height="250" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">BERT：双向 Encoder + 掩码语言模型(MLM)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40"  y="150" width="90" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="85" y="172">猫</text>
    <rect x="150" y="150" width="90" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="195" y="172">坐在</text>
    <rect x="260" y="150" width="90" height="34" rx="6" fill="#fee2e2" stroke="#ef4444"/><text x="305" y="172">[MASK]</text>
    <rect x="370" y="150" width="90" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="415" y="172">上</text>
  </g>
  <rect x="40" y="80" width="420" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="108" text-anchor="middle" font-size="13" fill="#1d4ed8">双向 Transformer Encoder（每词看左右全文）</text>
  <g stroke="#3b82f6" stroke-width="1.3">
    <line x1="85"  y1="148" x2="85"  y2="128" marker-end="url(#a18)"/>
    <line x1="195" y1="148" x2="195" y2="128" marker-end="url(#a18)"/>
    <line x1="305" y1="148" x2="305" y2="128" marker-end="url(#a18)"/>
    <line x1="415" y1="148" x2="415" y2="128" marker-end="url(#a18)"/>
  </g>
  <line x1="305" y1="80" x2="305" y2="55" stroke="#ef4444" stroke-width="1.6" marker-end="url(#a18r)"/>
  <rect x="250" y="30" width="120" height="26" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="310" y="48" text-anchor="middle" font-size="11">预测被遮词「垫子」</text>
  <rect x="500" y="80" width="120" height="100" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="560" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">预训练+微调</text>
  <text x="510" y="124" font-size="10.5" fill="#7c2d12">MLM 遮15%词</text>
  <text x="510" y="142" font-size="10.5" fill="#7c2d12">NSP 句对关系</text>
  <text x="510" y="162" font-size="10.5" fill="#7c2d12">→ 下游微调</text>
  <text x="320" y="225" text-anchor="middle" font-size="11.5" fill="#6b7280">双向擅长「理解」；Grounding DINO 的文本编码器即用 BERT</text>
  <defs>
    <marker id="a18" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
    <marker id="a18r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ef4444"/></marker>
  </defs>
</svg>
