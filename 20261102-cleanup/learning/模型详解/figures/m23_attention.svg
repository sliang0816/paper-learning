<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="'Microsoft YaHei',sans-serif">
  <rect width="640" height="270" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">注意力机制：Query-Key-Value 软检索</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="40"  y="70" width="80" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="80" y="92">Query Q</text>
    <rect x="40"  y="130" width="80" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="80" y="152">Key K</text>
    <rect x="40"  y="190" width="80" height="34" rx="6" fill="#d1fae5" stroke="#16a34a"/><text x="80" y="212">Value V</text>
  </g>
  <!-- QK -->
  <rect x="180" y="95" width="120" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8"/><text x="240" y="113" text-anchor="middle" font-size="11.5">Q·Kᵀ / √dₖ</text><text x="240" y="130" text-anchor="middle" font-size="10.5" fill="#6b7280">相似度</text>
  <line x1="120" y1="87"  x2="178" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#a16)"/>
  <line x1="120" y1="147" x2="178" y2="126" stroke="#374151" stroke-width="1.5" marker-end="url(#a16)"/>
  <rect x="340" y="95" width="100" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="390" y="121" text-anchor="middle" font-size="12">softmax</text>
  <line x1="300" y1="117" x2="338" y2="117" stroke="#374151" stroke-width="1.5" marker-end="url(#a16)"/>
  <!-- weighted sum -->
  <circle cx="500" cy="155" r="26" fill="#fef9c3" stroke="#eab308" stroke-width="1.8"/><text x="500" y="152" text-anchor="middle" font-size="11">加权</text><text x="500" y="167" text-anchor="middle" font-size="11">求和</text>
  <line x1="440" y1="120" x2="478" y2="145" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a16)"/>
  <text x="455" y="120" font-size="10" fill="#7c3aed">权重</text>
  <line x1="120" y1="207" x2="476" y2="165" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a16)"/>
  <line x1="500" y1="181" x2="500" y2="210" stroke="#374151" stroke-width="1.8" marker-end="url(#a16)"/>
  <text x="500" y="228" text-anchor="middle" font-size="12.5" fill="#374151">输出</text>
  <text x="320" y="258" text-anchor="middle" font-size="11.5" fill="#6b7280">自注意力：Q/K/V 同源 → 任意两位置一步交互（无长程衰减、可并行）</text>
  <defs><marker id="a16" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
