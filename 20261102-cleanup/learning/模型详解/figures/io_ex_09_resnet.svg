<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" font-family="'Microsoft YaHei',sans-serif">
  <rect width="840" height="240" fill="#fff"/>
  <text x="420" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">09 ResNet 输入输出实例（分类骨干 / 检测骨干 两种用法）</text>
  <text x="420" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">224×224×3 图像进 → 残差块堆叠（F(x)+x 跳连）→ 类别概率 或 多尺度特征图</text>

  <rect x="24" y="68" width="120" height="92" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="84" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#075985">输入图像</text>
  <text x="84" y="110" text-anchor="middle" font-size="9.5" fill="#374151">224×224×3</text>
  <text x="84" y="127" text-anchor="middle" font-size="8.5" fill="#6b7280">一张猫的照片</text>
  <text x="84" y="146" text-anchor="middle" font-size="8.5" fill="#6b7280">（RGB 三通道）</text>

  <line x1="144" y1="114" x2="178" y2="114" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="180" y="74" width="170" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="265" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">ResNet-50</text>
  <text x="265" y="115" text-anchor="middle" font-size="9" fill="#374151">残差块 ×16：F(x)+x</text>
  <text x="265" y="131" text-anchor="middle" font-size="8.5" fill="#6b7280">跳连让上百层不退化</text>
  <text x="265" y="147" text-anchor="middle" font-size="8.3" fill="#6b7280">逐级下采样、通道翻倍</text>

  <line x1="350" y1="100" x2="392" y2="86" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="350" y1="128" x2="392" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- usage A: classify -->
  <rect x="394" y="62" width="210" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="499" y="80" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#15803d">用法A 当分类器：1000 类概率</text>
  <text x="499" y="98" text-anchor="middle" font-size="9" fill="#374151">top-1 = “tabby cat” 0.88</text>
  <text x="499" y="110" text-anchor="middle" font-size="8" fill="#6b7280">GAP → FC1000 → softmax</text>

  <!-- usage B: backbone -->
  <rect x="394" y="124" width="210" height="56" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="499" y="142" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#6d28d9">用法B 当检测骨干：多尺度特征图</text>
  <text x="499" y="160" text-anchor="middle" font-size="9" fill="#374151">C2 56² / C3 28² / C4 14² / C5 7²×2048</text>
  <text x="499" y="173" text-anchor="middle" font-size="8" fill="#6b7280">不出类别，特征喂给 FPN/检测头</text>

  <line x1="604" y1="88" x2="646" y2="88" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="648" y="66" width="168" height="44" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="732" y="84" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">输出：类别 “猫”</text>
  <text x="732" y="100" text-anchor="middle" font-size="8.3" fill="#6b7280">（分类用法的最终答案）</text>

  <line x1="604" y1="152" x2="646" y2="152" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="648" y="130" width="168" height="44" rx="6" fill="#ddd6fe" stroke="#8b5cf6"/>
  <text x="732" y="148" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#6d28d9">输出：特征金字塔</text>
  <text x="732" y="164" text-anchor="middle" font-size="8.3" fill="#6b7280">→ 21 FPN → 检测框</text>

  <text x="420" y="214" text-anchor="middle" font-size="9.6" fill="#374151">一句话：同一个 ResNet，<tspan font-weight="bold" fill="#15803d">末端接 FC</tspan> 就输出类别；<tspan font-weight="bold" fill="#6d28d9">中途抽特征图</tspan> 就当骨干——本项目走后者，特征给检测头。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
