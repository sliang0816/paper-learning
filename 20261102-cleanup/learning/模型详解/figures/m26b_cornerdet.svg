<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="360" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">CornerNet：左上角 + 右下角热力图配对检测（无锚框先驱）</text>

  <!-- ===== LEFT: Pipeline ===== -->
  <text x="170" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">检测流程</text>
  <rect x="20" y="62" width="300" height="260" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- Hourglass -->
  <rect x="40" y="74" width="260" height="38" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="170" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">Hourglass-104 骨干</text>
  <text x="170" y="107" text-anchor="middle" font-size="9.5" fill="#6d28d9">2 × Stacked Hourglass，中间监督</text>

  <line x1="170" y1="112" x2="170" y2="124" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Head branches -->
  <line x1="170" y1="124" x2="90" y2="124" stroke="#7c3aed" stroke-width="1.3"/>
  <line x1="170" y1="124" x2="250" y2="124" stroke="#7c3aed" stroke-width="1.3"/>
  <line x1="90" y1="124" x2="90" y2="138" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="250" y1="124" x2="250" y2="138" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- TL head -->
  <rect x="40" y="138" width="100" height="46" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="90" y="156" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8">左上角 (TL) 头</text>
  <text x="90" y="171" text-anchor="middle" font-size="8.5" fill="#374151">热力图 H_tl ∈ R^{CxHxW}</text>
  <text x="90" y="182" text-anchor="middle" font-size="8" fill="#6b7280">嵌入向量 e_tl + 偏移 Δ_tl</text>

  <!-- BR head -->
  <rect x="180" y="138" width="100" height="46" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="230" y="156" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">右下角 (BR) 头</text>
  <text x="230" y="171" text-anchor="middle" font-size="8.5" fill="#374151">热力图 H_br ∈ R^{CxHxW}</text>
  <text x="230" y="182" text-anchor="middle" font-size="8" fill="#6b7280">嵌入向量 e_br + 偏移 Δ_br</text>

  <!-- Corner Pooling note -->
  <rect x="40" y="192" width="240" height="28" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="160" y="206" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">Corner Pooling：向右+向下扫描最大值（TL）</text>
  <text x="160" y="217" text-anchor="middle" font-size="9" fill="#b45309">使角点"看到"矩形框对角方向的语义</text>

  <!-- Pairing -->
  <line x1="90" y1="184" x2="90" y2="228" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="3 1"/>
  <line x1="230" y1="184" x2="230" y2="228" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="3 1"/>

  <rect x="60" y="228" width="200" height="32" rx="4" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="160" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">嵌入向量配对</text>
  <text x="160" y="257" text-anchor="middle" font-size="9" fill="#374151">|e_tl − e_br| &lt; 阈值 → 同一目标</text>

  <line x1="160" y1="260" x2="160" y2="278" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="60" y="278" width="200" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="160" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">目标框 (x₁,y₁,x₂,y₂)</text>
  <text x="160" y="307" text-anchor="middle" font-size="9" fill="#374151">TL 坐标 + 偏移 → 左上角；BR → 右下角</text>

  <!-- ===== RIGHT: Key concepts ===== -->
  <text x="594" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">关键机制详解</text>
  <rect x="334" y="62" width="466" height="260" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>

  <!-- Heatmap -->
  <rect x="350" y="74" width="210" height="78" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="455" y="91" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">热力图 Gaussian 标注</text>
  <text x="455" y="108" text-anchor="middle" font-size="9.5" fill="#374151">y_ij = exp(−‖p − p̃‖² / 2σ²)</text>
  <text x="455" y="122" text-anchor="middle" font-size="9" fill="#6b7280">• 正样本：高斯圆形衰减（半径 r 自适应）</text>
  <text x="455" y="136" text-anchor="middle" font-size="9" fill="#6b7280">• 损失：Focal Loss 变体（α=2, β=4）</text>
  <text x="455" y="148" text-anchor="middle" font-size="9" fill="#6b7280">• 高斯区域内的损失权重降低（减少误惩罚）</text>

  <!-- Embedding -->
  <rect x="570" y="74" width="214" height="78" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="677" y="91" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">Push-Pull 嵌入损失</text>
  <text x="677" y="108" text-anchor="middle" font-size="9.5" fill="#374151">L_pull: 同目标 TL/BR 嵌入靠近</text>
  <text x="677" y="122" text-anchor="middle" font-size="9.5" fill="#374151">L_push: 不同目标嵌入推远</text>
  <text x="677" y="136" text-anchor="middle" font-size="9" fill="#6b7280">实践中 d=1（1维嵌入即足够）</text>
  <text x="677" y="148" text-anchor="middle" font-size="9" fill="#6b7280">配对阈值 |e_tl − e_br| &lt; 0.5</text>

  <!-- Corner pooling illustration -->
  <rect x="350" y="162" width="210" height="90" rx="4" fill="#fff7ed" stroke="#d97706"/>
  <text x="455" y="179" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">Corner Pooling 示意</text>
  <!-- Grid -->
  <g font-size="8.5" text-anchor="middle" fill="#374151">
    <rect x="370" y="186" width="20" height="20" rx="1" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="380" y="200">★</text>
    <rect x="392" y="186" width="20" height="20" rx="1" fill="#fed7aa" stroke="#d97706"/>
    <text x="402" y="200">a</text>
    <rect x="414" y="186" width="20" height="20" rx="1" fill="#fed7aa" stroke="#d97706"/>
    <text x="424" y="200">b</text>
    <rect x="436" y="186" width="20" height="20" rx="1" fill="#fed7aa" stroke="#d97706"/>
    <text x="446" y="200">c</text>
    <!-- Down direction -->
    <rect x="370" y="208" width="20" height="20" rx="1" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="380" y="222">d</text>
    <rect x="370" y="230" width="20" height="20" rx="1" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="380" y="244">e</text>
  </g>
  <text x="455" y="220" text-anchor="middle" font-size="8.5" fill="#b45309">★ = 左上角点</text>
  <text x="455" y="234" text-anchor="middle" font-size="8.5" fill="#b45309">水平方向取右侧最大值</text>
  <text x="455" y="248" text-anchor="middle" font-size="8.5" fill="#b45309">垂直方向取下侧最大值</text>

  <!-- Total loss -->
  <rect x="570" y="162" width="214" height="90" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="677" y="179" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">总损失</text>
  <text x="677" y="196" text-anchor="middle" font-size="10" fill="#374151">L = L_det</text>
  <text x="677" y="212" text-anchor="middle" font-size="10" fill="#374151">+ α·L_pull + β·L_push</text>
  <text x="677" y="228" text-anchor="middle" font-size="10" fill="#374151">+ γ·L_off</text>
  <text x="677" y="244" text-anchor="middle" font-size="9" fill="#6b7280">α=β=0.1, γ=1</text>

  <!-- Comparison bar -->
  <rect x="334" y="290" width="466" height="32" rx="4" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="567" y="308" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">历史位置：CornerNet(2018) → CenterNet(2019) → FCOS(2019) → YOLOv8(2023) 无锚框主流</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
  </defs>
</svg>
