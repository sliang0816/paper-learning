<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="340" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">数据增强三件套：Mixup / CutMix / Mosaic</text>

  <!-- ===== Mixup ===== -->
  <text x="138" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3b82f6">Mixup（2017）</text>

  <rect x="20" y="62" width="236" height="140" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>

  <!-- Two images combined -->
  <rect x="35" y="74" width="60" height="50" rx="3" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="65" y="101" text-anchor="middle" font-size="9">图像 xᵢ</text>
  <text x="65" y="115" text-anchor="middle" font-size="8.5" fill="#6b7280">类别 yᵢ</text>

  <text x="110" y="102" text-anchor="middle" font-size="16" fill="#374151">+</text>

  <rect x="120" y="74" width="60" height="50" rx="3" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="150" y="101" text-anchor="middle" font-size="9">图像 xⱼ</text>
  <text x="150" y="115" text-anchor="middle" font-size="8.5" fill="#6b7280">类别 yⱼ</text>

  <rect x="194" y="80" width="52" height="38" rx="3" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="220" y="97" text-anchor="middle" font-size="8.5" fill="#312e81">混合图像</text>
  <text x="220" y="110" text-anchor="middle" font-size="8" fill="#312e81">x̃ = λxᵢ+(1-λ)xⱼ</text>

  <text x="138" y="150" text-anchor="middle" font-size="10" fill="#374151">公式：</text>
  <text x="138" y="166" text-anchor="middle" font-size="10" fill="#1d4ed8">x̃ = λxᵢ + (1−λ)xⱼ</text>
  <text x="138" y="183" text-anchor="middle" font-size="10" fill="#1d4ed8">ỹ = λyᵢ + (1−λ)yⱼ</text>
  <text x="138" y="196" text-anchor="middle" font-size="8.5" fill="#6b7280">λ ~ Beta(α, α)，α=0.2</text>

  <text x="138" y="218" text-anchor="middle" font-size="9" fill="#6b7280">改善决策边界平滑，减少过拟合</text>

  <!-- ===== CutMix ===== -->
  <text x="410" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">CutMix（2019）</text>

  <rect x="292" y="62" width="236" height="140" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>

  <rect x="308" y="74" width="90" height="70" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
  <rect x="350" y="104" width="48" height="38" rx="2" fill="#fde68a" stroke="#d97706"/>
  <text x="352" y="118" font-size="8" fill="#92400e">剪切贴图</text>
  <text x="308" y="162" font-size="8.5" fill="#6b7280">图像 B 的矩形区域</text>
  <text x="308" y="173" font-size="8.5" fill="#6b7280">贴到图像 A 上</text>

  <text x="445" y="94" text-anchor="middle" font-size="10" fill="#374151">公式：</text>
  <text x="445" y="114" text-anchor="middle" font-size="10" fill="#065f46">图像：A 中切掉区域</text>
  <text x="445" y="130" text-anchor="middle" font-size="10" fill="#065f46">    用 B 对应区域填</text>
  <text x="445" y="148" text-anchor="middle" font-size="10" fill="#065f46">标签：按像素面积比</text>
  <text x="445" y="164" text-anchor="middle" font-size="9" fill="#6b7280">ỹ = λyₐ + (1−λ)y_b</text>
  <text x="445" y="176" text-anchor="middle" font-size="8.5" fill="#6b7280">λ=1−(cut面积/总面积)</text>

  <text x="410" y="218" text-anchor="middle" font-size="9" fill="#6b7280">保留空间信息，检测/分割效果优于 Mixup</text>

  <!-- ===== Mosaic ===== -->
  <text x="682" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d97706">Mosaic（YOLOv4，2020）</text>

  <rect x="564" y="62" width="236" height="140" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>

  <!-- 4 quadrant mosaic -->
  <rect x="576" y="74" width="58" height="58" rx="2" fill="#fed7aa" stroke="#d97706"/>
  <text x="605" y="105" text-anchor="middle" font-size="8.5">图1</text>
  <rect x="636" y="74" width="58" height="58" rx="2" fill="#fde68a" stroke="#d97706"/>
  <text x="665" y="105" text-anchor="middle" font-size="8.5">图2</text>
  <rect x="576" y="134" width="58" height="58" rx="2" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="605" y="165" text-anchor="middle" font-size="8.5">图3</text>
  <rect x="636" y="134" width="58" height="58" rx="2" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="665" y="165" text-anchor="middle" font-size="8.5">图4</text>
  <line x1="611" y1="74" x2="611" y2="192" stroke="#d97706" stroke-width="1.5"/>
  <line x1="576" y1="132" x2="694" y2="132" stroke="#d97706" stroke-width="1.5"/>

  <text x="716" y="96" text-anchor="middle" font-size="10" fill="#374151">4张图拼</text>
  <text x="716" y="110" text-anchor="middle" font-size="10" fill="#374151">成一张</text>
  <text x="716" y="130" text-anchor="middle" font-size="9.5" fill="#b45309">丰富上下文</text>
  <text x="716" y="148" text-anchor="middle" font-size="9.5" fill="#b45309">无需大 batch</text>
  <text x="716" y="164" text-anchor="middle" font-size="9.5" fill="#b45309">也能多样化</text>
  <text x="716" y="180" text-anchor="middle" font-size="8.5" fill="#6b7280">每图标注随</text>
  <text x="716" y="191" text-anchor="middle" font-size="8.5" fill="#6b7280">裁剪坐标变换</text>

  <text x="682" y="218" text-anchor="middle" font-size="9" fill="#6b7280">YOLOv4/5/8 训练默认启用，小目标检测效果显著</text>

  <!-- Bottom comparison -->
  <rect x="20" y="252" width="780" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">三者对比与使用场景</text>
  <g font-size="10" fill="#374151">
    <text x="410" y="289" text-anchor="middle">Mixup：图像级像素混合，适合分类（改善标签软化）；CutMix：区域级替换，适合分类/分割（保留空间结构）</text>
    <text x="410" y="307" text-anchor="middle">Mosaic：4图拼接，专为目标检测设计（密集小目标）；三者可叠加用于训练（YOLOv8 默认 Mosaic+CutMix+Mixup）</text>
    <text x="410" y="323" text-anchor="middle" fill="#6b7280">本项目 YOLOv8 基线训练已自动使用 Mosaic（第三章改进实验不需重新设计增强策略）</text>
  </g>
</svg>
