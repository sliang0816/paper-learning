<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="'Microsoft YaHei',sans-serif">
  <rect width="680" height="230" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">SAM：可提示的通用分割</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="60" width="120" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="78">图像</text><text x="90" y="94" font-size="9.5" fill="#6b7280">Image Encoder(ViT,重)</text>
    <rect x="30" y="140" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="90" y="158">提示(点/框/文本)</text><text x="90" y="174" font-size="9.5" fill="#6b7280">Prompt Encoder(轻)</text>
    <rect x="220" y="98" width="130" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="285" y="120">Mask Decoder</text><text x="285" y="136" font-size="9.5" fill="#6b7280">(轻, 快)</text>
    <rect x="400" y="100" width="110" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="455" y="124">分割掩码</text>
  </g>
  <g stroke="#374151" stroke-width="1.6">
    <line x1="150" y1="80"  x2="218" y2="110" marker-end="url(#a24)"/>
    <line x1="150" y1="160" x2="218" y2="130" marker-end="url(#a24)"/>
    <line x1="350" y1="120" x2="398" y2="120" marker-end="url(#a24)"/>
  </g>
  <text x="285" y="172" text-anchor="middle" font-size="9.5" fill="#6b7280">图编码跑一次，提示可多次实时</text>
  <rect x="540" y="80" width="120" height="80" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">只分割不识别</text>
  <text x="550" y="120" font-size="9.5" fill="#7c2d12">SA-1B: 11亿掩码</text>
  <text x="550" y="138" font-size="9.5" fill="#7c2d12">常配 Grounding</text>
  <text x="550" y="153" font-size="9.5" fill="#7c2d12">DINO 用</text>
  <text x="340" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">本项目是检测(框级)任务，不用 SAM；未来做面积/形状分析时可作框→掩码工具</text>
  <defs><marker id="a24" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
