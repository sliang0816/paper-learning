<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="210" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">08 GoogLeNet/Inception 输入输出实例（多分支并行 + 1×1 降维）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">224×224×3 图 → 9 个 Inception 模块（多尺度并行）→ GAP → 1000 类（参数仅 ~5M）</text>

  <rect x="22" y="68" width="110" height="72" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="77" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入图像</text>
  <text x="77" y="107" text-anchor="middle" font-size="9.3" fill="#374151">224×224×3</text>

  <line x1="132" y1="104" x2="160" y2="104" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="162" y="58" width="246" height="92" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="285" y="77" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Inception 模块（并行 4 支路）</text>
  <text x="174" y="95" font-size="8.3" fill="#374151">1×1 / 3×3 / 5×5 卷积 + 池化 同时算</text>
  <text x="174" y="111" font-size="8.3" fill="#374151">先用 1×1 降通道再大核 → 省算量</text>
  <text x="174" y="127" font-size="8.3" fill="#374151">4 支路结果 concat 拼接</text>
  <text x="174" y="143" font-size="8" fill="#6b7280">末端 GAP 替代 FC（参数从千万降到几乎 0）</text>

  <line x1="408" y1="104" x2="438" y2="104" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="440" y="74" width="176" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="528" y="94" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">1000 类概率</text>
  <text x="528" y="112" text-anchor="middle" font-size="8.7" fill="#374151">top-1 “金毛犬” 0.90</text>
  <text x="528" y="127" text-anchor="middle" font-size="8" fill="#6b7280">22 层、仅 ~5M 参数</text>

  <line x1="616" y1="104" x2="646" y2="104" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="648" y="80" width="142" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="719" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">类别 “狗”</text>
  <text x="719" y="118" text-anchor="middle" font-size="7.8" fill="#6b7280">高效设计路线</text>

  <text x="410" y="180" text-anchor="middle" font-size="9.6" fill="#374151">和 VGG 同年的另一条路：不靠暴力加深，靠<tspan font-weight="bold" fill="#0369a1">多尺度并行 + 1×1 降维</tspan>，用 1/12 参数达更高精度（Q7/Q52/Q53）。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
