<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="280" fill="#fff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">YOLO 演进 v1→v11（v8 为本项目基线）</text>
  <line x1="40" y1="80" x2="720" y2="80" stroke="#cbd5e1" stroke-width="3"/>
  <g font-size="11" text-anchor="middle">
    <circle cx="70"  cy="80" r="6" fill="#3b82f6"/><text x="70" y="64">v1</text><text x="70" y="108" font-size="9" fill="#6b7280">2016 网格回归</text>
    <circle cx="140" cy="80" r="6" fill="#3b82f6"/><text x="140" y="64">v2</text><text x="140" y="108" font-size="9" fill="#6b7280">17 anchor/BN</text>
    <circle cx="210" cy="80" r="6" fill="#3b82f6"/><text x="210" y="64">v3</text><text x="210" y="108" font-size="9" fill="#6b7280">18 多尺度</text>
    <circle cx="290" cy="80" r="6" fill="#3b82f6"/><text x="290" y="64">v4/v5</text><text x="290" y="108" font-size="9" fill="#6b7280">20 CSP/PAN/Mosaic</text>
    <circle cx="380" cy="80" r="6" fill="#3b82f6"/><text x="380" y="64">v6/v7</text><text x="380" y="108" font-size="9" fill="#6b7280">22 效率优化</text>
    <circle cx="470" cy="80" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><text x="470" y="62" font-weight="bold" fill="#b45309">v8</text><text x="470" y="108" font-size="9" fill="#b45309">23 anchor-free/C2f</text>
    <circle cx="560" cy="80" r="6" fill="#3b82f6"/><text x="560" y="64">v9/v10</text><text x="560" y="108" font-size="9" fill="#6b7280">24 PGI/去NMS</text>
    <circle cx="660" cy="80" r="7" fill="#10b981"/><text x="660" y="64">v11</text><text x="660" y="108" font-size="9" fill="#16a34a">24 C2PSA(参考)</text>
  </g>
  <rect x="60" y="150" width="640" height="100" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="380" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">v8 三大关键设计（本项目基线）</text>
  <text x="80" y="200" font-size="12" fill="#7c2d12">① anchor-free：直接预测中心偏移 + DFL 分布回归（去 anchor 超参）</text>
  <text x="80" y="222" font-size="12" fill="#7c2d12">② 解耦头：分类/回归分支独立，互不干扰</text>
  <text x="80" y="244" font-size="12" fill="#7c2d12">③ C2f 模块：多分支梯度流（CSP 演进），利于小目标</text>
</svg>
