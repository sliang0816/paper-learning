<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="220" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">30 GPT 输入输出实例（自回归生成，逐词续写）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">文本 token → 单向 Transformer（只看左边）→ 下一个 token 的概率分布 → 采样接上 → 循环</text>

  <rect x="22" y="66" width="140" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="92" y="85" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#075985">输入：已有 token</text>
  <text x="92" y="103" text-anchor="middle" font-size="8.4" fill="#374151">“the cat sat on the”</text>
  <text x="92" y="119" text-anchor="middle" font-size="8" fill="#6b7280">只能看左侧上下文</text>
  <text x="92" y="133" text-anchor="middle" font-size="8" fill="#6b7280">（因果掩码）</text>

  <line x1="162" y1="106" x2="192" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="194" y="64" width="180" height="84" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="284" y="83" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#1e40af">单向 Transformer 解码器</text>
  <text x="284" y="101" text-anchor="middle" font-size="8.3" fill="#374151">预测“下一个词是什么”</text>
  <text x="284" y="116" text-anchor="middle" font-size="8.3" fill="#374151">大模型 → 涌现能力</text>
  <text x="284" y="133" text-anchor="middle" font-size="8" fill="#6b7280">GPT-1→4 越做越大</text>

  <line x1="374" y1="106" x2="404" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="406" y="70" width="186" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="499" y="89" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#15803d">输出：下一 token 概率</text>
  <text x="499" y="107" text-anchor="middle" font-size="8.3" fill="#374151">[mat 0.40, floor 0.20, rug 0.12…]</text>
  <text x="499" y="123" text-anchor="middle" font-size="8" fill="#6b7280">采样/取最大 → “mat”</text>

  <line x1="592" y1="106" x2="622" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="624" y="82" width="168" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="708" y="101" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#15803d">“…on the mat”</text>
  <text x="708" y="118" text-anchor="middle" font-size="7.4" fill="#6b7280">接上再预测下一个</text>

  <!-- loop arrow -->
  <path d="M708 130 Q708 175 400 175 Q92 175 92 148" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <text x="400" y="190" text-anchor="middle" font-size="8.3" fill="#b45309">自回归：把新词接回输入，一个词一个词地生成</text>

  <text x="410" y="208" text-anchor="middle" font-size="9.6" fill="#374151">和 BERT 互补：GPT 是<tspan font-weight="bold" fill="#0369a1">单向解码器</tspan>（只看左文做“生成”），逐词续写——ChatGPT 就是这么吐字的。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
  </defs>
</svg>
