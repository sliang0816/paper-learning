<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">Inception：4 分支并行 → 沿通道维拼接（concat）</text>

  <!-- 输入 -->
  <rect x="300" y="46" width="160" height="32" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="380" y="67" text-anchor="middle" font-size="13" fill="#374151">前层 28×28×192</text>

  <!-- fan-out 箭头 -->
  <g stroke="#9ca3af" stroke-width="1.6">
    <line x1="380" y1="78" x2="110" y2="106" marker-end="url(#a2)"/>
    <line x1="380" y1="78" x2="300" y2="106" marker-end="url(#a2)"/>
    <line x1="380" y1="78" x2="490" y2="106" marker-end="url(#a2)"/>
    <line x1="380" y1="78" x2="660" y2="106" marker-end="url(#a2)"/>
  </g>

  <!-- ===== 4 分支 ===== -->
  <!-- 分支1: 1×1,64 (amber) -->
  <rect x="55" y="108" width="110" height="28" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="110" y="127" text-anchor="middle" font-size="12.5" fill="#b45309">1×1, 64</text>

  <!-- 分支2: 1×1,96 -> 3×3,128 (blue) -->
  <rect x="245" y="108" width="110" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="300" y="127" text-anchor="middle" font-size="12.5" fill="#1d4ed8">1×1, 96（降维）</text>
  <line x1="300" y1="136" x2="300" y2="156" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a2b)"/>
  <rect x="245" y="158" width="110" height="28" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="300" y="177" text-anchor="middle" font-size="12.5" fill="#1d4ed8">3×3, 128</text>

  <!-- 分支3: 1×1,16 -> 5×5,32 (green) -->
  <rect x="435" y="108" width="110" height="28" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="490" y="127" text-anchor="middle" font-size="12.5" fill="#047857">1×1, 16（降维）</text>
  <line x1="490" y1="136" x2="490" y2="156" stroke="#10b981" stroke-width="1.5" marker-end="url(#a2g)"/>
  <rect x="435" y="158" width="110" height="28" rx="6" fill="#d1fae5" stroke="#10b981"/>
  <text x="490" y="177" text-anchor="middle" font-size="12.5" fill="#047857">5×5, 32</text>

  <!-- 分支4: 3×3 pool -> 1×1,32 (purple) -->
  <rect x="605" y="108" width="110" height="28" rx="6" fill="#faf5ff" stroke="#a855f7"/>
  <text x="660" y="127" text-anchor="middle" font-size="12.5" fill="#7e22ce">3×3 池化</text>
  <line x1="660" y1="136" x2="660" y2="156" stroke="#a855f7" stroke-width="1.5" marker-end="url(#a2p)"/>
  <rect x="605" y="158" width="110" height="28" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="660" y="177" text-anchor="middle" font-size="12.5" fill="#7e22ce">1×1, 32</text>

  <!-- 各分支输出块（宽 ∝ 通道）y=210 -->
  <text x="380" y="208" text-anchor="middle" font-size="12" fill="#6b7280">各分支输出（空间都是 28×28，宽度 ∝ 通道数）</text>
  <rect x="87" y="216" width="46" height="24" fill="#f59e0b" stroke="#b45309"/><text x="110" y="233" text-anchor="middle" font-size="11" fill="#fff">64</text>
  <rect x="255" y="216" width="90" height="24" fill="#3b82f6" stroke="#1d4ed8"/><text x="300" y="233" text-anchor="middle" font-size="11" fill="#fff">128</text>
  <rect x="467" y="216" width="46" height="24" fill="#10b981" stroke="#047857"/><text x="490" y="233" text-anchor="middle" font-size="11" fill="#fff">32</text>
  <rect x="637" y="216" width="46" height="24" fill="#a855f7" stroke="#7e22ce"/><text x="660" y="233" text-anchor="middle" font-size="11" fill="#fff">32</text>

  <!-- 汇聚箭头 -->
  <g stroke="#6b7280" stroke-width="1.6">
    <line x1="110" y1="242" x2="250" y2="296" marker-end="url(#a2)"/>
    <line x1="300" y1="242" x2="320" y2="296" marker-end="url(#a2)"/>
    <line x1="490" y1="242" x2="400" y2="296" marker-end="url(#a2)"/>
    <line x1="660" y1="242" x2="455" y2="296" marker-end="url(#a2)"/>
  </g>
  <text x="380" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111827">concat（沿通道维首尾相接，不相加、不混合）</text>

  <!-- concat 拼接条 -->
  <g stroke-width="1.5">
    <rect x="210" y="300" width="63"  height="34" fill="#f59e0b" stroke="#b45309"/>
    <rect x="273" y="300" width="126" height="34" fill="#3b82f6" stroke="#1d4ed8"/>
    <rect x="399" y="300" width="31"  height="34" fill="#10b981" stroke="#047857"/>
    <rect x="430" y="300" width="31"  height="34" fill="#a855f7" stroke="#7e22ce"/>
  </g>
  <text x="241" y="322" text-anchor="middle" font-size="11" fill="#fff">64</text>
  <text x="336" y="322" text-anchor="middle" font-size="11" fill="#fff">128</text>
  <text x="414" y="322" text-anchor="middle" font-size="9"  fill="#fff">32</text>
  <text x="445" y="322" text-anchor="middle" font-size="9"  fill="#fff">32</text>

  <text x="335" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">输出 28×28×256</text>
  <text x="335" y="380" text-anchor="middle" font-size="12" fill="#6b7280">通道数 = 各分支之和 = 64+128+32+32 = 256</text>

  <!-- 与 ResNet 区分 -->
  <rect x="40" y="402" width="680" height="50" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="58" y="423" font-size="12.5" fill="#374151"><tspan font-weight="bold">⚠ 区分：</tspan>Inception 用 <tspan font-weight="bold" fill="#7e22ce">concat（通道相加：64+128+32+32）</tspan>，不要求各分支通道相同；</text>
  <text x="58" y="442" font-size="12.5" fill="#374151">ResNet 用 <tspan font-weight="bold" fill="#b45309">add（逐元素相加）</tspan>，要求形状完全相同、通道数不变。</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
    <marker id="a2b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
    <marker id="a2g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#10b981"/></marker>
    <marker id="a2p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a855f7"/></marker>
  </defs>
</svg>
