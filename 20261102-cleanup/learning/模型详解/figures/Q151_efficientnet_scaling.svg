<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="660" fill="#fff"/>
  <text x="470" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q151 EfficientNet 为什么约束 α·β²·γ²≈2？——从「FLOPs ∝ 深度·宽度²·分辨率²」推出来</text>

  <!-- ① 复合缩放 -->
  <rect x="20" y="42" width="900" height="86" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="470" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">① 复合缩放：用一个系数 φ 同时放大三个维度（不单独乱调）</text>
  <text x="470" y="94" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#374151">深度 d=α^φ　宽度 w=β^φ　分辨率 r=γ^φ　（α,β,γ ≥ 1）</text>
  <text x="470" y="118" text-anchor="middle" font-size="9.5" fill="#6b7280">φ=模型规模旋钮（φ=0→7 得到 B0→B7）；α/β/γ=三个维度各自的"放大配比"</text>

  <!-- ② FLOPs关系 = 为什么指数是1/2/2 -->
  <rect x="20" y="140" width="900" height="180" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="470" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">② 关键：卷积 FLOPs ∝ 深度 × 宽度² × 分辨率²（这决定了指数 1、2、2）</text>
  <g font-size="10.5" fill="#374151">
    <text x="50" y="192">· 深度翻倍 → 层数翻倍 → FLOPs <tspan font-weight="bold" fill="#15803d">×2</tspan>（线性）　→ 所以 α 是 <tspan font-weight="bold">一次方</tspan></text>
    <text x="50" y="222">· 宽度翻倍 → 每层乘加 ∝ C_in·C_out 是<tspan font-weight="bold">平方</tspan> → FLOPs <tspan font-weight="bold" fill="#15803d">×4</tspan>　→ 所以 <tspan font-weight="bold">β²</tspan></text>
    <text x="50" y="252">· 分辨率翻倍 → H×W 面积是<tspan font-weight="bold">平方</tspan> → FLOPs <tspan font-weight="bold" fill="#15803d">×4</tspan>　→ 所以 <tspan font-weight="bold">γ²</tspan></text>
  </g>
  <text x="470" y="288" text-anchor="middle" font-size="12.5" font-family="Consolas,monospace" font-weight="bold" fill="#15803d">总 FLOPs 放大 ≈ (α · β² · γ²) ^ φ</text>
  <text x="470" y="310" text-anchor="middle" font-size="9.5" fill="#6b7280">三个维度对算力的"贡献指数"分别是 1、2、2 —— 直接来自 FLOPs 的正比关系</text>

  <!-- ③ 为什么钉成2 -->
  <rect x="20" y="332" width="440" height="150" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="240" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">③ 为什么钉成「≈2」</text>
  <text x="36" y="380" font-size="10" fill="#374151">把 α·β²·γ² 固定成 2，则总 FLOPs</text>
  <text x="36" y="400" font-size="11" font-family="Consolas,monospace" font-weight="bold" fill="#6d28d9">≈ 2^φ</text>
  <text x="36" y="424" font-size="10" fill="#374151">→ φ 每加 1，算力刚好<tspan font-weight="bold">翻一倍</tspan></text>
  <text x="36" y="446" font-size="10" fill="#374151">= 人为设的「算力预算刻度」，</text>
  <text x="36" y="466" font-size="10" fill="#374151">好换算、可预测（B0→B7）</text>

  <!-- ④ α/β/γ怎么来 -->
  <rect x="480" y="332" width="440" height="150" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="700" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">④ α/β/γ 具体值怎么来</text>
  <text x="496" y="380" font-size="10" fill="#374151">固定 φ=1，在约束 α·β²·γ²≈2 下</text>
  <text x="496" y="400" font-size="10" fill="#374151">做一次<tspan font-weight="bold">小网格搜索</tspan>，选精度最高组：</text>
  <text x="496" y="424" font-size="11" font-family="Consolas,monospace" font-weight="bold" fill="#b45309">α=1.2  β=1.1  γ=1.15</text>
  <text x="496" y="448" font-size="10" font-family="Consolas,monospace" fill="#15803d">验证：1.2×1.1²×1.15²≈1.92≈2 ✓</text>
  <text x="496" y="470" font-size="9.5" fill="#374151">然后<tspan font-weight="bold">固定这组、只调 φ</tspan> 得 B1~B7</text>

  <!-- ⑤ 为什么协同 -->
  <rect x="20" y="494" width="900" height="96" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="470" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">⑤ 为什么要「协同」放大（而不是单调一个）</text>
  <text x="40" y="540" font-size="10" fill="#374151">· 只加深 → 梯度难训、收益饱和；　· 只加宽 → 抓不到高层语义、易过拟合；　· 只升分辨率 → 感受野/通道跟不上，浪费像素</text>
  <text x="40" y="562" font-size="10" fill="#b91c1c">· 三者<tspan font-weight="bold">按固定比例一起放大</tspan> → 精度/算力效率最优；这就是"复合(compound)"的含义，比各自乱调高效得多</text>
  <text x="40" y="582" font-size="9" fill="#6b7280">B0 基线本身是用 NAS（Q150）搜出来的；EfficientNet = NAS 搜基线 + 复合缩放放大</text>

  <!-- 一句话 -->
  <rect x="20" y="602" width="900" height="50" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="624" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">一句话：指数 1/2/2 来自「FLOPs ∝ 深度·宽度²·分辨率²」；把 α·β²·γ² 钉成 2 是让"φ 每加 1、FLOPs 翻倍"，预算可控。</text>
  <text x="470" y="644" text-anchor="middle" font-size="9.5" fill="#374151">α/β/γ 的具体值 (1.2/1.1/1.15) 是在此约束下网格搜出来的最优配比，验证 1.2×1.1²×1.15²≈1.92≈2。</text>
</svg>
