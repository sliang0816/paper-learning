<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="380" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">SSD 为何对小目标友好：浅层高分辨率特征图的三重原理</text>

  <!-- 原理一：分辨率 -->
  <text x="160" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">原理① 分辨率：小目标在浅层"还占得到格子"</text>
  <!-- 38x38 -->
  <text x="80" y="80" text-anchor="middle" font-size="10" fill="#16a34a">浅层 38×38</text>
  <rect x="40" y="86" width="80" height="80" fill="#f0fdf4" stroke="#86efac"/>
  <g stroke="#bbf7d0"><line x1="60" y1="86" x2="60" y2="166"/><line x1="80" y1="86" x2="80" y2="166"/><line x1="100" y1="86" x2="100" y2="166"/><line x1="40" y1="106" x2="120" y2="106"/><line x1="40" y1="126" x2="120" y2="126"/><line x1="40" y1="146" x2="120" y2="146"/></g>
  <circle cx="80" cy="126" r="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="180" text-anchor="middle" font-size="9" fill="#15803d">占 ~3×3 格 ✅可检</text>
  <!-- 19x19 -->
  <text x="200" y="80" text-anchor="middle" font-size="10" fill="#ca8a04">中层 19×19</text>
  <rect x="166" y="96" width="60" height="60" fill="#fefce8" stroke="#fde047"/>
  <g stroke="#fef08a"><line x1="186" y1="96" x2="186" y2="156"/><line x1="206" y1="96" x2="206" y2="156"/><line x1="166" y1="116" x2="226" y2="116"/><line x1="166" y1="136" x2="226" y2="136"/></g>
  <circle cx="196" cy="126" r="8" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
  <text x="196" y="172" text-anchor="middle" font-size="9" fill="#a16207">占 ~1 格</text>
  <!-- 5x5 -->
  <text x="290" y="80" text-anchor="middle" font-size="10" fill="#dc2626">深层 5×5</text>
  <rect x="266" y="106" width="44" height="44" fill="#fef2f2" stroke="#fca5a5"/>
  <line x1="288" y1="106" x2="288" y2="150" stroke="#fecaca"/><line x1="266" y1="128" x2="310" y2="128" stroke="#fecaca"/>
  <circle cx="288" cy="128" r="3" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="288" y="166" text-anchor="middle" font-size="9" fill="#b91c1c">＜1 格 ❌没了</text>

  <text x="160" y="200" text-anchor="middle" font-size="9.5" fill="#374151">同一小目标：经多次下采样，深层图上缩到不足一个格子 → 信息被"采样没了"</text>

  <!-- 原理二：感受野 -->
  <text x="560" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">原理② 感受野匹配</text>
  <rect x="400" y="68" width="150" height="120" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="475" y="88" text-anchor="middle" font-size="10" fill="#1d4ed8">浅层神经元</text>
  <rect x="430" y="98" width="40" height="40" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="3 2"/>
  <circle cx="450" cy="118" r="12" fill="#fde68a" stroke="#d97706"/>
  <text x="475" y="158" text-anchor="middle" font-size="9" fill="#374151">感受野小 ≈ 小目标尺寸</text>
  <text x="475" y="174" text-anchor="middle" font-size="9" fill="#15803d">目标填满视野→特征鲜明</text>

  <rect x="566" y="68" width="174" height="120" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="653" y="88" text-anchor="middle" font-size="10" fill="#b91c1c">深层神经元</text>
  <rect x="586" y="96" width="100" height="80" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="3 2"/>
  <circle cx="636" cy="136" r="6" fill="#fde68a" stroke="#d97706"/>
  <text x="653" y="158" text-anchor="middle" font-size="8.5" fill="#374151">感受野巨大，小目标只占一角</text>
  <text x="653" y="173" text-anchor="middle" font-size="8.5" fill="#b91c1c">被周围背景"稀释"淹没</text>

  <!-- 原理三：default box -->
  <text x="380" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">原理③ default box 尺度分工：浅层配小先验框 → 小目标才分得到正样本</text>
  <rect x="60" y="238" width="300" height="64" rx="6" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="210" y="258" text-anchor="middle" font-size="10" fill="#6d28d9">浅层用小尺度 default box</text>
  <text x="210" y="276" text-anchor="middle" font-size="9.5" fill="#374151">与小真值 IoU 够大 → 判为正样本</text>
  <text x="210" y="292" text-anchor="middle" font-size="9" fill="#16a34a">→ 网络能学着去框它 ✅</text>
  <rect x="400" y="238" width="300" height="64" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="550" y="258" text-anchor="middle" font-size="10" fill="#b91c1c">若只有深层大 default box</text>
  <text x="550" y="276" text-anchor="middle" font-size="9.5" fill="#374151">与小真值 IoU 恒小 → 拿不到正样本</text>
  <text x="550" y="292" text-anchor="middle" font-size="9" fill="#dc2626">→ 小目标直接漏检 ❌（呼应 Q14）</text>

  <!-- 底注 -->
  <rect x="40" y="316" width="700" height="56" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="338" font-size="11" fill="#374151">一句话：浅层特征图<tspan fill="#16a34a">分辨率高(留得住细节) + 感受野小(尺寸匹配) + 小先验框(分得到正样本)</tspan>，三者叠加 → 小目标友好。</text>
  <text x="56" y="358" font-size="10.5" fill="#b45309">⚠️ 但只是"比 YOLOv1 单尺度友好"：SSD 浅层各自独立预测、语义弱 → 小目标仍不够好，一年后 FPN 加语义融合才补齐(见 Q15/16 FPN)。</text>
</svg>
