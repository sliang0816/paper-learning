<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Microsoft YaHei',sans-serif">
  <rect width="800" height="520" fill="#fff"/>
  <text x="400" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q56 数值例子：通道用「相加」、空间用「concat」——F 为 2×2×3</text>

  <!-- input F -->
  <text x="20" y="52" font-size="11.5" font-weight="bold" fill="#374151">输入 F（3 个通道，每张 2×2）</text>
  <g font-size="10" text-anchor="middle">
    <rect x="20" y="60" width="70" height="50" fill="#dbeafe" stroke="#3b82f6"/><text x="38" y="80">2</text><text x="72" y="80">0</text><text x="38" y="102">1</text><text x="72" y="102">1</text><text x="55" y="124" font-size="9" fill="#1d4ed8">c1</text>
    <rect x="100" y="60" width="70" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="118" y="80">4</text><text x="152" y="80">2</text><text x="118" y="102">0</text><text x="152" y="102">0</text><text x="135" y="124" font-size="9" fill="#15803d">c2</text>
    <rect x="180" y="60" width="70" height="50" fill="#fef3c7" stroke="#d97706"/><text x="198" y="80">2</text><text x="232" y="80">2</text><text x="198" y="102">2</text><text x="232" y="102">2</text><text x="215" y="124" font-size="9" fill="#b45309">c3</text>
  </g>

  <!-- Channel attention: ADD -->
  <rect x="20" y="140" width="760" height="160" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="34" y="160" font-size="12.5" font-weight="bold" fill="#1d4ed8">① 通道注意力：两个向量过「共享 MLP」后【相加】（不是 concat）</text>
  <g font-size="10.5" fill="#374151">
    <text x="34" y="182">AvgPool（每通道均值）：[1.0, 1.5, 2.0]　　MaxPool（每通道最大）：[2, 4, 2]</text>
    <text x="34" y="204">↓ 各过同一个共享 MLP（3→1→3，w1=[.5,.5,.5]、ReLU、w2=[.3,.6,.2]）</text>
    <text x="34" y="224">　m_avg = 2.25·[.3,.6,.2] = [0.68, 1.35, 0.45]　　m_max = 4.0·[.3,.6,.2] = [1.2, 2.4, 0.8]</text>
    <text x="34" y="248" font-weight="bold" fill="#b91c1c">　【相加】 m_avg + m_max = [1.88, 3.75, 1.25]　（维度仍是 C=3，不变 2C）</text>
    <text x="34" y="270">↓ Sigmoid</text>
    <text x="34" y="290" font-weight="bold" fill="#1d4ed8">　Mc = [0.87, 0.98, 0.78]　→　F′ = Mc ⊗ F（每通道整张图乘对应值）</text>
  </g>

  <!-- Spatial attention: CONCAT -->
  <rect x="20" y="312" width="760" height="160" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="34" y="332" font-size="12.5" font-weight="bold" fill="#15803d">② 空间注意力（在 F′ 上）：两张图沿通道【concat】堆叠后卷积（拼的是“图”）</text>
  <g font-size="10" text-anchor="middle">
    <!-- avg map -->
    <text x="95" y="352" font-size="10" fill="#374151">沿通道 Avg 图</text>
    <rect x="60" y="358" width="70" height="44" fill="#dcfce7" stroke="#16a34a"/><text x="78" y="376">2.41</text><text x="112" y="376">1.17</text><text x="78" y="396">0.81</text><text x="112" y="396">0.81</text>
    <text x="220" y="352" font-size="10" fill="#374151">沿通道 Max 图</text>
    <rect x="185" y="358" width="70" height="44" fill="#bbf7d0" stroke="#16a34a"/><text x="203" y="376">3.92</text><text x="237" y="376">1.96</text><text x="203" y="396">1.56</text><text x="237" y="396">1.56</text>
    <text x="300" y="383" font-size="20" fill="#059669">⇒</text>
    <text x="360" y="352" font-size="10" fill="#047857" font-weight="bold">concat → 2×H×W（两张图都留着）</text>
    <rect x="330" y="358" width="60" height="44" fill="#d1fae5" stroke="#059669"/><text x="360" y="383">avg</text>
    <rect x="392" y="358" width="60" height="44" fill="#a7f3d0" stroke="#059669"/><text x="422" y="383">max</text>
    <text x="470" y="383" font-size="16" fill="#6b7280">→</text>
    <text x="560" y="352" font-size="10" fill="#374151">7×7 卷积(演示=两通道各0.5)+Sigmoid</text>
    <rect x="525" y="358" width="70" height="44" fill="#fde68a" stroke="#d97706"/><text x="543" y="376">0.96</text><text x="577" y="376">0.83</text><text x="543" y="396">0.77</text><text x="577" y="396">0.77</text>
    <text x="560" y="416" font-size="9.5" fill="#b45309">Ms（H×W×1）</text>
  </g>
  <text x="34" y="446" font-size="10.5" fill="#15803d">↓ F″ = Ms ⊗ F′（每位置所有通道乘该位置值）——左上“目标”处(0.96)被强调，背景(0.77)被压。</text>
  <text x="34" y="464" font-size="9.5" fill="#6b7280">注：这里 concat 是把 avg/max 两张图并排堆好，让卷积同时看到二者；若改成相加就丢了区分。</text>

  <!-- bottom: multiply chain -->
  <text x="20" y="496" font-size="11.5" font-weight="bold" fill="#b45309">③ 通道↔空间：串联相乘　F —×Mc→ F′ —×Ms→ F″（不是把 Mc、Ms 拼起来）</text>
  <text x="20" y="513" font-size="9.5" fill="#6b7280">三处合并：通道内部=相加 ｜ 空间内部=concat ｜ 通道↔空间=相乘。</text>
</svg>
