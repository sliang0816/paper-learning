<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="560" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">YOLOv8 完整网络结构（Backbone + PAN-FPN Neck + 解耦头）</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7280">以 640×640 输入为例；通道随模型规模(n/s/m/l/x)缩放，下图为示意</text>

  <!-- ===== Backbone column (left) ===== -->
  <text x="120" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Backbone（骨干，自底向上提特征）</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="60" y="86" width="120" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="120" y="103">输入 640×640×3</text>
    <rect x="60" y="120" width="120" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="120" y="136">Conv s2 → P1 320</text>
    <rect x="60" y="152" width="120" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="120" y="168">Conv s2 → P2 160</text>
    <rect x="60" y="184" width="120" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="120" y="200">Conv s2 + C2f → 80</text>
    <rect x="60" y="216" width="120" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="120" y="228">Conv s2 + C2f</text><text x="120" y="240" font-size="8.5" fill="#1d4ed8">P3 80×80（小目标）</text>
    <rect x="60" y="252" width="120" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="120" y="264">Conv s2 + C2f</text><text x="120" y="276" font-size="8.5" fill="#1d4ed8">P4 40×40（中）</text>
    <rect x="60" y="288" width="120" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="120" y="300">Conv s2 + C2f</text><text x="120" y="312" font-size="8.5" fill="#1d4ed8">P5 20×20（大）</text>
    <rect x="60" y="324" width="120" height="24" rx="4" fill="#c7d2fe" stroke="#4f46e5"/><text x="120" y="340">SPPF 20×20</text>
  </g>
  <g stroke="#374151" stroke-width="1.3">
    <line x1="120" y1="112" x2="120" y2="119" marker-end="url(#a)"/>
    <line x1="120" y1="144" x2="120" y2="151" marker-end="url(#a)"/>
    <line x1="120" y1="176" x2="120" y2="183" marker-end="url(#a)"/>
    <line x1="120" y1="244" x2="120" y2="251" marker-end="url(#a)"/>
    <line x1="120" y1="280" x2="120" y2="287" marker-end="url(#a)"/>
    <line x1="120" y1="316" x2="120" y2="323" marker-end="url(#a)"/>
  </g>

  <!-- ===== Neck (middle) PAN-FPN ===== -->
  <text x="410" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Neck：PAN-FPN（先自顶向下灌语义，再自底向上灌定位）</text>

  <!-- top-down -->
  <text x="320" y="96" font-size="10" font-weight="bold" fill="#7c3aed">① 自顶向下 (FPN)</text>
  <g font-size="9" text-anchor="middle">
    <rect x="280" y="324" width="120" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="340" y="340">P5头特征 20</text>
    <rect x="280" y="252" width="120" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="340" y="262">上采样+concat P4</text><text x="340" y="274" font-size="8">→ C2f → 40</text>
    <rect x="280" y="216" width="120" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="340" y="226">上采样+concat P3</text><text x="340" y="238" font-size="8">→ C2f → 80</text>
  </g>
  <!-- arrows top-down -->
  <g stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 2">
    <line x1="340" y1="324" x2="340" y2="280" marker-end="url(#p)"/>
    <line x1="340" y1="252" x2="340" y2="244" marker-end="url(#p)"/>
  </g>
  <!-- lateral from backbone -->
  <g stroke="#94a3b8" stroke-width="1.2">
    <line x1="180" y1="230" x2="278" y2="229" marker-end="url(#s)"/>
    <line x1="180" y1="266" x2="278" y2="265" marker-end="url(#s)"/>
    <line x1="180" y1="336" x2="278" y2="336" marker-end="url(#s)"/>
  </g>

  <!-- bottom-up -->
  <text x="500" y="96" font-size="10" font-weight="bold" fill="#0d9488">② 自底向上 (PAN)</text>
  <g font-size="9" text-anchor="middle">
    <rect x="460" y="216" width="120" height="26" rx="4" fill="#ccfbf1" stroke="#0d9488"/><text x="520" y="226">N3 80（=head P3）</text><text x="520" y="238" font-size="8">最浅·小目标</text>
    <rect x="460" y="252" width="120" height="26" rx="4" fill="#ccfbf1" stroke="#0d9488"/><text x="520" y="262">下采样+concat</text><text x="520" y="274" font-size="8">→ C2f → 40 N4</text>
    <rect x="460" y="324" width="120" height="26" rx="4" fill="#ccfbf1" stroke="#0d9488"/><text x="520" y="334">下采样+concat</text><text x="520" y="346" font-size="8">→ C2f → 20 N5</text>
  </g>
  <g stroke="#0d9488" stroke-width="1.4" stroke-dasharray="4 2">
    <line x1="520" y1="242" x2="520" y2="250" marker-end="url(#t)"/>
    <line x1="520" y1="278" x2="520" y2="322" marker-end="url(#t)"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.2">
    <line x1="400" y1="229" x2="458" y2="229" marker-end="url(#s)"/>
  </g>

  <!-- ===== Heads (right) ===== -->
  <text x="710" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">解耦检测头 ×3（anchor-free）</text>
  <g font-size="9" text-anchor="middle">
    <rect x="640" y="214" width="140" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="710" y="227">Head P3 80×80</text><text x="710" y="239" font-size="8">cls + reg(DFL)</text>
    <rect x="640" y="250" width="140" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="710" y="263">Head P4 40×40</text><text x="710" y="275" font-size="8">cls + reg(DFL)</text>
    <rect x="640" y="322" width="140" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="710" y="335">Head P5 20×20</text><text x="710" y="347" font-size="8">cls + reg(DFL)</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.3">
    <line x1="580" y1="229" x2="638" y2="229" marker-end="url(#g)"/>
    <line x1="580" y1="265" x2="638" y2="265" marker-end="url(#g)"/>
    <line x1="580" y1="337" x2="638" y2="337" marker-end="url(#g)"/>
  </g>
  <rect x="640" y="366" width="140" height="40" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="710" y="383" text-anchor="middle" font-size="9.5" fill="#be185d">合并 → NMS</text>
  <text x="710" y="397" text-anchor="middle" font-size="8.5" fill="#6b7280">→ 框+类别+分数</text>
  <g stroke="#db2777" stroke-width="1.2">
    <line x1="710" y1="244" x2="710" y2="365" marker-end="url(#d)"/>
    <line x1="710" y1="280" x2="710" y2="365" marker-end="url(#d)"/>
    <line x1="710" y1="352" x2="710" y2="365" marker-end="url(#d)"/>
  </g>

  <!-- 本项目 P2 提示 -->
  <rect x="60" y="430" width="700" height="116" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="76" y="452" font-size="12" font-weight="bold" fill="#a16207">本项目第三章改进点（在此结构上动手）：</text>
  <text x="76" y="473" font-size="11" fill="#374151">① 加 <tspan font-weight="bold" fill="#b45309">P2 检测头</tspan>：在 Backbone 的 P2(160×160, stride 4) 处再引一条更高分辨率支路进 Neck，多一个 160×160 检测头 → 专捞极小目标（呼应 FPN/SSD 浅层测小思想，见 17 FPN / 19 SSD）。</text>
  <text x="76" y="494" font-size="11" fill="#374151">② 加 <tspan font-weight="bold" fill="#b45309">CBAM 注意力</tspan>：在 Neck/Head 前插通道+空间注意力，强化小目标、低对比度响应（见 34 CBAM）。</text>
  <text x="76" y="514" font-size="11" fill="#374151">③ 代价：P2 分辨率高→计算/显存涨、正负更不平衡（见答疑 Q21/Q25）→ 必须实测 FPS/延迟（EXP-002，呼应答疑 Q8）。</text>
  <text x="76" y="534" font-size="10" fill="#6b7280">※ C2f 模块内部、解耦头+DFL 细节见下面两张图；源码层映射见 notes/paper_notes_yolov8.md。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="t" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0d9488"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#db2777"/></marker>
  </defs>
</svg>
