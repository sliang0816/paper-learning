<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="200" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">06 AlexNet 输入输出实例（深度学习元年 2012）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">224×224×3 图 → 5 卷积 + 3 全连接（ReLU+Dropout+双 GPU）→ 1000 类概率</text>

  <rect x="30" y="66" width="124" height="72" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="92" y="86" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入图像</text>
  <text x="92" y="105" text-anchor="middle" font-size="9.3" fill="#374151">224×224×3</text>
  <text x="92" y="123" text-anchor="middle" font-size="8" fill="#6b7280">ImageNet 自然图</text>

  <line x1="154" y1="102" x2="186" y2="102" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="188" y="62" width="224" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="300" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">5 卷积 + 3 FC</text>
  <text x="300" y="100" text-anchor="middle" font-size="8.5" fill="#374151">首用 ReLU（快）、Dropout（防过拟合）</text>
  <text x="300" y="116" text-anchor="middle" font-size="8.5" fill="#374151">双 GPU 并行训练</text>
  <text x="300" y="132" text-anchor="middle" font-size="8" fill="#6b7280">约 6000 万参数</text>

  <line x1="412" y1="102" x2="444" y2="102" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="446" y="70" width="172" height="64" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="532" y="90" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">1000 类概率</text>
  <text x="532" y="108" text-anchor="middle" font-size="8.7" fill="#374151">top-1 “豹” 0.79</text>
  <text x="532" y="124" text-anchor="middle" font-size="8" fill="#6b7280">Top-5 错误率 15.3%</text>

  <line x1="618" y1="102" x2="650" y2="102" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="652" y="78" width="140" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="722" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">碾压传统方法</text>
  <text x="722" y="116" text-anchor="middle" font-size="7.8" fill="#6b7280">第二名 26.2%</text>

  <text x="410" y="172" text-anchor="middle" font-size="9.6" fill="#374151">I/O 和后续骨干一样（图→1000类），意义在<tspan font-weight="bold" fill="#0369a1">证明“大数据+大算力+深网络”可行</tspan>，点燃深度学习。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
