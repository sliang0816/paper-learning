<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="460" fill="#fff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Mask R-CNN：Faster R-CNN + 并行 mask 分支 → 实例分割；RoIAlign 修对齐</text>

  <!-- 主流程 -->
  <rect x="20" y="42" width="900" height="150" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="470" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">在 Faster R-CNN 的每个候选框上，多加一条"逐像素 mask"分支（三头并行）</text>
  <rect x="40" y="80" width="90" height="46" fill="#e5e7eb" stroke="#9ca3af"/><text x="85" y="107" text-anchor="middle" font-size="8.5" fill="#374151">图 → 骨干+FPN</text>
  <text x="138" y="106" font-size="12" fill="#9ca3af">→</text>
  <rect x="160" y="80" width="90" height="46" rx="4" fill="#bfdbfe" stroke="#3b82f6"/><text x="205" y="100" text-anchor="middle" font-size="8.5" fill="#1e40af">RPN 出候选框</text><text x="205" y="114" text-anchor="middle" font-size="7.5" fill="#6b7280">同 Faster R-CNN</text>
  <text x="258" y="106" font-size="12" fill="#9ca3af">→</text>
  <rect x="280" y="80" width="100" height="46" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="330" y="100" text-anchor="middle" font-size="8.5" fill="#b45309">RoIAlign</text><text x="330" y="114" text-anchor="middle" font-size="7.5" fill="#b91c1c">修对齐(替RoIPool)</text>
  <text x="388" y="106" font-size="12" fill="#9ca3af">→</text>
  <!-- 三头 -->
  <rect x="410" y="70" width="150" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="485" y="85" text-anchor="middle" font-size="8" fill="#15803d">分类头 → 类别</text>
  <rect x="410" y="96" width="150" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="485" y="111" text-anchor="middle" font-size="8" fill="#15803d">回归头 → 框</text>
  <rect x="410" y="122" width="150" height="24" rx="3" fill="#ede9fe" stroke="#8b5cf6"/><text x="485" y="138" text-anchor="middle" font-size="8" fill="#6d28d9">mask 分支(小FCN) → 掩码</text>
  <text x="575" y="106" font-size="12" fill="#9ca3af">→</text>
  <rect x="595" y="80" width="150" height="46" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="670" y="100" text-anchor="middle" font-size="8.5" fill="#15803d">每个实例：</text><text x="670" y="114" text-anchor="middle" font-size="7.5" fill="#374151">类别+框+掩码</text>
  <text x="760" y="106" font-size="8.5" fill="#6b7280">→ 实例分割</text>
  <text x="470" y="170" text-anchor="middle" font-size="9" fill="#374151">mask 分支：在每个 RoI 上跑一个小全卷积(FCN)，逐像素输出"是不是这个实例"的二值掩码</text>
  <text x="470" y="186" font-size="8.5" fill="#6b7280" text-anchor="middle">关键：掩码和分类"解耦"——分类头决定是什么类，mask 分支只管形状（每类各出一个掩码，按分类结果取用）</text>

  <!-- RoIAlign -->
  <rect x="20" y="206" width="900" height="140" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="470" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">RoIAlign：为什么要替换 RoIPool（分割对像素级对齐极敏感）</text>
  <text x="40" y="250" font-size="9.5" fill="#374151">· RoIPool（Fast R-CNN 用）：把候选框映射到特征图时做了<tspan font-weight="bold">两次取整量化</tspan>（边界、分格都四舍五入）</text>
  <text x="40" y="268" font-size="9.5" fill="#374151">　→ 检测框差几像素影响不大，但<tspan font-weight="bold" fill="#b91c1c">分割逐像素、对齐错位会让掩码明显偏</tspan></text>
  <text x="40" y="290" font-size="9.5" fill="#374151">· RoIAlign：<tspan font-weight="bold">不取整</tspan>，用<tspan font-weight="bold">双线性插值</tspan>在精确的浮点位置采样（见 Q59 双线性插值）</text>
  <text x="40" y="308" font-size="9.5" fill="#15803d">　→ 保住像素级对齐，掩码精度大幅提升（这是 Mask R-CNN 能做好分割的关键一环）</text>
  <text x="40" y="330" font-size="8.5" fill="#6b7280">对比 Q47 RoI Pooling：RoIAlign = 去掉量化 + 双线性插值的 RoI Pooling</text>

  <!-- 一句话 -->
  <rect x="20" y="360" width="900" height="86" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">一句话：Mask R-CNN = Faster R-CNN(检测) + 每个框上并行一个 mask 分支(逐像素二值掩码) → 实例分割；</text>
  <text x="470" y="404" text-anchor="middle" font-size="9.5" fill="#374151">用 RoIAlign（双线性插值、不取整）替换 RoIPool 保住像素对齐。"检测再分割"的代表范式。</text>
  <text x="470" y="424" text-anchor="middle" font-size="9" fill="#6b7280">对比语义分割(FCN/DeepLab 不分个体)：Mask R-CNN 分个体（车1/车2各一个掩码）</text>
  <text x="470" y="440" text-anchor="middle" font-size="8" fill="#6b7280">He K, Gkioxari G, Dollár P, Girshick R. Mask R-CNN. ICCV 2017.</text>
</svg>
