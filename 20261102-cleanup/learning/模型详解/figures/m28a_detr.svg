<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="220" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">DETR：集合预测，无 Anchor、无 NMS</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="20"  y="80" width="80" height="50" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="60" y="102">图像</text><text x="60" y="120" font-size="10" fill="#6b7280">CNN骨干</text>
    <rect x="130" y="80" width="110" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="185" y="102">Transformer</text><text x="185" y="120">Encoder</text>
    <rect x="290" y="80" width="110" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="345" y="102">Transformer</text><text x="345" y="120">Decoder</text>
    <rect x="290" y="150" width="110" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="345" y="170" font-size="11">N 个 object queries</text>
    <rect x="450" y="72" width="110" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="505" y="92">类别+框 ×N</text>
    <rect x="450" y="110" width="110" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="505" y="130" font-size="10.5">二分图匹配损失</text>
  </g>
  <g stroke="#374151" stroke-width="1.7">
    <line x1="100" y1="105" x2="128" y2="105" marker-end="url(#a15)"/>
    <line x1="240" y1="105" x2="288" y2="105" marker-end="url(#a15)"/>
    <line x1="345" y1="150" x2="345" y2="132" stroke="#f59e0b" marker-end="url(#a15f)"/>
    <line x1="400" y1="100" x2="448" y2="90" marker-end="url(#a15)"/>
  </g>
  <text x="360" y="205" text-anchor="middle" font-size="11.5" fill="#6b7280">匈牙利算法一对一匹配 → 天然去重（无需 NMS）；收敛慢、小目标弱，启发了 YOLOv10 去 NMS</text>
  <defs>
    <marker id="a15" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="a15f" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
