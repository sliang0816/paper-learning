<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 215" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="215" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">29 BERT 输入输出实例（双向编码器，理解类任务）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">[CLS]+句子 token → 双向 Transformer（每词左右都看）→ 每 token 向量；[CLS]→分类</text>

  <rect x="22" y="66" width="150" height="84" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="97" y="85" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#075985">输入：文本 token</text>
  <text x="97" y="103" text-anchor="middle" font-size="8.3" fill="#374151">[CLS] this movie good [SEP]</text>
  <text x="97" y="119" text-anchor="middle" font-size="8" fill="#6b7280">[CLS] 是“句子代表”位</text>
  <text x="97" y="134" text-anchor="middle" font-size="8" fill="#6b7280">预训练用 MLM（完形填空）</text>

  <line x1="172" y1="108" x2="202" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="204" y="64" width="190" height="88" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="299" y="83" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#1e40af">双向 Transformer 编码器</text>
  <text x="299" y="101" text-anchor="middle" font-size="8.3" fill="#374151">每个词同时看左边和右边</text>
  <text x="299" y="116" text-anchor="middle" font-size="8.3" fill="#374151">→ 充分理解语境</text>
  <text x="299" y="133" text-anchor="middle" font-size="8" fill="#6b7280">多对多：每 token 出一个向量</text>
  <text x="299" y="146" text-anchor="middle" font-size="7.6" fill="#6b7280">[CLS] 汇聚整句信息</text>

  <line x1="394" y1="108" x2="424" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="426" y="72" width="186" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="519" y="91" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#15803d">输出</text>
  <text x="519" y="109" text-anchor="middle" font-size="8.3" fill="#374151">· 每 token 上下文向量（如做 NER）</text>
  <text x="519" y="125" text-anchor="middle" font-size="8.3" fill="#374151">· [CLS] 向量 → 分类/句向量</text>

  <line x1="612" y1="108" x2="642" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="644" y="84" width="148" height="50" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="718" y="103" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#15803d">情感 = 正面 0.9</text>
  <text x="718" y="120" text-anchor="middle" font-size="7.4" fill="#6b7280">（[CLS]→FC）</text>

  <text x="410" y="180" text-anchor="middle" font-size="9.6" fill="#374151">和 GPT 互补：BERT 是<tspan font-weight="bold" fill="#0369a1">双向编码器</tspan>（看全句做“理解”），擅长分类/抽取；不做逐词生成。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
