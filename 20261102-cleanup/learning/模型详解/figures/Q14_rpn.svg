<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="320" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">RPN：滑窗 + k 个 anchor，分类(物体?) + 回归(偏移)</text>

  <!-- 特征图 + 滑窗 -->
  <g stroke="#cbd5e1" stroke-width="1">
    <rect x="40" y="58" width="120" height="120" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="70" y1="58" x2="70" y2="178"/><line x1="100" y1="58" x2="100" y2="178"/><line x1="130" y1="58" x2="130" y2="178"/>
    <line x1="40" y1="88" x2="160" y2="88"/><line x1="40" y1="118" x2="160" y2="118"/><line x1="40" y1="148" x2="160" y2="148"/>
  </g>
  <rect x="70" y="88" width="60" height="60" fill="#fde68a" fill-opacity="0.5" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="52" text-anchor="middle" font-size="10.5" fill="#6366f1">共享特征图 + 3×3 滑窗</text>

  <line x1="162" y1="118" x2="205" y2="118" stroke="#374151" stroke-width="1.8" marker-end="url(#aq14)"/>
  <rect x="207" y="100" width="80" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="247" y="122" text-anchor="middle" font-size="10.5">256 维</text>

  <!-- 两个头 -->
  <line x1="287" y1="112" x2="330" y2="92" stroke="#374151" stroke-width="1.6" marker-end="url(#aq14)"/>
  <line x1="287" y1="124" x2="330" y2="150" stroke="#374151" stroke-width="1.6" marker-end="url(#aq14)"/>
  <rect x="332" y="74" width="150" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="407" y="90" text-anchor="middle" font-size="10.5">分类 cls：2k 分数</text><text x="407" y="104" text-anchor="middle" font-size="9" fill="#7c2d12">每anchor:物体/背景</text>
  <rect x="332" y="132" width="150" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="407" y="148" text-anchor="middle" font-size="10.5">回归 reg：4k 偏移</text><text x="407" y="162" text-anchor="middle" font-size="9" fill="#166534">每anchor:tx,ty,tw,th</text>

  <!-- k 个 anchor 示意 -->
  <text x="600" y="60" text-anchor="middle" font-size="11" fill="#374151">每位置 k 个 anchor（3尺度×3比例）</text>
  <g fill="none" stroke-width="1.6">
    <rect x="560" y="78" width="80" height="50" stroke="#3b82f6"/>
    <rect x="572" y="72" width="56" height="62" stroke="#8b5cf6"/>
    <rect x="552" y="88" width="96" height="30" stroke="#ec4899"/>
  </g>
  <circle cx="600" cy="103" r="2.5" fill="#111827"/>

  <!-- 下：anchor→GT -->
  <rect x="40" y="200" width="640" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="60" y="222" font-size="12.5" font-weight="bold" fill="#b45309">anchor 负责"粗覆盖"，回归负责"细微调逼近真值"</text>
  <rect x="70" y="236" width="70" height="44" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="105" y="232" text-anchor="middle" font-size="9.5" fill="#3b82f6">anchor</text>
  <line x1="142" y1="258" x2="190" y2="258" stroke="#ef4444" stroke-width="1.8" marker-end="url(#aq14)"/>
  <text x="166" y="250" text-anchor="middle" font-size="9" fill="#ef4444">回归偏移</text>
  <rect x="192" y="240" width="78" height="48" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="231" y="232" text-anchor="middle" font-size="9.5" fill="#16a34a">真值 GT</text>
  <text x="300" y="252" font-size="11" fill="#374151">⚠️ 若没有 anchor 与某 GT 沾边(IoU低) → 拿不到正样本 → 漏检</text>
  <text x="300" y="272" font-size="11" fill="#374151">→ 故 anchor 尺寸需覆盖数据分布(YOLOv2 用 k-means 聚类选)</text>
  <text x="300" y="292" font-size="10.5" fill="#9ca3af">超参敏感正是 anchor-free(FCOS/YOLOv8)出现的动机</text>
  <defs><marker id="aq14" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
