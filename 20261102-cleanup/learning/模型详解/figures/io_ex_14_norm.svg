<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="235" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">14 BatchNorm/LayerNorm 输入输出实例（只调分布，不改形状）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">某层激活张量进 → 标准化到 ~N(0,1) + γβ 仿射 → 同形状张量出，分布更稳、收敛更快</text>

  <rect x="22" y="66" width="146" height="78" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="95" y="86" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入：某通道一批值</text>
  <text x="95" y="105" text-anchor="middle" font-size="9.2" fill="#374151">[10, −2, 8, 0]</text>
  <text x="95" y="123" text-anchor="middle" font-size="8" fill="#b91c1c">分布乱、忽大忽小</text>
  <text x="95" y="137" text-anchor="middle" font-size="8" fill="#6b7280">深层易“漂移”难训</text>

  <line x1="168" y1="105" x2="200" y2="105" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="202" y="62" width="210" height="86" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="307" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">标准化 + 仿射</text>
  <text x="307" y="100" text-anchor="middle" font-size="8.4" fill="#374151">减均值 4、除标准差 5 → [1.2,−1.2,0.8,−0.8]</text>
  <text x="307" y="116" text-anchor="middle" font-size="8.4" fill="#374151">再 γ=2,β=1 仿射 → [3.4,−1.4,2.6,−0.6]</text>
  <text x="307" y="133" text-anchor="middle" font-size="8" fill="#6b7280">BN 按通道(跨 batch) / LN 按样本(跨特征)</text>

  <line x1="412" y1="105" x2="444" y2="105" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="446" y="68" width="160" height="74" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="526" y="88" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">输出：同形状</text>
  <text x="526" y="106" text-anchor="middle" font-size="9" fill="#374151">[3.4,−1.4,2.6,−0.6]</text>
  <text x="526" y="123" text-anchor="middle" font-size="8" fill="#b91c1c">个数不变！分布稳了</text>

  <line x1="606" y1="105" x2="638" y2="105" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="640" y="80" width="152" height="50" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="716" y="100" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#15803d">下一层更好学</text>
  <text x="716" y="117" text-anchor="middle" font-size="7.8" fill="#6b7280">加速收敛、可用大学习率</text>

  <text x="410" y="180" text-anchor="middle" font-size="9.6" fill="#374151">关键：归一化层<tspan font-weight="bold" fill="#b91c1c">不改张量形状</tspan>（4 个数进、4 个数出），只把“数值分布”拉回稳定区间，再用 γβ 留学习自由度。</text>
  <text x="410" y="202" text-anchor="middle" font-size="9.2" fill="#6b7280">所以能插在任意层之间——YOLOv8 的 Conv-BN-SiLU 基本单元就靠它稳定训练。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
