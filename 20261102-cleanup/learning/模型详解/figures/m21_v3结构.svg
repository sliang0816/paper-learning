<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="320" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">YOLOv3（2018）　对照 v2：单尺度 → 三尺度预测 + Darknet-53 残差</text>

  <rect x="20" y="120" width="54" height="54" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="47" y="143" text-anchor="middle" font-size="10.5" fill="#0369a1">输入</text>
  <text x="47" y="159" text-anchor="middle" font-size="8.5" fill="#6b7280">416</text>

  <!-- Backbone changed: Darknet-53 residual -->
  <rect x="92" y="108" width="150" height="78" rx="6" fill="#dbeafe" stroke="#ef4444" stroke-width="2"/>
  <text x="167" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">骨干 Backbone</text>
  <text x="167" y="148" text-anchor="middle" font-size="11" fill="#dc2626">🔴 Darknet-53</text>
  <text x="167" y="165" text-anchor="middle" font-size="10" fill="#dc2626">🔴 残差连接(ResNet 思想)</text>
  <text x="167" y="179" text-anchor="middle" font-size="8.5" fill="#6b7280">更深仍可训</text>

  <!-- Neck NEW: FPN 3-scale -->
  <rect x="262" y="70" width="170" height="172" rx="6" fill="#ede9fe" stroke="#ef4444" stroke-width="2"/>
  <text x="347" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">🔴 颈部 Neck（新增）</text>
  <text x="347" y="107" text-anchor="middle" font-size="9.5" fill="#dc2626">FPN 自顶向下融合</text>
  <g font-size="9" text-anchor="middle">
    <rect x="278" y="116" width="138" height="32" rx="4" fill="#fff" stroke="#7c3aed"/><text x="347" y="136">大尺度 52×52 → 测小目标</text>
    <rect x="278" y="154" width="138" height="32" rx="4" fill="#fff" stroke="#7c3aed"/><text x="347" y="174">中尺度 26×26 → 测中目标</text>
    <rect x="278" y="192" width="138" height="32" rx="4" fill="#fff" stroke="#7c3aed"/><text x="347" y="212">小尺度 13×13 → 测大目标</text>
  </g>
  <g stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 2">
    <line x1="347" y1="224" x2="347" y2="186" marker-end="url(#b)"/>
    <line x1="347" y1="186" x2="347" y2="148" marker-end="url(#b)"/>
  </g>

  <!-- Heads x3 -->
  <g font-size="9.5" text-anchor="middle">
    <rect x="452" y="116" width="96" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="135">检测头·小</text>
    <rect x="452" y="154" width="96" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="173">检测头·中</text>
    <rect x="452" y="192" width="96" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="211">检测头·大</text>
  </g>
  <text x="500" y="106" text-anchor="middle" font-size="9.5" fill="#dc2626">🔴 三个独立头</text>

  <rect x="566" y="116" width="174" height="106" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="653" y="138" text-anchor="middle" font-size="10.5" fill="#be185d">3 尺度输出</text>
  <text x="653" y="156" text-anchor="middle" font-size="9" fill="#6b7280">每尺度 3 个 anchor</text>
  <text x="653" y="176" text-anchor="middle" font-size="9.5" fill="#dc2626">🔴 逻辑回归分类</text>
  <text x="653" y="192" text-anchor="middle" font-size="8.5" fill="#6b7280">(替 softmax，支持多标签)</text>
  <text x="653" y="210" text-anchor="middle" font-size="8.5" fill="#6b7280">N×N×3×(5+C)</text>

  <g stroke="#374151" stroke-width="1.4">
    <line x1="74" y1="147" x2="90" y2="147" marker-end="url(#a)"/>
    <line x1="242" y1="147" x2="260" y2="147" marker-end="url(#a)"/>
    <line x1="432" y1="131" x2="450" y2="131" marker-end="url(#a)"/>
    <line x1="432" y1="169" x2="450" y2="169" marker-end="url(#a)"/>
    <line x1="432" y1="207" x2="450" y2="207" marker-end="url(#a)"/>
    <line x1="548" y1="169" x2="564" y2="169" marker-end="url(#a)"/>
  </g>

  <rect x="20" y="256" width="720" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="36" y="278" font-size="11.5" font-weight="bold" fill="#b91c1c">🔴 相对 v2 的核心改进：从"单尺度"到"三尺度金字塔"（借鉴 FPN）</text>
  <text x="36" y="296" font-size="11" fill="#374151">① 多尺度预测：浅层大图测小目标、深层小图测大目标 → 小目标大幅改善。② Darknet-53 加残差 → 可堆更深。③ 逻辑回归独立分类支持多标签。</text>
  <text x="36" y="311" font-size="10" fill="#b45309">v3 确立的"多尺度 + 残差骨干"骨架一直延续到 v8。</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
