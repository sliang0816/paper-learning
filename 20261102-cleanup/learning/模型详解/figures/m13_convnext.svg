<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="'Microsoft YaHei',sans-serif">
  <rect width="680" height="240" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">ConvNeXt：把 ResNet 逐步"现代化"追平 Transformer</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20"  y="90" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="65" y="112">ResNet-50</text><text x="65" y="130" fill="#6b7280">76.1%</text>
    <rect x="560" y="90" width="100" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="610" y="112">ConvNeXt</text><text x="610" y="130" fill="#16a34a">82%+</text>
  </g>
  <line x1="110" y1="115" x2="558" y2="115" stroke="#9ca3af" stroke-width="2" marker-end="url(#a32)"/>
  <g font-size="9.5" text-anchor="middle" fill="#374151">
    <text x="180" y="100">①现代训练配方</text><text x="180" y="135">AdamW/增强</text>
    <text x="280" y="100">②结构比例</text><text x="280" y="135">仿Swin 1:1:3:1</text>
    <text x="375" y="100">③深度可分离</text><text x="375" y="135">+倒残差</text>
    <text x="460" y="100">④7×7大核</text><text x="460" y="135">仿注意力感受野</text>
    <text x="535" y="100">⑤GELU/LN</text>
  </g>
  <text x="340" y="185" text-anchor="middle" font-size="12" fill="#7c3aed">核心结论：纯卷积 + 现代配方即可追平 Transformer，自注意力非强性能必要条件</text>
  <text x="340" y="212" text-anchor="middle" font-size="11.5" fill="#6b7280">启示：CNN 仍强且部署友好 → 支持本项目用 YOLOv8（CNN）做实时方案</text>
  <defs><marker id="a32" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
