<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" font-family="'Microsoft YaHei',sans-serif">
  <rect width="740" height="160" fill="#fff"/>
  <text x="14" y="24" font-size="13" font-weight="bold" fill="#111827">⑥ 视觉 Transformer 与视觉语言：图像(切 patch) [+文本] → 类别 / 相似度 / 文本 / 掩码</text>
  <!-- ViT row -->
  <g font-size="11">
    <rect x="20" y="40" width="150" height="32" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="95" y="60" text-anchor="middle">图像→patch 序列</text>
    <line x1="172" y1="56" x2="222" y2="56" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="224" y="40" width="110" height="32" rx="5" fill="#f3f4f6" stroke="#6b7280"/><text x="279" y="60" text-anchor="middle">ViT / Swin</text>
    <line x1="336" y1="56" x2="386" y2="56" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="388" y="40" width="338" height="32" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="557" y="60" text-anchor="middle">类别 / 多尺度特征（[CLS]→类别）</text>
  </g>
  <!-- VLM row: two-tower -->
  <g font-size="11">
    <rect x="20" y="86" width="150" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="95" y="105" text-anchor="middle">图像</text>
    <rect x="20" y="120" width="150" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="95" y="139" text-anchor="middle">文本 / 提示词</text>
    <line x1="172" y1="101" x2="222" y2="110" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <line x1="172" y1="135" x2="222" y2="124" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="224" y="92" width="130" height="52" rx="5" fill="#f3f4f6" stroke="#6b7280"/><text x="289" y="114" text-anchor="middle">双塔 / 多模态</text><text x="289" y="132" text-anchor="middle" font-size="10" fill="#6b7280">CLIP/GDINO/SAM/LLaVA</text>
    <line x1="356" y1="118" x2="406" y2="118" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="408" y="92" width="318" height="52" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="567" y="113" text-anchor="middle">余弦相似度 / 文本回答 / 检测框 / 分割掩码</text><text x="567" y="132" text-anchor="middle" font-size="10" fill="#b45309">CLIP 相似度 = 本项目零样本识别核心</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
