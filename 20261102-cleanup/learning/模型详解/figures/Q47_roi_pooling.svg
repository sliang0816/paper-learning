<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" font-family="'Microsoft YaHei',sans-serif">
  <rect width="830" height="470" fill="#fff"/>
  <text x="415" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">RoI Pooling：把任意大小的候选框区域，池化成固定大小，好喂全连接</text>
  <text x="415" y="46" text-anchor="middle" font-size="11" fill="#6b7280">整图只过一次 CNN → 在特征图上抠每个 RoI → 各自池化到同样 7×7 → 同一个 FC 头</text>

  <!-- pipeline top -->
  <g font-size="10" text-anchor="middle">
    <rect x="30" y="64" width="92" height="46" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="76" y="84">整图</text><text x="76" y="100" font-size="8">一次 CNN</text>
    <rect x="150" y="64" width="110" height="46" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="205" y="84">特征图</text><text x="205" y="100" font-size="8">含多个 RoI(不同大小)</text>
    <rect x="290" y="64" width="120" height="46" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="350" y="84">RoI Pooling</text><text x="350" y="100" font-size="8">各自 → 固定 7×7</text>
    <rect x="440" y="64" width="110" height="46" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="495" y="84">FC 头</text><text x="495" y="100" font-size="8">定长输入(见 Q44)</text>
    <rect x="580" y="64" width="120" height="46" rx="5" fill="#bbf7d0" stroke="#15803d"/><text x="640" y="84">类别 + 回归框</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)">
    <line x1="122" y1="87" x2="148" y2="87"/><line x1="260" y1="87" x2="288" y2="87"/><line x1="410" y1="87" x2="438" y2="87"/><line x1="550" y1="87" x2="578" y2="87"/>
  </g>

  <!-- worked example: 4x6 RoI -> 2x2 -->
  <text x="200" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">例：特征图上一个 4×6 的 RoI → 池化成 2×2</text>
  <text x="200" y="164" text-anchor="middle" font-size="9.5" fill="#6b7280">行 4÷2=每格2行，列 6÷2=每格3列 → 4 个 2×3 小格，各取最大值</text>

  <!-- 4x6 grid -->
  <g font-size="11" text-anchor="middle">
    <!-- values -->
    <!-- row0 -->
    <rect x="60" y="178" width="30" height="30" fill="#eff6ff" stroke="#93c5fd"/><text x="75" y="198">1</text>
    <rect x="90" y="178" width="30" height="30" fill="#eff6ff" stroke="#93c5fd"/><text x="105" y="198">3</text>
    <rect x="120" y="178" width="30" height="30" fill="#eff6ff" stroke="#93c5fd"/><text x="135" y="198">2</text>
    <rect x="150" y="178" width="30" height="30" fill="#fef3c7" stroke="#f59e0b"/><text x="165" y="198">0</text>
    <rect x="180" y="178" width="30" height="30" fill="#fef3c7" stroke="#f59e0b"/><text x="195" y="198">5</text>
    <rect x="210" y="178" width="30" height="30" fill="#fef3c7" stroke="#f59e0b"/><text x="225" y="198">1</text>
    <!-- row1 -->
    <rect x="60" y="208" width="30" height="30" fill="#eff6ff" stroke="#93c5fd"/><text x="75" y="228">4</text>
    <rect x="90" y="208" width="30" height="30" fill="#eff6ff" stroke="#93c5fd"/><text x="105" y="228">2</text>
    <rect x="120" y="208" width="30" height="30" fill="#eff6ff" stroke="#93c5fd"/><text x="135" y="228">1</text>
    <rect x="150" y="208" width="30" height="30" fill="#fef3c7" stroke="#f59e0b"/><text x="165" y="228">2</text>
    <rect x="180" y="208" width="30" height="30" fill="#fef3c7" stroke="#f59e0b"/><text x="195" y="228">1</text>
    <rect x="210" y="208" width="30" height="30" fill="#fef3c7" stroke="#f59e0b"/><text x="225" y="228">6</text>
    <!-- row2 -->
    <rect x="60" y="238" width="30" height="30" fill="#f0fdf4" stroke="#86efac"/><text x="75" y="258">0</text>
    <rect x="90" y="238" width="30" height="30" fill="#f0fdf4" stroke="#86efac"/><text x="105" y="258">1</text>
    <rect x="120" y="238" width="30" height="30" fill="#f0fdf4" stroke="#86efac"/><text x="135" y="258">7</text>
    <rect x="150" y="238" width="30" height="30" fill="#fce7f3" stroke="#ec4899"/><text x="165" y="258">3</text>
    <rect x="180" y="238" width="30" height="30" fill="#fce7f3" stroke="#ec4899"/><text x="195" y="258">2</text>
    <rect x="210" y="238" width="30" height="30" fill="#fce7f3" stroke="#ec4899"/><text x="225" y="258">1</text>
    <!-- row3 -->
    <rect x="60" y="268" width="30" height="30" fill="#f0fdf4" stroke="#86efac"/><text x="75" y="288">2</text>
    <rect x="90" y="268" width="30" height="30" fill="#f0fdf4" stroke="#86efac"/><text x="105" y="288">8</text>
    <rect x="120" y="268" width="30" height="30" fill="#f0fdf4" stroke="#86efac"/><text x="135" y="288">1</text>
    <rect x="150" y="268" width="30" height="30" fill="#fce7f3" stroke="#ec4899"/><text x="165" y="288">4</text>
    <rect x="180" y="268" width="30" height="30" fill="#fce7f3" stroke="#ec4899"/><text x="195" y="288">0</text>
    <rect x="210" y="268" width="30" height="30" fill="#fce7f3" stroke="#ec4899"/><text x="225" y="288">2</text>
    <!-- thick bin borders -->
    <g stroke="#374151" stroke-width="2.5" fill="none">
      <rect x="60" y="178" width="90" height="60"/><rect x="150" y="178" width="90" height="60"/>
      <rect x="60" y="238" width="90" height="60"/><rect x="150" y="238" width="90" height="60"/>
    </g>
  </g>

  <!-- arrow to 2x2 result -->
  <line x1="250" y1="238" x2="300" y2="238" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="275" y="230" text-anchor="middle" font-size="9" fill="#6b7280">每格取max</text>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="310" y="208" width="40" height="30" fill="#dbeafe" stroke="#3b82f6"/><text x="330" y="229">4</text>
    <rect x="350" y="208" width="40" height="30" fill="#fef3c7" stroke="#f59e0b"/><text x="370" y="229">6</text>
    <rect x="310" y="238" width="40" height="30" fill="#f0fdf4" stroke="#16a34a"/><text x="330" y="259">8</text>
    <rect x="350" y="238" width="40" height="30" fill="#fce7f3" stroke="#ec4899"/><text x="370" y="259">4</text>
  </g>
  <text x="350" y="288" text-anchor="middle" font-size="9.5" fill="#374151">固定 2×2 输出</text>
  <text x="455" y="222" font-size="9.5" fill="#374151">蓝格 max(1,3,2,4,2,1)=4</text>
  <text x="455" y="238" font-size="9.5" fill="#374151">黄格 max(0,5,1,2,1,6)=6</text>
  <text x="455" y="254" font-size="9.5" fill="#374151">绿格 max(0,1,7,2,8,1)=8</text>
  <text x="455" y="270" font-size="9.5" fill="#374151">粉格 max(3,2,1,4,0,2)=4</text>
  <text x="610" y="246" font-size="10" fill="#15803d">RoI 多大都 → 2×2，</text>
  <text x="610" y="262" font-size="10" fill="#15803d">于是能进同一个 FC</text>

  <!-- bottom notes -->
  <rect x="40" y="312" width="750" height="142" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="334" font-size="11" font-weight="bold" fill="#374151">要点：</text>
  <text x="56" y="356" font-size="10.5" fill="#374151">• <tspan font-weight="bold">解决的问题</tspan>：候选框大小不一 → 抠出的特征也不一 → 撞上"FC 要定长"(Q44)。RoI Pooling 把任意大小 RoI 池化成固定 H×W。</text>
  <text x="56" y="376" font-size="10.5" fill="#374151">• <tspan font-weight="bold">本质 = 自适应池化</tspan>：输出格数固定，每格覆盖的输入大小随 RoI 自适应。也就是"单层的 SPP"(见 04 §五)。</text>
  <text x="56" y="396" font-size="10.5" fill="#374151">• <tspan font-weight="bold">价值</tspan>：整图只过一次 CNN、所有 RoI 共享特征 → Fast R-CNN 比 R-CNN(逐框过 CNN)快上百倍。</text>
  <text x="56" y="416" font-size="10.5" fill="#b91c1c">• <tspan font-weight="bold">缺陷 → RoI Align</tspan>：两次取整(RoI 映射到特征图取整、分格取整)有错位，小目标受损；Mask R-CNN 用双线性插值在精确浮点位置采样，去掉取整。</text>
  <text x="56" y="438" font-size="10" fill="#6b7280">本项目用 YOLOv8(单阶段，无 RoI Pooling)，但理解它有助看懂两阶段检测器与 RoI Align/分割头。</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9ca3af"/></marker>
  </defs>
</svg>
