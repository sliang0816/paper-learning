<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="260" fill="#fff"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">EfficientNet：复合缩放（深度·宽度·分辨率）</text>
  <!-- three dims -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="60"  y="70" width="150" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="135" y="93">深度 ∝ αᵠ（更多层）</text>
    <rect x="60"  y="116" width="150" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="135" y="139">宽度 ∝ βᵠ（更多通道）</text>
    <rect x="60"  y="162" width="150" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="135" y="185">分辨率 ∝ γᵠ（更大图）</text>
  </g>
  <text x="250" y="138" text-anchor="middle" font-size="22" fill="#9ca3af">⟹</text>
  <rect x="290" y="90" width="120" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="350" y="124" text-anchor="middle" font-size="12">统一系数 φ</text><text x="350" y="144" text-anchor="middle" font-size="10" fill="#6b7280">α·β²·γ²≈2</text>
  <line x1="410" y1="130" x2="448" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#a31)"/>
  <g font-size="11" text-anchor="middle" fill="#374151">
    <rect x="450" y="105" width="40" height="50" rx="4" fill="#c7d2fe"/><text x="470" y="135">B0</text>
    <rect x="500" y="95" width="40" height="60" rx="4" fill="#a5b4fc"/><text x="520" y="130">B3</text>
    <rect x="550" y="80" width="40" height="75" rx="4" fill="#818cf8"/><text x="570" y="125">B7</text>
  </g>
  <text x="330" y="225" text-anchor="middle" font-size="11.5" fill="#6b7280">基线 B0（MBConv+SE）按 φ 整体放大成 B1~B7；呼应 YOLOv8 的 n/s/m/l/x 多尺寸</text>
  <defs><marker id="a31" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
