<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="440" fill="#fff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">U-Net：编码器下采样提语义 + 解码器上采样还原 + 跳跃连接补细节</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#6b7280">跳跃连接把编码器高分辨率细节(边界在哪)旁路给解码器，融合深层语义(这是什么)</text>

  <!-- encoder blocks (left, going down) -->
  <g text-anchor="middle" font-size="10">
    <rect x="70" y="80"  width="120" height="34" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="130" y="102">enc1 256²×64</text>
    <rect x="95" y="140" width="110" height="34" rx="4" fill="#bfdbfe" stroke="#3b82f6"/><text x="150" y="162">enc2 128²×128</text>
    <rect x="120" y="200" width="100" height="34" rx="4" fill="#93c5fd" stroke="#2563eb"/><text x="170" y="222">enc3 64²×256</text>
    <rect x="145" y="260" width="95" height="34" rx="4" fill="#60a5fa" stroke="#2563eb"/><text x="192" y="282">enc4 32²×512</text>
  </g>
  <!-- bottleneck -->
  <rect x="330" y="330" width="160" height="40" rx="6" fill="#1e3a8a" stroke="#1e3a8a"/><text x="410" y="355" text-anchor="middle" font-size="11" fill="#fff">瓶颈 16²×1024（语义最强）</text>

  <!-- decoder blocks (right, going up) -->
  <g text-anchor="middle" font-size="10">
    <rect x="580" y="260" width="95"  height="34" rx="4" fill="#fcd34d" stroke="#d97706"/><text x="627" y="282">dec4 32²×512</text>
    <rect x="600" y="200" width="100" height="34" rx="4" fill="#fde68a" stroke="#d97706"/><text x="650" y="222">dec3 64²×256</text>
    <rect x="615" y="140" width="110" height="34" rx="4" fill="#fef08a" stroke="#ca8a04"/><text x="670" y="162">dec2 128²×128</text>
    <rect x="630" y="80"  width="120" height="34" rx="4" fill="#fef9c3" stroke="#ca8a04"/><text x="690" y="102">dec1 256²×64</text>
  </g>
  <!-- output -->
  <rect x="630" y="40" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="690" y="59" text-anchor="middle" font-size="10" fill="#15803d">输出 256²×K 分割图</text>

  <!-- down arrows -->
  <g stroke="#3b82f6" stroke-width="1.5" marker-end="url(#b)">
    <line x1="130" y1="114" x2="150" y2="138"/><line x1="150" y1="174" x2="170" y2="198"/>
    <line x1="170" y1="234" x2="192" y2="258"/><line x1="192" y1="294" x2="370" y2="330"/>
  </g>
  <!-- up arrows -->
  <g stroke="#d97706" stroke-width="1.5" marker-end="url(#o)">
    <line x1="450" y1="330" x2="627" y2="296"/><line x1="650" y1="258" x2="650" y2="236"/>
    <line x1="670" y1="198" x2="670" y2="176"/><line x1="690" y1="138" x2="690" y2="116"/>
    <line x1="690" y1="78" x2="690" y2="70"/>
  </g>

  <!-- skip connections (horizontal gray) -->
  <g stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)">
    <line x1="190" y1="97"  x2="628" y2="97"/>
    <line x1="205" y1="157" x2="613" y2="157"/>
    <line x1="220" y1="217" x2="598" y2="217"/>
    <line x1="240" y1="277" x2="578" y2="277"/>
  </g>
  <text x="410" y="90" text-anchor="middle" font-size="9" fill="#6b7280">skip ① concat（高分辨率细节）</text>
  <text x="410" y="150" text-anchor="middle" font-size="9" fill="#6b7280">skip ②</text>
  <text x="410" y="210" text-anchor="middle" font-size="9" fill="#6b7280">skip ③</text>
  <text x="410" y="270" text-anchor="middle" font-size="9" fill="#6b7280">skip ④</text>

  <!-- note -->
  <rect x="40" y="386" width="740" height="44" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="410" y="404" text-anchor="middle" font-size="10.5" fill="#374151">编码器：分辨率↓通道↑（提语义）；解码器：分辨率↑（还原）；跳跃连接 concat 把浅层细节送回 → 同源于 FPN 的"语义+细节"融合。</text>
  <text x="410" y="422" text-anchor="middle" font-size="10" fill="#6b7280">后来成为扩散模型(DDPM/Stable Diffusion)的去噪骨干：每步"图进图出"预测噪声，正合 U-Net 所长。</text>

  <defs>
    <marker id="b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <marker id="o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d97706"/></marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#6b7280"/></marker>
  </defs>
</svg>
