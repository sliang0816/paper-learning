<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="'Microsoft YaHei',sans-serif">
  <rect width="680" height="270" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">ViT：图像切块 → 当作序列送入 Transformer</text>
  <!-- image grid -->
  <g stroke="#94a3b8" stroke-width="1">
    <rect x="30" y="80" width="96" height="96" fill="#f1f5f9"/>
    <line x1="62" y1="80" x2="62" y2="176"/><line x1="94" y1="80" x2="94" y2="176"/>
    <line x1="30" y1="112" x2="126" y2="112"/><line x1="30" y1="144" x2="126" y2="144"/>
  </g>
  <text x="78" y="196" text-anchor="middle" font-size="10.5" fill="#6b7280">切 16×16 patch</text>
  <line x1="130" y1="128" x2="168" y2="128" stroke="#374151" stroke-width="1.8" marker-end="url(#a20)"/>
  <!-- patch embed -->
  <rect x="170" y="100" width="110" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="225" y="124" text-anchor="middle" font-size="11">线性投影</text><text x="225" y="142" text-anchor="middle" font-size="10" fill="#6b7280">+位置编码 +[CLS]</text>
  <line x1="280" y1="128" x2="318" y2="128" stroke="#374151" stroke-width="1.8" marker-end="url(#a20)"/>
  <!-- transformer -->
  <rect x="320" y="92" width="150" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="395" y="124" text-anchor="middle" font-size="12">Transformer</text><text x="395" y="142" text-anchor="middle" font-size="11">Encoder ×L</text>
  <line x1="470" y1="128" x2="508" y2="128" stroke="#374151" stroke-width="1.8" marker-end="url(#a20)"/>
  <rect x="510" y="104" width="120" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="570" y="124" text-anchor="middle" font-size="11">取[CLS]→MLP</text><text x="570" y="142" text-anchor="middle" font-size="11">分类</text>
  <text x="340" y="232" text-anchor="middle" font-size="11.5" fill="#6b7280">每个 patch 通过自注意力与所有 patch 交互（全局感受野）</text>
  <text x="340" y="252" text-anchor="middle" font-size="11.5" fill="#ef4444">依赖大规模预训练；CLIP 图像编码器主力（ViT-B/32 等）</text>
  <defs><marker id="a20" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
