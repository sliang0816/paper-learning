<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Microsoft YaHei',sans-serif">
  <rect width="920" height="560" fill="#fff"/>
  <text x="460" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q81 推理第一步：只有 &lt;BOS&gt;，怎么就算出第一个词“我”？</text>
  <text x="460" y="44" text-anchor="middle" font-size="11" fill="#6b7280">&lt;BOS&gt; 本身不含内容、只是“起跑信号”；真正定“我”的=交叉注意力读到的源 memory + 固定权重</text>

  <!-- encoder memory -->
  <rect x="20" y="64" width="220" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="130" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">编码器 memory（只算一次）</text>
  <text x="130" y="102" text-anchor="middle" font-size="9" fill="#374151">“I love road” 的编码</text>
  <rect x="36" y="112" width="188" height="22" fill="#fff" stroke="#7dd3fc"/><text x="130" y="127" text-anchor="middle" font-size="9" fill="#374151">m_I  = [..]</text>
  <rect x="36" y="138" width="188" height="22" fill="#fff" stroke="#7dd3fc"/><text x="130" y="153" text-anchor="middle" font-size="9" fill="#374151">m_love = [..]</text>
  <rect x="36" y="164" width="188" height="22" fill="#fff" stroke="#7dd3fc"/><text x="130" y="179" text-anchor="middle" font-size="9" fill="#374151">m_road = [..]</text>
  <text x="130" y="202" text-anchor="middle" font-size="8.5" fill="#6b7280">作交叉注意力的 K/V</text>

  <!-- decoder first step pipeline -->
  <rect x="280" y="64" width="620" height="300" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="590" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">解码器第一步（输入只有 &lt;BOS&gt;）</text>

  <rect x="300" y="96" width="180" height="40" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="390" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">&lt;BOS&gt; = 起跑信号</text>
  <text x="390" y="127" text-anchor="middle" font-size="8.5" fill="#b91c1c">本身不含内容！只占一个位置</text>

  <line x1="390" y1="136" x2="390" y2="152" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="300" y="152" width="180" height="30" rx="5" fill="#fff" stroke="#fcd34d"/>
  <text x="390" y="171" text-anchor="middle" font-size="9" fill="#374151">嵌入 + 位置0编码 → 向量</text>

  <line x1="390" y1="182" x2="390" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="300" y="198" width="180" height="34" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="390" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="#b91c1c">① 掩码自注意力</text>
  <text x="390" y="227" text-anchor="middle" font-size="8" fill="#6b7280">只有自己 → 近似透传</text>

  <line x1="390" y1="232" x2="390" y2="248" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="300" y="248" width="180" height="44" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="390" y="266" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">② 交叉注意力（关键！）</text>
  <text x="390" y="280" text-anchor="middle" font-size="8" fill="#374151">Q=&lt;BOS&gt;，去 memory 查源句</text>
  <text x="390" y="289" text-anchor="middle" font-size="7.5" fill="#6b7280">吸进“源是 I love road、句首该出主语”</text>

  <!-- memory -> cross attn arrow -->
  <path d="M240 165 C 265 250, 270 268, 298 270" fill="none" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#b)"/>
  <text x="250" y="240" font-size="8" fill="#1e40af">K/V</text>

  <line x1="390" y1="292" x2="390" y2="308" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="300" y="308" width="180" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="390" y="326" text-anchor="middle" font-size="9" fill="#15803d">③ FFN 加工</text>

  <!-- output projection -->
  <line x1="480" y1="322" x2="520" y2="322" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="520" y="250" width="360" height="100" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="700" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">输出投影 512→词表 → softmax</text>
  <g font-size="10">
    <rect x="540" y="282" width="320" height="20" fill="#ddd6fe" stroke="#9333ea"/><text x="550" y="297" fill="#6d28d9">我 ：0.88　← argmax 取它</text>
    <rect x="540" y="306" width="320" height="18" fill="#fff" stroke="#c4b5fd"/><text x="550" y="320" fill="#374151">你 0.04　他 0.02　爱 0.01 …</text>
  </g>
  <text x="700" y="342" text-anchor="middle" font-size="8.5" fill="#6b7280">固定权重学到：源=I love road、句首 → “我”最高</text>

  <text x="590" y="120" font-size="9" fill="#6b7280" text-anchor="start" x="500">真正定“我”的两样：</text>
  <text x="500" y="138" font-size="9" fill="#374151">· 交叉注意力读到的 <tspan font-weight="bold" fill="#1e40af">源 memory</tspan></text>
  <text x="500" y="155" font-size="9" fill="#374151">· 训练好的 <tspan font-weight="bold" fill="#b45309">固定权重</tspan></text>
  <text x="500" y="178" font-size="8.5" fill="#b91c1c">都不是 &lt;BOS&gt; 自己</text>

  <!-- proof -->
  <rect x="20" y="380" width="880" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="460" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">证据：换源句，同样的 &lt;BOS&gt;，首词就变 → 说明定首词的是“源句(经交叉注意力)”，不是 &lt;BOS&gt;</text>
  <text x="120" y="428" font-size="10" fill="#374151">源 = “I love road”　 → 同一个 &lt;BOS&gt; → 首词 <tspan font-weight="bold" fill="#15803d">我</tspan>（我爱路）</text>
  <text x="120" y="448" font-size="10" fill="#374151">源 = “You love road” → 同一个 &lt;BOS&gt; → 首词 <tspan font-weight="bold" fill="#b91c1c">你</tspan>（你爱路）</text>
  <text x="640" y="438" font-size="9" fill="#6b7280">&lt;BOS&gt; 一模一样、首词却不同</text>

  <!-- bottom -->
  <rect x="20" y="474" width="880" height="70" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="460" y="497" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">你的直觉对了一大半：参数固定 + 编码了 I love road → 自动算出“我” ✅</text>
  <text x="460" y="519" text-anchor="middle" font-size="10" fill="#374151">补一句：&lt;BOS&gt; 不是凭自己，而是<tspan font-weight="bold">经交叉注意力借助编码器 memory</tspan> + 固定权重，才算出“我”</text>
  <text x="460" y="537" text-anchor="middle" font-size="9" fill="#6b7280">&lt;BOS&gt; 的角色 = “求第一个词”的位置槽；内容由源 memory + 权重填</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
