<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 215" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="215" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">18 R-CNN 输入输出实例（两阶段开山，但慢）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">图 + Selective Search ~2000 候选框 → 每框裁剪过 CNN → SVM 分类 + 回归 → 框+类别</text>

  <rect x="22" y="66" width="150" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="97" y="86" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入：图 + 候选框</text>
  <text x="97" y="105" text-anchor="middle" font-size="8.6" fill="#374151">Selective Search</text>
  <text x="97" y="120" text-anchor="middle" font-size="8.6" fill="#374151">外部生成 ~2000 框</text>
  <text x="97" y="136" text-anchor="middle" font-size="8" fill="#6b7280">（传统算法，CPU ~2 秒）</text>

  <line x1="172" y1="106" x2="202" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="204" y="62" width="220" height="88" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="314" y="81" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">每框各过一次 CNN</text>
  <text x="314" y="99" text-anchor="middle" font-size="8.5" fill="#374151">裁剪+缩放到 227×227 → CNN 提特征</text>
  <text x="314" y="115" text-anchor="middle" font-size="8.5" fill="#374151">→ SVM 分类 + 回归修框</text>
  <text x="314" y="132" text-anchor="middle" font-size="8" fill="#b91c1c">2000 框 = 2000 次 CNN → 极慢（Q10）</text>
  <text x="314" y="144" text-anchor="middle" font-size="7.6" fill="#6b7280">特征不共享，重复计算</text>

  <line x1="424" y1="106" x2="454" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="456" y="74" width="160" height="64" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="536" y="94" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">每框：类别 + 修正框</text>
  <text x="536" y="112" text-anchor="middle" font-size="8.5" fill="#374151">“车” @(x,y,w,h)</text>
  <text x="536" y="128" text-anchor="middle" font-size="8" fill="#6b7280">NMS 去重</text>

  <line x1="616" y1="106" x2="646" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="648" y="82" width="144" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="720" y="103" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">检测结果</text>
  <text x="720" y="120" text-anchor="middle" font-size="7.8" fill="#6b7280">mAP 大涨但慢</text>

  <text x="410" y="180" text-anchor="middle" font-size="9.6" fill="#374151">开创“<tspan font-weight="bold" fill="#0369a1">候选框 + CNN 分类</tspan>”的两阶段范式；痛点是 2000 框重复过 CNN → 19 Fast R-CNN 用共享特征解决。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
