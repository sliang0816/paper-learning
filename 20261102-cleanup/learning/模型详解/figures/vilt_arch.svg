<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="560" fill="#fff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">ViLT 架构：图像只做"线性 patch 投影"（无 CNN、无区域检测），图文拼一起进单个 Transformer 深度融合</text>

  <!-- 左：架构 -->
  <rect x="20" y="42" width="560" height="300" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="300" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">单流（single-stream）：图文 token 拼接后早融合</text>

  <!-- 文本侧 -->
  <rect x="40" y="80" width="150" height="46" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="115" y="100" text-anchor="middle" font-size="9" fill="#15803d">文本 "a dog runs"</text>
  <text x="115" y="116" text-anchor="middle" font-size="8" fill="#6b7280">词嵌入+位置+模态类型</text>
  <!-- 图像侧 -->
  <rect x="40" y="140" width="150" height="60" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="115" y="160" text-anchor="middle" font-size="9" fill="#b45309">图像 → 切 patch</text>
  <text x="115" y="176" text-anchor="middle" font-size="8" fill="#374151">线性投影(像ViT)</text>
  <text x="115" y="190" text-anchor="middle" font-size="8" fill="#b91c1c">无CNN/无区域检测</text>

  <text x="200" y="146" font-size="14" fill="#9ca3af">→</text>
  <!-- 拼接 -->
  <rect x="225" y="100" width="90" height="86" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="270" y="138" text-anchor="middle" font-size="9" fill="#4338ca">拼接</text>
  <text x="270" y="154" text-anchor="middle" font-size="8" fill="#6b7280">[文本token]</text>
  <text x="270" y="168" text-anchor="middle" font-size="8" fill="#6b7280">+[图patch token]</text>
  <text x="325" y="146" font-size="14" fill="#9ca3af">→</text>
  <!-- transformer -->
  <rect x="348" y="88" width="120" height="110" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="408" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">单个</text>
  <text x="408" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">Transformer</text>
  <text x="408" y="170" text-anchor="middle" font-size="8" fill="#374151">自注意力让图文</text>
  <text x="408" y="182" text-anchor="middle" font-size="8" fill="#374151">从第1层就互相看</text>
  <text x="470" y="146" font-size="14" fill="#9ca3af">→</text>
  <!-- 输出 -->
  <rect x="490" y="100" width="80" height="86" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="530" y="126" text-anchor="middle" font-size="8.5" fill="#15803d">pooled token</text>
  <text x="530" y="146" text-anchor="middle" font-size="8" fill="#374151">→ 图文匹配</text>
  <text x="530" y="164" text-anchor="middle" font-size="8" fill="#374151">/ 掩码词预测</text>

  <text x="300" y="228" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">预训练目标</text>
  <text x="40" y="250" font-size="9" fill="#374151">· ITM 图文匹配（这对图文配吗，含词-patch对齐）</text>
  <text x="40" y="270" font-size="9" fill="#374151">· MLM 掩码语言建模（遮词、靠图+上下文猜）</text>
  <text x="40" y="292" font-size="9" fill="#b91c1c">关键：图像 embedding 极轻（只一层线性），"重量"全放在图文交互的 Transformer</text>
  <text x="40" y="312" font-size="9" fill="#15803d">→ 没有目标检测器 → 比"区域特征"方案快几十倍（convolution-free / region-free）</text>
  <text x="40" y="332" font-size="8.5" fill="#6b7280">对比：早期 VLM(ViLBERT/UNITER) 用 Faster R-CNN 抽区域特征，慢且需区域标注</text>

  <!-- 右：VE/TE/MI 分类 -->
  <rect x="596" y="42" width="324" height="300" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="758" y="62" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">ViLT 提出的 VLM 分类（按三部分算力）</text>
  <text x="612" y="82" font-size="8.5" fill="#6b7280">VE=视觉嵌入  TE=文本嵌入  MI=图文交互</text>

  <!-- type a -->
  <rect x="612" y="92" width="292" height="42" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="622" y="108" font-size="9" font-weight="bold" fill="#b91c1c">① VE 很重（区域特征）</text>
  <text x="622" y="124" font-size="8" fill="#374151">ViLBERT/UNITER：Faster R-CNN 抽框 → 慢、需标注</text>
  <!-- type b -->
  <rect x="612" y="140" width="292" height="52" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="622" y="156" font-size="9" font-weight="bold" fill="#1e40af">② VE=TE 重、MI 浅（双塔）= CLIP</text>
  <text x="622" y="172" font-size="8" fill="#374151">两个重编码器，交互只是点积相似度</text>
  <text x="622" y="185" font-size="8" fill="#15803d">检索/零样本快，但无深度跨模态推理</text>
  <!-- type d -->
  <rect x="612" y="198" width="292" height="60" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="622" y="214" font-size="9" font-weight="bold" fill="#15803d">③ VE、TE 都轻、MI 深（单流）= ViLT ⭐</text>
  <text x="622" y="230" font-size="8" fill="#374151">图文嵌入都只做线性投影</text>
  <text x="622" y="243" font-size="8" fill="#374151">算力全放在图文交互 Transformer</text>
  <text x="622" y="254" font-size="8" fill="#b45309">→ 又轻又能深度融合（VQA/NLVR2 强）</text>

  <text x="612" y="278" font-size="9" fill="#374151" font-weight="bold">一句话洞见：</text>
  <text x="612" y="296" font-size="8.5" fill="#374151">别把算力砸在"抽视觉特征"上，</text>
  <text x="612" y="310" font-size="8.5" fill="#374151">砸在"图文如何交互"上更划算。</text>
  <text x="612" y="330" font-size="8" fill="#6b7280">代价：丢掉重视觉特征，个别任务略降，但快几十倍</text>

  <!-- 与CLIP对比 -->
  <rect x="20" y="354" width="900" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="470" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">ViLT vs CLIP：VLM 融合的两个极端</text>
  <line x1="320" y1="384" x2="320" y2="466" stroke="#c4b5fd"/>
  <line x1="620" y1="384" x2="620" y2="466" stroke="#c4b5fd"/>
  <text x="170" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">　</text>
  <text x="470" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">CLIP（双塔·晚融合）</text>
  <text x="770" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">ViLT（单流·早融合）</text>
  <text x="170" y="424" text-anchor="middle" font-size="9" fill="#374151">融合方式</text>
  <text x="470" y="424" text-anchor="middle" font-size="9" fill="#374151">最后点积一次</text>
  <text x="770" y="424" text-anchor="middle" font-size="9" fill="#374151">第1层就在一个Transformer里交互</text>
  <text x="170" y="444" text-anchor="middle" font-size="9" fill="#374151">强项</text>
  <text x="470" y="444" text-anchor="middle" font-size="9" fill="#374151">检索/零样本分类、可预缓存</text>
  <text x="770" y="444" text-anchor="middle" font-size="9" fill="#374151">VQA/推理（需深度图文理解）</text>
  <text x="170" y="462" text-anchor="middle" font-size="9" fill="#374151">检索速度</text>
  <text x="470" y="462" text-anchor="middle" font-size="9" fill="#15803d">快（图文独立编码）</text>
  <text x="770" y="462" text-anchor="middle" font-size="9" fill="#b91c1c">慢（每对图文都要一起过）</text>

  <!-- 一句话 -->
  <rect x="20" y="486" width="900" height="60" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="508" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">一句话：ViLT 把图像嵌入砍到只剩"线性 patch 投影"，图文拼一起进单个 Transformer 深度融合——</text>
  <text x="470" y="528" text-anchor="middle" font-size="9.5" fill="#374151">最轻的 VLM 视觉端 + 最深的图文交互；与 CLIP 双塔晚融合正好互为两极。</text>
  <text x="470" y="542" text-anchor="middle" font-size="8" fill="#6b7280">Kim W, Son B, Kim I. ViLT: Vision-and-Language Transformer Without Convolution or Region Supervision. ICML 2021.</text>
</svg>
