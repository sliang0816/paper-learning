<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 215" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="215" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">19 Fast R-CNN 输入输出实例（整图只过一次 CNN）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">整图过一次 CNN 得特征图 + 候选框 → RoI Pooling 抠特征 → FC 双头 → 类别+回归框</text>

  <rect x="22" y="68" width="130" height="78" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="87" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入：整图+候选框</text>
  <text x="87" y="107" text-anchor="middle" font-size="8.6" fill="#374151">整图过 1 次 CNN</text>
  <text x="87" y="123" text-anchor="middle" font-size="8.6" fill="#374151">→ 共享特征图</text>
  <text x="87" y="138" text-anchor="middle" font-size="8" fill="#6b7280">候选框仍由 SS 给</text>

  <line x1="152" y1="107" x2="182" y2="107" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="184" y="64" width="200" height="86" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="284" y="83" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">RoI Pooling</text>
  <text x="284" y="101" text-anchor="middle" font-size="8.5" fill="#374151">在特征图上抠每个候选框区域</text>
  <text x="284" y="117" text-anchor="middle" font-size="8.5" fill="#374151">→ 统一池化成 7×7×512</text>
  <text x="284" y="134" text-anchor="middle" font-size="8" fill="#15803d">特征共享，不再每框过 CNN</text>
  <text x="284" y="146" text-anchor="middle" font-size="7.6" fill="#6b7280">比 R-CNN 测试快 ~146×</text>

  <line x1="384" y1="107" x2="414" y2="107" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="416" y="70" width="190" height="74" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="511" y="89" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#15803d">FC6/FC7 → 双头</text>
  <text x="511" y="107" text-anchor="middle" font-size="8.4" fill="#374151">分类 K+1（softmax）</text>
  <text x="511" y="123" text-anchor="middle" font-size="8.4" fill="#374151">回归 4(K+1)（每类一组框）</text>
  <text x="511" y="137" text-anchor="middle" font-size="7.8" fill="#6b7280">输出每框 类别+精修框</text>

  <line x1="606" y1="107" x2="636" y2="107" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="638" y="84" width="154" height="46" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="715" y="105" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#15803d">框 + 类别</text>
  <text x="715" y="121" text-anchor="middle" font-size="7.8" fill="#6b7280">→ NMS</text>

  <text x="410" y="180" text-anchor="middle" font-size="9.6" fill="#374151">相比 R-CNN 的进步：<tspan font-weight="bold" fill="#0369a1">整图共享特征</tspan>（RoI Pooling），但候选框还靠外部 SS → 20 Faster R-CNN 用 RPN 把它也并进网络。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
