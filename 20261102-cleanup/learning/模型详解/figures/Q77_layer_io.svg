<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Microsoft YaHei',sans-serif">
  <rect width="900" height="540" fill="#fff"/>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q77 解码器跨层数据流：Q 逐层更新，交叉注意力的 K/V（图像）全程不变共享</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#6b7280">每层 = 先自注意力(Q/K/V 都来自 query) → 再交叉注意力(Q=query、K/V=图像 memory)</text>

  <!-- encoder runs once -->
  <rect x="20" y="64" width="150" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="95" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">图像编码器</text>
  <text x="95" y="104" text-anchor="middle" font-size="9" fill="#374151">图 → Swin/CNN</text>
  <text x="95" y="120" text-anchor="middle" font-size="9" fill="#374151">→ 编码器</text>
  <text x="95" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">只跑一次</text>
  <text x="95" y="162" text-anchor="middle" font-size="9" fill="#374151">输出 memory</text>
  <text x="95" y="177" text-anchor="middle" font-size="8.5" fill="#6b7280">(图像特征+位置编码)</text>

  <!-- shared K/V bus -->
  <rect x="20" y="200" width="860" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="450" y="217" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">同一份 memory 作为交叉注意力的 K/V，被全部 L 层共享复用（逐层不变）</text>
  <line x1="95" y1="184" x2="95" y2="200" stroke="#0284c7" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- layer 1 -->
  <rect x="200" y="250" width="190" height="170" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="295" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">第 1 层</text>
  <rect x="214" y="280" width="162" height="40" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="295" y="295" text-anchor="middle" font-size="8.5" fill="#b45309">自注意力 Q/K/V=query</text>
  <text x="295" y="311" text-anchor="middle" font-size="8" fill="#6b7280">query 彼此分工避让</text>
  <rect x="214" y="326" width="162" height="44" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="295" y="342" text-anchor="middle" font-size="8.5" fill="#1e40af">交叉注意力</text>
  <text x="295" y="357" text-anchor="middle" font-size="8" fill="#374151">Q=query，K/V=memory</text>
  <rect x="214" y="376" width="162" height="30" rx="5" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="295" y="395" text-anchor="middle" font-size="8.5" fill="#6d28d9">FFN → 输出 query₁</text>

  <!-- Q input to layer 1 -->
  <rect x="40" y="280" width="120" height="56" rx="6" fill="#fff" stroke="#d97706"/>
  <text x="100" y="300" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">初始 Q</text>
  <text x="100" y="316" text-anchor="middle" font-size="8" fill="#374151">object query</text>
  <text x="100" y="329" text-anchor="middle" font-size="7.5" fill="#6b7280">(内容初始=0+位置编码)</text>
  <line x1="160" y1="305" x2="200" y2="300" stroke="#d97706" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- K/V into layer1 cross -->
  <line x1="295" y1="226" x2="295" y2="326" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#b)"/>

  <!-- arrow layer1 -> layer2 (Q updated) -->
  <line x1="390" y1="391" x2="470" y2="391" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="382" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#15803d">query₁</text>
  <text x="430" y="408" text-anchor="middle" font-size="8" fill="#15803d">= 第2层的 Q</text>

  <!-- layer 2 -->
  <rect x="475" y="250" width="190" height="170" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="570" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">第 2 层</text>
  <rect x="489" y="280" width="162" height="40" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="570" y="295" text-anchor="middle" font-size="8.5" fill="#b45309">自注意力 Q/K/V=query₁</text>
  <text x="570" y="311" text-anchor="middle" font-size="8" fill="#6b7280">(自己更新后的 query)</text>
  <rect x="489" y="326" width="162" height="44" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="570" y="342" text-anchor="middle" font-size="8.5" fill="#1e40af">交叉注意力</text>
  <text x="570" y="357" text-anchor="middle" font-size="8" fill="#374151">Q=query₁，K/V=<tspan font-weight="bold">同一 memory</tspan></text>
  <rect x="489" y="376" width="162" height="30" rx="5" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="570" y="395" text-anchor="middle" font-size="8.5" fill="#6d28d9">FFN → 输出 query₂</text>

  <line x1="570" y1="226" x2="570" y2="326" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#b)"/>

  <!-- arrow to ... -->
  <line x1="665" y1="391" x2="745" y2="391" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="705" y="382" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#15803d">query₂</text>
  <rect x="750" y="330" width="130" height="76" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="815" y="352" text-anchor="middle" font-size="9" fill="#15803d">第 3…6 层同理</text>
  <text x="815" y="370" text-anchor="middle" font-size="8.5" fill="#374151">Q 继续逐层更新</text>
  <text x="815" y="386" text-anchor="middle" font-size="8.5" fill="#1e40af">K/V 仍是同一 memory</text>
  <text x="815" y="402" text-anchor="middle" font-size="8" fill="#6b7280">→ 读 L6 输出框</text>
  <line x1="750" y1="226" x2="815" y2="330" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#b)"/>

  <!-- conclusion -->
  <rect x="20" y="440" width="860" height="86" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="450" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">证据(图像 K/V)不变，变的只是 Q 每层问得更好</text>
  <text x="40" y="484" font-size="9.5" fill="#374151">· <tspan font-weight="bold">Q</tspan>：逐层更新——第 l 层的 Q = 第 l−1 层输出的 query（+ 每层重加的固定 object query 位置编码=身份信号）</text>
  <text x="40" y="503" font-size="9.5" fill="#374151">· <tspan font-weight="bold">交叉注意力 K/V</tspan>：编码器只算一次的 memory，全部 L 层共享、逐层不变；<tspan font-weight="bold">自注意力 K/V</tspan>：来自 query 自己</text>
  <text x="40" y="521" font-size="9" fill="#6b7280">→ 精修的本质：不是反复看不同的图，而是带着越来越准的问题，反复问同一张图（同一份 memory）</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
