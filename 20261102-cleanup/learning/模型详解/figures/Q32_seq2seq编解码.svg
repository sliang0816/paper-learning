<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Microsoft YaHei',sans-serif">
  <rect width="780" height="420" fill="#fff"/>
  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">RNN Seq2Seq：编码器压成定长 C，解码器自回归展开</text>

  <!-- 编码器 -->
  <text x="170" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">编码器（读输入，滚动更新隐藏状态）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="74" width="56" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="68" y="99">h₁</text>
    <rect x="120" y="74" width="56" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="148" y="99">h₂</text>
    <rect x="200" y="74" width="56" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="228" y="99">h₃</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.6">
    <line x1="96" y1="94" x2="118" y2="94" marker-end="url(#b)"/>
    <line x1="176" y1="94" x2="198" y2="94" marker-end="url(#b)"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#374151">
    <text x="68" y="134">我</text><text x="148" y="134">爱</text><text x="228" y="134">路</text>
  </g>
  <g stroke="#374151" stroke-width="1.2">
    <line x1="68" y1="124" x2="68" y2="114" marker-end="url(#a)"/>
    <line x1="148" y1="124" x2="148" y2="114" marker-end="url(#a)"/>
    <line x1="228" y1="124" x2="228" y2="114" marker-end="url(#a)"/>
  </g>
  <text x="148" y="156" text-anchor="middle" font-size="9.5" fill="#6b7280">hₜ = f(hₜ₋₁, xₜ)　逐词读入、状态滚动</text>

  <!-- 取最后状态当 C -->
  <line x1="256" y1="94" x2="300" y2="94" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <rect x="300" y="70" width="92" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="346" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">C = h₃</text>
  <text x="346" y="106" text-anchor="middle" font-size="8.5" fill="#b91c1c">语境向量(定长)</text>

  <!-- 解码器 -->
  <text x="560" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">解码器（用 C 起步，自回归逐词生成）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="430" y="74" width="56" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="458" y="99">s₁</text>
    <rect x="528" y="74" width="56" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="556" y="99">s₂</text>
    <rect x="626" y="74" width="56" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="654" y="99">s₃</text>
  </g>
  <!-- C 初始化解码器 -->
  <line x1="392" y1="94" x2="428" y2="94" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <text x="410" y="86" text-anchor="middle" font-size="8" fill="#dc2626">初始化</text>
  <g stroke="#16a34a" stroke-width="1.6">
    <line x1="486" y1="94" x2="526" y2="94" marker-end="url(#g)"/>
    <line x1="584" y1="94" x2="624" y2="94" marker-end="url(#g)"/>
  </g>
  <!-- 输出 -->
  <g font-size="10" text-anchor="middle" fill="#15803d">
    <text x="458" y="134">I</text><text x="556" y="134">love</text><text x="654" y="134">road</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.2">
    <line x1="458" y1="114" x2="458" y2="124" marker-end="url(#g)"/>
    <line x1="556" y1="114" x2="556" y2="124" marker-end="url(#g)"/>
    <line x1="654" y1="114" x2="654" y2="124" marker-end="url(#g)"/>
  </g>
  <!-- 上一步输出喂下一步（自回归） -->
  <g stroke="#9ca3af" stroke-width="1.1" stroke-dasharray="3 2">
    <path d="M458,138 C490,160 500,160 528,116" fill="none" marker-end="url(#s)"/>
    <path d="M556,138 C590,160 600,160 626,116" fill="none" marker-end="url(#s)"/>
  </g>
  <text x="556" y="172" text-anchor="middle" font-size="9" fill="#6b7280">上一步生成的词喂给下一步（自回归）</text>
  <text x="430" y="60" font-size="8.5" fill="#6b7280"></text>
  <text x="412" y="128" font-size="8.5" fill="#6b7280">&lt;BOS&gt;</text>

  <!-- 三块说明 -->
  <rect x="30" y="196" width="240" height="96" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="46" y="216" font-size="11" font-weight="bold" fill="#1d4ed8">编码器怎么编</text>
  <text x="46" y="234" font-size="9.5" fill="#374151">RNN(常用 LSTM/GRU)逐词读，</text>
  <text x="46" y="250" font-size="9.5" fill="#374151">隐藏状态 hₜ 不断吸收新词信息，</text>
  <text x="46" y="266" font-size="9.5" fill="#374151">读完整句后取<tspan fill="#b91c1c">最后状态 h_T</tspan></text>
  <text x="46" y="282" font-size="9.5" fill="#374151">当作 C —— 全句的"摘要"。</text>

  <rect x="282" y="196" width="240" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="298" y="216" font-size="11" font-weight="bold" fill="#b91c1c">为什么 C 是定长</text>
  <text x="298" y="234" font-size="9.5" fill="#374151">RNN 隐藏状态的维度由<tspan font-weight="bold">网络</tspan></text>
  <text x="298" y="250" font-size="9.5" fill="#374151"><tspan font-weight="bold">结构</tspan>定死(如 512 维)，</text>
  <text x="298" y="266" font-size="9.5" fill="#374151">与句子长短无关 →</text>
  <text x="298" y="282" font-size="9.5" fill="#b91c1c">5 词 / 50 词都压成同样 512 个数</text>

  <rect x="534" y="196" width="240" height="96" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="216" font-size="11" font-weight="bold" fill="#15803d">解码器怎么解</text>
  <text x="550" y="234" font-size="9.5" fill="#374151">用 C 初始化解码器状态，</text>
  <text x="550" y="250" font-size="9.5" fill="#374151">从 &lt;BOS&gt; 起<tspan font-weight="bold">自回归</tspan>逐词：</text>
  <text x="550" y="266" font-size="9.5" fill="#374151">sₜ=f(sₜ₋₁, yₜ₋₁, C)，</text>
  <text x="550" y="282" font-size="9.5" fill="#374151">softmax 出 yₜ，直到 &lt;EOS&gt;。</text>

  <!-- 底注 瓶颈 -->
  <rect x="30" y="306" width="744" height="100" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="46" y="328" font-size="11" fill="#374151"><tspan font-weight="bold" fill="#b91c1c">瓶颈</tspan>：全句信息必须挤进定长 C；句子越长，C 越装不下 → 前面的词被挤丢 → 长句翻译质量骤降。</text>
  <text x="46" y="349" font-size="11" fill="#374151"><tspan font-weight="bold" fill="#7c3aed">注意力的修法</tspan>：解码每步不再只看一个 C，而是"回看"编码器<tspan font-weight="bold">全部</tspan> h₁…h_T，按相关性加权 → 不再被定长 C 卡住。</text>
  <text x="46" y="370" font-size="10" fill="#6b7280">训练：用真值上一个词喂下一步（teacher forcing）；推理：用模型自己上一步的预测喂下一步。</text>
  <text x="46" y="389" font-size="10" fill="#6b7280">编码器/解码器是两个独立的 RNN（各有各的权重）；C 是连接两者的唯一桥梁（这正是瓶颈所在）。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="s" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9ca3af"/></marker>
  </defs>
</svg>
