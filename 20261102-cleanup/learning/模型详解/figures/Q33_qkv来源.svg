<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Microsoft YaHei',sans-serif">
  <rect width="800" height="470" fill="#fff"/>
  <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">10 个 token 的 Q/K/V 从哪来：同一批词向量，乘三个不同的投影矩阵</text>

  <!-- 1. 文本→token -->
  <text x="60" y="56" font-size="11" font-weight="bold" fill="#b45309">① 分词：文本按规则(BPE/WordPiece)切成 token</text>
  <g font-size="10" text-anchor="middle">
    <rect x="60" y="66" width="360" height="24" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="240" y="83">"我爱路面检测…" → [tok₁, tok₂, …, tok₁₀]　(10 个 token id)</text>
  </g>

  <!-- 2. 嵌入 -->
  <text x="60" y="112" font-size="11" font-weight="bold" fill="#0369a1">② 查嵌入表 + 位置编码 → 每个 token 一个向量，堆成矩阵 X (10×d)</text>
  <g font-size="9" text-anchor="middle">
    <rect x="60" y="122" width="120" height="150" fill="#e0f2fe" stroke="#0284c7"/>
    <g stroke="#bae6fd"><line x1="60" y1="137" x2="180" y2="137"/><line x1="60" y1="152" x2="180" y2="152"/><line x1="60" y1="167" x2="180" y2="167"/><line x1="60" y1="182" x2="180" y2="182"/><line x1="60" y1="257" x2="180" y2="257"/></g>
    <text x="120" y="133" font-size="8" fill="#0369a1">x₁ (词"我"的向量, d 维)</text>
    <text x="120" y="148" font-size="8" fill="#0369a1">x₂</text>
    <text x="120" y="163" font-size="8" fill="#0369a1">x₃  ← 高亮看它</text>
    <text x="120" y="200" font-size="8" fill="#9ca3af">⋮</text>
    <text x="120" y="268" font-size="8" fill="#0369a1">x₁₀</text>
  </g>
  <text x="120" y="286" text-anchor="middle" font-size="8.5" fill="#6b7280">X：10 行(token)×d 列(如 512)</text>
  <rect x="60" y="159" width="120" height="15" fill="none" stroke="#dc2626" stroke-width="1.6"/>

  <!-- 3. 三个投影 -->
  <text x="430" y="112" font-size="11" font-weight="bold" fill="#7c3aed">③ 同一个 X，乘三个不同的【可学习】投影矩阵</text>
  <g font-size="10" text-anchor="middle">
    <rect x="250" y="140" width="80" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="290" y="157">× W_Q</text>
    <rect x="250" y="196" width="80" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="290" y="213">× W_K</text>
    <rect x="250" y="252" width="80" height="26" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="290" y="269">× W_V</text>
  </g>
  <g stroke="#7c3aed" stroke-width="1.3">
    <line x1="180" y1="180" x2="248" y2="153" marker-end="url(#p)"/>
    <line x1="180" y1="197" x2="248" y2="209" marker-end="url(#p)"/>
    <line x1="180" y1="214" x2="248" y2="265" marker-end="url(#p)"/>
  </g>

  <!-- 4. Q K V -->
  <g font-size="9" text-anchor="middle">
    <rect x="370" y="134" width="90" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="415" y="150" font-weight="bold" fill="#1d4ed8">Q (10×dₖ)</text><text x="415" y="164" font-size="8" fill="#374151">10 个 query</text>
    <rect x="370" y="190" width="90" height="38" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="415" y="206" font-weight="bold" fill="#15803d">K (10×dₖ)</text><text x="415" y="220" font-size="8" fill="#374151">10 个 key</text>
    <rect x="370" y="246" width="90" height="38" rx="4" fill="#fce7f3" stroke="#db2777"/><text x="415" y="262" font-weight="bold" fill="#be185d">V (10×dᵥ)</text><text x="415" y="276" font-size="8" fill="#374151">10 个 value</text>
  </g>
  <g stroke="#374151" stroke-width="1.2">
    <line x1="330" y1="153" x2="368" y2="153" marker-end="url(#a)"/>
    <line x1="330" y1="209" x2="368" y2="209" marker-end="url(#a)"/>
    <line x1="330" y1="265" x2="368" y2="265" marker-end="url(#a)"/>
  </g>

  <!-- 第3个token的三重身份 -->
  <rect x="500" y="130" width="288" height="158" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="644" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">每个 token 同时扮演三个角色</text>
  <text x="516" y="170" font-size="9.5" fill="#374151">以 token₃ 为例，它的同一个 x₃ 投出：</text>
  <text x="516" y="190" font-size="10" fill="#1d4ed8">• q₃ = x₃·W_Q　"我(token₃)想找什么"</text>
  <text x="516" y="210" font-size="10" fill="#15803d">• k₃ = x₃·W_K　"我能提供什么(被别人匹配)"</text>
  <text x="516" y="230" font-size="10" fill="#be185d">• v₃ = x₃·W_V　"若被关注，我传出什么内容"</text>
  <text x="516" y="254" font-size="9" fill="#6b7280">注意力分数 = qᵢ·kⱼ；对 token₃ 而言，用 q₃ 去和</text>
  <text x="516" y="268" font-size="9" fill="#6b7280">全部 k₁…k₁₀ 点积得权重，再加权汇总 v₁…v₁₀。</text>
  <text x="516" y="282" font-size="9" fill="#7c3aed">W_Q/W_K/W_V 是训练学出来的，三者各不相同。</text>

  <!-- 底部：self vs cross -->
  <rect x="60" y="306" width="728" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="326" font-size="11" font-weight="bold" fill="#1d4ed8">翻译里有三处注意力，Q/K/V 来源不同：</text>
  <text x="76" y="345" font-size="10" fill="#374151">① 编码器自注意力：Q,K,V 全来自<tspan font-weight="bold">源句</tspan>那 10 个 token（自己看自己）。</text>
  <text x="76" y="361" font-size="10" fill="#374151">② 解码器掩码自注意力：Q,K,V 来自<tspan font-weight="bold">已生成的目标词</tspan>（且只能看左边）。</text>
  <text x="430" y="345" font-size="10" fill="#b91c1c">③ 交叉注意力(关键)：</text>
  <text x="430" y="361" font-size="10" fill="#374151">Q 来自<tspan font-weight="bold">解码器</tspan>，K、V 来自<tspan font-weight="bold">编码器输出</tspan>→ 解码时"回看源句"。</text>

  <!-- 底注 -->
  <rect x="60" y="386" width="728" height="72" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="76" y="406" font-size="10.5" fill="#374151">一句话：Q/K/V 不是三份不同输入，而是<tspan font-weight="bold">同一批 token 向量 X 乘三个不同的可学习矩阵 W_Q/W_K/W_V</tspan> 得到的三种"视角"。</text>
  <text x="76" y="424" font-size="10.5" fill="#374151">10 个 token → Q、K、V 各是 10 行的矩阵（每个 token 各有一个 q、一个 k、一个 v）。</text>
  <text x="76" y="442" font-size="10" fill="#6b7280">多头：把 W_Q/W_K/W_V 切成 h 组(如 8 头×64 维)，各自做一遍注意力再拼接 → 多个"关注子空间"并行。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
