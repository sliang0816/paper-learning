<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="340" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">YOLOv8（2023）⭐本项目基线　对照 v5/v7：anchor-free + 解耦头 + C2f</text>

  <rect x="20" y="130" width="48" height="48" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="44" y="151" text-anchor="middle" font-size="10" fill="#0369a1">输入</text>
  <text x="44" y="167" text-anchor="middle" font-size="8" fill="#6b7280">640</text>

  <!-- Backbone C2f -->
  <rect x="84" y="116" width="148" height="78" rx="6" fill="#dbeafe" stroke="#ef4444" stroke-width="2"/>
  <text x="158" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">骨干 Backbone</text>
  <text x="158" y="156" text-anchor="middle" font-size="11" fill="#dc2626">🔴 C2f 模块</text>
  <text x="158" y="172" text-anchor="middle" font-size="8.5" fill="#374151">CSP 演进·更多分支梯度流</text>
  <text x="158" y="186" text-anchor="middle" font-size="8.5" fill="#374151">+ SPPF　保留浅层纹理</text>

  <!-- Neck PAN -->
  <rect x="252" y="84" width="150" height="160" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="327" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">颈部 Neck</text>
  <text x="327" y="120" text-anchor="middle" font-size="9.5" fill="#374151">PAN-FPN（沿用）</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="266" y="130" width="122" height="30" rx="4" fill="#fff" stroke="#7c3aed"/><text x="327" y="149">P3 80×80 小目标</text>
    <rect x="266" y="166" width="122" height="30" rx="4" fill="#fff" stroke="#7c3aed"/><text x="327" y="185">P4 40×40 中</text>
    <rect x="266" y="202" width="122" height="30" rx="4" fill="#fff" stroke="#7c3aed"/><text x="327" y="221">P5 20×20 大</text>
  </g>

  <!-- Decoupled head -->
  <rect x="422" y="100" width="150" height="130" rx="6" fill="#dcfce7" stroke="#ef4444" stroke-width="2"/>
  <text x="497" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">检测头 Head</text>
  <text x="497" y="137" text-anchor="middle" font-size="10.5" fill="#dc2626">🔴 解耦头</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="436" y="148" width="122" height="26" rx="4" fill="#fff" stroke="#16a34a"/><text x="497" y="165">分类分支 cv2</text>
    <rect x="436" y="180" width="122" height="26" rx="4" fill="#fff" stroke="#16a34a"/><text x="497" y="197">回归分支 cv3</text>
  </g>
  <text x="497" y="222" text-anchor="middle" font-size="8" fill="#6b7280">两任务独立卷积·互不干扰</text>

  <!-- 输出 -->
  <rect x="592" y="116" width="150" height="100" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="667" y="138" text-anchor="middle" font-size="11" fill="#be185d">3 尺度输出</text>
  <text x="667" y="158" text-anchor="middle" font-size="10" fill="#dc2626">🔴 Anchor-free</text>
  <text x="667" y="173" text-anchor="middle" font-size="8" fill="#6b7280">直接回归中心+宽高</text>
  <text x="667" y="191" text-anchor="middle" font-size="10" fill="#dc2626">🔴 DFL 损失</text>
  <text x="667" y="206" text-anchor="middle" font-size="8" fill="#6b7280">框回归建模为分布</text>

  <g stroke="#374151" stroke-width="1.4">
    <line x1="68" y1="154" x2="82" y2="154" marker-end="url(#a)"/>
    <line x1="232" y1="154" x2="250" y2="154" marker-end="url(#a)"/>
    <line x1="402" y1="160" x2="420" y2="160" marker-end="url(#a)"/>
    <line x1="572" y1="160" x2="590" y2="160" marker-end="url(#a)"/>
  </g>

  <rect x="20" y="258" width="722" height="76" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="36" y="280" font-size="11.5" font-weight="bold" fill="#b91c1c">🔴 相对 v5/v7 的三大改进（本项目改进的切入点）：</text>
  <text x="36" y="299" font-size="11" fill="#374151">① Anchor-free：抛弃预设 anchor，直接预测中心偏移+宽高(借鉴 FCOS) → 去掉 anchor 超参调优(呼应 Q14)。</text>
  <text x="36" y="316" font-size="11" fill="#374151">② 解耦头：分类(cv2)与回归(cv3)独立卷积，避免互相干扰 → 精度↑。③ C2f 替 C3：更多分支梯度流，保留浅层纹理 → 利小目标。</text>
  <text x="36" y="331" font-size="10" fill="#b45309">本项目：在 PAN 颈部加 P2(80→160 更浅层) + CBAM 注意力；检测框后接 CLIP 开放类识别。</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
