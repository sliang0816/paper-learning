<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" font-family="'Microsoft YaHei',sans-serif">
  <rect width="960" height="220" fill="#fff"/>
  <text x="480" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">50 PatchCore 输入/输出实例</text>

  <rect x="20" y="46" width="180" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="110" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">训练：只喂"正常"图</text>
  <text x="110" y="92" text-anchor="middle" font-size="9.5" fill="#374151">不需要任何异常样本/标注</text>
  <text x="110" y="106" text-anchor="middle" font-size="9.5" fill="#374151">（cold-start 设定）</text>

  <text x="215" y="86" text-anchor="middle" font-size="18">→</text>

  <rect x="235" y="46" width="200" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="335" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">存成记忆库 M</text>
  <text x="335" y="88" text-anchor="middle" font-size="9.5" fill="#374151">全部正常图的局部感知</text>
  <text x="335" y="102" text-anchor="middle" font-size="9.5" fill="#374151">patch特征，coreset压缩到1%</text>

  <text x="450" y="86" text-anchor="middle" font-size="18">→</text>

  <rect x="470" y="46" width="190" height="70" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="565" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">测试：任意新图</text>
  <text x="565" y="88" text-anchor="middle" font-size="9.5" fill="#374151">逐patch去记忆库M里</text>
  <text x="565" y="102" text-anchor="middle" font-size="9.5" fill="#374151">查最近邻距离</text>

  <text x="675" y="86" text-anchor="middle" font-size="18">→</text>

  <rect x="695" y="46" width="245" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="817" y="68" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">输出：异常分 s + 分割图</text>
  <text x="817" y="88" text-anchor="middle" font-size="9.5" fill="#374151">image-level 异常分数(判有无缺陷)</text>
  <text x="817" y="102" text-anchor="middle" font-size="9.5" fill="#374151">+ 逐像素异常热力图(定位缺陷)</text>

  <rect x="20" y="140" width="920" height="60" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="480" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">MVTec AD 基准实测：PatchCore-25% 达 image-level AUROC 99.1%（最优配置达99.6%），误差比同期最强的PaDiM再腰斩</text>
  <text x="480" y="184" text-anchor="middle" font-size="9.5" fill="#374151">推理仍保持较快速度（0.17~0.6秒/图，视记忆库压缩比例而定），工业场景可直接落地使用</text>
</svg>
