<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="480" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">通道 ≠ 列：通道是"第几张图"，列是"图里第几竖排"</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7280">数据是三维立方体 H×W×C：高 H、宽 W（行列在这里）、深 C（通道在这里）</text>

  <!-- 左：一张特征图，标出行列 -->
  <text x="180" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0369a1">① 一个通道 = 一整张 H×W 图（有行有列）</text>
  <g>
    <!-- 4x4 grid -->
    <g stroke="#0284c7" fill="#e0f2fe">
      <rect x="90" y="92" width="180" height="180"/>
    </g>
    <g stroke="#7dd3fc" stroke-width="1">
      <line x1="135" y1="92" x2="135" y2="272"/><line x1="180" y1="92" x2="180" y2="272"/><line x1="225" y1="92" x2="225" y2="272"/>
      <line x1="90" y1="137" x2="270" y2="137"/><line x1="90" y1="182" x2="270" y2="182"/><line x1="90" y1="227" x2="270" y2="227"/>
    </g>
    <!-- highlight a column -->
    <rect x="180" y="92" width="45" height="180" fill="#fde68a" fill-opacity="0.6" stroke="#f59e0b"/>
    <text x="202" y="288" text-anchor="middle" font-size="10" fill="#b45309">一"列"(W方向的一竖排)</text>
    <!-- row label -->
    <text x="78" y="116" text-anchor="end" font-size="9" fill="#0369a1">行↓</text>
    <text x="110" y="86" text-anchor="middle" font-size="9" fill="#0369a1">列→</text>
  </g>
  <text x="180" y="306" text-anchor="middle" font-size="9.5" fill="#374151">行、列都在这一张图内部</text>

  <!-- 右：通道是叠起来的多张图 -->
  <text x="585" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">② 多个通道 = 多张图沿"深度"叠起来</text>
  <!-- stacked sheets (like cards) -->
  <g>
    <rect x="470" y="160" width="150" height="110" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="490" y="140" width="150" height="110" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="510" y="120" width="150" height="110" fill="#fee2e2" stroke="#ef4444"/>
    <text x="585" y="178" text-anchor="middle" font-size="11" fill="#b91c1c">通道3 (一整张图)</text>
    <text x="565" y="200" text-anchor="middle" font-size="10" fill="#15803d">通道2</text>
    <text x="545" y="248" text-anchor="middle" font-size="10" fill="#1d4ed8">通道1</text>
  </g>
  <text x="585" y="296" text-anchor="middle" font-size="9.5" fill="#374151">例：RGB 彩色图 = 红/绿/蓝 3 张同样大小的图 = 3 通道</text>

  <!-- 中下：一个像素穿过整摞 = 通道向量 -->
  <rect x="60" y="330" width="700" height="76" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="76" y="352" font-size="11" font-weight="bold" fill="#7c3aed">③ Q39 里那个竖列 [2,0,1,3] 是什么？</text>
  <text x="76" y="372" font-size="10.5" fill="#374151">是在<tspan font-weight="bold">某一个像素位置</tspan>，用针从上往下穿过整摞特征图，扎到的 C 个值（深度/通道方向）——</text>
  <text x="76" y="390" font-size="10.5" fill="#7c3aed">是"这个点在第 1、2、3、4 张图上分别是多少"，<tspan font-weight="bold">不是图像里的一列像素</tspan>。竖着写只为套 y = Wx。</text>

  <!-- 底：对照表 -->
  <rect x="60" y="416" width="700" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="76" y="438" font-size="10.5" fill="#374151">• <tspan font-weight="bold" fill="#b45309">行 / 列</tspan>：一张图<tspan font-weight="bold">内部</tspan>的像素排布（H 方向 / W 方向）。</text>
  <text x="76" y="458" font-size="10.5" fill="#374151">• <tspan font-weight="bold" fill="#15803d">通道</tspan>：叠了<tspan font-weight="bold">多少张</tspan> H×W 图（深度方向）= 用了多少个卷积核（每核扫出一张）。</text>
</svg>
