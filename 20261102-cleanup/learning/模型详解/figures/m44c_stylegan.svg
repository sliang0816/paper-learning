<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="360" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">StyleGAN2：映射网络 + AdaIN 风格注入（GAN 质量顶峰）</text>

  <!-- ===== LEFT: Mapping Network ===== -->
  <text x="88" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">映射网络</text>
  <rect x="20" y="60" width="136" height="248" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>

  <rect x="36" y="74" width="104" height="32" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="88" y="90" text-anchor="middle" font-size="10">z ∼ N(0,I)</text>
  <text x="88" y="103" text-anchor="middle" font-size="8.5" fill="#6b7280">潜向量 z ∈ R^512</text>

  <line x1="88" y1="106" x2="88" y2="120" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="36" y="120" width="104" height="62" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="88" y="137" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8">MLP × 8 层</text>
  <text x="88" y="152" text-anchor="middle" font-size="9" fill="#374151">每层：Linear</text>
  <text x="88" y="166" text-anchor="middle" font-size="9" fill="#374151">+ LeakyReLU</text>
  <text x="88" y="179" text-anchor="middle" font-size="8.5" fill="#6b7280">解耦潜空间</text>

  <line x1="88" y1="182" x2="88" y2="196" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="36" y="196" width="104" height="32" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="88" y="213" text-anchor="middle" font-size="10" font-weight="bold">w ∈ R^512</text>
  <text x="88" y="226" text-anchor="middle" font-size="8.5" fill="#6b7280">解耦中间潜空间</text>

  <line x1="88" y1="228" x2="88" y2="242" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 1" marker-end="url(#av)"/>

  <rect x="36" y="242" width="104" height="48" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="88" y="259" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">Affine A(w)</text>
  <text x="88" y="274" text-anchor="middle" font-size="9" fill="#374151">→ 风格参数</text>
  <text x="88" y="286" text-anchor="middle" font-size="9" fill="#374151">(y_s, y_b)</text>

  <!-- ===== CENTER: Synthesis Network ===== -->
  <text x="430" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">合成网络（Synthesis Network）</text>
  <rect x="174" y="60" width="512" height="248" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>

  <!-- Const input -->
  <rect x="306" y="74" width="120" height="28" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="366" y="92" text-anchor="middle" font-size="10">常数输入 4×4×512</text>

  <!-- Resolution stages: 4x4 -> 8x8 -> 16x16 -> ... -->
  <g>
    <!-- 4×4 -->
    <line x1="366" y1="102" x2="366" y2="118" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="246" y="118" width="72" height="28" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="282" y="135" text-anchor="middle" font-size="9.5">Conv 4×4</text>
    <!-- AdaIN 4x4 -->
    <rect x="330" y="118" width="72" height="28" rx="3" fill="#fde68a" stroke="#d97706"/>
    <text x="366" y="131" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">AdaIN</text>
    <text x="366" y="143" text-anchor="middle" font-size="8.5" fill="#b45309">粗粒度风格</text>
    <!-- noise -->
    <rect x="414" y="118" width="52" height="28" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="440" y="131" text-anchor="middle" font-size="9">B×noise</text>
    <text x="440" y="143" text-anchor="middle" font-size="8.5" fill="#7c3aed">随机细节</text>

    <!-- Upsample -->
    <line x1="366" y1="146" x2="366" y2="162" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="246" y="162" width="72" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="282" y="179" text-anchor="middle" font-size="9">Upsample 8×8</text>

    <line x1="318" y1="176" x2="330" y2="176" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="330" y="162" width="72" height="28" rx="3" fill="#fde68a" stroke="#d97706"/>
    <text x="366" y="175" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">AdaIN</text>
    <text x="366" y="187" text-anchor="middle" font-size="8.5" fill="#b45309">中粒度风格</text>
    <rect x="414" y="162" width="52" height="28" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="440" y="175" text-anchor="middle" font-size="9">B×noise</text>
    <text x="440" y="187" text-anchor="middle" font-size="8.5" fill="#7c3aed">随机细节</text>

    <!-- ... -->
    <text x="366" y="210" text-anchor="middle" font-size="12" fill="#6b7280">⋮</text>
    <text x="440" y="210" text-anchor="middle" font-size="9" fill="#6b7280">（持续至 1024×1024）</text>

    <!-- 1024×1024 -->
    <line x1="366" y1="220" x2="366" y2="236" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="246" y="236" width="72" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="282" y="253" text-anchor="middle" font-size="9">Conv 1024×1024</text>
    <line x1="318" y1="250" x2="330" y2="250" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="330" y="236" width="72" height="28" rx="3" fill="#fde68a" stroke="#d97706"/>
    <text x="366" y="249" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">AdaIN</text>
    <text x="366" y="261" text-anchor="middle" font-size="8.5" fill="#b45309">细粒度纹理</text>
    <rect x="414" y="236" width="52" height="28" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="440" y="249" text-anchor="middle" font-size="9">B×noise</text>
    <text x="440" y="261" text-anchor="middle" font-size="8.5" fill="#7c3aed">发丝/毛孔</text>

    <!-- ToRGB -->
    <line x1="366" y1="264" x2="366" y2="280" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="306" y="280" width="120" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="366" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">ToRGB → 1024×1024 图像</text>
  </g>

  <!-- w arrows coming from left (style injection) -->
  <g stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 1.5">
    <line x1="160" y1="272" x2="330" y2="130"/>
    <line x1="160" y1="272" x2="330" y2="174"/>
    <line x1="160" y1="272" x2="330" y2="250"/>
  </g>
  <text x="196" y="254" font-size="9" fill="#d97706">w→风格注入</text>

  <!-- ===== RIGHT: Key concepts ===== -->
  <rect x="696" y="60" width="104" height="248" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="748" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">风格混合</text>
  <text x="748" y="93" text-anchor="middle" font-size="8.5" fill="#374151">w₁ → 低分辨率</text>
  <text x="748" y="106" text-anchor="middle" font-size="8.5" fill="#374151">（姿态/轮廓）</text>
  <text x="748" y="119" text-anchor="middle" font-size="8.5" fill="#374151">w₂ → 高分辨率</text>
  <text x="748" y="132" text-anchor="middle" font-size="8.5" fill="#374151">（肤色/纹理）</text>
  <text x="748" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">AdaIN 公式</text>
  <text x="748" y="167" text-anchor="middle" font-size="8.5" fill="#374151">y_s·(x−μ)/σ</text>
  <text x="748" y="180" text-anchor="middle" font-size="8.5" fill="#374151">+ y_b</text>
  <text x="748" y="193" text-anchor="middle" font-size="8" fill="#6b7280">y_s,y_b 由 w 生成</text>
  <text x="748" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">StyleGAN2</text>
  <text x="748" y="228" text-anchor="middle" font-size="8.5" fill="#374151">去掉 AdaIN 归一化</text>
  <text x="748" y="241" text-anchor="middle" font-size="8.5" fill="#374151">改为调制-反调制</text>
  <text x="748" y="254" text-anchor="middle" font-size="8.5" fill="#374151">卷积（去水滴伪影）</text>
  <text x="748" y="271" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">FID 2.84</text>
  <text x="748" y="285" text-anchor="middle" font-size="8.5" fill="#374151">FFHQ（2020，当时 SOTA）</text>
  <text x="748" y="298" text-anchor="middle" font-size="8" fill="#6b7280">2022 后扩散模型</text>
  <text x="748" y="310" text-anchor="middle" font-size="8" fill="#6b7280">取代 GAN 主流</text>

  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
    <marker id="av" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
