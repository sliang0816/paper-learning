<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Microsoft YaHei',sans-serif">
  <rect width="980" height="640" fill="#fff"/>
  <text x="490" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q168 只要一个patch异常，PatchCore为何判整图异常</text>

  <!-- ① 局部缺陷 -->
  <rect x="20" y="42" width="940" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="490" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">① 工业缺陷本身就是"局部"的——照搬真实质检逻辑</text>
  <text x="490" y="88" text-anchor="middle" font-size="10.5" fill="#374151">划痕/裂纹/烧痕/缺件通常只占一小块区域，其余部分完全正常——质检员也是"哪怕一处瑕疵就报废"</text>
  <text x="490" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">这是一个 OR(逻辑或) 判断，不是"平均"判断</text>

  <!-- ② 平均会稀释小缺陷 -->
  <rect x="20" y="146" width="940" height="150" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="490" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">② 前人用全局特征向量的坑：小缺陷被稀释、漏检</text>
  <text x="40" y="194" font-size="10" fill="#374151">全图压成一个向量(如最后一层GAP池化)：绝大部分区域正常 → 一小块异常信号被大量正常信号稀释</text>
  <text x="40" y="216" font-size="10" fill="#374151">→ 全局向量整体上仍"看起来很正常" → 漏检真正该抓的小缺陷</text>
  <text x="490" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">PatchCore反过来做：每个patch各自算最近邻距离，取所有patch里的最大值作为图像分</text>
  <text x="490" y="274" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">s* = max_(patch∈测试图) min_(m∈M) ‖patch − m‖₂</text>

  <!-- ③ max-min结构 -->
  <rect x="20" y="306" width="460" height="150" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="250" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">③ max-min结构：一个异常patch就拉高整图分</text>
  <text x="40" y="354" font-size="9.6" fill="#374151">只要存在一个patch，在记忆库里怎么都</text>
  <text x="40" y="372" font-size="9.6" fill="#374151">找不到相近的"正常"邻居</text>
  <text x="40" y="394" font-size="9.6" font-weight="bold" fill="#15803d">→ 这一个patch的距离直接拉高整图分数</text>
  <text x="40" y="414" font-size="9.6" fill="#374151">不会被其余大量正常patch的低距离</text>
  <text x="40" y="432" font-size="9.6" fill="#374151">拉低平均值、稀释掉</text>

  <!-- ④ 分割图免费 -->
  <rect x="500" y="306" width="460" height="150" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="730" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">④ 附带好处：分割图是"免费"的</text>
  <text x="516" y="354" font-size="9.6" fill="#374151">打分本来就要逐patch算距离</text>
  <text x="516" y="374" font-size="9.6" fill="#374151">这些逐patch距离按空间位置拼回去</text>
  <text x="516" y="394" font-size="9.6" font-weight="bold" fill="#6d28d9">→ 就是异常热力图/分割图</text>
  <text x="516" y="416" font-size="9.6" fill="#374151">图像级判断+像素级定位=同一次计算</text>
  <text x="516" y="436" font-size="9.6" fill="#374151">不需要额外训练分割头</text>

  <!-- ⑤ 鲁棒性 -->
  <rect x="20" y="470" width="940" height="90" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="490" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">⑤ 取最大值比取平均鲁棒——不随patch数量/图像大小被稀释</text>
  <text x="490" y="516" text-anchor="middle" font-size="10" fill="#374151">若改成"所有patch距离取平均"：几百个patch里真正异常的可能只占一两个，平均后信号权重微乎其微</text>
  <text x="490" y="538" text-anchor="middle" font-size="10" fill="#374151">取最大值完全不受影响：不管图里有多少patch，一个真异常就直接决定分数</text>

  <!-- 一句话 -->
  <rect x="20" y="574" width="940" height="52" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="490" y="598" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">一句话：这条假设继承自PaDiM/PatchSVDD，用max而非average聚合逐patch距离——</text>
  <text x="490" y="616" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">对应"局部小缺陷不该被大片正常区域稀释"的真实质检直觉，本项目OOD模块同样受用。</text>
</svg>
