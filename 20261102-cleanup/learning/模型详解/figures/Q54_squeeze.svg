<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="470" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">SE-Net 第一步 Squeeze：全局平均池化把每通道 H×W 压成 1 个数</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7280">目的：卷积响应只反映局部感受野，Squeeze 给每个通道一个“全局描述”，供后面 Excitation 打分</text>

  <!-- input cube: 3 channels 2x2 -->
  <text x="150" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">输入特征图 H×W×C（例 2×2×3）</text>
  <g font-size="12" text-anchor="middle">
    <!-- channel 1 -->
    <rect x="60" y="95" width="80" height="80" fill="#dbeafe" stroke="#3b82f6"/>
    <line x1="100" y1="95" x2="100" y2="175" stroke="#93c5fd"/><line x1="60" y1="135" x2="140" y2="135" stroke="#93c5fd"/>
    <text x="80" y="120">1</text><text x="120" y="120">3</text><text x="80" y="160">2</text><text x="120" y="160">2</text>
    <text x="100" y="190" font-size="10" fill="#1d4ed8">通道1</text>
    <!-- channel 2 -->
    <rect x="95" y="118" width="80" height="80" fill="#dcfce7" stroke="#16a34a" opacity="0.96"/>
    <line x1="135" y1="118" x2="135" y2="198" stroke="#86efac"/><line x1="95" y1="158" x2="175" y2="158" stroke="#86efac"/>
    <text x="115" y="143">0</text><text x="155" y="143">0</text><text x="115" y="183">1</text><text x="155" y="183">1</text>
    <text x="135" y="213" font-size="10" fill="#15803d">通道2</text>
    <!-- channel 3 -->
    <rect x="130" y="141" width="80" height="80" fill="#fef3c7" stroke="#d97706" opacity="0.96"/>
    <line x1="170" y1="141" x2="170" y2="221" stroke="#fcd34d"/><line x1="130" y1="181" x2="210" y2="181" stroke="#fcd34d"/>
    <text x="150" y="166">4</text><text x="190" y="166">4</text><text x="150" y="206">4</text><text x="190" y="206">4</text>
    <text x="170" y="236" font-size="10" fill="#b45309">通道3</text>
  </g>

  <!-- arrow -->
  <g stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"><line x1="225" y1="160" x2="330" y2="160"/></g>
  <text x="277" y="150" text-anchor="middle" font-size="11" fill="#374151">Squeeze</text>
  <text x="277" y="178" text-anchor="middle" font-size="9.5" fill="#6b7280">每通道求平均</text>

  <!-- formula -->
  <rect x="340" y="120" width="270" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="475" y="146" text-anchor="middle" font-size="13" fill="#111827">z_c = (1/HW) Σ x_c(i,j)</text>
  <text x="355" y="170" font-size="10.5" fill="#374151">通道1: (1+3+2+2)/4 = 2.0</text>
  <text x="355" y="186" font-size="10.5" fill="#374151">通道2: (0+0+1+1)/4 = 0.5　通道3: 16/4 = 4.0</text>

  <!-- output vector -->
  <g stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"><line x1="615" y1="160" x2="660" y2="160"/></g>
  <g font-size="13" text-anchor="middle">
    <rect x="665" y="120" width="50" height="26" fill="#bfdbfe" stroke="#3b82f6"/><text x="690" y="138">2.0</text>
    <rect x="665" y="146" width="50" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="690" y="164">0.5</text>
    <rect x="665" y="172" width="50" height="26" fill="#fde68a" stroke="#d97706"/><text x="690" y="190">4.0</text>
  </g>
  <text x="690" y="214" text-anchor="middle" font-size="10.5" fill="#374151">C 维通道描述符 z</text>
  <text x="690" y="229" text-anchor="middle" font-size="9.5" fill="#6b7280">12 个数 → 3 个数</text>

  <!-- key points -->
  <rect x="40" y="270" width="360" height="170" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="56" y="293" font-size="12" font-weight="bold" fill="#15803d">为什么需要 Squeeze</text>
  <text x="56" y="316" font-size="10.5" fill="#374151">· 卷积核只看局部感受野，单点响应反映不了</text>
  <text x="66" y="332" font-size="10.5" fill="#374151">“这个通道对整张图重不重要”。</text>
  <text x="56" y="354" font-size="10.5" fill="#374151">· 全局平均把整通道 H×W 汇成 1 个全局统计，</text>
  <text x="66" y="370" font-size="10.5" fill="#374151">打破局部、获得通道的全局描述。</text>
  <text x="56" y="392" font-size="10.5" fill="#374151">· 空间维被完全压掉，只留“每通道一个强度”，</text>
  <text x="66" y="408" font-size="10.5" fill="#374151">后面 Excitation 才能基于全局上下文打分。</text>
  <text x="56" y="430" font-size="9.5" fill="#16a34a">· Squeeze 无可学习参数，就是 GAP（见 Q48）。</text>

  <rect x="420" y="270" width="360" height="170" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="436" y="293" font-size="12" font-weight="bold" fill="#1d4ed8">三步里的位置</text>
  <text x="436" y="318" font-size="11" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">① Squeeze</tspan>（本题）：GAP → C 维 z（全局描述）</text>
  <text x="436" y="342" font-size="11" fill="#374151">② Excitation：两层 FC + Sigmoid → C 个权重 s</text>
  <text x="436" y="366" font-size="11" fill="#374151">③ Scale：用 s 逐通道相乘，重要通道放大</text>
  <text x="436" y="396" font-size="10" fill="#6b7280">平均 vs 最大：平均反映整体激活、更稳健；</text>
  <text x="436" y="412" font-size="10" fill="#6b7280">max 只抓最强点、易受噪声。SE 论文用平均。</text>
  <text x="436" y="430" font-size="9.5" fill="#1d4ed8">CBAM 通道分支则 avg + max 两支并用。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
</svg>
