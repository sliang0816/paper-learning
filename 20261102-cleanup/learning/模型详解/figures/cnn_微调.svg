<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="330" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">CNN 微调（迁移学习）：预训练 → 换头 → 继续训</text>

  <!-- 上：微调三步 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="24"  y="50" width="140" height="52" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="94" y="72">① ImageNet 预训练</text><text x="94" y="90" fill="#6b7280">学通用特征(边缘/部件)</text>
    <rect x="200" y="50" width="140" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="270" y="72">② 换输出头</text><text x="270" y="90" fill="#7c2d12">1000类 → 检测 N+1 类</text>
    <rect x="376" y="50" width="150" height="52" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="451" y="72">③ 检测数据继续训</text><text x="451" y="90" fill="#3b82f6">小学习率，特征适配</text>
    <rect x="562" y="50" width="134" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="629" y="72">检测用 CNN</text><text x="629" y="90" fill="#166534">通用→任务专用</text>
  </g>
  <g stroke="#374151" stroke-width="1.8">
    <line x1="164" y1="76" x2="198" y2="76" marker-end="url(#af)"/>
    <line x1="340" y1="76" x2="374" y2="76" marker-end="url(#af)"/>
    <line x1="526" y1="76" x2="560" y2="76" marker-end="url(#af)"/>
  </g>
  <text x="360" y="124" text-anchor="middle" font-size="10.5" fill="#9ca3af">为何不从零训：检测数据小，从零易过拟合 → 借大数据特征 + 少量数据适配（你训 YOLOv8 即加载 COCO 权重再训）</text>

  <!-- 下：R-CNN vs Fast R-CNN 的微调 -->
  <rect x="24" y="146" width="330" height="166" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="189" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">R-CNN：微调是独立一步</text>
  <g font-size="11" text-anchor="middle">
    <rect x="50" y="182" width="110" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="105" y="203">CNN 微调(softmax)</text>
    <rect x="50" y="240" width="110" height="30" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="105" y="260">❄ 冻结</text>
    <rect x="210" y="226" width="110" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="265" y="246">SVM / 回归</text>
  </g>
  <line x1="105" y1="216" x2="105" y2="238" stroke="#374151" stroke-width="1.6" marker-end="url(#af)"/>
  <line x1="160" y1="255" x2="208" y2="244" stroke="#374151" stroke-width="1.6" marker-end="url(#af)"/>
  <text x="189" y="294" text-anchor="middle" font-size="10" fill="#ef4444">微调后冻结，特征不再为 SVM/回归优化</text>

  <rect x="366" y="146" width="330" height="166" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="531" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Fast R-CNN：微调=端到端训练</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="392" y="182" width="90" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="437" y="203">共享卷积</text>
    <rect x="392" y="240" width="90" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="437" y="260">RoI Pooling</text>
    <rect x="540" y="196" width="130" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="605" y="216">softmax 分类</text>
    <rect x="540" y="234" width="130" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="605" y="254">边框回归</text>
  </g>
  <line x1="437" y1="216" x2="437" y2="238" stroke="#374151" stroke-width="1.4" marker-end="url(#af)"/>
  <line x1="482" y1="252" x2="538" y2="215" stroke="#374151" stroke-width="1.4" marker-end="url(#af)"/>
  <line x1="482" y1="255" x2="538" y2="248" stroke="#374151" stroke-width="1.4" marker-end="url(#af)"/>
  <path d="M540,285 Q470,300 437,218" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#afg)"/>
  <text x="560" y="300" text-anchor="middle" font-size="10" fill="#16a34a">梯度经 RoI Pooling 回流，卷积联合优化</text>
  <defs>
    <marker id="af" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="afg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
