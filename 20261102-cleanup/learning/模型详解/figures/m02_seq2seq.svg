<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="'Microsoft YaHei',sans-serif">
  <rect width="840" height="420" fill="#fff"/>
  <text x="420" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">RNN Seq2Seq：编码器把整句压成 c，解码器自回归逐词生成</text>
  <text x="420" y="46" text-anchor="middle" font-size="11" fill="#6b7280">例：翻译 "我 爱 路" → "I love road"</text>

  <!-- Encoder -->
  <text x="200" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">编码器（读输入，更新隐藏状态）</text>
  <g font-size="12" text-anchor="middle">
    <!-- inputs -->
    <rect x="70" y="150" width="56" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="98" y="170">我</text>
    <rect x="170" y="150" width="56" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="198" y="170">爱</text>
    <rect x="270" y="150" width="56" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="298" y="170">路</text>
    <!-- hidden states -->
    <circle cx="98" cy="108" r="20" fill="#dbeafe" stroke="#3b82f6"/><text x="98" y="113">h₁</text>
    <circle cx="198" cy="108" r="20" fill="#dbeafe" stroke="#3b82f6"/><text x="198" y="113">h₂</text>
    <circle cx="298" cy="108" r="20" fill="#bfdbfe" stroke="#2563eb"/><text x="298" y="113">h₃</text>
  </g>
  <!-- enc arrows up & right -->
  <g stroke="#3b82f6" stroke-width="1.4" marker-end="url(#b)">
    <line x1="98" y1="148" x2="98" y2="130"/>
    <line x1="198" y1="148" x2="198" y2="130"/>
    <line x1="298" y1="148" x2="298" y2="130"/>
    <line x1="118" y1="108" x2="178" y2="108"/>
    <line x1="218" y1="108" x2="278" y2="108"/>
  </g>

  <!-- context vector c -->
  <rect x="360" y="90" width="90" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="405" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">语境向量 c</text>
  <text x="405" y="123" text-anchor="middle" font-size="8.5" fill="#92400e">= h₃（整句压缩）</text>
  <line x1="318" y1="108" x2="358" y2="108" stroke="#ca8a04" stroke-width="2" marker-end="url(#y)"/>

  <!-- Decoder -->
  <text x="640" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">解码器（自回归：上一个输出喂回当输入）</text>
  <g font-size="12" text-anchor="middle">
    <circle cx="510" cy="108" r="20" fill="#dcfce7" stroke="#16a34a"/><text x="510" y="113">s₁</text>
    <circle cx="610" cy="108" r="20" fill="#dcfce7" stroke="#16a34a"/><text x="610" y="113">s₂</text>
    <circle cx="710" cy="108" r="20" fill="#dcfce7" stroke="#16a34a"/><text x="710" y="113">s₃</text>
    <!-- inputs (below) -->
    <rect x="482" y="150" width="56" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a"/><text x="510" y="170" font-size="10">&lt;BOS&gt;</text>
    <rect x="582" y="150" width="56" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a"/><text x="610" y="170">I</text>
    <rect x="682" y="150" width="56" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a"/><text x="710" y="170">love</text>
    <!-- outputs (above) -->
    <rect x="482" y="44" width="56" height="28" rx="5" fill="#bbf7d0" stroke="#15803d"/><text x="510" y="63" font-weight="bold">I</text>
    <rect x="582" y="44" width="56" height="28" rx="5" fill="#bbf7d0" stroke="#15803d"/><text x="610" y="63" font-weight="bold">love</text>
    <rect x="682" y="44" width="56" height="28" rx="5" fill="#bbf7d0" stroke="#15803d"/><text x="710" y="63" font-weight="bold">road</text>
  </g>
  <!-- c into decoder -->
  <line x1="450" y1="108" x2="488" y2="108" stroke="#ca8a04" stroke-width="2" marker-end="url(#y)"/>
  <!-- dec internal arrows -->
  <g stroke="#16a34a" stroke-width="1.4" marker-end="url(#g)">
    <line x1="530" y1="108" x2="590" y2="108"/>
    <line x1="630" y1="108" x2="690" y2="108"/>
    <!-- input up to state -->
    <line x1="510" y1="148" x2="510" y2="130"/>
    <line x1="610" y1="148" x2="610" y2="130"/>
    <line x1="710" y1="148" x2="710" y2="130"/>
    <!-- state up to output -->
    <line x1="510" y1="88" x2="510" y2="74"/>
    <line x1="610" y1="88" x2="610" y2="74"/>
    <line x1="710" y1="88" x2="710" y2="74"/>
  </g>
  <!-- autoregressive feedback: output -> next input -->
  <g stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#o)">
    <path d="M538,58 C565,58 583,120 610,148" fill="none"/>
    <path d="M638,58 C665,58 683,120 710,148" fill="none"/>
  </g>
  <text x="640" y="200" text-anchor="middle" font-size="9" fill="#b45309">虚线 = 上一步生成的词，喂回去当下一步输入（自回归）；生成 &lt;EOS&gt; 即停</text>

  <!-- bottom notes -->
  <rect x="40" y="226" width="760" height="170" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="248" font-size="11.5" font-weight="bold" fill="#374151">逐步过程：</text>
  <text x="56" y="270" font-size="10.5" fill="#1d4ed8" font-weight="bold">编码器</text>
  <text x="120" y="270" font-size="10.5" fill="#374151">读"我"→h₁；读"爱"(带着h₁)→h₂；读"路"(带着h₂)→h₃。取 c=h₃，整句信息压进一个定长向量。</text>
  <text x="56" y="294" font-size="10.5" fill="#15803d" font-weight="bold">解码器</text>
  <text x="120" y="294" font-size="10.5" fill="#374151">步1：&lt;BOS&gt;+c → s₁ → 输出"I"；步2：把"I"喂回 +s₁ → s₂ → "love"；</text>
  <text x="120" y="312" font-size="10.5" fill="#374151">步3：把"love"喂回 +s₂ → s₃ → "road"；步4：再喂"road" → 输出 &lt;EOS&gt; → 结束。</text>
  <text x="56" y="338" font-size="10.5" fill="#374151">• <tspan font-weight="bold">变长对变长</tspan>：输入 3 词、输出可不是 3 词；&lt;EOS&gt; 决定何时停，所以能处理任意长度。</text>
  <text x="56" y="358" font-size="10.5" fill="#374151">• <tspan font-weight="bold">训练用 teacher forcing</tspan>：训练时第 t 步喂"标准答案的上一个词"而非模型自己的输出，收敛更稳。</text>
  <text x="56" y="378" font-size="10.5" fill="#b91c1c">• <tspan font-weight="bold">瓶颈</tspan>：整句全压进一个定长 c，句子一长就装不下 → 注意力让解码器回看 h₁…h₃，不再只靠 c。</text>

  <defs>
    <marker id="b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/></marker>
    <marker id="y" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ca8a04"/></marker>
    <marker id="o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#b45309"/></marker>
  </defs>
</svg>
