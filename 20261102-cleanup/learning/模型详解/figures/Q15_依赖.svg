<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="320" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">SVM/回归器对 CNN 的依赖：R-CNN 单向 vs Fast R-CNN 双向</text>

  <!-- 左：R-CNN -->
  <text x="185" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">R-CNN（单向，CNN 冻结）</text>
  <rect x="40" y="78" width="100" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="104" text-anchor="middle" font-size="12">CNN</text><text x="90" y="122" text-anchor="middle" font-size="11" fill="#ef4444">❄冻结</text>
  <line x1="140" y1="108" x2="178" y2="108" stroke="#374151" stroke-width="1.8" marker-end="url(#q15)"/>
  <rect x="180" y="80" width="70" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="215" y="104" text-anchor="middle" font-size="10.5">特征</text><text x="215" y="120" text-anchor="middle" font-size="9" fill="#6b7280">fc7/pool5</text>
  <line x1="250" y1="100" x2="288" y2="86" stroke="#374151" stroke-width="1.6" marker-end="url(#q15)"/>
  <line x1="250" y1="116" x2="288" y2="142" stroke="#374151" stroke-width="1.6" marker-end="url(#q15)"/>
  <rect x="290" y="66" width="80" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="330" y="89" text-anchor="middle" font-size="11">SVM 分类</text>
  <rect x="290" y="122" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="330" y="145" text-anchor="middle" font-size="11">边框回归</text>
  <!-- 梯度不回流 -->
  <path d="M288,180 Q180,180 110,142" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#q15r)"/>
  <text x="200" y="200" text-anchor="middle" font-size="11" fill="#ef4444">✗ 梯度不回流（CNN 不更新）</text>
  <text x="200" y="222" text-anchor="middle" font-size="10" fill="#9ca3af">特征只迁就 softmax，未为 SVM/回归优化</text>

  <!-- 分隔 -->
  <line x1="400" y1="55" x2="400" y2="240" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 右：Fast R-CNN -->
  <text x="560" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Fast R-CNN（双向，端到端）</text>
  <rect x="430" y="78" width="100" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="480" y="112" text-anchor="middle" font-size="12">CNN</text>
  <line x1="530" y1="108" x2="568" y2="108" stroke="#374151" stroke-width="1.8" marker-end="url(#q15)"/>
  <rect x="570" y="80" width="60" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="600" y="112" text-anchor="middle" font-size="10.5">特征</text>
  <line x1="630" y1="100" x2="660" y2="88" stroke="#374151" stroke-width="1.6" marker-end="url(#q15)"/>
  <line x1="630" y1="116" x2="660" y2="142" stroke="#374151" stroke-width="1.6" marker-end="url(#q15)"/>
  <rect x="640" y="64" width="74" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="677" y="86" text-anchor="middle" font-size="10">softmax</text>
  <rect x="640" y="120" width="74" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="677" y="142" text-anchor="middle" font-size="10">回归</text>
  <!-- 梯度回流 -->
  <path d="M660,185 Q540,195 480,142" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#q15g)"/>
  <text x="575" y="205" text-anchor="middle" font-size="11" fill="#16a34a">✓ 梯度回流，联合优化</text>
  <text x="575" y="227" text-anchor="middle" font-size="10" fill="#9ca3af">多任务损失，CNN 为检测任务本身优化</text>

  <rect x="40" y="256" width="640" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="360" y="277" text-anchor="middle" font-size="11.5" fill="#374151">两者 SVM/回归都依赖 CNN 特征（强依赖、绑定具体权重，CNN 一变就得重训）；</text>
  <text x="360" y="296" text-anchor="middle" font-size="11.5" fill="#374151">区别在 R-CNN 是单向（CNN 冻结），Fast R-CNN 让损失回流、特征与任务联合优化。</text>
  <defs>
    <marker id="q15" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="q15r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ef4444"/></marker>
    <marker id="q15g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
