<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">YOLOv8 解耦检测头：分类/回归分双支 + anchor-free + DFL</text>

  <!-- input feature -->
  <rect x="30" y="150" width="80" height="60" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="70" y="176" text-anchor="middle" font-size="10" fill="#0f766e">某尺度</text>
  <text x="70" y="192" text-anchor="middle" font-size="9" fill="#374151">特征图</text>
  <text x="70" y="205" text-anchor="middle" font-size="8" fill="#6b7280">(如80×80)</text>

  <!-- cls branch -->
  <rect x="170" y="70" width="250" height="70" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="295" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">① 分类分支 cv2</text>
  <text x="295" y="108" text-anchor="middle" font-size="9.5" fill="#374151">Conv→Conv→Conv(1×1, 输出 C 类)</text>
  <text x="295" y="124" text-anchor="middle" font-size="9" fill="#6b7280">每个网格点 C 个类别分数（sigmoid）</text>

  <!-- reg branch -->
  <rect x="170" y="220" width="250" height="74" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="295" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">② 回归分支 cv3</text>
  <text x="295" y="258" text-anchor="middle" font-size="9.5" fill="#374151">Conv→Conv→Conv(1×1, 输出 4×16)</text>
  <text x="295" y="274" text-anchor="middle" font-size="9" fill="#6b7280">每边(l,t,r,b)预测一个 16 档分布</text>
  <text x="295" y="288" text-anchor="middle" font-size="8.5" fill="#6b7280">（reg_max=16）</text>

  <g stroke="#374151" stroke-width="1.4">
    <line x1="110" y1="170" x2="168" y2="110" marker-end="url(#a)"/>
    <line x1="110" y1="190" x2="168" y2="255" marker-end="url(#a)"/>
  </g>

  <!-- cls loss -->
  <rect x="450" y="78" width="130" height="54" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="515" y="100" text-anchor="middle" font-size="10" fill="#a16207">分类损失</text>
  <text x="515" y="117" text-anchor="middle" font-size="9" fill="#374151">BCE / VFL</text>
  <line x1="420" y1="105" x2="448" y2="105" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- DFL -->
  <rect x="450" y="220" width="130" height="74" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="515" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">DFL 积分</text>
  <text x="515" y="257" text-anchor="middle" font-size="8.5" fill="#374151">分布×档位 期望</text>
  <text x="515" y="271" text-anchor="middle" font-size="8.5" fill="#374151">→ 4 个距离 l,t,r,b</text>
  <text x="515" y="285" text-anchor="middle" font-size="8" fill="#6b7280">损失 DFL+CIoU</text>
  <line x1="420" y1="257" x2="448" y2="257" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- anchor-free decode -->
  <rect x="610" y="220" width="130" height="74" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="675" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">anchor-free 解码</text>
  <text x="675" y="257" text-anchor="middle" font-size="8.5" fill="#374151">网格点 ± l,t,r,b</text>
  <text x="675" y="271" text-anchor="middle" font-size="8.5" fill="#374151">→ 框 x1y1x2y2</text>
  <text x="675" y="285" text-anchor="middle" font-size="8" fill="#6b7280">无预设 anchor</text>
  <line x1="580" y1="257" x2="608" y2="257" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 小图：anchor-free 距离示意 -->
  <text x="675" y="86" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">anchor-free = 学到四边距离</text>
  <rect x="625" y="98" width="100" height="80" fill="none" stroke="#db2777" stroke-width="1.6"/>
  <circle cx="675" cy="138" r="3" fill="#db2777"/>
  <line x1="675" y1="138" x2="675" y2="98" stroke="#9ca3af" stroke-dasharray="3 2"/><text x="683" y="116" font-size="8" fill="#6b7280">t</text>
  <line x1="675" y1="138" x2="675" y2="178" stroke="#9ca3af" stroke-dasharray="3 2"/><text x="683" y="162" font-size="8" fill="#6b7280">b</text>
  <line x1="675" y1="138" x2="625" y2="138" stroke="#9ca3af" stroke-dasharray="3 2"/><text x="642" y="134" font-size="8" fill="#6b7280">l</text>
  <line x1="675" y1="138" x2="725" y2="138" stroke="#9ca3af" stroke-dasharray="3 2"/><text x="705" y="134" font-size="8" fill="#6b7280">r</text>

  <!-- 底注 -->
  <rect x="30" y="312" width="710" height="78" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="46" y="333" font-size="11" fill="#374151"><tspan font-weight="bold" fill="#15803d">解耦</tspan>：分类、回归各走独立卷积分支，互不干扰 → 比 v5 耦合头精度高（一个卷积同时管分类+回归会相互拖累）。</text>
  <text x="46" y="353" font-size="11" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">anchor-free</tspan>：不预设框，直接让网格点回归到目标四边的距离 → 去掉 anchor 超参（呼应答疑 Q14）。</text>
  <text x="46" y="373" font-size="11" fill="#374151"><tspan font-weight="bold" fill="#6d28d9">DFL</tspan>：把"边距"建模成离散分布再求期望，比直接回归一个数更稳、更准（尤其边界模糊时）；配 TaskAligned 分配自动平衡正负（答疑 Q25）。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
