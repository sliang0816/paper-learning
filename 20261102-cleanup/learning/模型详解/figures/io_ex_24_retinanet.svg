<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" font-family="'Microsoft YaHei',sans-serif">
  <rect width="840" height="250" fill="#fff"/>
  <text x="420" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">24 RetinaNet 输入输出实例（一阶段密集预测 + Focal Loss）</text>
  <text x="420" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">图像进 → ResNet+FPN → 每位置铺 9 anchor、双子网预测 → ~10 万密集框 → NMS → 最终框</text>

  <rect x="22" y="72" width="110" height="84" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="77" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入图像</text>
  <text x="77" y="112" text-anchor="middle" font-size="9.3" fill="#374151">800×800×3</text>
  <text x="77" y="131" text-anchor="middle" font-size="8.3" fill="#6b7280">一张路面图</text>

  <line x1="132" y1="114" x2="162" y2="114" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="164" y="68" width="166" height="92" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="247" y="87" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#1e40af">ResNet + FPN</text>
  <text x="247" y="105" text-anchor="middle" font-size="8.5" fill="#374151">每层每位置铺 9 anchor</text>
  <text x="247" y="121" text-anchor="middle" font-size="8.5" fill="#374151">分类子网 → K·A 通道</text>
  <text x="247" y="137" text-anchor="middle" font-size="8.5" fill="#374151">回归子网 → 4·A 通道</text>
  <text x="247" y="152" text-anchor="middle" font-size="8" fill="#6b7280">两个全卷积小网络</text>

  <line x1="330" y1="114" x2="360" y2="114" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="362" y="70" width="180" height="88" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="452" y="89" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#b45309">密集预测 ~10 万框</text>
  <text x="452" y="107" text-anchor="middle" font-size="8.5" fill="#374151">某 anchor：类别[抛洒物 0.95]</text>
  <text x="452" y="123" text-anchor="middle" font-size="8.5" fill="#374151">框偏移 (tx,ty,tw,th)</text>
  <text x="452" y="140" text-anchor="middle" font-size="8.2" fill="#b45309">Focal Loss 压低海量易分背景</text>
  <text x="452" y="153" text-anchor="middle" font-size="7.8" fill="#6b7280">→ 一阶段也能精准</text>

  <line x1="542" y1="114" x2="572" y2="114" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="557" y="106" text-anchor="middle" font-size="7.6" fill="#6b7280">NMS</text>

  <rect x="574" y="80" width="150" height="68" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="649" y="100" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">输出：最终框</text>
  <text x="649" y="118" text-anchor="middle" font-size="8.5" fill="#374151">抛洒物 @(x,y,w,h)</text>
  <text x="649" y="133" text-anchor="middle" font-size="8.5" fill="#374151">置信度 0.95</text>

  <line x1="724" y1="114" x2="752" y2="114" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="754" y="90" width="74" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="791" y="110" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#15803d">画框</text>
  <text x="791" y="127" text-anchor="middle" font-size="7.6" fill="#6b7280">输出结果</text>

  <text x="420" y="190" text-anchor="middle" font-size="9.8" fill="#374151">关键创新不在结构在<tspan font-weight="bold" fill="#b45309">损失</tspan>：密集预测时背景框占 99%+，Focal Loss 自动给“容易的背景”降权，让模型专注难样本。</text>
  <text x="420" y="212" text-anchor="middle" font-size="9.3" fill="#6b7280">这让一阶段首次追平二阶段精度——本项目 YOLOv8 处理正负不平衡也是这一脉思路（见 Q25/Q26）。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
