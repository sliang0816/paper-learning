<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Microsoft YaHei',sans-serif">
  <rect width="600" height="300" fill="#fff"/>
  <text x="300" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">ResNet 残差块：输出 = F(x) + x</text>
  <!-- input -->
  <circle cx="300" cy="60" r="6" fill="#374151"/><text x="320" y="64" font-size="13" fill="#374151">x</text>
  <!-- main path -->
  <line x1="300" y1="66" x2="300" y2="92" stroke="#374151" stroke-width="2" marker-end="url(#a7)"/>
  <rect x="240" y="94" width="120" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="300" y="116" text-anchor="middle" font-size="12">Conv 3×3 → ReLU</text>
  <line x1="300" y1="128" x2="300" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a7)"/>
  <rect x="240" y="152" width="120" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="300" y="174" text-anchor="middle" font-size="12">Conv 3×3</text>
  <line x1="300" y1="186" x2="300" y2="210" stroke="#374151" stroke-width="2" marker-end="url(#a7)"/>
  <!-- skip connection -->
  <path d="M300,66 H470 V210 H318" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a7g)"/>
  <text x="480" y="140" font-size="12" fill="#16a34a">恒等捷径</text>
  <text x="480" y="156" font-size="12" fill="#16a34a">identity x</text>
  <!-- add -->
  <circle cx="300" cy="218" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="300" y="223" text-anchor="middle" font-size="15">+</text>
  <line x1="300" y1="232" x2="300" y2="252" stroke="#374151" stroke-width="2" marker-end="url(#a7)"/>
  <text x="300" y="272" text-anchor="middle" font-size="13" fill="#374151">ReLU → 输出</text>
  <text x="300" y="294" text-anchor="middle" font-size="11.5" fill="#6b7280">+x 让梯度可直接回传（∂y/∂x 含 +1），解决退化/梯度消失，可深达 152 层</text>
  <defs>
    <marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="a7g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
