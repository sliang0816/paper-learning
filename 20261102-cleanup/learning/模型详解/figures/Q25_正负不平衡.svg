<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">极端正负不平衡导致什么：背景淹没损失 → 模型偏向"全判背景" → 漏检、召回低</text>

  <!-- 比例条 -->
  <text x="40" y="56" font-size="12" font-weight="bold" fill="#b45309">① 数量悬殊（一阶段尤甚）</text>
  <rect x="40" y="64" width="680" height="26" fill="#fee2e2" stroke="#fca5a5"/>
  <rect x="40" y="64" width="8" height="26" fill="#16a34a"/>
  <text x="60" y="82" font-size="10.5" fill="#b91c1c">海量负样本（背景）：数万~十万　|　正样本（目标）：寥寥几个 → 正:负 可达 1:1000+</text>
  <text x="52" y="105" font-size="9" fill="#15803d">↑ 这一丝绿就是正样本</text>

  <!-- 链条 -->
  <text x="40" y="134" font-size="12" font-weight="bold" fill="#dc2626">② 后果链条</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40"  y="146" width="150" height="48" rx="6" fill="#fef9c3" stroke="#ca8a04"/><text x="115" y="166">海量"简单背景"负样本</text><text x="115" y="182" font-size="8.5" fill="#a16207">每个 loss 虽小，累加却巨大</text>
    <rect x="214" y="146" width="150" height="48" rx="6" fill="#fee2e2" stroke="#ef4444"/><text x="289" y="166">损失/梯度被背景主导</text><text x="289" y="182" font-size="8.5" fill="#b91c1c">正样本信号被淹没</text>
    <rect x="388" y="146" width="150" height="48" rx="6" fill="#fee2e2" stroke="#ef4444"/><text x="463" y="166">模型偷懒：全判背景</text><text x="463" y="182" font-size="8.5" fill="#b91c1c">"都说没目标"loss 也低</text>
    <rect x="562" y="146" width="158" height="48" rx="6" fill="#fecaca" stroke="#dc2626"/><text x="641" y="162">漏检多、召回低</text><text x="641" y="177" font-size="8.5" fill="#991b1b">精度下降 / 训练难收敛</text><text x="641" y="190" font-size="8" fill="#991b1b">正样本框回归也学不准</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.6">
    <line x1="190" y1="170" x2="212" y2="170" marker-end="url(#r)"/>
    <line x1="364" y1="170" x2="386" y2="170" marker-end="url(#r)"/>
    <line x1="538" y1="170" x2="560" y2="170" marker-end="url(#r)"/>
  </g>

  <!-- 为何二阶段轻 -->
  <text x="40" y="226" font-size="12" font-weight="bold" fill="#7c3aed">③ 为何二阶段受影响小</text>
  <rect x="40" y="236" width="680" height="44" rx="6" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="56" y="257" font-size="10.5" fill="#374151">二阶段先由 RPN 把背景筛掉 → 第二阶段只在 ~2000 稀疏候选上分类，正负比可控（如 1:3）→ 不平衡缓和。</text>
  <text x="56" y="273" font-size="10.5" fill="#6d28d9">一阶段直接在所有位置稠密预测（无筛选）→ 不平衡最极端 → 这正是早期一阶段精度不如二阶段的主因。</text>

  <!-- 解法 -->
  <text x="40" y="306" font-size="12" font-weight="bold" fill="#15803d">④ 怎么解决</text>
  <g font-size="9.5">
    <rect x="40"  y="316" width="218" height="40" rx="6" fill="#fff" stroke="#16a34a"/><text x="52" y="333" fill="#374151">硬采样：OHEM、SSD 难负挖掘</text><text x="52" y="348" font-size="8.5" fill="#6b7280">固定正负比(如 1:3)，丢弃易负</text>
    <rect x="270" y="316" width="218" height="40" rx="6" fill="#fff" stroke="#16a34a"/><text x="282" y="333" fill="#374151">损失加权：YOLOv1 λ_noobj=0.5</text><text x="282" y="348" font-size="8.5" fill="#6b7280">压低无目标框的置信度损失</text>
    <rect x="500" y="316" width="220" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="512" y="333" fill="#15803d" font-weight="bold">Focal Loss（RetinaNet）⭐</text><text x="512" y="348" font-size="8.5" fill="#374151">降易样本权重、聚焦难例 → 追平二阶段</text>
  </g>

  <rect x="40" y="366" width="680" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="385" font-size="10" fill="#374151">本项目：YOLOv8 已含平衡机制（TaskAligned 分配 + 分类 BCE/VFL）；加 P2 使网格更密、负样本更多 → 关注训练是否收敛、召回。</text>

  <defs><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
</svg>
