<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" font-family="'Microsoft YaHei',sans-serif">
  <rect width="840" height="250" fill="#fff"/>
  <text x="420" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">01 感知机 / MLP 输入输出实例（鸢尾花分类）</text>
  <text x="420" y="43" text-anchor="middle" font-size="10.5" fill="#6b7280">定长特征向量进 → 类别得分出（经 softmax 得概率）</text>

  <!-- input -->
  <rect x="22" y="70" width="130" height="92" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="87" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#075985">输入 x（4 维）</text>
  <text x="87" y="110" text-anchor="middle" font-size="9.5" fill="#374151">[5.1, 3.5, 1.4, 0.2]</text>
  <text x="87" y="126" text-anchor="middle" font-size="8.5" fill="#6b7280">萼长 萼宽 瓣长 瓣宽</text>
  <text x="87" y="148" text-anchor="middle" font-size="8.5" fill="#b91c1c">维度被权重焊死→必须定长</text>

  <line x1="152" y1="116" x2="184" y2="116" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- MLP -->
  <rect x="186" y="76" width="150" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="261" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">MLP</text>
  <text x="261" y="117" text-anchor="middle" font-size="9" fill="#374151">隐层 z = W·x + b</text>
  <text x="261" y="133" text-anchor="middle" font-size="9" fill="#374151">+ ReLU 激活</text>
  <text x="261" y="149" text-anchor="middle" font-size="8.3" fill="#6b7280">权重从数据学出</text>

  <line x1="336" y1="116" x2="368" y2="116" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- logits -->
  <rect x="370" y="78" width="120" height="76" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="430" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">logits（3 类）</text>
  <text x="430" y="118" text-anchor="middle" font-size="9.5" fill="#374151">[2.1, 0.3, −1.0]</text>
  <text x="430" y="138" text-anchor="middle" font-size="8.3" fill="#6b7280">未归一的得分</text>

  <line x1="490" y1="116" x2="522" y2="116" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="506" y="108" text-anchor="middle" font-size="8" fill="#6b7280">softmax</text>

  <!-- probs -->
  <rect x="524" y="78" width="130" height="76" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="589" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">概率（和=1）</text>
  <text x="589" y="118" text-anchor="middle" font-size="9.3" fill="#374151">[0.83, 0.13, 0.04]</text>
  <text x="589" y="138" text-anchor="middle" font-size="8.3" fill="#6b7280">每类的可能性</text>

  <line x1="654" y1="116" x2="686" y2="116" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="670" y="108" text-anchor="middle" font-size="8" fill="#6b7280">argmax</text>

  <!-- class -->
  <rect x="688" y="84" width="128" height="64" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="752" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">类别 = 0</text>
  <text x="752" y="126" text-anchor="middle" font-size="9.5" fill="#374151">山鸢尾</text>
  <text x="752" y="142" text-anchor="middle" font-size="8" fill="#6b7280">输出维度=类别数 3</text>

  <text x="420" y="196" text-anchor="middle" font-size="10" fill="#374151">一句话：<tspan font-weight="bold" fill="#0369a1">4 个固定数</tspan> 进 → 一串加权求和+激活 → <tspan font-weight="bold" fill="#15803d">3 个类别概率</tspan> 出，取最大的当答案。</text>
  <text x="420" y="218" text-anchor="middle" font-size="9.3" fill="#6b7280">换一朵花只改这 4 个数；想分 5 类则输出层换成 5 个节点（输入维度和类别数都写死在权重里）。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
