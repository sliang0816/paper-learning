<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="460" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">SPP 怎么固定格子数：格数是写死的目标，窗口/步长随输入大小反算（自适应池化）</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7280">普通池化：窗口固定→输出随输入变；SPP：输出格数固定→窗口随输入变</text>

  <!-- formula -->
  <rect x="230" y="58" width="360" height="40" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="410" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4338ca">目标 n×n 格 → 窗口=⌈a/n⌉，步长=⌊a/n⌋</text>

  <!-- case 1: 13x13 -> 4x4 -->
  <text x="210" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">输入 13×13，目标 4×4</text>
  <g stroke="#93c5fd" fill="#eff6ff"><rect x="120" y="134" width="180" height="180"/></g>
  <g stroke="#bfdbfe" stroke-width="0.8">
    <line x1="120" y1="148" x2="300" y2="148"/><line x1="120" y1="162" x2="300" y2="162"/><line x1="120" y1="176" x2="300" y2="176"/><line x1="120" y1="190" x2="300" y2="190"/><line x1="120" y1="204" x2="300" y2="204"/><line x1="120" y1="218" x2="300" y2="218"/><line x1="120" y1="232" x2="300" y2="232"/><line x1="120" y1="246" x2="300" y2="246"/><line x1="120" y1="260" x2="300" y2="260"/><line x1="120" y1="274" x2="300" y2="274"/><line x1="120" y1="288" x2="300" y2="288"/><line x1="120" y1="302" x2="300" y2="302"/>
    <line x1="134" y1="134" x2="134" y2="314"/><line x1="148" y1="134" x2="148" y2="314"/><line x1="162" y1="134" x2="162" y2="314"/><line x1="176" y1="134" x2="176" y2="314"/><line x1="190" y1="134" x2="190" y2="314"/><line x1="204" y1="134" x2="204" y2="314"/><line x1="218" y1="134" x2="218" y2="314"/><line x1="232" y1="134" x2="232" y2="314"/><line x1="246" y1="134" x2="246" y2="314"/><line x1="260" y1="134" x2="260" y2="314"/><line x1="274" y1="134" x2="274" y2="314"/><line x1="288" y1="134" x2="288" y2="314"/>
  </g>
  <!-- 4x4 thick bins: window 4, stride 3 -> bins start at 0,3,6,9 cols/rows, width ~4 cells(56px? 13cells=180 -> 1cell≈13.8). bin width = win4≈55, stride3≈41.5 -->
  <g stroke="#1d4ed8" stroke-width="2.5" fill="none">
    <rect x="120" y="134" width="56" height="56"/><rect x="161" y="134" width="56" height="56"/><rect x="202" y="134" width="56" height="56"/><rect x="244" y="134" width="56" height="56"/>
    <rect x="120" y="175" width="56" height="56"/><rect x="120" y="216" width="56" height="56"/><rect x="120" y="258" width="56" height="56"/>
  </g>
  <text x="210" y="332" text-anchor="middle" font-size="10" fill="#374151">窗口=⌈13/4⌉=4，步长=⌊13/4⌋=3</text>
  <text x="210" y="348" text-anchor="middle" font-size="10" fill="#1d4ed8">⌊(13−4)/3⌋+1 = 4 → 4×4 格</text>

  <!-- case 2: 10x10 -> 4x4 -->
  <text x="560" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">输入 10×10，目标 4×4</text>
  <g stroke="#86efac" fill="#f0fdf4"><rect x="480" y="134" width="160" height="160"/></g>
  <g stroke="#bbf7d0" stroke-width="0.8">
    <line x1="480" y1="150" x2="640" y2="150"/><line x1="480" y1="166" x2="640" y2="166"/><line x1="480" y1="182" x2="640" y2="182"/><line x1="480" y1="198" x2="640" y2="198"/><line x1="480" y1="214" x2="640" y2="214"/><line x1="480" y1="230" x2="640" y2="230"/><line x1="480" y1="246" x2="640" y2="246"/><line x1="480" y1="262" x2="640" y2="262"/><line x1="480" y1="278" x2="640" y2="278"/>
    <line x1="496" y1="134" x2="496" y2="294"/><line x1="512" y1="134" x2="512" y2="294"/><line x1="528" y1="134" x2="528" y2="294"/><line x1="544" y1="134" x2="544" y2="294"/><line x1="560" y1="134" x2="560" y2="294"/><line x1="576" y1="134" x2="576" y2="294"/><line x1="592" y1="134" x2="592" y2="294"/><line x1="608" y1="134" x2="608" y2="294"/><line x1="624" y1="134" x2="624" y2="294"/>
  </g>
  <!-- 4x4 thick bins: window 3, stride 2; 10cells=160 -> 1cell=16; win3=48, stride2=32 -->
  <g stroke="#15803d" stroke-width="2.5" fill="none">
    <rect x="480" y="134" width="48" height="48"/><rect x="512" y="134" width="48" height="48"/><rect x="544" y="134" width="48" height="48"/><rect x="576" y="134" width="48" height="48"/>
    <rect x="480" y="166" width="48" height="48"/><rect x="480" y="198" width="48" height="48"/><rect x="480" y="230" width="48" height="48"/>
  </g>
  <text x="560" y="312" text-anchor="middle" font-size="10" fill="#374151">窗口=⌈10/4⌉=3，步长=⌊10/4⌋=2</text>
  <text x="560" y="328" text-anchor="middle" font-size="10" fill="#15803d">⌊(10−3)/2⌋+1 = 4 → 4×4 格</text>

  <text x="410" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">13×13 和 10×10 都 → 4×4=16 格：窗口/步长自适应，格数恒定</text>

  <!-- pyramid -->
  <rect x="40" y="384" width="740" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="56" y="404" font-size="10.5" font-weight="bold" fill="#a16207">SPP 金字塔：多档固定网格各自自适应池化，再拼接</text>
  <text x="56" y="424" font-size="10.5" fill="#374151">4×4(16格) + 2×2(4格) + 1×1(1格，=全局池化) = 21 格（恒定）→ 每通道 21 值 → 21×C 定长向量 → FC。</text>
  <text x="56" y="441" font-size="9.5" fill="#6b7280">PyTorch 即 AdaptiveMaxPool2d(output_size)：你给输出尺寸，它自动算窗口与步长。</text>
</svg>
