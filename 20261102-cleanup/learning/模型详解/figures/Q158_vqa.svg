<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Microsoft YaHei',sans-serif">
  <rect width="960" height="700" fill="#fff"/>
  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q158 VQA(视觉问答)：给图+自然语言问题，模型输出答案——检验跨模态理解深度的标杆任务</text>

  <!-- 任务形式 -->
  <rect x="20" y="42" width="920" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="480" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">① 任务形式</text>
  <text x="480" y="88" text-anchor="middle" font-size="11" font-family="Consolas,monospace" fill="#374151">输入: 图片(一辆红色公交车) + "What color is the bus?"　→　输出: "red"</text>
  <text x="480" y="112" text-anchor="middle" font-size="9.5" fill="#6b7280">两种做法：分类式(主流，从~3000候选答案词表选一个)　vs　生成式(直接写句子，LLaVA等大模型用)</text>

  <!-- 模型怎么做 -->
  <rect x="20" y="144" width="920" height="200" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">② 模型怎么做（接区域VLP/ViLT脉络，用 pooled token 接分类头）</text>
  <text x="40" y="190" font-size="10" fill="#374151">1. 图 → 检测器抽N个区域token(区域VLP) 或 切patch线性投影(ViLT)</text>
  <text x="40" y="210" font-size="10" fill="#374151">2. 问题 → 分词成词token</text>
  <text x="40" y="230" font-size="10" fill="#374151">3. 区域/patch token + 词token 一起进跨模态Transformer(单塔，深度互相注意)</text>
  <text x="40" y="250" font-size="10" fill="#15803d">4. 取 <tspan font-weight="bold">pooled token</tspan>([CLS]最终向量，见Q157) → 接分类头 → 候选答案词表softmax → 选概率最高答案</text>
  <g font-size="9.5" font-family="Consolas,monospace" fill="#374151">
    <text x="60" y="278">[CLS] What color is the bus [SEP] [区域1:公交车][区域2:马路]...</text>
    <text x="60" y="296" fill="#6b7280">    ↓ 过Transformer，CLS吸收全部信息</text>
    <text x="60" y="316" fill="#15803d" font-weight="bold">pooled token → FC → 3000类softmax → "red"(概率最高)</text>
  </g>

  <!-- 为何是标杆 -->
  <rect x="20" y="356" width="920" height="176" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="480" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">③ 为什么是检验"跨模态理解深度"的标杆任务</text>
  <text x="40" y="402" font-size="10" fill="#374151">比"图文匹配"难得多——很多问题<tspan font-weight="bold">必须同时读图+读文字</tspan>才能答：</text>
  <text x="56" y="424" font-size="9.5" fill="#374151">· "巴士是什么颜色" → 必须定位到"那辆巴士"这个具体物体(不是随便一个颜色)</text>
  <text x="56" y="444" font-size="9.5" fill="#374151">· "图里有几个人" → 要数数，考验细粒度识别</text>
  <text x="56" y="464" font-size="9.5" fill="#374151">· "这个女人在做什么" → 要理解动作/关系</text>
  <text x="40" y="490" font-size="10" fill="#b45309">这正是为什么VLP需要 <tspan font-weight="bold">MLM+MRM 细粒度(词↔区域)对齐能力</tspan>（Q156）——没有它答不出"公交车什么颜色"</text>
  <text x="40" y="510" font-size="10" fill="#b45309">这类需要精确定位的问题，只靠CLIP"整图↔整句"粗粒度对齐不够（Q155分野在下游任务上的直接体现）</text>

  <!-- 数据集 -->
  <rect x="20" y="544" width="920" height="86" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="480" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">④ 经典数据集：VQA v2</text>
  <text x="40" y="590" font-size="10" fill="#374151">最主流基准，特意做"平衡"处理——同一问题配答案不同的两张图(如"是不是红色"配一张红车一张蓝车)</text>
  <text x="40" y="610" font-size="10" fill="#374151">逼模型必须<tspan font-weight="bold">真的看图</tspan>，不能靠"猜哪个答案在训练集出现最多"蒙混过关</text>

  <!-- 一句话 -->
  <rect x="20" y="640" width="920" height="48" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="480" y="662" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">一句话：VQA=图+问题→答案，用pooled token接分类头选候选答案；需要细粒度词↔区域对齐才能答好，是VLP模型的经典下游考场。</text>
  <text x="480" y="680" text-anchor="middle" font-size="9" fill="#6b7280">纯当模型学习，与本项目路面抛洒物检测无直接关联。</text>
</svg>
