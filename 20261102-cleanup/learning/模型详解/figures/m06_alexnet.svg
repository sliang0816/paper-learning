<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="230" fill="#fff"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">AlexNet：5 卷积 + 3 全连接（ReLU + Dropout + GPU）</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="20"  y="70" width="58" height="70" fill="#e5e7eb" stroke="#9ca3af"/><text x="49" y="108">224²×3</text><text x="49" y="160" fill="#6b7280">输入</text>
    <rect x="92"  y="74" width="50" height="62" fill="#dbeafe" stroke="#3b82f6"/><text x="117" y="106">55²×96</text><text x="117" y="160" fill="#3b82f6">Conv1 11×11</text>
    <rect x="156" y="80" width="44" height="50" fill="#dbeafe" stroke="#3b82f6"/><text x="178" y="108">27²×256</text><text x="178" y="160" fill="#3b82f6">Conv2 5×5</text>
    <rect x="214" y="84" width="38" height="42" fill="#bfdbfe" stroke="#3b82f6"/><text x="233" y="108">13²×384</text><text x="233" y="160" fill="#3b82f6">Conv3</text>
    <rect x="266" y="84" width="38" height="42" fill="#bfdbfe" stroke="#3b82f6"/><text x="285" y="108">13²×384</text><text x="285" y="160" fill="#3b82f6">Conv4</text>
    <rect x="318" y="84" width="38" height="42" fill="#dbeafe" stroke="#3b82f6"/><text x="337" y="108">13²×256</text><text x="337" y="160" fill="#3b82f6">Conv5</text>
    <rect x="400" y="86" width="22" height="38" fill="#fef3c7" stroke="#f59e0b"/><text x="450" y="108">4096</text><text x="450" y="160" fill="#b45309">FC6</text>
    <rect x="490" y="86" width="22" height="38" fill="#fef3c7" stroke="#f59e0b"/><text x="540" y="108">4096</text><text x="540" y="160" fill="#b45309">FC7</text>
    <rect x="580" y="86" width="20" height="38" fill="#dcfce7" stroke="#16a34a"/><text x="630" y="108">1000</text><text x="630" y="160" fill="#16a34a">FC8→Softmax</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.3">
    <line x1="78" y1="105" x2="90" y2="105"/><line x1="142" y1="105" x2="154" y2="105"/><line x1="200" y1="105" x2="212" y2="105"/>
    <line x1="252" y1="105" x2="264" y2="105"/><line x1="304" y1="105" x2="316" y2="105"/><line x1="356" y1="105" x2="398" y2="105"/>
    <line x1="422" y1="105" x2="488" y2="105"/><line x1="512" y1="105" x2="578" y2="105"/>
  </g>
  <rect x="680" y="74" width="125" height="76" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="742" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">四大创新</text>
  <text x="690" y="112" font-size="10.5" fill="#7c2d12">ReLU · Dropout</text>
  <text x="690" y="128" font-size="10.5" fill="#7c2d12">GPU 并行</text>
  <text x="690" y="144" font-size="10.5" fill="#7c2d12">数据增强</text>
  <text x="410" y="205" text-anchor="middle" font-size="12" fill="#6b7280">ImageNet 2012 Top-5 错误率 15.3%（第二名 26.2%）——深度学习元年</text>
</svg>
