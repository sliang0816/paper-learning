<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="420" fill="#fff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">窗口注意力 W-MSA 与移位窗口 SW-MSA：线性复杂度下的近全局建模</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#6b7280">两层交替：第 l 层规则切窗（窗内算注意力）→ 第 l+1 层窗口平移半格，跨窗口信息流动</text>

  <!-- left: W-MSA regular windows -->
  <text x="200" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">第 l 层 W-MSA：规则窗口（窗间不通）</text>
  <g>
    <!-- 8x8 grid divided into 4 windows of 4x4 -->
    <rect x="80" y="92" width="240" height="240" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <!-- thin grid -->
    <g stroke="#bfdbfe">
      <line x1="80" y1="122" x2="320" y2="122"/><line x1="80" y1="152" x2="320" y2="152"/><line x1="80" y1="182" x2="320" y2="182"/>
      <line x1="80" y1="212" x2="320" y2="212"/><line x1="80" y1="242" x2="320" y2="242"/><line x1="80" y1="272" x2="320" y2="272"/><line x1="80" y1="302" x2="320" y2="302"/>
      <line x1="110" y1="92" x2="110" y2="332"/><line x1="140" y1="92" x2="140" y2="332"/><line x1="170" y1="92" x2="170" y2="332"/>
      <line x1="200" y1="92" x2="200" y2="332"/><line x1="230" y1="92" x2="230" y2="332"/><line x1="260" y1="92" x2="260" y2="332"/><line x1="290" y1="92" x2="290" y2="332"/>
    </g>
    <!-- 4 window borders (thick) -->
    <g stroke="#1d4ed8" stroke-width="3" fill="none">
      <rect x="80" y="92" width="120" height="120"/><rect x="200" y="92" width="120" height="120"/>
      <rect x="80" y="212" width="120" height="120"/><rect x="200" y="212" width="120" height="120"/>
    </g>
    <text x="140" y="158" text-anchor="middle" font-size="10" fill="#1e40af">窗口1</text>
    <text x="260" y="158" text-anchor="middle" font-size="10" fill="#1e40af">窗口2</text>
    <text x="140" y="278" text-anchor="middle" font-size="10" fill="#1e40af">窗口3</text>
    <text x="260" y="278" text-anchor="middle" font-size="10" fill="#1e40af">窗口4</text>
  </g>
  <text x="200" y="354" text-anchor="middle" font-size="9.5" fill="#374151">注意力只在每个窗口内部算 → O(N) 线性</text>

  <!-- right: SW-MSA shifted -->
  <text x="610" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">第 l+1 层 SW-MSA：窗口平移半格</text>
  <g>
    <rect x="490" y="92" width="240" height="240" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <g stroke="#bbf7d0">
      <line x1="490" y1="122" x2="730" y2="122"/><line x1="490" y1="152" x2="730" y2="152"/><line x1="490" y1="182" x2="730" y2="182"/>
      <line x1="490" y1="212" x2="730" y2="212"/><line x1="490" y1="242" x2="730" y2="242"/><line x1="490" y1="272" x2="730" y2="272"/><line x1="490" y1="302" x2="730" y2="302"/>
      <line x1="520" y1="92" x2="520" y2="332"/><line x1="550" y1="92" x2="550" y2="332"/><line x1="580" y1="92" x2="580" y2="332"/>
      <line x1="610" y1="92" x2="610" y2="332"/><line x1="640" y1="92" x2="640" y2="332"/><line x1="670" y1="92" x2="670" y2="332"/><line x1="700" y1="92" x2="700" y2="332"/>
    </g>
    <!-- shifted window borders, offset by half (60px) -> windows centered -->
    <g stroke="#15803d" stroke-width="3" fill="none">
      <rect x="550" y="152" width="120" height="120"/>
    </g>
    <rect x="550" y="152" width="120" height="120" fill="#bbf7d0" fill-opacity="0.5"/>
    <text x="610" y="216" text-anchor="middle" font-size="9.5" fill="#15803d">平移后的新窗口</text>
  </g>
  <text x="610" y="300" text-anchor="middle" font-size="9.5" fill="#166534">原本被边界隔开的 token</text>
  <text x="610" y="316" text-anchor="middle" font-size="9.5" fill="#166534">现在落进同一窗口 → 跨窗通信</text>
  <text x="610" y="354" text-anchor="middle" font-size="9.5" fill="#374151">交替几层后，信息扩散到全图（近全局）</text>

  <!-- bottom -->
  <rect x="40" y="372" width="740" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="410" y="396" text-anchor="middle" font-size="10.5" fill="#92400e">复杂度：全局 MSA O((HW)²) → 窗口 W-MSA O(M²·HW) 线性；配 Patch Merging 造 4 尺度金字塔，可当检测/分割骨干。</text>
</svg>
