<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" font-family="'Microsoft YaHei',sans-serif">
  <rect width="840" height="500" fill="#fff"/>
  <text x="420" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">CBAM：通道 vs 空间 = 沿不同轴池化（压掉哪个轴，就比较剩下那个轴）</text>
  <text x="420" y="46" text-anchor="middle" font-size="11" fill="#6b7280">特征是 H×W×C 立方体；CBAM 不“分辨”谁是谁，而是两次注意力各压掉一个轴</text>

  <!-- ===== Channel attention (top) ===== -->
  <text x="60" y="86" font-size="13" font-weight="bold" fill="#1d4ed8">① 通道注意力：压掉空间 H×W，保留通道 C → 1×1×C（看什么特征）</text>
  <!-- cube -->
  <g>
    <rect x="70" y="100" width="70" height="70" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="82" y="112" width="70" height="70" fill="#bfdbfe" stroke="#3b82f6"/>
    <rect x="94" y="124" width="70" height="70" fill="#93c5fd" stroke="#3b82f6"/>
    <text x="129" y="210" text-anchor="middle" font-size="10" fill="#374151">F：H×W×C（C 张图）</text>
  </g>
  <!-- squeeze arrow -->
  <g stroke="#3b82f6" stroke-width="1.4" marker-end="url(#b)"><line x1="180" y1="150" x2="250" y2="150"/></g>
  <text x="215" y="140" text-anchor="middle" font-size="10" fill="#1d4ed8">每张图压成1个数</text>
  <text x="215" y="166" text-anchor="middle" font-size="9" fill="#6b7280">Avg + Max 沿 H×W</text>
  <!-- C-vector -->
  <g font-size="11" text-anchor="middle">
    <rect x="258" y="120" width="44" height="22" fill="#bfdbfe" stroke="#3b82f6"/><text x="280" y="136">2.0</text>
    <rect x="258" y="142" width="44" height="22" fill="#bfdbfe" stroke="#3b82f6"/><text x="280" y="158">0.5</text>
    <rect x="258" y="164" width="44" height="22" fill="#bfdbfe" stroke="#3b82f6"/><text x="280" y="180">4.0</text>
  </g>
  <text x="280" y="200" text-anchor="middle" font-size="9" fill="#374151">C 维</text>
  <!-- MLP -->
  <g stroke="#9ca3af" stroke-width="1.2" marker-end="url(#b)"><line x1="305" y1="152" x2="360" y2="152"/></g>
  <text x="332" y="144" text-anchor="middle" font-size="9" fill="#6b7280">共享MLP</text>
  <text x="332" y="166" text-anchor="middle" font-size="9" fill="#6b7280">+Sigmoid</text>
  <!-- Mc -->
  <g font-size="11" text-anchor="middle">
    <rect x="366" y="120" width="44" height="22" fill="#fde68a" stroke="#d97706"/><text x="388" y="136">0.4</text>
    <rect x="366" y="142" width="44" height="22" fill="#fde68a" stroke="#d97706"/><text x="388" y="158">0.3</text>
    <rect x="366" y="164" width="44" height="22" fill="#fde68a" stroke="#d97706"/><text x="388" y="180">0.9</text>
  </g>
  <text x="388" y="200" text-anchor="middle" font-size="9.5" fill="#b45309">Mc (1×1×C)</text>
  <!-- multiply back -->
  <text x="430" y="150" font-size="14" fill="#374151">⊗</text>
  <text x="495" y="146" text-anchor="middle" font-size="10.5" fill="#374151">F' = Mc ⊗ F</text>
  <text x="495" y="166" text-anchor="middle" font-size="9.5" fill="#6b7280">每通道整张图</text>
  <text x="495" y="180" text-anchor="middle" font-size="9.5" fill="#6b7280">乘同一权重（沿空间广播）</text>
  <text x="640" y="150" text-anchor="middle" font-size="10.5" fill="#1d4ed8">通道3(0.9)强调 / 通道2(0.3)抑制</text>

  <line x1="40" y1="225" x2="800" y2="225" stroke="#e5e7eb"/>

  <!-- ===== Spatial attention (bottom) ===== -->
  <text x="60" y="256" font-size="13" font-weight="bold" fill="#15803d">② 空间注意力：压掉通道 C，保留空间 H×W → H×W×1（在哪里看）</text>
  <!-- cube F' -->
  <g>
    <rect x="70" y="270" width="70" height="70" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="82" y="282" width="70" height="70" fill="#bbf7d0" stroke="#16a34a"/>
    <rect x="94" y="294" width="70" height="70" fill="#86efac" stroke="#16a34a"/>
    <text x="129" y="380" text-anchor="middle" font-size="10" fill="#374151">F'：H×W×C</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.4" marker-end="url(#b)"><line x1="180" y1="312" x2="250" y2="312"/></g>
  <text x="215" y="302" text-anchor="middle" font-size="10" fill="#15803d">每个位置跨C压</text>
  <text x="215" y="328" text-anchor="middle" font-size="9" fill="#6b7280">Avg + Max 沿 C</text>
  <!-- 2 maps 2x2 -->
  <g font-size="9" text-anchor="middle">
    <rect x="256" y="285" width="50" height="50" fill="#bbf7d0" stroke="#16a34a"/>
    <line x1="281" y1="285" x2="281" y2="335" stroke="#86efac"/><line x1="256" y1="310" x2="306" y2="310" stroke="#86efac"/>
    <text x="320" y="313" font-size="11">+</text>
    <rect x="332" y="285" width="50" height="50" fill="#a7f3d0" stroke="#16a34a"/>
    <line x1="357" y1="285" x2="357" y2="335" stroke="#86efac"/><line x1="332" y1="310" x2="382" y2="310" stroke="#86efac"/>
  </g>
  <text x="319" y="350" text-anchor="middle" font-size="9" fill="#374151">2 张 H×W 图（拼成 2×H×W）</text>
  <g stroke="#9ca3af" stroke-width="1.2" marker-end="url(#b)"><line x1="388" y1="310" x2="440" y2="310"/></g>
  <text x="414" y="302" text-anchor="middle" font-size="9" fill="#6b7280">7×7 卷积</text>
  <text x="414" y="324" text-anchor="middle" font-size="9" fill="#6b7280">+Sigmoid</text>
  <!-- Ms map -->
  <g font-size="10" text-anchor="middle">
    <rect x="446" y="285" width="56" height="56" fill="#fde68a" stroke="#d97706"/>
    <line x1="474" y1="285" x2="474" y2="341" stroke="#fcd34d"/><line x1="446" y1="313" x2="502" y2="313" stroke="#fcd34d"/>
    <text x="460" y="305">0.2</text><text x="488" y="305">0.6</text><text x="460" y="333">0.5</text><text x="488" y="333">0.9</text>
  </g>
  <text x="474" y="356" text-anchor="middle" font-size="9.5" fill="#b45309">Ms (H×W×1)</text>
  <text x="522" y="312" font-size="14" fill="#374151">⊗</text>
  <text x="600" y="305" text-anchor="middle" font-size="10.5" fill="#374151">F'' = Ms ⊗ F'</text>
  <text x="600" y="324" text-anchor="middle" font-size="9.5" fill="#6b7280">每位置所有通道乘同一权重（沿通道广播）</text>
  <text x="600" y="340" text-anchor="middle" font-size="10.5" fill="#15803d">右下(0.9)区域被强调</text>

  <!-- bottom contrast bar -->
  <rect x="660" y="100" width="160" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="740" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">区分的关键</text>
  <text x="672" y="140" font-size="9.5" fill="#374151">压掉空间→比通道</text>
  <text x="672" y="156" font-size="9.5" fill="#374151">压掉通道→比位置</text>
  <text x="672" y="174" font-size="9" fill="#6b7280">两轴互补，串联使用</text>

  <rect x="640" y="370" width="180" height="110" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="730" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">为什么这样设计</text>
  <text x="650" y="409" font-size="9" fill="#374151">· 通道用 avg+max：整体+最强</text>
  <text x="650" y="425" font-size="9" fill="#374151">　点互补（SE 只 avg）</text>
  <text x="650" y="443" font-size="9" fill="#374151">· 空间用 7×7 大核：看邻域</text>
  <text x="650" y="459" font-size="9" fill="#374151">　判断“这片是不是目标区”</text>
  <text x="650" y="475" font-size="9" fill="#16a34a">· 顺序：先通道后空间</text>

  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>
</svg>
