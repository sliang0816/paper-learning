<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" font-family="'Microsoft YaHei',sans-serif">
  <rect width="980" height="680" fill="#fff"/>
  <text x="490" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q183 BCE 是什么？——二元交叉熵：衡量一个"是/不是"判断预测得准不准的损失</text>

  <!-- 定义 -->
  <rect x="20" y="42" width="940" height="26" rx="6" fill="#1e40af"/>
  <text x="490" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">BCE = Binary Cross-Entropy = 二元/二分类交叉熵，是交叉熵(Q102)在"两个结果(是/不是)"这种情形下的特例</text>

  <!-- 公式与两项 -->
  <rect x="20" y="78" width="460" height="210" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="250" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">公式：两项，一项管"该是1"、一项管"该是0"</text>
  <text x="40" y="128" font-size="11" fill="#111827" font-family="monospace">L = −[ y·log(p) + (1−y)·log(1−p) ]</text>
  <text x="40" y="152" font-size="9.4" fill="#374151">p = 模型预测"是"的概率(由sigmoid给出，∈(0,1))</text>
  <text x="40" y="172" font-size="9.4" fill="#374151">y = 真实标签，是=1 / 不是=0</text>
  <text x="40" y="198" font-size="9.4" fill="#374151">·当 y=1：只剩 −log(p) → 逼 p 往 1 走</text>
  <text x="40" y="218" font-size="9.4" fill="#374151">·当 y=0：只剩 −log(1−p) → 逼 p 往 0 走</text>
  <text x="40" y="242" font-size="9.4" font-weight="bold" fill="#1e40af">两项里总有一项因系数(y或1−y)=0而消失</text>
  <text x="40" y="266" font-size="9" fill="#6b7280">所以BCE同时监督"该是1"和"该是0"两个方向</text>
  <text x="40" y="282" font-size="9" fill="#6b7280">(对比softmax-CE只写正确类那一项，见Q102)</text>

  <!-- 和sigmoid配对 -->
  <rect x="500" y="78" width="460" height="210" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="730" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">和 sigmoid 天生一对</text>
  <text x="520" y="126" font-size="9.4" fill="#374151">sigmoid 把网络原始分数 z 压成概率 p=σ(z)∈(0,1)</text>
  <text x="520" y="146" font-size="9.4" fill="#374151">BCE 就负责衡量这个 p 离真实 y 多远</text>
  <text x="520" y="170" font-size="9.4" fill="#374151">求导后梯度 = p − y(预测减真实)，形式极简</text>
  <text x="520" y="190" font-size="9.4" fill="#374151">不会像"sigmoid+MSE"那样梯度消失(呼应Q2/Q102)</text>
  <text x="520" y="214" font-size="9.4" font-weight="bold" fill="#15803d">"逻辑回归"=sigmoid+BCE，就是最基础的二分类器</text>
  <text x="520" y="238" font-size="9.4" fill="#374151">这也是Q182"独立逻辑回归"的由来</text>
  <text x="520" y="262" font-size="9" fill="#6b7280">softmax配多分类CE、sigmoid配BCE，各是一对</text>

  <!-- 数值例子 -->
  <rect x="20" y="300" width="940" height="26" rx="6" fill="#b45309"/>
  <text x="490" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">数值例子：BCE 怎么"重罚自信地错、奖励自信地对"（问题：这个框是不是"车"？）</text>

  <rect x="20" y="336" width="940" height="120" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <line x1="20" y1="368" x2="960" y2="368" stroke="#f59e0b" stroke-width="1"/>
  <line x1="240" y1="336" x2="240" y2="456" stroke="#f59e0b" stroke-width="1"/>
  <line x1="480" y1="336" x2="480" y2="456" stroke="#f59e0b" stroke-width="1"/>
  <line x1="720" y1="336" x2="720" y2="456" stroke="#f59e0b" stroke-width="1"/>
  <text x="130" y="358" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#374151">真实 y</text>
  <text x="360" y="358" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#374151">预测 p</text>
  <text x="600" y="358" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#374151">BCE 损失</text>
  <text x="840" y="358" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#374151">解读</text>

  <text x="130" y="388" text-anchor="middle" font-size="9.3" fill="#15803d">是车 y=1</text>
  <text x="360" y="388" text-anchor="middle" font-size="9.3" fill="#374151">0.9</text>
  <text x="600" y="388" text-anchor="middle" font-size="9.3" fill="#374151" font-family="monospace">−log0.9 ≈ 0.11</text>
  <text x="840" y="388" text-anchor="middle" font-size="9.3" fill="#15803d">又对又自信→小</text>

  <text x="130" y="410" text-anchor="middle" font-size="9.3" fill="#15803d">是车 y=1</text>
  <text x="360" y="410" text-anchor="middle" font-size="9.3" fill="#374151">0.1</text>
  <text x="600" y="410" text-anchor="middle" font-size="9.3" fill="#374151" font-family="monospace">−log0.1 ≈ 2.30</text>
  <text x="840" y="410" text-anchor="middle" font-size="9.3" fill="#b91c1c">自信地错→重罚</text>

  <text x="130" y="432" text-anchor="middle" font-size="9.3" fill="#b91c1c">不是车 y=0</text>
  <text x="360" y="432" text-anchor="middle" font-size="9.3" fill="#374151">0.1</text>
  <text x="600" y="432" text-anchor="middle" font-size="9.3" fill="#374151" font-family="monospace">−log(1−0.1) ≈ 0.11</text>
  <text x="840" y="432" text-anchor="middle" font-size="9.3" fill="#15803d">对→小</text>

  <text x="130" y="452" text-anchor="middle" font-size="9.3" fill="#b91c1c">不是车 y=0</text>
  <text x="360" y="452" text-anchor="middle" font-size="9.3" fill="#374151">0.8</text>
  <text x="600" y="452" text-anchor="middle" font-size="9.3" fill="#374151" font-family="monospace">−log(1−0.8) ≈ 1.61</text>
  <text x="840" y="452" text-anchor="middle" font-size="9.3" fill="#b91c1c">把非车判成车→罚</text>

  <!-- 多标签 -->
  <rect x="20" y="470" width="940" height="80" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="490" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">多标签怎么用：C个类各算一个BCE再相加（这就是Q182 YOLOv3独立逻辑回归的损失）</text>
  <text x="45" y="516" font-size="9.6" fill="#374151" font-family="monospace">L_cls = Σ_i BCE(p_i, y_i) = Σ_i −[ y_i·log(p_i) + (1−y_i)·log(1−p_i) ]</text>
  <text x="45" y="538" font-size="9.4" fill="#374151">每个类别独立做一次"是/不是"的BCE、彼此不干扰 → 一个框可同时属多个类(多标签)；softmax做不到(它逼类间抢概率)</text>

  <!-- 一句话 -->
  <rect x="20" y="562" width="940" height="56" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="490" y="584" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#a16207">一句话：BCE是"一个是/不是判断"的交叉熵损失，配sigmoid用，两项分别管"该是1"和"该是0"，重罚自信的错、奖励自信的对；</text>
  <text x="490" y="602" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#a16207">多标签/多类各判各的时就是"每类一个BCE相加"。它和多分类softmax-CE是两套：softmax=C选1、BCE=每类独立是非题。</text>

  <rect x="20" y="626" width="940" height="42" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="490" y="646" text-anchor="middle" font-size="9.2" fill="#374151">和Q102的关系：交叉熵(Q102)是总纲；BCE是它在"两类/是非"情形的具体形式。本项目YOLOv8分类分支、CLIP的InfoNCE都建立在交叉熵这套地基上。</text>
  <text x="490" y="662" text-anchor="middle" font-size="9" fill="#6b7280">名字拆解：Binary(二元/两个结果) + Cross-Entropy(交叉熵) = 针对"是/不是"两个结果的交叉熵。</text>
</svg>
