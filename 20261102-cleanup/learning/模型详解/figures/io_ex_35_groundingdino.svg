<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 205" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="205" fill="#fff"/>
  <text x="410" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">35 Grounding DINO 输入输出实例（文本驱动检测，“指哪打哪”）</text>
  <text x="410" y="41" text-anchor="middle" font-size="10.5" fill="#6b7280">图像 + 文本提示词 → 图文特征融合 → 文本所指类别的检测框（开放词汇）</text>

  <rect x="22" y="66" width="140" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="92" y="85" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#075985">输入</text>
  <text x="92" y="103" text-anchor="middle" font-size="8.4" fill="#374151">一张路面图</text>
  <text x="92" y="119" text-anchor="middle" font-size="8.4" fill="#374151">+ 文本 “tire. glass.”</text>
  <text x="92" y="134" text-anchor="middle" font-size="8" fill="#6b7280">想找什么就写什么</text>

  <line x1="162" y1="106" x2="192" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="194" y="64" width="200" height="84" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="294" y="83" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#1e40af">图文特征深度融合</text>
  <text x="294" y="101" text-anchor="middle" font-size="8.3" fill="#374151">文本指导“看哪里”</text>
  <text x="294" y="116" text-anchor="middle" font-size="8.3" fill="#374151">检测器只框出文本提到的类</text>
  <text x="294" y="133" text-anchor="middle" font-size="8" fill="#6b7280">类别不再固定在训练集</text>

  <line x1="394" y1="106" x2="424" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="426" y="72" width="186" height="68" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="519" y="91" text-anchor="middle" font-size="9.3" font-weight="bold" fill="#15803d">输出：文本所指的框</text>
  <text x="519" y="109" text-anchor="middle" font-size="8.3" fill="#374151">tire @(x,y,w,h)、glass @(..)</text>
  <text x="519" y="125" text-anchor="middle" font-size="8" fill="#6b7280">只框 tire/glass，不框别的</text>

  <line x1="612" y1="106" x2="642" y2="106" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="644" y="84" width="148" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="718" y="103" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#15803d">开放词汇检测</text>
  <text x="718" y="120" text-anchor="middle" font-size="7.2" fill="#6b7280">本项目相关工作对比</text>

  <text x="410" y="178" text-anchor="middle" font-size="9.6" fill="#374151">和本项目目标相近：<tspan font-weight="bold" fill="#0369a1">用文本指定要检测的类</tspan>——本项目是“YOLO 检测 + CLIP 命名”，它是“文本直接驱动检测”，是第二章关键对比对象。</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
