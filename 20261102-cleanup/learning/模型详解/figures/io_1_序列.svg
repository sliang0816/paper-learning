<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 150" font-family="'Microsoft YaHei',sans-serif">
  <rect width="740" height="150" fill="#fff"/>
  <text x="14" y="24" font-size="13" font-weight="bold" fill="#111827">① 基础与序列模型：定长向量 / 变长序列 → 类别 或 序列表示</text>
  <!-- MLP row -->
  <g font-size="11">
    <rect x="20" y="40" width="150" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="95" y="61" text-anchor="middle">定长向量 x∈ℝⁿ</text>
    <line x1="172" y1="57" x2="226" y2="57" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="228" y="40" width="120" height="34" rx="5" fill="#f3f4f6" stroke="#6b7280"/><text x="288" y="61" text-anchor="middle">MLP / 感知机</text>
    <line x1="350" y1="57" x2="404" y2="57" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="406" y="40" width="170" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="491" y="61" text-anchor="middle">类别得分 → softmax</text>
  </g>
  <!-- RNN row -->
  <g font-size="11">
    <rect x="20" y="92" width="150" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="95" y="109" text-anchor="middle">变长向量序列</text><text x="95" y="124" text-anchor="middle" font-size="10" fill="#6b7280">x₁,…,x_T</text>
    <line x1="172" y1="112" x2="226" y2="112" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="228" y="92" width="120" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280"/><text x="288" y="116" text-anchor="middle">RNN / LSTM</text>
    <line x1="350" y1="112" x2="404" y2="112" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="406" y="92" width="320" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="566" y="109" text-anchor="middle">末态 h_T（多对一）/ 每步 y_t（多对多）</text><text x="566" y="124" text-anchor="middle" font-size="10" fill="#15803d">5 种 I/O 模式见 Q45</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
