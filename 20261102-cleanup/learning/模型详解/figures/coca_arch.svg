<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="470" fill="#fff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">CoCa：一个模型两个损失——对比(像CLIP) + 生成caption；文本解码器拆成"单模态半"+"多模态半"</text>

  <!-- 图像编码器 -->
  <rect x="30" y="60" width="130" height="170" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="95" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af" transform="rotate(-90 95 140)">图像编码器 ViT</text>
  <text x="95" y="248" text-anchor="middle" font-size="8" fill="#6b7280">出图像特征</text>

  <!-- 文本解码器：两半 -->
  <text x="470" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">文本解码器（自回归），从中间拆成两半</text>

  <!-- 下半：单模态 -->
  <rect x="200" y="60" width="360" height="70" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="380" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">下半：单模态文本解码器（无交叉注意力）</text>
  <text x="380" y="100" text-anchor="middle" font-size="8.5" fill="#374151">只处理文本，产出整句文本表示（pooled）</text>
  <text x="380" y="116" text-anchor="middle" font-size="8.5" fill="#b45309">→ 和图像特征做【对比损失】(像 CLIP)</text>

  <!-- 上半：多模态 -->
  <rect x="200" y="150" width="360" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="380" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">上半：多模态文本解码器（加交叉注意力看图）</text>
  <text x="380" y="190" text-anchor="middle" font-size="8.5" fill="#374151">交叉注意力吸取图像信息，自回归生成描述</text>
  <text x="380" y="208" text-anchor="middle" font-size="8.5" fill="#b45309">→ 【生成/caption 损失】(逐词预测)</text>

  <!-- 图像→上半交叉注意力 -->
  <line x1="160" y1="180" x2="200" y2="185" stroke="#8b5cf6" stroke-width="2"/>
  <text x="180" y="175" text-anchor="middle" font-size="7.5" fill="#6d28d9">交叉注意力</text>
  <!-- 图像→对比 -->
  <line x1="160" y1="95" x2="200" y2="95" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- 两个损失 -->
  <rect x="600" y="60" width="310" height="70" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="755" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">① 对比损失（Contrastive）</text>
  <text x="755" y="100" text-anchor="middle" font-size="8.5" fill="#374151">图向量 ↔ 单模态文本向量</text>
  <text x="755" y="116" text-anchor="middle" font-size="8.5" fill="#15803d">→ 检索/零样本分类（像 CLIP）</text>
  <rect x="600" y="150" width="310" height="80" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="755" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">② 生成损失（Captioning）</text>
  <text x="755" y="190" text-anchor="middle" font-size="8.5" fill="#374151">多模态解码器逐词预测描述</text>
  <text x="755" y="208" text-anchor="middle" font-size="8.5" fill="#6d28d9">→ caption / VQA（会"说"）</text>

  <line x1="560" y1="95" x2="600" y2="95" stroke="#9ca3af"/>
  <line x1="560" y1="190" x2="600" y2="190" stroke="#9ca3af"/>

  <!-- 关键 -->
  <rect x="30" y="250" width="880" height="120" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="470" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">妙处：一次前向、一个模型，同时拿"对齐能力"和"生成能力"</text>
  <text x="50" y="292" font-size="9.5" fill="#374151">· 把文本解码器从中间劈开：下半不看图（单模态）→ 出的文本表示拿去和图像做对比（拿到 CLIP 的检索/零样本）</text>
  <text x="50" y="312" font-size="9.5" fill="#374151">· 上半看图（多模态交叉注意力）→ 自回归生成 caption（拿到"会说话"的生成能力）</text>
  <text x="50" y="332" font-size="9.5" fill="#374151">· 两个损失一起训 → 一个"图文基础模型"既会检索/分类、又会描述/答问</text>
  <text x="50" y="352" font-size="9" fill="#6b7280">对比：CLIP 只有对比（不会生成）；纯 caption 模型只会生成（对齐弱）。CoCa 用"劈开解码器"把两者合一。</text>

  <!-- 一句话 -->
  <rect x="30" y="382" width="880" height="76" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="404" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">一句话：CoCa = 图像编码器 + "劈成两半的文本解码器"——下半单模态做对比、上半多模态做生成，</text>
  <text x="470" y="426" text-anchor="middle" font-size="9.5" fill="#374151">一个模型同时具备 CLIP 的对齐 + caption 的生成，成为通用图文基础模型。</text>
  <text x="470" y="446" text-anchor="middle" font-size="8" fill="#6b7280">Yu J, et al. CoCa: Contrastive Captioners are Image-Text Foundation Models. 2022 (arXiv:2205.01917).</text>
</svg>
