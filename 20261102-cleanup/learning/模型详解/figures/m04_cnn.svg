<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="360" fill="#fff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">CNN 原理：卷积滑窗 + 卷积/池化/全连接流水线</text>

  <!-- 上：卷积滑窗示意 -->
  <text x="150" y="60" text-anchor="middle" font-size="13" fill="#3b82f6">① 卷积核在图上滑动，逐元素相乘求和</text>
  <g stroke="#94a3b8" stroke-width="1">
    <rect x="60" y="74" width="120" height="120" fill="#f1f5f9"/>
    <line x1="100" y1="74" x2="100" y2="194"/><line x1="140" y1="74" x2="140" y2="194"/>
    <line x1="60" y1="114" x2="180" y2="114"/><line x1="60" y1="154" x2="180" y2="154"/>
  </g>
  <rect x="60" y="74" width="80" height="80" fill="#fde68a" fill-opacity="0.5" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="118" text-anchor="middle" font-size="11" fill="#7c2d12">k×k 核</text>
  <line x1="180" y1="134" x2="230" y2="134" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>
  <rect x="232" y="104" width="120" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="292" y="130" text-anchor="middle" font-size="11">滑遍全图</text><text x="292" y="148" text-anchor="middle" font-size="11">→ 特征图(1通道)</text>
  <text x="292" y="186" text-anchor="middle" font-size="10" fill="#6b7280">Cout 个核 → Cout 通道</text>

  <!-- 三大思想 -->
  <rect x="400" y="74" width="320" height="118" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="560" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">卷积省参又有效的三大思想</text>
  <text x="416" y="120" font-size="11.5" fill="#7c2d12">• 局部连接：只看 k×k 一小块（参数→k²级）</text>
  <text x="416" y="142" font-size="11.5" fill="#7c2d12">• 权重共享：同一核扫全图（平移不变）</text>
  <text x="416" y="164" font-size="11.5" fill="#7c2d12">• 层级堆叠：浅层边缘→深层物体</text>
  <text x="416" y="184" font-size="10.5" fill="#9ca3af">对比 MLP 全连接：参数从亿级降到 k² 级</text>

  <!-- 下：流水线 -->
  <text x="380" y="232" text-anchor="middle" font-size="13" fill="#16a34a">② 典型流水线（空间↓、通道↑ 金字塔）</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="30"  y="248" width="70" height="60" fill="#e5e7eb" stroke="#9ca3af"/><text x="65" y="282">输入图</text>
    <rect x="120" y="252" width="80" height="52" fill="#dbeafe" stroke="#3b82f6"/><text x="160" y="274">Conv</text><text x="160" y="290" fill="#6b7280">+ReLU</text>
    <rect x="220" y="258" width="64" height="40" fill="#bfdbfe" stroke="#3b82f6"/><text x="252" y="282">Pool</text>
    <text x="312" y="282" font-size="14" fill="#9ca3af">…×N</text>
    <rect x="350" y="252" width="80" height="52" fill="#dbeafe" stroke="#3b82f6"/><text x="390" y="274">Conv</text><text x="390" y="290" fill="#6b7280">+Pool</text>
    <rect x="460" y="256" width="80" height="44" fill="#fef3c7" stroke="#f59e0b"/><text x="500" y="282">FC / GAP</text>
    <rect x="570" y="258" width="90" height="40" fill="#dcfce7" stroke="#16a34a"/><text x="615" y="282">类别/框</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="100" y1="278" x2="118" y2="278" marker-end="url(#a3)"/>
    <line x1="200" y1="278" x2="218" y2="278" marker-end="url(#a3)"/>
    <line x1="284" y1="278" x2="304" y2="278" marker-end="url(#a3)"/>
    <line x1="332" y1="278" x2="348" y2="278" marker-end="url(#a3)"/>
    <line x1="430" y1="278" x2="458" y2="278" marker-end="url(#a3)"/>
    <line x1="540" y1="278" x2="568" y2="278" marker-end="url(#a3)"/>
  </g>
  <text x="380" y="338" text-anchor="middle" font-size="11.5" fill="#6b7280">LeNet/AlexNet/VGG/ResNet… 都是这套积木的不同搭法；YOLOv8 骨干同理</text>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
