<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="760" height="800" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">两个 3×3 卷积  ≡  一个 5×5 卷积</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#6b7280">（一维演示，步长1。两栏的橙色输出点都覆盖输入第 2~6 共 5 个绿点 → 感受野相同）</text>

  <!-- ===================== 上栏：两个 3×3 ===================== -->
  <rect x="24" y="78" width="712" height="318" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="44" y="104" font-size="15" font-weight="bold" fill="#b45309">方案 A：两个 3×3 堆叠（两步到达 5 格）</text>

  <!-- 行标签 -->
  <text x="40" y="156" font-size="12" fill="#6b7280">输出</text>
  <text x="40" y="256" font-size="12" fill="#6b7280">中间</text>
  <text x="40" y="356" font-size="12" fill="#6b7280">输入</text>

  <!-- 连线 -->
  <g stroke="#9ca3af" stroke-width="1.4" opacity="0.6">
    <line x1="320" y1="168" x2="250" y2="242"/>
    <line x1="320" y1="168" x2="320" y2="242"/>
    <line x1="320" y1="168" x2="390" y2="242"/>
  </g>
  <g stroke="#34d399" stroke-width="1.4" opacity="0.75">
    <line x1="250" y1="262" x2="180" y2="338"/><line x1="250" y1="262" x2="250" y2="338"/><line x1="250" y1="262" x2="320" y2="338"/>
    <line x1="320" y1="262" x2="250" y2="338"/><line x1="320" y1="262" x2="320" y2="338"/><line x1="320" y1="262" x2="390" y2="338"/>
    <line x1="390" y1="262" x2="320" y2="338"/><line x1="390" y1="262" x2="390" y2="338"/><line x1="390" y1="262" x2="460" y2="338"/>
  </g>

  <!-- 两次卷积标注（关键：第①② 个 3×3 在这里） -->
  <g>
    <rect x="556" y="196" width="150" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="565" y="216" font-size="13" font-weight="bold" fill="#b45309">② 第 2 个 3×3</text>
    <line x1="430" y1="205" x2="556" y2="211" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="556" y="296" width="150" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="565" y="316" font-size="13" font-weight="bold" fill="#b45309">① 第 1 个 3×3</text>
    <line x1="430" y1="305" x2="556" y2="311" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- 输入覆盖底色 -->
  <rect x="152" y="328" width="328" height="44" rx="9" fill="#d1fae5" opacity="0.55"/>

  <!-- L2 节点(3) y=150 -->
  <circle cx="250" cy="150" r="16" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="320" cy="150" r="19" fill="#f59e0b" stroke="#b45309" stroke-width="2.4"/>
  <circle cx="390" cy="150" r="16" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
  <!-- L1 节点(5) y=250 -->
  <circle cx="180" cy="250" r="15" fill="#dbeafe" stroke="#93c5fd"/>
  <circle cx="250" cy="250" r="17" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="320" cy="250" r="17" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="390" cy="250" r="17" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="460" cy="250" r="15" fill="#dbeafe" stroke="#93c5fd"/>
  <!-- 输入节点(7) y=350 -->
  <g font-size="12" font-weight="bold">
    <circle cx="110" cy="350" r="15" fill="#e5e7eb" stroke="#9ca3af"/><text x="110" y="354" text-anchor="middle" fill="#6b7280">1</text>
    <circle cx="180" cy="350" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="180" y="354" text-anchor="middle" fill="#064e3b">2</text>
    <circle cx="250" cy="350" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="250" y="354" text-anchor="middle" fill="#064e3b">3</text>
    <circle cx="320" cy="350" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="320" y="354" text-anchor="middle" fill="#064e3b">4</text>
    <circle cx="390" cy="350" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="390" y="354" text-anchor="middle" fill="#064e3b">5</text>
    <circle cx="460" cy="350" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="460" y="354" text-anchor="middle" fill="#064e3b">6</text>
    <circle cx="530" cy="350" r="15" fill="#e5e7eb" stroke="#9ca3af"/><text x="530" y="354" text-anchor="middle" fill="#6b7280">7</text>
  </g>

  <!-- ===================== 等号 ===================== -->
  <text x="380" y="438" text-anchor="middle" font-size="40" font-weight="bold" fill="#111827">=</text>
  <text x="450" y="436" font-size="13" fill="#059669" font-weight="bold">覆盖同样的 5 个输入</text>

  <!-- ===================== 下栏：一个 5×5 ===================== -->
  <rect x="24" y="458" width="712" height="246" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="44" y="484" font-size="15" font-weight="bold" fill="#b45309">方案 B：一个 5×5 卷积（一步直接跨 5 格）</text>

  <text x="40" y="536" font-size="12" fill="#6b7280">输出</text>
  <text x="40" y="666" font-size="12" fill="#6b7280">输入</text>

  <!-- 5×5 直接连线 -->
  <g stroke="#34d399" stroke-width="1.5" opacity="0.8">
    <line x1="320" y1="548" x2="180" y2="642"/>
    <line x1="320" y1="548" x2="250" y2="642"/>
    <line x1="320" y1="548" x2="320" y2="642"/>
    <line x1="320" y1="548" x2="390" y2="642"/>
    <line x1="320" y1="548" x2="460" y2="642"/>
  </g>
  <!-- 一个5×5标注 -->
  <rect x="556" y="575" width="150" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="565" y="595" font-size="13" font-weight="bold" fill="#b45309">一个 5×5（跨5格）</text>
  <line x1="420" y1="595" x2="556" y2="590" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="152" y="638" width="328" height="44" rx="9" fill="#d1fae5" opacity="0.55"/>

  <!-- 输出(3) y=530 -->
  <circle cx="250" cy="530" r="16" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="320" cy="530" r="19" fill="#f59e0b" stroke="#b45309" stroke-width="2.4"/>
  <circle cx="390" cy="530" r="16" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
  <!-- 输入(7) y=660 -->
  <g font-size="12" font-weight="bold">
    <circle cx="110" cy="660" r="15" fill="#e5e7eb" stroke="#9ca3af"/><text x="110" y="664" text-anchor="middle" fill="#6b7280">1</text>
    <circle cx="180" cy="660" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="180" y="664" text-anchor="middle" fill="#064e3b">2</text>
    <circle cx="250" cy="660" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="250" y="664" text-anchor="middle" fill="#064e3b">3</text>
    <circle cx="320" cy="660" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="320" y="664" text-anchor="middle" fill="#064e3b">4</text>
    <circle cx="390" cy="660" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="390" y="664" text-anchor="middle" fill="#064e3b">5</text>
    <circle cx="460" cy="660" r="17" fill="#34d399" stroke="#047857" stroke-width="1.6"/><text x="460" y="664" text-anchor="middle" fill="#064e3b">6</text>
    <circle cx="530" cy="660" r="15" fill="#e5e7eb" stroke="#9ca3af"/><text x="530" y="664" text-anchor="middle" fill="#6b7280">7</text>
  </g>

  <!-- 底部公式条 -->
  <rect x="24" y="722" width="712" height="62" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="380" y="745" text-anchor="middle" font-size="13.5" fill="#111827">感受野相同（都=5）；但参数量：两个 3×3 = <tspan font-weight="bold" fill="#047857">2×9C² = 18C²</tspan>　&lt;　一个 5×5 = <tspan font-weight="bold" fill="#b45309">25C²</tspan></text>
  <text x="380" y="766" text-anchor="middle" font-size="12" fill="#6b7280">参数量公式 = k×k×C_in×C_out；C_in=C_out=C 时，5×5→25C²，3×3→9C²。小核更省参，且多一次 ReLU 非线性更强。</text>
</svg>
