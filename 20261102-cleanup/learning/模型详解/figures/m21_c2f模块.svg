<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="360" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">C2f 模块（YOLOv8）：split + 多个 Bottleneck 全部 concat → 更多梯度分支</text>

  <!-- C2f -->
  <text x="380" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">C2f 数据流</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="30" y="120" width="70" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="65" y="144">输入</text>
    <rect x="120" y="120" width="80" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="160" y="137">Conv 1×1</text><text x="160" y="151" font-size="8">升维后 split</text>
    <!-- split into 2 -->
    <rect x="240" y="70" width="90" height="30" rx="5" fill="#f1f5f9" stroke="#64748b"/><text x="285" y="89">分支0（直连）</text>
    <rect x="240" y="116" width="90" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="285" y="135">Bottleneck①</text>
    <rect x="240" y="162" width="90" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="285" y="181">Bottleneck②</text>
    <rect x="240" y="208" width="90" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="285" y="227">Bottleneck…n</text>
    <!-- concat -->
    <rect x="400" y="120" width="80" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="440" y="137">Concat</text><text x="440" y="151" font-size="8">(2+n) 段</text>
    <rect x="500" y="120" width="80" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="540" y="137">Conv 1×1</text><text x="540" y="151" font-size="8">融合</text>
    <rect x="600" y="120" width="70" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="635" y="144">输出</text>
  </g>
  <!-- arrows -->
  <g stroke="#374151" stroke-width="1.3">
    <line x1="100" y1="140" x2="118" y2="140" marker-end="url(#a)"/>
    <line x1="200" y1="140" x2="238" y2="85" marker-end="url(#a)"/>
    <line x1="200" y1="140" x2="238" y2="131" marker-end="url(#a)"/>
    <line x1="580" y1="140" x2="598" y2="140" marker-end="url(#a)"/>
  </g>
  <!-- bottleneck chain -->
  <g stroke="#ca8a04" stroke-width="1.3">
    <line x1="285" y1="146" x2="285" y2="160" marker-end="url(#y)"/>
    <line x1="285" y1="192" x2="285" y2="206" marker-end="url(#y)"/>
  </g>
  <!-- all to concat -->
  <g stroke="#7c3aed" stroke-width="1.1">
    <line x1="330" y1="85" x2="400" y2="128" marker-end="url(#p)"/>
    <line x1="330" y1="131" x2="398" y2="135" marker-end="url(#p)"/>
    <line x1="330" y1="177" x2="398" y2="143" marker-end="url(#p)"/>
    <line x1="330" y1="223" x2="400" y2="152" marker-end="url(#p)"/>
  </g>
  <text x="350" y="250" text-anchor="middle" font-size="9" fill="#7c3aed">每个 Bottleneck 的输出都被保留并 concat（不像 C3 只用最后一个）</text>

  <!-- vs C3 -->
  <rect x="30" y="270" width="350" height="78" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="46" y="291" font-size="11" font-weight="bold" fill="#374151">对比 C3（v5）：</text>
  <text x="46" y="310" font-size="10" fill="#374151">C3 = 两路，一路串过 n 个 Bottleneck 只取末端输出，</text>
  <text x="46" y="326" font-size="10" fill="#374151">另一路直连，再 concat。梯度路径少。</text>
  <text x="46" y="343" font-size="10" fill="#16a34a">C2f 保留每个 Bottleneck 输出 → 梯度分支更多更短。</text>

  <rect x="396" y="270" width="334" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="412" y="291" font-size="11" font-weight="bold" fill="#1d4ed8">为什么对本项目有利：</text>
  <text x="412" y="310" font-size="10" fill="#374151">更多梯度分支 = "给梯度修更多高速路"（同 ResNet</text>
  <text x="412" y="326" font-size="10" fill="#374151">残差思想，见 09 ResNet / 答疑 Q9），</text>
  <text x="412" y="343" font-size="10" fill="#b45309">浅层纹理保留更好 → 利于小目标/低对比度抛洒物。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="y" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ca8a04"/></marker>
    <marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
