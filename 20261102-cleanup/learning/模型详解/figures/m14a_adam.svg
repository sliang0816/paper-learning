<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="'Microsoft YaHei',sans-serif">
  <rect width="980" height="500" fill="#fff"/>
  <text x="490" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Adam：一阶矩(动量)+二阶矩(自适应步长)+偏差修正</text>

  <!-- 谱系 -->
  <rect x="20" y="46" width="940" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="490" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Adam = Momentum 的思路 + RMSProp 的思路，合二为一</text>
  <text x="490" y="92" text-anchor="middle" font-size="10" fill="#374151">Momentum：给梯度做指数滑动平均，抑制震荡、加速沿一致方向前进（一阶矩 m）</text>
  <text x="490" y="112" text-anchor="middle" font-size="10" fill="#374151">RMSProp：给梯度平方做指数滑动平均，每个参数各自获得自适应步长（二阶矩 v）——梯度大的参数步子小，梯度小的参数步子大</text>

  <!-- 算法步骤 -->
  <rect x="20" y="150" width="940" height="230" rx="8" fill="#fff7ed" stroke="#f59e0b" font-family="monospace"/>
  <text x="490" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309" font-family="'Microsoft YaHei',sans-serif">Adam 每一步更新（默认 α=0.001, β1=0.9, β2=0.999, ε=1e-8）</text>
  <text x="40" y="200" font-size="11" fill="#374151">g_t   ← ∇θ f_t(θ_{t-1})                          （当前梯度）</text>
  <text x="40" y="224" font-size="11" fill="#374151">m_t   ← β1·m_{t-1} + (1-β1)·g_t                   （一阶矩：梯度的指数滑动平均 = 动量）</text>
  <text x="40" y="248" font-size="11" fill="#374151">v_t   ← β2·v_{t-1} + (1-β2)·g_t²                  （二阶矩：梯度平方的指数滑动平均）</text>
  <text x="40" y="272" font-size="11" fill="#b91c1c" font-weight="bold">m̂_t ← m_t / (1-β1^t)   v̂_t ← v_t / (1-β2^t)      （偏差修正：抵消初始化为0的低估）</text>
  <text x="40" y="296" font-size="11" fill="#1e40af" font-weight="bold">θ_t   ← θ_{t-1} − α · m̂_t / (√v̂_t + ε)             （参数更新：方向靠m̂，步长靠v̂自适应缩放）</text>
  <text x="490" y="330" text-anchor="middle" font-size="10" fill="#374151">m_0=0, v_0=0 初始化 → 训练早期 m_t/v_t 会偏向0（"偏差"）→ 除以(1-β^t)修正，t越大修正项越接近1</text>
  <text x="490" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">效果：每个参数各自有自适应学习率，步长大致被α"信任域"限制住，训练初期也不会因偏差被带偏</text>
  <text x="490" y="374" text-anchor="middle" font-size="9.5" fill="#6b7280">对稀疏梯度、非平稳目标(如GAN)、噪声梯度都鲁棒——这也是它成为深度学习默认优化器的原因</text>

  <!-- 对比表 -->
  <rect x="20" y="392" width="940" height="96" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="490" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">与 SGD(+Momentum) 对比</text>
  <text x="40" y="438" font-size="10" fill="#374151">SGD(+Momentum)：所有参数共用同一个学习率；调参敏感，但收敛点往往泛化更好（部分CNN分类任务仍用SGD+余弦退火）</text>
  <text x="40" y="460" font-size="10" fill="#374151">Adam：每个参数自适应学习率，对超参不敏感、收敛快，是 Transformer/BERT/GPT/ViT 等现代大模型训练的默认选择（常用 AdamW 变体）</text>
  <text x="40" y="478" font-size="9.5" fill="#6b7280">AdamW（2019）：把权重衰减从梯度更新里解耦出来单独处理，修正Adam里L2正则化和自适应学习率耦合导致的失效问题</text>
</svg>
