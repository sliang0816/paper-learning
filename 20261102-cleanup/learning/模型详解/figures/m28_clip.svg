<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="680" height="360" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">CLIP：双塔对比学习 → 零样本识别</text>
  <!-- image tower -->
  <rect x="40" y="60" width="120" height="40" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="100" y="85" text-anchor="middle" font-size="12">图像</text>
  <rect x="40" y="120" width="120" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="100" y="140" text-anchor="middle" font-size="11">Image Encoder</text><text x="100" y="156" text-anchor="middle" font-size="10" fill="#6b7280">ViT / ResNet</text>
  <line x1="100" y1="100" x2="100" y2="118" stroke="#374151" stroke-width="1.6" marker-end="url(#a21)"/>
  <!-- text tower -->
  <rect x="40" y="240" width="180" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="130" y="260" text-anchor="middle" font-size="10.5">"a {cls} on the road"</text><text x="130" y="276" text-anchor="middle" font-size="10" fill="#6b7280">文本 prompt</text>
  <rect x="40" y="180" width="180" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="130" y="200" text-anchor="middle" font-size="11">Text Encoder</text><text x="130" y="216" text-anchor="middle" font-size="10" fill="#6b7280">Transformer</text>
  <line x1="130" y1="238" x2="130" y2="226" stroke="#374151" stroke-width="1.6" marker-end="url(#a21)"/>
  <!-- similarity matrix -->
  <line x1="160" y1="142" x2="300" y2="160" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#a21)"/>
  <line x1="220" y1="202" x2="300" y2="190" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a21)"/>
  <rect x="305" y="120" width="150" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="112" text-anchor="middle" font-size="11" fill="#374151">图文相似度矩阵</text>
  <g>
    <rect x="320" y="135" width="26" height="26" fill="#34d399"/><rect x="348" y="135" width="26" height="26" fill="#e5e7eb"/><rect x="376" y="135" width="26" height="26" fill="#e5e7eb"/>
    <rect x="320" y="163" width="26" height="26" fill="#e5e7eb"/><rect x="348" y="163" width="26" height="26" fill="#34d399"/><rect x="376" y="163" width="26" height="26" fill="#e5e7eb"/>
    <rect x="320" y="191" width="26" height="26" fill="#e5e7eb"/><rect x="348" y="191" width="26" height="26" fill="#e5e7eb"/><rect x="376" y="191" width="26" height="26" fill="#34d399"/>
  </g>
  <text x="430" y="180" font-size="10" fill="#16a34a">对角线</text><text x="430" y="194" font-size="10" fill="#16a34a">=正样本</text>
  <line x1="455" y1="175" x2="500" y2="175" stroke="#374151" stroke-width="1.6" marker-end="url(#a21)"/>
  <rect x="505" y="150" width="140" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="575" y="172" text-anchor="middle" font-size="11">最高相似度</text><text x="575" y="188" text-anchor="middle" font-size="11">= 识别类别</text>
  <rect x="40" y="300" width="605" height="44" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="342" y="320" text-anchor="middle" font-size="11.5" fill="#b45309">训练：4亿图文对，拉近匹配对/推远不匹配对　推理：换 prompt 即识别新类（零样本）</text>
  <text x="342" y="337" text-anchor="middle" font-size="11" fill="#7c2d12">本项目：YOLOv8 出框 → 裁剪 → CLIP 识别开放类（GL/ME 零样本）</text>
  <defs><marker id="a21" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
