<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 350" font-family="'Microsoft YaHei',sans-serif">
  <rect width="740" height="350" fill="#fff"/>
  <text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">一阶段 vs 二阶段：稀疏两轮 vs 稠密一轮</text>

  <!-- 二阶段 -->
  <text x="60" y="58" font-size="13" font-weight="bold" fill="#b45309">二阶段（Faster R-CNN）：稀疏候选 + 第二阶段精修</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="30"  y="70" width="64" height="40" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="62" y="94">图→骨干</text>
    <rect x="116" y="70" width="110" height="40" rx="6" fill="#fff7ed" stroke="#f59e0b"/><text x="171" y="88">①RPN 生成</text><text x="171" y="103">稀疏候选(~2000)</text>
    <rect x="248" y="70" width="100" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="298" y="88">RoI Pooling</text><text x="298" y="103">逐候选重采样</text>
    <rect x="370" y="70" width="120" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="430" y="88">②分类+回归</text><text x="430" y="103">精细(第二轮)</text>
    <rect x="512" y="70" width="64" height="40" rx="6" fill="#fce7f3" stroke="#db2777"/><text x="544" y="94">结果</text>
  </g>
  <g stroke="#374151" stroke-width="1.6">
    <line x1="94" y1="90" x2="114" y2="90" marker-end="url(#s)"/>
    <line x1="226" y1="90" x2="246" y2="90" marker-end="url(#s)"/>
    <line x1="348" y1="90" x2="368" y2="90" marker-end="url(#s)"/>
    <line x1="490" y1="90" x2="510" y2="90" marker-end="url(#s)"/>
  </g>
  <text x="600" y="86" font-size="10.5" fill="#b45309">两轮分类回归</text>
  <text x="600" y="102" font-size="10.5" fill="#6b7280">准，但慢</text>

  <!-- 一阶段 -->
  <text x="60" y="168" font-size="13" font-weight="bold" fill="#1d4ed8">一阶段（YOLO / SSD）：所有位置稠密预测</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="30"  y="180" width="64" height="40" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="62" y="204">图→骨干</text>
    <rect x="140" y="180" width="180" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="230" y="198">检测头：所有位置/anchor</text><text x="230" y="213">一次性预测 类别+框</text>
    <rect x="370" y="180" width="64" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="402" y="204">NMS</text>
    <rect x="456" y="180" width="64" height="40" rx="6" fill="#fce7f3" stroke="#db2777"/><text x="488" y="204">结果</text>
  </g>
  <g stroke="#374151" stroke-width="1.6">
    <line x1="94" y1="200" x2="138" y2="200" marker-end="url(#s)"/>
    <line x1="320" y1="200" x2="368" y2="200" marker-end="url(#s)"/>
    <line x1="434" y1="200" x2="454" y2="200" marker-end="url(#s)"/>
  </g>
  <text x="600" y="196" font-size="10.5" fill="#1d4ed8">一轮，稠密</text>
  <text x="600" y="212" font-size="10.5" fill="#6b7280">快，结构简单</text>

  <!-- 底注 -->
  <rect x="30" y="250" width="680" height="86" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="48" y="272" font-size="11.5" fill="#374151">⚠️ 误区：一阶段并非"没有候选框"——它也有 anchor(参考框)。真正区别 = 有无"稀疏候选 + 第二阶段重采样精修"。</text>
  <text x="48" y="293" font-size="11.5" fill="#374151">代价：一阶段要分类所有位置→极端正负不平衡→ RetinaNet 的 Focal Loss 解决，精度追平二阶段。</text>
  <text x="48" y="313" font-size="11" fill="#6b7280">界限已模糊：anchor-free(FCOS/YOLOv8)无anchor无候选；DETR用query集合预测，端到端，算另一类。</text>
  <text x="48" y="330" font-size="11" fill="#b45309">本项目：YOLOv8 一阶段(anchor-free)为实时；对小目标稍弱 → 用 P2+CBAM 补。</text>
  <defs><marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
