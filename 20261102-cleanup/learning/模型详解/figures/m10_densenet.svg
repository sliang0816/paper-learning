<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="'Microsoft YaHei',sans-serif">
  <rect width="700" height="370" fill="#fff"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">DenseNet：密集连接，每层拼接所有前层（concat）</text>

  <!-- Blocks row y=115-165 -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="18"  y="115" width="68" height="50" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="52" y="136">x₀</text>
    <text x="52" y="155" font-size="9" fill="#6b7280">256 ch</text>

    <rect x="143" y="115" width="74" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="180" y="134">H₁</text>
    <text x="180" y="150" font-size="9" fill="#1d4ed8">in: 256</text>
    <text x="180" y="162" font-size="8.5" fill="#6b7280">out: +32</text>

    <rect x="274" y="115" width="74" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="311" y="134">H₂</text>
    <text x="311" y="150" font-size="9" fill="#1d4ed8">in: 288</text>
    <text x="311" y="162" font-size="8.5" fill="#6b7280">out: +32</text>

    <rect x="405" y="115" width="74" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="442" y="134">H₃</text>
    <text x="442" y="150" font-size="9" fill="#1d4ed8">in: 320</text>
    <text x="442" y="162" font-size="8.5" fill="#6b7280">out: +32</text>

    <rect x="536" y="115" width="74" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="573" y="134">H₄</text>
    <text x="573" y="150" font-size="9" fill="#16a34a">in: 352</text>
    <text x="573" y="162" font-size="8.5" fill="#6b7280">out: +32</text>
  </g>

  <!-- Dense skip arcs above (all 6 connections from x0/H1/H2 to H2/H3/H4) -->
  <g stroke="#16a34a" stroke-width="1.3" fill="none">
    <!-- x0 → H2 -->
    <path d="M86,115 C120,68 258,68 311,113" marker-end="url(#ag)"/>
    <!-- x0 → H3 -->
    <path d="M86,115 C155,50 388,50 442,113" marker-end="url(#ag)"/>
    <!-- x0 → H4 -->
    <path d="M86,115 C190,36 518,36 573,113" marker-end="url(#ag)"/>
    <!-- H1 → H3 -->
    <path d="M217,115 C255,70 390,70 442,113" marker-end="url(#ag)"/>
    <!-- H1 → H4 -->
    <path d="M217,115 C278,52 516,52 573,113" marker-end="url(#ag)"/>
    <!-- H2 → H4 -->
    <path d="M348,115 C388,72 516,72 573,113" marker-end="url(#ag)"/>
  </g>

  <!-- Direct arrows (adjacent blocks) -->
  <g stroke="#374151" stroke-width="1.6" marker-end="url(#a)">
    <line x1="86"  y1="140" x2="141" y2="140"/>
    <line x1="217" y1="140" x2="272" y2="140"/>
    <line x1="348" y1="140" x2="403" y2="140"/>
    <line x1="479" y1="140" x2="534" y2="140"/>
  </g>

  <!-- Green arc legend -->
  <text x="350" y="100" text-anchor="middle" font-size="9.5" fill="#16a34a">↑ 绿弧 = 前面所有层输出全部 concat 给后层（特征复用，输入通道累加）</text>

  <!-- Transition Layer -->
  <rect x="190" y="206" width="320" height="46" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="350" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Transition 层（Dense Block 之间）</text>
  <text x="350" y="244" text-anchor="middle" font-size="10.5" fill="#92400e">1×1 conv（压缩通道）+ 2×2 AvgPool（缩小空间）</text>
  <line x1="350" y1="167" x2="350" y2="204" stroke="#374151" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <!-- Comparison -->
  <rect x="18" y="272" width="664" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="350" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#374151">DenseNet vs ResNet（特征融合方式对比）</text>
  <text x="350" y="311" text-anchor="middle" font-size="10.5" fill="#6b7280">ResNet：x_l = H(x_{l-1}) + x_{l-1}（逐元素相加，通道不变，始终 256）</text>
  <text x="350" y="329" text-anchor="middle" font-size="10.5" fill="#16a34a">DenseNet：x_l = H([x₀,…,x_{l-1}])（concat，通道 256→288→320→352…）</text>
  <text x="350" y="346" text-anchor="middle" font-size="10" fill="#6b7280">省参数，但显存大；YOLOv8 C2f 是 DenseNet concat 思想的轻量化体现</text>

  <defs>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
