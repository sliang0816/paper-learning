<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="740" height="560" fill="#ffffff"/>
  <text x="370" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">1×1 卷积：降的是通道维（深度），空间 H×W 不变</text>

  <!-- ===== 上：体积块对比（宽度 ∝ 通道数） ===== -->
  <text x="370" y="70" text-anchor="middle" font-size="13" fill="#6b7280">方块"宽度"代表通道数，"高度"代表空间 28×28</text>

  <!-- 输入块（宽=256） -->
  <rect x="70" y="92" width="270" height="128" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="205" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">28×28 × 256</text>
  <text x="205" y="84" text-anchor="middle" font-size="12" fill="#1d4ed8">通道 256（宽）</text>

  <!-- 箭头 -->
  <line x1="346" y1="156" x2="404" y2="156" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="375" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">1×1 卷积</text>
  <text x="375" y="178" text-anchor="middle" font-size="11.5" fill="#6b7280">用 64 个核</text>

  <!-- 输出块（宽=64） -->
  <rect x="410" y="92" width="68" height="128" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="444" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">28×28×64</text>
  <text x="444" y="84" text-anchor="middle" font-size="12" fill="#16a34a">通道 64</text>

  <!-- 高度相同标注 -->
  <line x1="500" y1="92" x2="500" y2="220" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="512" y="160" font-size="12" fill="#6b7280">高度(空间)</text>
  <text x="512" y="176" font-size="12" fill="#6b7280">28×28 不变</text>

  <!-- ===== 中：放大一个像素位置 ===== -->
  <rect x="40" y="266" width="660" height="150" rx="10" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="60" y="290" font-size="13.5" font-weight="bold" fill="#374151">放大看「一个像素位置」：1×1 卷积 = 跨通道的加权求和（全连接）</text>

  <!-- 左：256 值 -->
  <text x="150" y="312" text-anchor="middle" font-size="12" fill="#1d4ed8">该位置的 256 个通道值</text>
  <g fill="#93c5fd" stroke="#3b82f6">
    <circle cx="120" cy="332" r="6"/><circle cx="120" cy="350" r="6"/><circle cx="120" cy="368" r="6"/>
    <circle cx="120" cy="386" r="6"/><circle cx="120" cy="404" r="6"/>
  </g>
  <text x="120" y="338" font-size="9" fill="#1e3a8a" text-anchor="middle"></text>
  <text x="148" y="372" font-size="14" fill="#6b7280">⋮ (共256)</text>

  <!-- 连线 fan-in -->
  <g stroke="#34d399" stroke-width="1.2" opacity="0.7">
    <line x1="220" y1="368" x2="430" y2="350"/>
    <line x1="220" y1="368" x2="430" y2="372"/>
    <line x1="220" y1="368" x2="430" y2="394"/>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">加权求和</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#6b7280">（所有像素共享同一组权重）</text>

  <!-- 右：64 值 -->
  <text x="500" y="312" text-anchor="middle" font-size="12" fill="#16a34a">→ 64 个新值</text>
  <g fill="#86efac" stroke="#16a34a">
    <circle cx="450" cy="350" r="6"/><circle cx="450" cy="372" r="6"/><circle cx="450" cy="394" r="6"/>
  </g>
  <text x="478" y="378" font-size="13" fill="#6b7280">⋮ (共64)</text>

  <!-- ===== 下：瓶颈省算账 ===== -->
  <rect x="40" y="430" width="660" height="106" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="60" y="454" font-size="13.5" font-weight="bold" fill="#854d0e">为什么省算？在 28×28×256 上做 5×5 输出 128 通道：</text>
  <text x="70" y="480" font-size="13" fill="#7c2d12">✗ 直接 5×5：　5×5×256×128 = <tspan font-weight="bold">819,200</tspan> 参数</text>
  <text x="70" y="504" font-size="13" fill="#166534">✓ 先 1×1 降到 64 再 5×5：　1×1×256×64 + 5×5×64×128 = 16,384 + 204,800 = <tspan font-weight="bold">221,184</tspan></text>
  <text x="70" y="526" font-size="12.5" font-weight="bold" fill="#b45309">→ 省约 73%（先压瘦通道，再做贵的大核卷积）</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
