<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="450" fill="#fff"/>
  <text x="410" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Faster R-CNN = 骨干 + 两个头：RPN（第一阶段）+ 检测头（第二阶段 = Fast R-CNN 头）</text>
  <text x="410" y="44" text-anchor="middle" font-size="11" fill="#6b7280">通常说的“检测头”指第二阶段那套：RoI Align → FC6/FC7 → 分类 + 回归双头</text>

  <!-- backbone -->
  <rect x="30" y="74" width="120" height="56" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="90" y="98" text-anchor="middle" font-size="11">图像</text><text x="90" y="116" text-anchor="middle" font-size="10" fill="#6b7280">→ 骨干共享卷积</text>
  <line x1="152" y1="102" x2="190" y2="102" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="192" y="74" width="110" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="247" y="98" text-anchor="middle" font-size="11">共享特征图</text><text x="247" y="116" text-anchor="middle" font-size="9.5" fill="#6b7280">两个头都用它</text>

  <!-- branch to RPN (stage1) -->
  <line x1="247" y1="132" x2="247" y2="168" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="150" y="170" width="195" height="74" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="247" y="190" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">① RPN 头（第一阶段）</text>
  <text x="247" y="208" text-anchor="middle" font-size="9.5" fill="#374151">类别无关：2k(前景/背景)+4k(框)</text>
  <text x="247" y="224" text-anchor="middle" font-size="9.5" fill="#374151">滑窗 + anchor → 候选框</text>
  <text x="247" y="239" text-anchor="middle" font-size="9.5" fill="#1d4ed8">输出 ~300 个 proposals</text>

  <!-- proposals feed RoI -->
  <line x1="345" y1="207" x2="392" y2="207" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="368" y="198" text-anchor="middle" font-size="8.5" fill="#7c3aed">候选框</text>

  <!-- detection head (stage2) -->
  <rect x="394" y="150" width="404" height="200" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="596" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">② 检测头（第二阶段 = Fast R-CNN 头，Q58）</text>
  <g font-size="10" text-anchor="middle">
    <rect x="408" y="186" width="120" height="42" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="468" y="204">RoI Align</text><text x="468" y="220" font-size="9" fill="#6b7280">候选框→7×7×512</text>
    <line x1="530" y1="207" x2="556" y2="207" stroke="#9ca3af" marker-end="url(#a)"/>
    <rect x="558" y="186" width="110" height="42" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="613" y="204">FC6 → FC7</text><text x="613" y="220" font-size="9" fill="#6b7280">4096 维向量</text>
    <line x1="670" y1="207" x2="690" y2="195" stroke="#9ca3af" marker-end="url(#a)"/>
    <line x1="670" y1="207" x2="690" y2="232" stroke="#9ca3af" marker-end="url(#a)"/>
  </g>
  <g font-size="9.5" text-anchor="middle">
    <rect x="692" y="178" width="96" height="34" rx="4" fill="#bfdbfe" stroke="#3b82f6"/><text x="740" y="193">分类头</text><text x="740" y="206" font-size="8.5" fill="#374151">K+1 softmax</text>
    <rect x="692" y="218" width="96" height="34" rx="4" fill="#bbf7d0" stroke="#16a34a"/><text x="740" y="233">回归头</text><text x="740" y="246" font-size="8.5" fill="#374151">4(K+1) 类别专属</text>
  </g>
  <text x="596" y="278" text-anchor="middle" font-size="10" fill="#374151">对每个候选框：判“具体哪一类” + “精修框坐标”</text>
  <line x1="596" y1="288" x2="596" y2="308" stroke="#9ca3af" marker-end="url(#a)"/>
  <rect x="506" y="310" width="180" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="596" y="330" text-anchor="middle" font-size="10.5">NMS → 最终检测（类别+框）</text>

  <!-- contrast table -->
  <rect x="30" y="360" width="768" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="380" font-size="11" font-weight="bold" fill="#111827">两个头别混（任务分工）</text>
  <text x="46" y="400" font-size="10" fill="#1d4ed8">RPN 头：类别无关，2(前景/背景)+4(一组框) → 只回答“有没有、大致在哪”（Q60/Q61）</text>
  <text x="46" y="419" font-size="10" fill="#15803d">检测头：类别专属，K+1(含背景)+4(K+1) → 回答“是哪一类、精修框”（Q58）</text>
  <text x="46" y="435" font-size="9.5" fill="#6b7280">Faster R-CNN = RPN（新增）+ Fast R-CNN 检测头（复用），二者共享骨干 → “两阶段”。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
