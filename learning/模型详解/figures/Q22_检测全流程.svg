<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">anchor-based 检测全流程：训练用真值学，推理用 NMS 去重（两阶段分开）</text>

  <!-- 训练列 -->
  <rect x="24" y="44" width="350" height="334" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="199" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">训练阶段（有真值 GT）</text>

  <g font-size="10" text-anchor="middle">
    <rect x="120" y="80" width="158" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="199" y="99">图 → 网格（每格 k 个预设 anchor）</text>
    <rect x="120" y="124" width="158" height="38" rx="6" fill="#fef9c3" stroke="#ca8a04"/><text x="199" y="140">① 用 GT 按 IoU 分配正负样本</text><text x="199" y="155" font-size="8.5" fill="#a16207">一个 GT 可匹配多个 anchor（一对多）</text>
    <rect x="120" y="176" width="158" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="199" y="192">② 正样本学"相对 anchor 偏移"</text><text x="199" y="207" font-size="8.5" fill="#1d4ed8">tx,ty,tw,th，不是绝对坐标</text>
    <rect x="120" y="228" width="158" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="199" y="244">③ 算损失（分类+回归）</text><text x="199" y="257" font-size="8.5" fill="#6d28d9">反向传播更新网络</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.4">
    <line x1="199" y1="110" x2="199" y2="122" marker-end="url(#g)"/>
    <line x1="199" y1="162" x2="199" y2="174" marker-end="url(#g)"/>
    <line x1="199" y1="214" x2="199" y2="226" marker-end="url(#g)"/>
  </g>
  <rect x="44" y="276" width="310" height="92" rx="8" fill="#fff" stroke="#bbf7d0"/>
  <text x="60" y="298" font-size="10.5" font-weight="bold" fill="#15803d">关键：这一步才用真值 GT</text>
  <text x="60" y="316" font-size="10" fill="#374151">• 一对多分配 = 为保证正样本充足、好训练</text>
  <text x="60" y="333" font-size="10" fill="#374151">• 学的是"怎么从 anchor 挪到 GT"（偏移量）</text>
  <text x="60" y="350" font-size="10" fill="#b45309">• 这里没有 NMS（NMS 不参与训练）</text>
  <text x="60" y="365" font-size="9" fill="#6b7280">anchor-free（YOLOv8）：去掉预设框，每格直接预测中心+宽高</text>

  <!-- 推理列 -->
  <rect x="386" y="44" width="350" height="334" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="561" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">推理阶段（无真值）</text>

  <g font-size="10" text-anchor="middle">
    <rect x="482" y="80" width="158" height="30" rx="6" fill="#fff" stroke="#3b82f6"/><text x="561" y="99">图 → 网格（同样 k 个 anchor）</text>
    <rect x="482" y="124" width="158" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="561" y="140">预测每个 anchor 的偏移+类别分</text><text x="561" y="153" font-size="8.5" fill="#1d4ed8">解码偏移 → 实际框</text>
    <rect x="482" y="172" width="158" height="34" rx="6" fill="#fee2e2" stroke="#ef4444"/><text x="561" y="188">稠密框（同一目标多个重复）</text><text x="561" y="201" font-size="8.5" fill="#b91c1c">一对多的"后遗症"</text>
    <rect x="482" y="220" width="158" height="30" rx="6" fill="#fff" stroke="#6366f1"/><text x="561" y="239">置信度阈值过滤</text>
    <rect x="482" y="262" width="158" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="561" y="278">④ NMS 去重</text><text x="561" y="291" font-size="8.5" fill="#4338ca">一个目标只留最自信的框</text>
    <rect x="482" y="310" width="158" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="561" y="328">最终结果（框+类别+分数）</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.4">
    <line x1="561" y1="110" x2="561" y2="122" marker-end="url(#b)"/>
    <line x1="561" y1="158" x2="561" y2="170" marker-end="url(#b)"/>
    <line x1="561" y1="206" x2="561" y2="218" marker-end="url(#b)"/>
    <line x1="561" y1="250" x2="561" y2="260" marker-end="url(#b)"/>
    <line x1="561" y1="296" x2="561" y2="308" marker-end="url(#b)"/>
  </g>
  <text x="561" y="358" text-anchor="middle" font-size="10" fill="#b45309">关键：这里才用 NMS（没有 GT 可对比，只能靠重叠去重）</text>
  <text x="561" y="372" text-anchor="middle" font-size="9" fill="#6b7280">你说的"多个 anchor 和同一标注重合 → NMS 消除"发生在这一列</text>

  <defs>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
