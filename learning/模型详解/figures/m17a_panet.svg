<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="400" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">PANet：FPN 自顶向下 + 新增自底向上增强路径</text>

  <!-- ===== LEFT: FPN (top-down only) ===== -->
  <text x="155" y="52" text-anchor="middle" font-size="11.5" fill="#374151" font-weight="bold">FPN（原有，自顶向下）</text>

  <!-- FPN backbone features (bottom to top: small stride = large feature) -->
  <!-- C5(small) → C4 → C3 → C2(large) in backbone -->
  <!-- P5 → P4 → P3 → P2 after FPN (top-down) -->

  <g font-size="10" text-anchor="middle">
    <!-- C5 backbone -->
    <rect x="20" y="70" width="80" height="38" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="60" y="92">C5 (backbone)</text>
    <!-- P5 -->
    <rect x="140" y="70" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="180" y="88">P5</text><text x="180" y="102" font-size="8.5" fill="#6b7280">stride 32</text>

    <!-- C4 -->
    <rect x="20" y="140" width="80" height="38" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="60" y="162">C4</text>
    <!-- P4 -->
    <rect x="140" y="140" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="180" y="158">P4</text><text x="180" y="172" font-size="8.5" fill="#6b7280">stride 16</text>

    <!-- C3 -->
    <rect x="20" y="210" width="80" height="38" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="60" y="232">C3</text>
    <!-- P3 -->
    <rect x="140" y="210" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="180" y="228">P3</text><text x="180" y="242" font-size="8.5" fill="#6b7280">stride 8</text>

    <!-- C2 -->
    <rect x="20" y="280" width="80" height="38" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="60" y="302">C2</text>
    <!-- P2 -->
    <rect x="140" y="280" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="180" y="298">P2</text><text x="180" y="312" font-size="8.5" fill="#6b7280">stride 4</text>
  </g>

  <!-- C backbone arrows (top-down lateral) -->
  <g stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ag)">
    <line x1="100" y1="89" x2="138" y2="89"/>
    <line x1="100" y1="159" x2="138" y2="159"/>
    <line x1="100" y1="229" x2="138" y2="229"/>
    <line x1="100" y1="299" x2="138" y2="299"/>
  </g>
  <!-- top-down merging (P5→P4→P3→P2) -->
  <g stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)">
    <line x1="180" y1="108" x2="180" y2="138"/>
    <line x1="180" y1="178" x2="180" y2="208"/>
    <line x1="180" y1="248" x2="180" y2="278"/>
  </g>
  <text x="196" y="128" font-size="9" fill="#3b82f6">↓ upsample</text>
  <text x="196" y="198" font-size="9" fill="#3b82f6">↓ upsample</text>
  <text x="196" y="268" font-size="9" fill="#3b82f6">↓ upsample</text>

  <!-- long path annotation -->
  <text x="155" y="350" text-anchor="middle" font-size="9" fill="#ef4444">⚠ C2特征到P5: >100层，信息路径长</text>

  <!-- divider -->
  <line x1="310" y1="40" x2="310" y2="380" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="320" y="48" font-size="10.5" fill="#6b7280">→ PANet 新增 ↓</text>

  <!-- ===== RIGHT: PANet adds bottom-up path ===== -->
  <text x="565" y="52" text-anchor="middle" font-size="11.5" fill="#374151" font-weight="bold">PANet = FPN + 自底向上增强</text>

  <g font-size="10" text-anchor="middle">
    <!-- N2 (from P2) -->
    <rect x="360" y="280" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="400" y="298">N2 = P2</text><text x="400" y="312" font-size="8.5" fill="#6b7280">stride 4</text>

    <!-- N3 -->
    <rect x="360" y="210" width="80" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="400" y="228">N3</text><text x="400" y="242" font-size="8.5" fill="#15803d">stride 8</text>

    <!-- N4 -->
    <rect x="360" y="140" width="80" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="400" y="158">N4</text><text x="400" y="172" font-size="8.5" fill="#15803d">stride 16</text>

    <!-- N5 -->
    <rect x="360" y="70" width="80" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="400" y="88">N5</text><text x="400" y="102" font-size="8.5" fill="#15803d">stride 32</text>

    <!-- P' copies (top-down pass results) -->
    <rect x="490" y="70" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="530" y="88">P5'</text>
    <rect x="490" y="140" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="530" y="158">P4'</text>
    <rect x="490" y="210" width="80" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="530" y="228">P3'</text>
  </g>

  <!-- FPN top-down still exists -->
  <g stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#ab)">
    <line x1="530" y1="108" x2="530" y2="138"/>
    <line x1="530" y1="178" x2="530" y2="208"/>
  </g>
  <!-- laterals from P' to N -->
  <g stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ag)">
    <line x1="488" y1="89" x2="442" y2="89"/>
    <line x1="488" y1="159" x2="442" y2="159"/>
    <line x1="488" y1="229" x2="442" y2="229"/>
  </g>

  <!-- bottom-up augmentation (N2→N3→N4→N5) GREEN arrows -->
  <g stroke="#16a34a" stroke-width="2.5" marker-end="url(#agg)">
    <line x1="400" y1="278" x2="400" y2="250"/>
    <line x1="400" y1="208" x2="400" y2="180"/>
    <line x1="400" y1="138" x2="400" y2="110"/>
  </g>
  <text x="452" y="268" font-size="9.5" fill="#16a34a">↑ stride 2</text>
  <text x="452" y="198" font-size="9.5" fill="#16a34a">↑ stride 2</text>
  <text x="452" y="128" font-size="9.5" fill="#16a34a">↑ stride 2</text>

  <!-- output N2-N5 to detection -->
  <g stroke="#374151" stroke-width="1.4" marker-end="url(#a)">
    <line x1="440" y1="89" x2="590" y2="89"/>
    <line x1="440" y1="159" x2="590" y2="159"/>
    <line x1="440" y1="229" x2="590" y2="229"/>
    <line x1="440" y1="299" x2="590" y2="299"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#374151">
    <text x="650" y="92">→ 检测 (small)</text>
    <text x="650" y="162">→ 检测</text>
    <text x="650" y="232">→ 检测</text>
    <text x="650" y="302">→ 检测 (large)</text>
  </g>

  <!-- short path annotation -->
  <text x="400" y="350" text-anchor="middle" font-size="9" fill="#16a34a">✓ N2特征到N5: 仅约 10 层，信息路径大幅缩短</text>

  <!-- legend -->
  <rect x="20" y="370" width="780" height="24" rx="4" fill="#f8fafc"/>
  <text x="410" y="386" text-anchor="middle" font-size="10" fill="#374151">蓝色自顶向下 = FPN（语义信息从深层流向浅层）　绿色自底向上 = PANet 新增（细粒度定位信息从浅层流向深层）　两路融合 → N2~N5 送检测头</text>

  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9ca3af"/></marker>
    <marker id="agg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
