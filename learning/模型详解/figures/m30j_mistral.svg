<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="350" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Mistral 7B / Mixtral 8×7B：滑动窗口注意力 + 稀疏 MoE（2023）</text>

  <!-- ===== LEFT: SWA vs Full Attention ===== -->
  <text x="138" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">滑动窗口注意力（SWA）</text>
  <rect x="20" y="56" width="236" height="270" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>

  <!-- Full Attention -->
  <text x="78" y="74" text-anchor="middle" font-size="9.5" fill="#ef4444">全局注意力 O(n²)</text>
  <rect x="32" y="78" width="92" height="92" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <!-- Attention matrix cells: all attended -->
  <g fill="#fca5a5" stroke="#ef4444" stroke-width="0.5">
    <rect x="34" y="80" width="11" height="11"/><rect x="47" y="80" width="11" height="11"/><rect x="60" y="80" width="11" height="11"/><rect x="73" y="80" width="11" height="11"/><rect x="86" y="80" width="11" height="11"/><rect x="99" y="80" width="11" height="11"/>
    <rect x="34" y="93" width="11" height="11"/><rect x="47" y="93" width="11" height="11"/><rect x="60" y="93" width="11" height="11"/><rect x="73" y="93" width="11" height="11"/><rect x="86" y="93" width="11" height="11"/><rect x="99" y="93" width="11" height="11"/>
    <rect x="34" y="106" width="11" height="11"/><rect x="47" y="106" width="11" height="11"/><rect x="60" y="106" width="11" height="11"/><rect x="73" y="106" width="11" height="11"/><rect x="86" y="106" width="11" height="11"/>
    <rect x="34" y="119" width="11" height="11"/><rect x="47" y="119" width="11" height="11"/><rect x="60" y="119" width="11" height="11"/><rect x="73" y="119" width="11" height="11"/>
    <rect x="34" y="132" width="11" height="11"/><rect x="47" y="132" width="11" height="11"/><rect x="60" y="132" width="11" height="11"/>
    <rect x="34" y="145" width="11" height="11"/><rect x="47" y="145" width="11" height="11"/>
  </g>
  <text x="78" y="180" text-anchor="middle" font-size="8.5" fill="#ef4444">n×n 矩阵，KV Cache 随 n 线性增长</text>

  <!-- Arrow -->
  <text x="132" y="125" text-anchor="middle" font-size="16" fill="#374151">→</text>

  <!-- SWA -->
  <text x="190" y="74" text-anchor="middle" font-size="9.5" fill="#16a34a">SWA（窗口 w=4096）</text>
  <rect x="144" y="78" width="92" height="92" rx="3" fill="#f0fdf4" stroke="#16a34a"/>
  <!-- Only diagonal band attended -->
  <g fill="#e5e7eb" stroke="#d1d5db" stroke-width="0.5">
    <!-- Unattended cells: light gray -->
    <rect x="146" y="80" width="11" height="11"/><rect x="159" y="80" width="11" height="11"/><rect x="172" y="80" width="11" height="11"/><rect x="185" y="80" width="11" height="11"/><rect x="198" y="80" width="11" height="11"/>
    <rect x="159" y="93" width="11" height="11"/><rect x="172" y="93" width="11" height="11"/><rect x="185" y="93" width="11" height="11"/><rect x="198" y="93" width="11" height="11"/>
    <rect x="172" y="106" width="11" height="11"/><rect x="185" y="106" width="11" height="11"/><rect x="198" y="106" width="11" height="11"/>
    <rect x="185" y="119" width="11" height="11"/><rect x="198" y="119" width="11" height="11"/>
    <rect x="198" y="132" width="11" height="11"/>
  </g>
  <!-- Attended cells: green diagonal band (window=3 for illustration) -->
  <g fill="#86efac" stroke="#16a34a" stroke-width="0.5">
    <rect x="146" y="93" width="11" height="11"/><rect x="146" y="106" width="11" height="11"/><rect x="146" y="119" width="11" height="11"/>
    <rect x="159" y="106" width="11" height="11"/><rect x="159" y="119" width="11" height="11"/><rect x="159" y="132" width="11" height="11"/>
    <rect x="172" y="119" width="11" height="11"/><rect x="172" y="132" width="11" height="11"/><rect x="172" y="145" width="11" height="11"/>
    <rect x="185" y="132" width="11" height="11"/><rect x="185" y="145" width="11" height="11"/>
    <rect x="198" y="145" width="11" height="11"/>
  </g>
  <!-- Diagonal self-attend -->
  <g fill="#4ade80" stroke="#16a34a" stroke-width="0.8">
    <rect x="146" y="80" width="11" height="11"/><rect x="159" y="93" width="11" height="11"/>
    <rect x="172" y="106" width="11" height="11"/><rect x="185" y="119" width="11" height="11"/>
    <rect x="198" y="132" width="11" height="11"/>
  </g>
  <text x="190" y="180" text-anchor="middle" font-size="8.5" fill="#16a34a">只看窗口内；KV Cache 固定为 O(w)</text>

  <!-- Multi-layer receptive field -->
  <rect x="32" y="188" width="204" height="52" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="134" y="204" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">多层感受野：局部 × 层数 = 全局</text>
  <text x="134" y="219" text-anchor="middle" font-size="9.5" fill="#374151">第 L 层感受野 = L × w</text>
  <text x="134" y="232" text-anchor="middle" font-size="9" fill="#374151">Mistral 32层 × 4096 = 131K token</text>

  <!-- Rolling buffer -->
  <rect x="32" y="246" width="204" height="70" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="134" y="261" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8">Rolling Buffer KV Cache</text>
  <text x="134" y="276" text-anchor="middle" font-size="9" fill="#374151">缓存大小固定 = w（循环覆盖）</text>
  <text x="134" y="290" text-anchor="middle" font-size="9" fill="#374151">位置 i 存入槽 (i mod w)</text>
  <text x="134" y="305" text-anchor="middle" font-size="9" fill="#16a34a">32K 序列的 KV 内存 ≈ 4K 序列</text>
  <text x="134" y="316" text-anchor="middle" font-size="8.5" fill="#6b7280">（旧 K/V 被新值覆盖，无需增长）</text>

  <!-- ===== CENTER: Mixtral MoE ===== -->
  <text x="430" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Mixtral 8×7B：稀疏 MoE</text>
  <rect x="268" y="56" width="324" height="270" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- Input token -->
  <rect x="356" y="68" width="148" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="430" y="84" text-anchor="middle" font-size="10">输入 token x</text>

  <line x1="430" y1="92" x2="430" y2="106" stroke="#374151" stroke-width="1.4" marker-end="url(#moa)"/>

  <!-- Router -->
  <rect x="340" y="106" width="180" height="30" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="430" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">Router：g = softmax(x·Wg)</text>
  <text x="430" y="133" text-anchor="middle" font-size="9" fill="#374151">输出 8 个专家的权重得分</text>

  <!-- 8 experts -->
  <text x="430" y="150" text-anchor="middle" font-size="9" fill="#6b7280">Top-2 专家（得分最高的 2 个）</text>

  <!-- Expert boxes: 8 experts, 2 highlighted -->
  <g>
    <rect x="280" y="156" width="36" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="298" y="174" text-anchor="middle" font-size="7.5" fill="#6b7280">E₁</text>
    <rect x="320" y="156" width="36" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="338" y="174" text-anchor="middle" font-size="7.5" fill="#6b7280">E₂</text>
    <!-- Expert 3: selected (highlighted) -->
    <rect x="360" y="152" width="38" height="36" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="379" y="171" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b45309">E₃</text>
    <text x="379" y="182" text-anchor="middle" font-size="7" fill="#b45309">selected</text>
    <rect x="402" y="156" width="36" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="420" y="174" text-anchor="middle" font-size="7.5" fill="#6b7280">E₄</text>
    <!-- Expert 5: selected (highlighted) -->
    <rect x="442" y="152" width="38" height="36" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="461" y="171" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b45309">E₅</text>
    <text x="461" y="182" text-anchor="middle" font-size="7" fill="#b45309">selected</text>
    <rect x="484" y="156" width="36" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="502" y="174" text-anchor="middle" font-size="7.5" fill="#6b7280">E₆</text>
    <rect x="524" y="156" width="36" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="542" y="174" text-anchor="middle" font-size="7.5" fill="#6b7280">E₇</text>
    <rect x="284" y="198" width="36" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="302" y="216" text-anchor="middle" font-size="7.5" fill="#6b7280">E₈</text>
  </g>

  <!-- Weighted sum -->
  <rect x="340" y="204" width="180" height="38" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="430" y="219" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">加权合并（Top-2）</text>
  <text x="430" y="233" text-anchor="middle" font-size="9.5" fill="#374151">out = g₃·E₃(x) + g₅·E₅(x)</text>

  <line x1="430" y1="242" x2="430" y2="256" stroke="#374151" stroke-width="1.4" marker-end="url(#moa)"/>

  <!-- Key stats box -->
  <rect x="296" y="256" width="268" height="58" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="430" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">Mixtral 8×7B 关键数字</text>
  <text x="430" y="287" text-anchor="middle" font-size="9.5" fill="#374151">总参数：46.7B（8 专家×7B，减去共享层）</text>
  <text x="430" y="302" text-anchor="middle" font-size="9.5" fill="#374151">激活参数：12.9B（每 token 仅 2 专家参与计算）</text>
  <text x="430" y="315" text-anchor="middle" font-size="9" fill="#16a34a">推理速度 ≈ 12.9B 密集模型，性能超 LLaMA 2-70B</text>

  <!-- ===== RIGHT: Comparison ===== -->
  <text x="700" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">性能对比</text>
  <rect x="604" y="56" width="196" height="270" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>

  <!-- comparison table -->
  <rect x="614" y="68" width="176" height="172" rx="5" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="702" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">MMLU 对比</text>
  <g font-size="9" fill="#374151">
    <text x="622" y="99" font-weight="bold">模型（参数）</text>           <text x="760" y="99" font-weight="bold">得分</text>
    <line x1="616" y1="102" x2="782" y2="102" stroke="#d1d5db" stroke-width="0.8"/>
    <text x="622" y="116">LLaMA 2-7B (7B)</text>      <text x="760" y="116">45.3</text>
    <text x="622" y="132" fill="#16a34a" font-weight="bold">Mistral 7B (7B)</text>  <text x="760" y="132" fill="#16a34a" font-weight="bold">60.1 ↑</text>
    <text x="622" y="148">LLaMA 2-13B (13B)</text>    <text x="760" y="148">54.8</text>
    <text x="622" y="164">LLaMA 2-70B (70B)</text>    <text x="760" y="164">68.9</text>
    <text x="622" y="180" fill="#7c3aed" font-weight="bold">Mixtral 8×7B</text>
    <text x="622" y="192" fill="#7c3aed" font-weight="bold">  (12.9B 激活)</text>  <text x="760" y="184" fill="#7c3aed" font-weight="bold">70.6 ↑</text>
  </g>
  <line x1="614" y1="198" x2="784" y2="198" stroke="#d1d5db"/>
  <text x="702" y="212" text-anchor="middle" font-size="8.5" fill="#16a34a">7B Mistral 超过 13B LLaMA 2</text>
  <text x="702" y="224" text-anchor="middle" font-size="8.5" fill="#7c3aed">Mixtral 超过 70B LLaMA 2</text>

  <!-- LLaMA relationship -->
  <rect x="614" y="240" width="176" height="74" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="702" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">对 LLaMA 的扩展</text>
  <text x="622" y="271" font-size="8.5" fill="#374151">· 共享架构基础</text>
  <text x="622" y="284" font-size="8.5" fill="#374151">  (RMSNorm/SwiGLU/RoPE)</text>
  <text x="622" y="297" font-size="8.5" fill="#374151">· 新增：SWA (Mistral)</text>
  <text x="622" y="310" font-size="8.5" fill="#374151">· 新增：稀疏 MoE (Mixtral)</text>

  <!-- Bottom note -->
  <rect x="20" y="334" width="780" height="12" rx="3" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="410" y="343" text-anchor="middle" font-size="8.5" fill="#374151">SWA：局部窗口注意力 × 多层 = 全局感受野，KV Cache 大小固定；MoE：总参数多、激活参数少，兼顾容量与推理速度；两思路均已被后续模型（DeepSeek/Qwen-MoE）广泛采用</text>

  <defs>
    <marker id="moa" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
  </defs>
</svg>
