<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" font-family="'Microsoft YaHei',sans-serif">
  <rect width="850" height="540" fill="#fff"/>
  <text x="425" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Faster R-CNN 更准，只是因为“第二阶段逐区域 FC 精修”吗？——一半对</text>
  <text x="425" y="44" text-anchor="middle" font-size="11" fill="#6b7280">两阶段的精度优势靠两根柱子：① 逐区域精修（你说的）+ ② RPN 预筛带来的样本均衡（常被忽略）</text>

  <!-- Pillar A -->
  <rect x="24" y="62" width="390" height="180" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="40" y="84" font-size="13" font-weight="bold" fill="#15803d">柱①　逐区域精修（你说对的一半）</text>
  <text x="40" y="108" font-size="10.5" fill="#374151"><tspan font-weight="bold">a. 由粗到细，框回归两次</tspan></text>
  <text x="54" y="125" font-size="10" fill="#374151">RPN 先出粗框 → 检测头再修一次</text>
  <text x="54" y="140" font-size="10" fill="#374151">两步精修 比单阶段“一次到位”更准</text>
  <text x="40" y="164" font-size="10.5" fill="#374151"><tspan font-weight="bold">b. RoI 对齐的“聚焦特征”</tspan></text>
  <text x="54" y="181" font-size="10" fill="#374151">RoI Align 把每个候选抠成规整 7×7、</text>
  <text x="54" y="196" font-size="10" fill="#374151">对准目标的特征——比单阶段“在共享</text>
  <text x="54" y="211" font-size="10" fill="#374151">特征图某点直接预测”更专注（尤利小目标）</text>
  <text x="40" y="232" font-size="9" fill="#6b7280">→ 这部分确实让两阶段更准</text>

  <!-- Pillar B -->
  <rect x="436" y="62" width="390" height="180" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="452" y="84" font-size="13" font-weight="bold" fill="#1e40af">柱②　样本均衡（常被忽略，可能更大）</text>
  <text x="452" y="108" font-size="10.5" fill="#374151"><tspan font-weight="bold">单阶段：</tspan>在所有网格/anchor 稠密预测</text>
  <text x="466" y="125" font-size="10" fill="#374151">一张图海量背景框 → <tspan font-weight="bold" fill="#b91c1c">极端正负不平衡</tspan></text>
  <text x="466" y="140" font-size="10" fill="#374151">分类被背景淹没，学不准</text>
  <text x="452" y="164" font-size="10.5" fill="#374151"><tspan font-weight="bold">两阶段：</tspan>RPN 先滤掉绝大多数背景</text>
  <text x="466" y="181" font-size="10" fill="#374151">第二阶段只对 ~300 候选精算</text>
  <text x="466" y="196" font-size="10" fill="#374151">（还做 1:3 正负采样）→ <tspan font-weight="bold" fill="#15803d">天然均衡</tspan></text>
  <text x="466" y="211" font-size="10" fill="#374151">分类/回归在干净样本上学得更准</text>
  <text x="452" y="232" font-size="9" fill="#6b7280">→ 这块贡献常被低估</text>

  <!-- key evidence -->
  <rect x="24" y="256" width="802" height="106" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="40" y="278" font-size="13" font-weight="bold" fill="#b45309">关键证据：RetinaNet 直接回答了“是不是因为 FC 精修”</text>
  <text x="40" y="300" font-size="10.5" fill="#374151">RetinaNet 是<tspan font-weight="bold">单阶段</tspan>——<tspan font-weight="bold">没有第二阶段、没有逐区域 FC 精修</tspan>，只用 <tspan font-weight="bold" fill="#b45309">Focal Loss</tspan> 解决了“正负不平衡”（柱②）。</text>
  <text x="40" y="320" font-size="10.5" fill="#374151">结果：精度<tspan font-weight="bold">追平了两阶段</tspan>。</text>
  <text x="40" y="344" font-size="10.5" fill="#b91c1c">⇒ 若“FC 精修”是唯一原因，单阶段不该靠改损失就追上。说明两阶段优势里，“治不平衡”这块占了很大份额，不全是精修。</text>

  <!-- project -->
  <rect x="24" y="376" width="802" height="142" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="40" y="398" font-size="13" font-weight="bold" fill="#6d28d9">与本项目：YOLOv8 单阶段，如何“补回”两阶段的这两块优势</text>
  <text x="40" y="420" font-size="10.5" fill="#374151">本项目要<tspan font-weight="bold">实时（&lt;100ms）</tspan>，选单阶段 YOLOv8，主动放弃了两阶段的逐区域精修红利——但用别的手段补：</text>

  <rect x="44" y="432" width="370" height="74" rx="6" fill="#fff" stroke="#c4b5fd"/>
  <text x="229" y="452" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">补“柱① 特征质量”</text>
  <text x="229" y="471" text-anchor="middle" font-size="9.5" fill="#374151">P2 浅层特征（小目标）+ CBAM 注意力</text>
  <text x="229" y="487" text-anchor="middle" font-size="9.5" fill="#374151">让特征更聚焦目标，替代 RoI 对齐的作用</text>
  <text x="229" y="501" text-anchor="middle" font-size="8.5" fill="#6b7280">＝创新点 1 改进检测头</text>

  <rect x="436" y="432" width="370" height="74" rx="6" fill="#fff" stroke="#c4b5fd"/>
  <text x="621" y="452" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">补“柱② 样本均衡”</text>
  <text x="621" y="471" text-anchor="middle" font-size="9.5" fill="#374151">现代标签分配（TaskAligned）+ 损失设计</text>
  <text x="621" y="487" text-anchor="middle" font-size="9.5" fill="#374151">在单阶段框架里处理正负不平衡</text>
  <text x="621" y="501" text-anchor="middle" font-size="8.5" fill="#6b7280">＝Focal Loss 一脉的思路</text>
</svg>
