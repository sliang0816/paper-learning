<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Microsoft YaHei',sans-serif">
  <rect width="900" height="580" fill="#fff"/>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q76 L 层为何能“精修”——光加非线性不够，靠结构 + 深监督把容量导向精修</text>

  <!-- misconception strip -->
  <rect x="20" y="40" width="860" height="44" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="450" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">误区：多堆几层 = 多点非线性 = 更强 ⟶ 但“容量”≠“精修”</text>
  <text x="450" y="77" text-anchor="middle" font-size="9.5" fill="#374151">非线性/深度只是“能学复杂函数”的底座；随便堆 6 个异质 FC 不会天然变成“逐层把框修准”</text>

  <!-- three pillars -->
  <text x="450" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">把容量导向“精修”的三个机制</text>

  <!-- pillar 1 -->
  <rect x="20" y="118" width="280" height="150" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="160" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">① 迭代结构（重复同操作）</text>
  <text x="34" y="158" font-size="9" fill="#374151">6 层是<tspan font-weight="bold">同一种操作</tspan>重复：</text>
  <text x="34" y="173" font-size="9" fill="#374151">自注意力 + 交叉注意力 + FFN</text>
  <text x="34" y="191" font-size="9" fill="#374151">= 把一个<tspan font-weight="bold">迭代更新展开 6 步</tspan></text>
  <text x="34" y="206" font-size="9" fill="#374151">（像把循环 unroll 成 6 层）</text>
  <text x="34" y="226" font-size="9" fill="#b45309">“重复同操作”本身=精修的</text>
  <text x="34" y="241" font-size="9" fill="#b45309">结构含义：每步用上步结果再算</text>
  <text x="34" y="260" font-size="8.5" fill="#6b7280">≠ 一堆杂乱异质深层</text>

  <!-- pillar 2 -->
  <rect x="310" y="118" width="280" height="150" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="450" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">② 再注意 + 参考框残差</text>
  <text x="324" y="158" font-size="9" fill="#374151">L1：query 懵 → 注意力散、框粗</text>
  <text x="324" y="174" font-size="9" fill="#374151">→ 更新成“更懂物体在哪”的 query</text>
  <text x="324" y="190" font-size="9" fill="#374151">L2：用更好 query <tspan font-weight="bold">重新查图</tspan></text>
  <text x="324" y="206" font-size="9" fill="#374151">→ 注意力落更准 → 框更准…</text>
  <text x="324" y="228" font-size="9" fill="#1e40af">DINO/Deformable 显式：</text>
  <text x="324" y="244" font-size="10" font-weight="bold" fill="#1e40af">框_{l+1} = 框_l + Δ_l</text>
  <text x="324" y="261" font-size="8.5" fill="#6b7280">残差微调 = “精修”的字面实现</text>

  <!-- pillar 3 -->
  <rect x="600" y="118" width="280" height="150" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">③ 深监督（每层接损失）</text>
  <text x="614" y="158" font-size="9" fill="#15803d">← 这才是你问的“因为损失”</text>
  <text x="614" y="176" font-size="9" fill="#374151">每层解码器后都接预测头</text>
  <text x="614" y="192" font-size="9" fill="#374151">+ 匈牙利损失（辅助损失）</text>
  <text x="614" y="210" font-size="9" fill="#374151">→ 逼<tspan font-weight="bold">每个中间层都输出像样框</tspan></text>
  <text x="614" y="228" font-size="9" fill="#374151">→ 每层被钉上“比上层更准”</text>
  <text x="614" y="246" font-size="9" fill="#15803d">→ 层间形成由粗到细的阶梯</text>
  <text x="614" y="262" font-size="8.5" fill="#b91c1c">没它：中间层只是隐特征、无精修压力</text>

  <!-- ladder visualization -->
  <rect x="20" y="284" width="860" height="120" rx="8" fill="#f0f9ff" stroke="#93c5fd"/>
  <text x="450" y="304" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">每层都被损失盯着 → 框逐层收紧（粗→细的阶梯）</text>
  <g>
    <rect x="60" y="318" width="64" height="64" fill="#fff" stroke="#93c5fd"/>
    <rect x="70" y="326" width="48" height="46" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="92" y="396" text-anchor="middle" font-size="8.5" fill="#374151">L1+损失</text>
  </g>
  <text x="135" y="352" font-size="12" fill="#9ca3af">→</text>
  <g>
    <rect x="160" y="318" width="64" height="64" fill="#fff" stroke="#93c5fd"/>
    <rect x="174" y="330" width="36" height="38" fill="none" stroke="#fb923c" stroke-width="2"/>
    <text x="192" y="396" text-anchor="middle" font-size="8.5" fill="#374151">L2+损失</text>
  </g>
  <text x="235" y="352" font-size="12" fill="#9ca3af">→</text>
  <g>
    <rect x="260" y="318" width="64" height="64" fill="#fff" stroke="#93c5fd"/>
    <rect x="276" y="333" width="28" height="30" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="292" y="396" text-anchor="middle" font-size="8.5" fill="#374151">L3–L5+损失</text>
  </g>
  <text x="335" y="352" font-size="12" fill="#9ca3af">→</text>
  <g>
    <rect x="360" y="318" width="64" height="64" fill="#fff" stroke="#93c5fd"/>
    <rect x="376" y="337" width="22" height="22" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="392" y="396" text-anchor="middle" font-size="8.5" fill="#15803d">L6 贴合</text>
  </g>
  <text x="640" y="340" text-anchor="middle" font-size="9" fill="#374151">每步：用上层更好的 query 重新注意 + 预测残差 Δ 微调框</text>
  <text x="640" y="358" text-anchor="middle" font-size="9" fill="#374151">+ 该层损失把它钉准 → 下一层接着修</text>
  <text x="640" y="378" text-anchor="middle" font-size="8.5" fill="#6b7280">原版 DETR：隐式（堆叠再注意+每层辅助损失，注意力图逐层变尖）</text>
  <text x="640" y="392" text-anchor="middle" font-size="8.5" fill="#6b7280">Deformable/DAB/DINO：显式（参考框逐层残差更新）</text>

  <!-- bottom conclusion -->
  <rect x="20" y="416" width="860" height="140" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="450" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">所以“是因为损失函数吗？”——是一环，不是全部</text>
  <text x="40" y="462" font-size="9.5" fill="#374151">· 只有损失、没有“重复同操作+再注意+残差框”的<tspan font-weight="bold">结构</tspan> → 有目标却没有逐层精修的机制</text>
  <text x="40" y="482" font-size="9.5" fill="#374151">· 只有结构、没有<tspan font-weight="bold">深监督损失</tspan> → 中间层学不到“输出渐准的框”，精修退化成普通深层</text>
  <text x="40" y="502" font-size="9.5" fill="#374151">· <tspan font-weight="bold">非线性/深度</tspan>只提供<tspan font-weight="bold">表达力底座</tspan>（必要不充分）</text>
  <line x1="40" y1="512" x2="860" y2="512" stroke="#c4b5fd"/>
  <text x="450" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">非线性给“能力”；迭代+再注意+残差给“精修的动作”；每层损失给“精修的方向和目标”——三者缺一不可</text>
  <text x="450" y="548" text-anchor="middle" font-size="9" fill="#6b7280">层数加的是“能力”，把能力变成“精修”的是“重复同一种带再注意的更新”结构 + “每层被损失盯着要更准”的深监督</text>
</svg>
