<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="360" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">DeiT：用知识蒸馏 + Token 训练数据高效 ViT</text>

  <!-- ===== ViT baseline (left) ===== -->
  <text x="170" y="52" text-anchor="middle" font-size="11.5" fill="#ef4444" font-weight="bold">原 ViT（需 JFT-300M 大数据）</text>

  <rect x="50" y="62" width="240" height="150" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="5 3"/>
  <text x="170" y="88" text-anchor="middle" font-size="10.5" fill="#991b1b">ImageNet（1.3M）</text>
  <text x="170" y="106" text-anchor="middle" font-size="10" fill="#6b7280">→ ViT-B/16 Top-1 仅 74.6%</text>
  <text x="170" y="122" text-anchor="middle" font-size="10.5" fill="#991b1b">需要 JFT-300M（3亿图片）</text>
  <text x="170" y="140" text-anchor="middle" font-size="10" fill="#6b7280">→ ViT-B/16 Top-1 86.7%</text>
  <text x="170" y="162" text-anchor="middle" font-size="10" fill="#6b7280">普通研究者无法复现</text>
  <text x="170" y="185" text-anchor="middle" font-size="9.5" fill="#b91c1c">× 没有 JFT 就精度差</text>

  <!-- ===== DeiT (right) ===== -->
  <text x="620" y="52" text-anchor="middle" font-size="11.5" fill="#16a34a" font-weight="bold">DeiT（仅 ImageNet）</text>

  <!-- Teacher box -->
  <rect x="460" y="62" width="150" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="535" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Teacher 模型</text>
  <text x="535" y="98" text-anchor="middle" font-size="10" fill="#92400e">RegNet（CNN）</text>
  <text x="535" y="114" text-anchor="middle" font-size="9.5" fill="#6b7280">无蒸馏训练好的强模型</text>

  <!-- DeiT student box -->
  <rect x="630" y="62" width="160" height="160" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="710" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">DeiT Student</text>
  <text x="710" y="100" text-anchor="middle" font-size="10" fill="#1d4ed8">ViT-S/16 / ViT-B/16</text>

  <!-- Tokens inside DeiT -->
  <rect x="646" y="112" width="60" height="30" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="676" y="131" text-anchor="middle" font-size="9.5">[CLS]</text>
  <rect x="712" y="112" width="70" height="30" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="747" y="127" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">[DIST]</text>
  <text x="747" y="141" text-anchor="middle" font-size="8.5" fill="#b45309">蒸馏 Token</text>

  <text x="710" y="168" text-anchor="middle" font-size="9" fill="#6b7280">Patch tokens</text>
  <text x="710" y="182" text-anchor="middle" font-size="9" fill="#6b7280">（与 ViT 相同）</text>
  <text x="710" y="200" text-anchor="middle" font-size="8.5" fill="#1d4ed8">[DIST] 跟 Teacher 学</text>
  <text x="710" y="212" text-anchor="middle" font-size="8.5" fill="#1d4ed8">[CLS] 跟 Hard Label 学</text>

  <!-- Loss boxes -->
  <rect x="460" y="148" width="150" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="535" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">L_CE（硬标签）</text>
  <text x="535" y="181" text-anchor="middle" font-size="9.5" fill="#15803d">one-hot → [CLS] 头</text>

  <rect x="460" y="198" width="150" height="40" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="535" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">L_KD（软/硬标签）</text>
  <text x="535" y="231" text-anchor="middle" font-size="9.5" fill="#6d28d9">Teacher 输出 → [DIST] 头</text>

  <g stroke="#374151" stroke-width="1.3" marker-end="url(#a)">
    <line x1="535" y1="122" x2="535" y2="146"/>
    <line x1="535" y1="188" x2="535" y2="196"/>
    <line x1="630" y1="150" x2="612" y2="165"/>
    <line x1="630" y1="177" x2="612" y2="215"/>
  </g>

  <!-- Final inference -->
  <rect x="460" y="260" width="320" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="620" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">推理：[CLS] + [DIST] 两个头预测求平均</text>
  <text x="620" y="298" text-anchor="middle" font-size="10.5" fill="#15803d">DeiT-B/16 → ImageNet Top-1 83.4%（仅 ImageNet 训练，相当 ViT-JFT 级别）</text>

  <g stroke="#374151" stroke-width="1.3" marker-end="url(#a)">
    <line x1="535" y1="238" x2="535" y2="258"/>
    <line x1="710" y1="222" x2="710" y2="250"/>
    <line x1="710" y1="250" x2="620" y2="258"/>
  </g>

  <!-- bottom note -->
  <rect x="20" y="330" width="780" height="24" rx="4" fill="#f8fafc"/>
  <text x="410" y="346" text-anchor="middle" font-size="10" fill="#374151">关键贡献：① 蒸馏 Token（[DIST]）让 ViT 模仿 CNN Teacher 的输出；② 数据增强（Mixup+RandAugment+CutMix）使 ImageNet 训练足够；③ 证明"无需 JFT"也能训出高精度 ViT</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
  </defs>
</svg>
