<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" font-family="'Microsoft YaHei',sans-serif">
  <rect width="780" height="230" fill="#fff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">VGG-16：5 个卷积块（全 3×3）+ 3 全连接</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="20"  y="60" width="56" height="84" fill="#e5e7eb" stroke="#9ca3af"/><text x="48" y="104">224²×3</text><text x="48" y="164" fill="#6b7280">输入</text>
    <rect x="92"  y="64" width="52" height="76" fill="#dbeafe" stroke="#3b82f6"/><text x="118" y="100">112²</text><text x="118" y="116">×64</text><text x="118" y="164" fill="#3b82f6">[3×3,64]×2</text>
    <rect x="160" y="72" width="46" height="60" fill="#dbeafe" stroke="#3b82f6"/><text x="183" y="100">56²</text><text x="183" y="116">×128</text><text x="183" y="164" fill="#3b82f6">[3×3,128]×2</text>
    <rect x="222" y="80" width="40" height="46" fill="#bfdbfe" stroke="#3b82f6"/><text x="242" y="100">28²</text><text x="242" y="116">×256</text><text x="242" y="164" fill="#3b82f6">[3×3,256]×3</text>
    <rect x="278" y="86" width="34" height="36" fill="#bfdbfe" stroke="#3b82f6"/><text x="295" y="100">14²</text><text x="295" y="116">×512</text><text x="295" y="164" fill="#3b82f6">[3×3,512]×3</text>
    <rect x="328" y="90" width="28" height="28" fill="#93c5fd" stroke="#3b82f6"/><text x="342" y="100">7²</text><text x="342" y="114">×512</text><text x="342" y="164" fill="#3b82f6">[3×3,512]×3</text>
    <rect x="400" y="92" width="20" height="24" fill="#fef3c7" stroke="#f59e0b"/><text x="448" y="106">4096</text><text x="448" y="164" fill="#b45309">FC</text>
    <rect x="488" y="92" width="20" height="24" fill="#fef3c7" stroke="#f59e0b"/><text x="536" y="106">4096</text><text x="536" y="164" fill="#b45309">FC</text>
    <rect x="576" y="92" width="18" height="24" fill="#dcfce7" stroke="#16a34a"/><text x="620" y="106">1000</text><text x="620" y="164" fill="#16a34a">输出</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.3">
    <line x1="76" y1="102" x2="90" y2="102"/><line x1="144" y1="102" x2="158" y2="102"/><line x1="206" y1="102" x2="220" y2="102"/>
    <line x1="262" y1="102" x2="276" y2="102"/><line x1="312" y1="102" x2="326" y2="102"/><line x1="356" y1="102" x2="398" y2="102"/>
    <line x1="420" y1="102" x2="486" y2="102"/><line x1="508" y1="102" x2="574" y2="102"/>
  </g>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#6b7280">每块后池化：空间减半、通道翻倍（64→128→256→512）；两个 3×3 ≡ 一个 5×5（见 Q6）</text>
</svg>
