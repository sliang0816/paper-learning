<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="450" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Inception：4 支路为"多尺度"，concat 为"并排保留"；256 = 各支路独立宽度之和（非目标）</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7280">以 Inception(3a) 为例，输入 28×28×192</text>

  <!-- input -->
  <rect x="350" y="60" width="120" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="410" y="80" text-anchor="middle" font-size="11">输入 28×28×192</text>

  <!-- 4 branches -->
  <g font-size="10" text-anchor="middle">
    <!-- branch1 1x1 -->
    <rect x="40" y="120" width="150" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="142" font-weight="bold" fill="#1d4ed8">支路1：1×1</text>
    <text x="115" y="160" font-size="9" fill="#374151">逐点/跨通道精细</text>
    <text x="115" y="174" font-size="9" fill="#1d4ed8">输出 64 通道</text>
    <!-- branch2 3x3 -->
    <rect x="210" y="120" width="150" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="285" y="142" font-weight="bold" fill="#15803d">支路2：1×1→3×3</text>
    <text x="285" y="160" font-size="9" fill="#374151">中感受野（先降到96）</text>
    <text x="285" y="174" font-size="9" fill="#15803d">输出 128 通道</text>
    <!-- branch3 5x5 -->
    <rect x="380" y="120" width="150" height="60" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="455" y="142" font-weight="bold" fill="#b45309">支路3：1×1→5×5</text>
    <text x="455" y="160" font-size="9" fill="#374151">大感受野（先降到16）</text>
    <text x="455" y="174" font-size="9" fill="#b45309">输出 32 通道</text>
    <!-- branch4 pool -->
    <rect x="550" y="120" width="150" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="625" y="142" font-weight="bold" fill="#6d28d9">支路4：池化→1×1</text>
    <text x="625" y="160" font-size="9" fill="#374151">主导/平移不变</text>
    <text x="625" y="174" font-size="9" fill="#6d28d9">输出 32 通道</text>
  </g>
  <!-- input to branches -->
  <g stroke="#9ca3af" stroke-width="1.1" marker-end="url(#a)">
    <line x1="370" y1="90" x2="130" y2="118"/><line x1="395" y1="90" x2="285" y2="118"/>
    <line x1="425" y1="90" x2="455" y2="118"/><line x1="450" y1="90" x2="620" y2="118"/>
  </g>

  <!-- concat bar -->
  <text x="410" y="214" text-anchor="middle" font-size="11" fill="#374151">concat（沿通道首尾相接，并排保留，不相加不混合）</text>
  <g font-size="10" text-anchor="middle">
    <rect x="180" y="224" width="120" height="34" fill="#bfdbfe" stroke="#3b82f6"/><text x="240" y="246">64</text>
    <rect x="300" y="224" width="200" height="34" fill="#bbf7d0" stroke="#16a34a"/><text x="400" y="246">128</text>
    <rect x="500" y="224" width="70" height="34" fill="#fde68a" stroke="#d97706"/><text x="535" y="246">32</text>
    <rect x="570" y="224" width="70" height="34" fill="#ddd6fe" stroke="#7c3aed"/><text x="605" y="246">32</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.1" marker-end="url(#a)">
    <line x1="115" y1="180" x2="230" y2="222"/><line x1="285" y1="180" x2="390" y2="222"/>
    <line x1="455" y1="180" x2="525" y2="222"/><line x1="625" y1="180" x2="610" y2="222"/>
  </g>
  <text x="410" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">输出 28×28×256，其中 256 = 64+128+32+32</text>

  <!-- key boxes -->
  <rect x="40" y="298" width="370" height="138" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="320" font-size="11.5" font-weight="bold" fill="#b91c1c">✗ 误解："为了凑 256 通道"</text>
  <text x="56" y="342" font-size="10" fill="#374151">256 不是预设目标，而是各支路宽度相加的<tspan font-weight="bold">结果</tspan>。</text>
  <text x="56" y="360" font-size="10" fill="#374151">每个支路宽度(64/128/32/32)是<tspan font-weight="bold">独立选的超参</tspan>，</text>
  <text x="56" y="378" font-size="10" fill="#374151">按"这个尺度想提多少特征"来定。</text>
  <text x="56" y="398" font-size="10" fill="#b91c1c">顺序是：先各自定宽度 → concat 得到它们的和。</text>
  <text x="56" y="418" font-size="9.5" fill="#6b7280">换一组宽度就是别的数；下一层 3b 输出就是 480。</text>

  <rect x="430" y="298" width="350" height="138" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="446" y="320" font-size="11.5" font-weight="bold" fill="#15803d">✓ 真正的两个目的</text>
  <text x="446" y="342" font-size="10" fill="#374151">① <tspan font-weight="bold">多尺度</tspan>：1×1/3×3/5×5/池化并行，不赌单一</text>
  <text x="446" y="358" font-size="10" fill="#374151">　 感受野，同时在多种尺度提特征。</text>
  <text x="446" y="378" font-size="10" fill="#374151">② <tspan font-weight="bold">concat 并排保留</tspan>：不同种类特征堆在一起，</text>
  <text x="446" y="394" font-size="10" fill="#374151">　 下一层同时看到全部；add 会混掉、还要求同形状。</text>
  <text x="446" y="416" font-size="9.5" fill="#16a34a">（1×1 还兼顾"先降维省算"，见 Q7/Q52）</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9ca3af"/></marker>
  </defs>
</svg>
