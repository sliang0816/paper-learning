<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="560" fill="#fff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q137 理解校验：是 [196×768]×[768×d]=[196×d]（768 被乘掉、196 当行数）；工程=stride16 的"卷积"非单纯下采样</text>

  <!-- ① 矩阵修正 -->
  <rect x="20" y="42" width="900" height="190" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="470" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① 矩阵账修正：768（patch 维度）才在"里面"被乘掉，196（patch 个数）在"外面"当行数</text>
  <g font-size="10.5" font-family="Consolas,monospace" text-anchor="middle">
    <text x="470" y="98" fill="#b91c1c">✗ 你写的:  (1×196) × (196×d) = 1×d     ← 196 是 patch 个数，不是维度</text>
    <text x="470" y="130" fill="#15803d">✓ 单个:    (1×768) × (768×d) = 1×d     ← 768 = 16×16×3 拉直维度</text>
    <text x="470" y="162" fill="#15803d">✓ 批量:  (196×768) × (768×d) = 196×d   ← 每行一个 patch → 每行一个 token</text>
  </g>
  <text x="470" y="196" text-anchor="middle" font-size="9.5" fill="#374151">口诀：<tspan font-weight="bold">768 在里面被乘掉、196 在外面当行数</tspan>——投影对每个 patch 独立做，与 patch 总数无关</text>
  <text x="470" y="218" text-anchor="middle" font-size="9" fill="#6b7280">易混来源：ViT-Base 恰好 d=768，与拉直维度 768 撞数；结论"token 是 d 维向量"本身没错 ✓</text>

  <!-- ② 卷积非下采样 -->
  <rect x="20" y="244" width="900" height="200" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="470" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">② "下采样 stride=16 即可"缺主语：得是"卷积"——Conv2d(3, d, kernel=16, stride=16) 三参数缺一不可</text>
  <g font-size="9.5">
    <text x="40" y="292" fill="#374151">· <tspan font-weight="bold">kernel=16</tspan>：核盖住整个 patch → 每位置点积 = "拉直 × E 的一行"</text>
    <text x="40" y="316" fill="#374151">· <tspan font-weight="bold">stride=16</tspan>：步长=核大小 → 无重叠、一块一跳</text>
    <text x="40" y="340" fill="#374151">· <tspan font-weight="bold">输出通道=d</tspan>：d 个卷积核 = E 的 d 行 → 输出才是 d 维 token</text>
    <text x="40" y="368" fill="#15803d">224×224×3 → 14×14×d（空间÷16、通道3→d）→ 摊平 = 196 个 token</text>
    <text x="40" y="396" fill="#b91c1c" font-weight="bold">"下采样"只是空间分辨率的副作用：stride=16 的平均/最大池化也是下采样，但无参数、不升通道、粗暴压信息——不能替代</text>
    <text x="40" y="420" fill="#6d28d9">这一步的本质 = 带参数的线性投影，"顺便"把分辨率降了 16 倍</text>
  </g>

  <!-- 修正版 -->
  <rect x="20" y="456" width="900" height="50" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="470" y="476" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">修正后的完整表述：[196×768] × [768×d] = [196×d]，每行一个 d 维 token；</text>
  <text x="470" y="496" text-anchor="middle" font-size="10" fill="#374151">工程上一层 kernel=stride=16、输出通道 d 的卷积一步完成（下采样是副作用，可学习投影是本体）</text>

  <!-- 一句话 -->
  <rect x="20" y="518" width="900" height="34" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="540" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a16207">一句话：结论对（token=d 维向量✓），两处校准——乘的是 768 不是 196；工程是"stride16 卷积"（可学习），不是"下采样即可"（池化不行）。</text>
</svg>
