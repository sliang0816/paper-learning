<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Microsoft YaHei',sans-serif">
  <rect width="800" height="460" fill="#fff"/>
  <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">多头注意力：每个头独立算注意力 → 拼接"各头输出"（不是 Q/K/V）→ 再过 W_O</text>

  <!-- 输入 X -->
  <rect x="30" y="180" width="64" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="62" y="216" text-anchor="middle" font-size="12" fill="#0369a1">X</text>
  <text x="62" y="232" text-anchor="middle" font-size="8" fill="#6b7280">n×d</text>
  <text x="62" y="272" text-anchor="middle" font-size="8.5" fill="#374151">同一批 token</text>

  <!-- Head 1 -->
  <text x="270" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">头 1（自己的 W_Q¹/W_K¹/W_V¹）</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="150" y="74" width="70" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="185" y="89">Q¹ n×dₖ</text>
    <rect x="150" y="100" width="70" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="185" y="115">K¹ n×dₖ</text>
    <rect x="150" y="126" width="70" height="22" rx="4" fill="#fce7f3" stroke="#db2777"/><text x="185" y="141">V¹ n×dₖ</text>
    <rect x="244" y="92" width="96" height="38" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="292" y="108">注意力</text><text x="292" y="122" font-size="7.5">softmax(Q¹K¹ᵀ)V¹</text>
    <rect x="360" y="98" width="78" height="26" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="399" y="115">head₁ n×dₖ</text>
  </g>
  <g stroke="#7c3aed" stroke-width="1.1"><line x1="220" y1="111" x2="242" y2="111" marker-end="url(#p)"/></g>
  <g stroke="#ca8a04" stroke-width="1.1"><line x1="340" y1="111" x2="358" y2="111" marker-end="url(#y)"/></g>

  <!-- Head 2 -->
  <text x="270" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">头 2（自己的 W_Q²/W_K²/W_V²）</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="150" y="170" width="70" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="185" y="185">Q² n×dₖ</text>
    <rect x="150" y="196" width="70" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="185" y="211">K² n×dₖ</text>
    <rect x="150" y="222" width="70" height="22" rx="4" fill="#fce7f3" stroke="#db2777"/><text x="185" y="237">V² n×dₖ</text>
    <rect x="244" y="188" width="96" height="38" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="292" y="204">注意力</text><text x="292" y="218" font-size="7.5">softmax(Q²K²ᵀ)V²</text>
    <rect x="360" y="194" width="78" height="26" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="399" y="211">head₂ n×dₖ</text>
  </g>
  <g stroke="#7c3aed" stroke-width="1.1"><line x1="220" y1="207" x2="242" y2="207" marker-end="url(#p)"/></g>
  <g stroke="#ca8a04" stroke-width="1.1"><line x1="340" y1="207" x2="358" y2="207" marker-end="url(#y)"/></g>

  <!-- ... -->
  <text x="270" y="262" text-anchor="middle" font-size="13" fill="#9ca3af">⋮  （共 h 个头，如 8 头，各 dₖ = d/h = 64）</text>

  <!-- Head h -->
  <g font-size="8.5" text-anchor="middle">
    <rect x="150" y="276" width="70" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="185" y="291">Qʰ</text>
    <rect x="150" y="300" width="70" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="185" y="314">Kʰ</text>
    <rect x="150" y="322" width="70" height="20" rx="4" fill="#fce7f3" stroke="#db2777"/><text x="185" y="336">Vʰ</text>
    <rect x="244" y="292" width="96" height="36" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="292" y="314">注意力</text>
    <rect x="360" y="296" width="78" height="26" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="399" y="313">headₕ n×dₖ</text>
  </g>
  <g stroke="#7c3aed" stroke-width="1.1"><line x1="220" y1="310" x2="242" y2="310" marker-end="url(#p)"/></g>
  <g stroke="#ca8a04" stroke-width="1.1"><line x1="340" y1="310" x2="358" y2="310" marker-end="url(#y)"/></g>

  <!-- X 分发到各头 -->
  <g stroke="#0284c7" stroke-width="1.1">
    <line x1="94" y1="210" x2="148" y2="111" marker-end="url(#c)"/>
    <line x1="94" y1="220" x2="148" y2="207" marker-end="url(#c)"/>
    <line x1="94" y1="230" x2="148" y2="305" marker-end="url(#c)"/>
  </g>

  <!-- Concat -->
  <rect x="470" y="150" width="80" height="120" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="510" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">拼接</text>
  <text x="510" y="216" text-anchor="middle" font-size="9" fill="#9a3412">Concat</text>
  <text x="510" y="234" text-anchor="middle" font-size="8" fill="#6b7280">h×dₖ = d</text>
  <text x="510" y="248" text-anchor="middle" font-size="8" fill="#9a3412">n×d</text>
  <g stroke="#ca8a04" stroke-width="1.2">
    <line x1="438" y1="111" x2="468" y2="170" marker-end="url(#y)"/>
    <line x1="438" y1="207" x2="468" y2="205" marker-end="url(#y)"/>
    <line x1="438" y1="309" x2="468" y2="250" marker-end="url(#y)"/>
  </g>

  <!-- W_O -->
  <rect x="580" y="180" width="76" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="618" y="205" text-anchor="middle" font-size="12" fill="#1d4ed8">× W_O</text>
  <text x="618" y="222" text-anchor="middle" font-size="8" fill="#6b7280">输出投影/融合</text>
  <line x1="550" y1="210" x2="578" y2="210" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>

  <rect x="686" y="180" width="90" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="731" y="205" text-anchor="middle" font-size="11" fill="#15803d">最终输出</text>
  <text x="731" y="222" text-anchor="middle" font-size="8" fill="#6b7280">n×d</text>
  <line x1="656" y1="210" x2="684" y2="210" stroke="#374151" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 纠正框 -->
  <rect x="30" y="356" width="746" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="46" y="376" font-size="11" font-weight="bold" fill="#b91c1c">⚠️ 你的理解纠正：</text>
  <text x="46" y="395" font-size="10.5" fill="#374151">✅ 对：用 h 组<tspan font-weight="bold">不同的 W_Q/W_K/W_V</tspan>，每组各投出一套 Q/K/V（维度 dₖ=d/h）。</text>
  <text x="46" y="413" font-size="10.5" fill="#b91c1c">❌ 错："拼接成最终的 Q/K/V"——每个头是<tspan font-weight="bold">各自独立算完注意力</tspan>得到一个输出 headᵢ；拼接的是这些<tspan font-weight="bold">注意力输出</tspan>，不是 Q/K/V。</text>
  <text x="46" y="431" font-size="10.5" fill="#374151">✅ 补：拼接后还要再乘一个<tspan font-weight="bold">输出矩阵 W_O</tspan> 做融合，才得最终结果。公式：MultiHead = Concat(head₁,…,headₕ)·W_O。</text>
  <text x="46" y="448" font-size="9.5" fill="#6b7280">意义：每个头在不同子空间各看一种关系（语法/指代/位置…），并行互补 → 表达更丰富。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="p" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
    <marker id="y" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ca8a04"/></marker>
    <marker id="c" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0284c7"/></marker>
  </defs>
</svg>
