<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="510" fill="#fff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q117 为什么是 QKV 三个，不是四个/五个？— 来源于检索/数据库的"查询-键-值"抽象</text>

  <!-- 检索类比 -->
  <rect x="20" y="44" width="440" height="220" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="240" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">来源于检索/数据库的抽象</text>
  <text x="36" y="88" font-size="9.5" fill="#374151">一个检索/查字典的过程天然需要三样东西：</text>
  <text x="36" y="108" font-size="9.5" fill="#374151"><tspan font-weight="bold">① 查询(Query)</tspan>：我想找什么（用户输入的搜索词）</text>
  <text x="36" y="128" font-size="9.5" fill="#374151"><tspan font-weight="bold">② 键(Key)</tspan>：数据库里每个条目靠什么被检索（索引/标题）</text>
  <text x="36" y="148" font-size="9.5" fill="#374151"><tspan font-weight="bold">③ 值(Value)</tspan>：匹配后返回什么内容（正文内容）</text>
  <rect x="70" y="170" width="130" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="135" y="186" text-anchor="middle" font-size="9" fill="#15803d">Q 搜 → K 索引匹配 → V 输出</text>
  <text x="36" y="216" font-size="9" fill="#374151">关键：<tspan font-weight="bold">Query≠Key≠Value</tspan> —— 你想找的东西(Q)</text>
  <text x="36" y="232" font-size="9" fill="#374151">和它被找到的依据(K)不一样，匹配后给你的(V)又是另一套</text>
  <text x="36" y="252" font-size="9" fill="#b91c1c">所以"3 个不是拍脑袋，是检索天然需要 3 个不同角色"</text>

  <!-- 三个独立必要性 -->
  <rect x="480" y="44" width="440" height="220" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="700" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">为什么刚好 3 个：Q、K、V 三个不可归并</text>
  <text x="496" y="88" font-size="9" fill="#374151">· Q 和 K 为何不能合并：检索方向不完全对称——</text>
  <text x="508" y="102" font-size="9" fill="#6b7280">"I 要找动词" ≠ "I 作为主语被动词匹配到"</text>
  <text x="508" y="116" font-size="9" fill="#6b7280">若 Q=K 退化对称，对应 [Q116] 的"角色冲突"</text>
  <text x="496" y="136" font-size="9" fill="#374151">· K 和 V 为何不同：匹配靠什么(K) ≠ 一旦匹配上，</text>
  <text x="508" y="150" font-size="9" fill="#6b7280">要搬过去的具体内容(V)。K=轻量标签匹配好；</text>
  <text x="508" y="164" font-size="9" fill="#6b7280">V 带着原 token 的完整语义去融合</text>
  <text x="496" y="184" font-size="9" fill="#374151">· 为何不是 4 个？少一个关键角色已在三者中分配完毕；</text>
  <text x="508" y="198" font-size="9" fill="#6b7280">Q/K/V 三个就够覆盖"谁提问-怎么匹配-出口什么"全流程</text>
  <text x="496" y="222" font-size="9" fill="#15803d">→ 2 个不够(必有角色合并丢信息)，3 个刚好；</text>
  <text x="508" y="236" font-size="9" fill="#6b7280">4 个无额外必要(没有第 4 个独立功能)</text>

  <!-- 检索类比例 -->
  <rect x="20" y="276" width="900" height="100" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="470" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">两个例子——不用术语也能看 3 个角色</text>
  <rect x="40" y="314" width="410" height="52" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="245" y="332" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6d28d9">视频搜索：输入 Q=搜索词 → 用 K=标题索引(不是视频)检索 → 返回 V=视频</text>
  <text x="245" y="352" text-anchor="middle" font-size="9" fill="#374151">Q=你想看什么 · K=按什么被找到(标题) · V=匹配后给你的(视频内容)</text>
  <rect x="470" y="314" width="430" height="52" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="685" y="332" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6d28d9">字典：Q=要查哪个字(部首/拼音) → K=部首索引 → V=该字的解释</text>
  <text x="685" y="352" text-anchor="middle" font-size="9" fill="#374151">Q、K、V 是三种不同身份的中间形态</text>

  <!-- 一句话 -->
  <rect x="20" y="388" width="900" height="110" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#a16207">总结：QKV 源自检索——"查询-键-值"的抽象最早来自数据库/信息检索</text>
  <text x="40" y="440" font-size="9.5" fill="#374151">· 神经网络实现：Bahdanau 注意力(2015) 只用 Q 和 K(未分立出 V，对齐后直接读隐藏态)；Transformer 明确分出 Q、K、V 三个矩阵</text>
  <text x="40" y="460" font-size="9.5" fill="#374151">· 关键不是"3 个"这个数字，而是 Q≠K≠V 三者归不同的角色，投影恰好给了它们自由度</text>
  <text x="40" y="482" font-size="9.5" fill="#15803d">· Q116(角色冲突)的理论根在此：一旦收回 3 为 2 甚至为 1，就丢失"检索方向不必然对称"和"找到的线索≠被返回的内容"两个自由度</text>
  <text x="470" y="502" text-anchor="middle" font-size="8.5" fill="#6b7280">Bahdanau et al., Neural Machine Translation (2015) · Vaswani et al., Transformer (2017)</text>
</svg>
