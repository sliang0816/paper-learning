<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 150" font-family="'Microsoft YaHei',sans-serif">
  <rect width="740" height="150" fill="#fff"/>
  <text x="14" y="24" font-size="13" font-weight="bold" fill="#111827">⑤ 注意力 / Transformer：token 向量序列 → 上下文化 token 或 下一词概率</text>
  <!-- encoder (BERT) row -->
  <g font-size="11">
    <rect x="20" y="40" width="160" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="100" y="61" text-anchor="middle">token 序列(+位置)</text>
    <line x1="182" y1="57" x2="232" y2="57" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="234" y="40" width="150" height="34" rx="5" fill="#f3f4f6" stroke="#6b7280"/><text x="309" y="61" text-anchor="middle">编码器(BERT/ViT)</text>
    <line x1="386" y1="57" x2="436" y2="57" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="438" y="40" width="288" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="582" y="61" text-anchor="middle">同长上下文 token（[CLS]→分类/句向量）</text>
  </g>
  <!-- decoder (GPT) row -->
  <g font-size="11">
    <rect x="20" y="90" width="160" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="100" y="111" text-anchor="middle">已生成 token 序列</text>
    <line x1="182" y1="107" x2="232" y2="107" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="234" y="90" width="150" height="34" rx="5" fill="#f3f4f6" stroke="#6b7280"/><text x="309" y="111" text-anchor="middle">解码器(GPT)</text>
    <line x1="386" y1="107" x2="436" y2="107" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="438" y="90" width="288" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="582" y="111" text-anchor="middle">下一个 token 的概率分布（自回归续写）</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
</svg>
