<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="470" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">"1×1""3×3"只报核的空间大小（高×宽），通道深度被省略了</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7280">卷积核完整形状永远是 高 × 宽 × C_in；深度那维 = 输入通道数，自动确定，不写进名字</text>

  <!-- 左：1×1 核 -->
  <rect x="24" y="64" width="372" height="246" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="210" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">① "1×1 核"（输入 2 通道）</text>
  <text x="210" y="108" text-anchor="middle" font-size="10.5" fill="#374151">空间只盖 1 个像素，深度穿透 2 个通道</text>

  <!-- depiction: a 1x1x2 column -->
  <g>
    <rect x="150" y="124" width="40" height="40" fill="#dbeafe" stroke="#3b82f6"/><text x="170" y="149" text-anchor="middle" font-size="13">1</text>
    <rect x="150" y="170" width="40" height="40" fill="#dcfce7" stroke="#16a34a"/><text x="170" y="195" text-anchor="middle" font-size="13">−1</text>
    <text x="230" y="149" font-size="10" fill="#1d4ed8">← 对通道A的权重</text>
    <text x="230" y="195" font-size="10" fill="#15803d">← 对通道B的权重</text>
  </g>
  <text x="210" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">完整形状 = 1 × 1 × 2</text>
  <text x="210" y="256" text-anchor="middle" font-size="10" fill="#374151">高1 · 宽1 · 通道2 → 共 2 个权重 [1, −1]</text>
  <rect x="60" y="270" width="300" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="210" y="290" text-anchor="middle" font-size="10" fill="#15803d">那 2 个数是"通道方向"，不是"空间方向"</text>

  <!-- 右：3×3 核 -->
  <rect x="424" y="64" width="372" height="246" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="610" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">② "3×3 核"（输入 2 通道）作对照</text>
  <text x="610" y="108" text-anchor="middle" font-size="10.5" fill="#374151">空间盖 3×3=9 个像素，深度仍穿透 2 通道</text>

  <g>
    <!-- 3x3 grid channel A -->
    <g stroke="#3b82f6" fill="#dbeafe">
      <rect x="500" y="124" width="22" height="22"/><rect x="522" y="124" width="22" height="22"/><rect x="544" y="124" width="22" height="22"/>
      <rect x="500" y="146" width="22" height="22"/><rect x="522" y="146" width="22" height="22"/><rect x="544" y="146" width="22" height="22"/>
      <rect x="500" y="168" width="22" height="22"/><rect x="522" y="168" width="22" height="22"/><rect x="544" y="168" width="22" height="22"/>
    </g>
    <!-- 3x3 grid channel B offset -->
    <g stroke="#16a34a" fill="#dcfce7">
      <rect x="612" y="124" width="22" height="22"/><rect x="634" y="124" width="22" height="22"/><rect x="656" y="124" width="22" height="22"/>
      <rect x="612" y="146" width="22" height="22"/><rect x="634" y="146" width="22" height="22"/><rect x="656" y="146" width="22" height="22"/>
      <rect x="612" y="168" width="22" height="22"/><rect x="634" y="168" width="22" height="22"/><rect x="656" y="168" width="22" height="22"/>
    </g>
    <text x="533" y="206" text-anchor="middle" font-size="9" fill="#1d4ed8">通道A 的 3×3</text>
    <text x="645" y="206" text-anchor="middle" font-size="9" fill="#15803d">通道B 的 3×3</text>
  </g>
  <text x="610" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">完整形状 = 3 × 3 × 2</text>
  <text x="610" y="256" text-anchor="middle" font-size="10" fill="#374151">高3 · 宽3 · 通道2 → 共 18 个权重</text>
  <rect x="460" y="270" width="300" height="30" rx="6" fill="#ffedd5" stroke="#f97316"/>
  <text x="610" y="290" text-anchor="middle" font-size="10" fill="#9a3412">也不止 9 个数，但仍叫"3×3"</text>

  <!-- 底部对照表 + 结论 -->
  <rect x="24" y="324" width="772" height="128" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="40" y="346" font-size="11" font-weight="bold" fill="#374151">命名规则：名字 = 空间大小（高×宽）；权重个数 = 空间 × C_in（深度自动等于输入通道数）</text>
  <text x="40" y="372" font-size="10.5" fill="#374151" font-family="monospace">  叫法      空间(看几个像素)     完整形状        权重个数</text>
  <text x="40" y="392" font-size="10.5" fill="#374151" font-family="monospace">  1×1 核    1 个像素            1×1×C_in        C_in 个</text>
  <text x="40" y="412" font-size="10.5" fill="#374151" font-family="monospace">  3×3 核    9 个像素            3×3×C_in        9·C_in 个</text>
  <text x="40" y="436" font-size="10.5" fill="#16a34a">所以 [1,−1] 是 1×1 核：它空间上只看 1 个点（故不改 H×W、只混通道）；2 个数是因输入恰好 2 通道——换 256 通道，这个"1×1 核"里就有 256 个数。</text>
</svg>
