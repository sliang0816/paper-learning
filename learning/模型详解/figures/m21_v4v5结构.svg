<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="330" fill="#fff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">YOLOv4 / v5（2020）　对照 v3：CSP 骨干 + PAN 双向颈部 + Mosaic</text>

  <rect x="20" y="120" width="50" height="50" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="45" y="142" text-anchor="middle" font-size="10" fill="#0369a1">输入</text>
  <text x="45" y="158" text-anchor="middle" font-size="8" fill="#dc2626">🔴Mosaic</text>

  <!-- Backbone CSP -->
  <rect x="86" y="108" width="150" height="76" rx="6" fill="#dbeafe" stroke="#ef4444" stroke-width="2"/>
  <text x="161" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">骨干 Backbone</text>
  <text x="161" y="147" text-anchor="middle" font-size="10.5" fill="#dc2626">🔴 CSPDarknet53</text>
  <text x="161" y="163" text-anchor="middle" font-size="9" fill="#374151">分两路:一路卷积一路直连</text>
  <text x="161" y="177" text-anchor="middle" font-size="9" fill="#dc2626">🔴 末端 SPP 多尺度池化</text>

  <!-- Neck PAN -->
  <rect x="256" y="64" width="190" height="186" rx="6" fill="#ede9fe" stroke="#ef4444" stroke-width="2"/>
  <text x="351" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">颈部 Neck</text>
  <text x="351" y="101" text-anchor="middle" font-size="10" fill="#dc2626">🔴 PAN-FPN（双向融合）</text>
  <g font-size="8.5" text-anchor="middle">
    <rect x="270" y="110" width="76" height="28" rx="4" fill="#fff" stroke="#7c3aed"/><text x="308" y="128">P3 大·小目标</text>
    <rect x="270" y="146" width="76" height="28" rx="4" fill="#fff" stroke="#7c3aed"/><text x="308" y="164">P4 中</text>
    <rect x="270" y="182" width="76" height="28" rx="4" fill="#fff" stroke="#7c3aed"/><text x="308" y="200">P5 小·大目标</text>
  </g>
  <!-- 自顶向下 -->
  <g stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 2">
    <line x1="356" y1="196" x2="356" y2="160" marker-end="url(#b)"/>
    <line x1="356" y1="160" x2="356" y2="124" marker-end="url(#b)"/>
  </g>
  <text x="372" y="118" font-size="8" fill="#7c3aed">↑FPN语义</text>
  <!-- 自底向上 -->
  <g stroke="#0d9488" stroke-width="1" stroke-dasharray="3 2">
    <line x1="400" y1="124" x2="400" y2="160" marker-end="url(#c)"/>
    <line x1="400" y1="160" x2="400" y2="196" marker-end="url(#c)"/>
  </g>
  <text x="408" y="200" font-size="8" fill="#0d9488">↓PAN定位</text>

  <!-- Heads -->
  <g font-size="9" text-anchor="middle">
    <rect x="464" y="110" width="86" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="507" y="128">检测头 P3</text>
    <rect x="464" y="146" width="86" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="507" y="164">检测头 P4</text>
    <rect x="464" y="182" width="86" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="507" y="200">检测头 P5</text>
  </g>
  <text x="507" y="102" text-anchor="middle" font-size="8.5" fill="#6b7280">耦合头·anchor-based</text>

  <rect x="568" y="110" width="172" height="100" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="654" y="132" text-anchor="middle" font-size="10.5" fill="#be185d">3 尺度输出</text>
  <text x="654" y="150" text-anchor="middle" font-size="9" fill="#6b7280">anchor-based</text>
  <text x="654" y="170" text-anchor="middle" font-size="9.5" fill="#dc2626">🔴 CIoU 损失</text>
  <text x="654" y="186" text-anchor="middle" font-size="8.5" fill="#6b7280">v5:AutoAnchor/超参进化</text>
  <text x="654" y="202" text-anchor="middle" font-size="8.5" fill="#dc2626">🔴 PyTorch 工程化</text>

  <g stroke="#374151" stroke-width="1.4">
    <line x1="70" y1="145" x2="84" y2="145" marker-end="url(#a)"/>
    <line x1="236" y1="145" x2="254" y2="145" marker-end="url(#a)"/>
    <line x1="446" y1="145" x2="462" y2="145" marker-end="url(#a)"/>
    <line x1="550" y1="160" x2="566" y2="160" marker-end="url(#a)"/>
  </g>

  <rect x="20" y="262" width="720" height="62" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="36" y="284" font-size="11.5" font-weight="bold" fill="#b91c1c">🔴 相对 v3 的改进（tricks 集大成）：</text>
  <text x="36" y="302" font-size="11" fill="#374151">① CSP 骨干：特征分两路再拼接，省算 + 增强梯度流（C2f 前身）。② FPN→PAN：自顶向下(语义)+自底向上(定位)双向融合。</text>
  <text x="36" y="319" font-size="11" fill="#374151">③ Mosaic 四图拼接增强(本项目用)；④ CIoU 损失；⑤ v5 全面 PyTorch 化 + AutoAnchor，落地门槛骤降。</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
    <marker id="c" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0d9488"/></marker>
  </defs>
</svg>
