<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'Microsoft YaHei',sans-serif">
  <rect width="980" height="760" fill="#fff"/>
  <text x="490" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Transformer 架构详图（原创绘制 · 等价呈现原论文 Encoder-Decoder）</text>
  <text x="490" y="46" text-anchor="middle" font-size="11" fill="#6b7280">例：翻译 “I love road” → “我 爱 路”　|　d_model=512，多头 h=8、d_k=64，FFN 512→2048→512，堆叠 N=6 层</text>

  <!-- ===================== ENCODER ===================== -->
  <rect x="40" y="70" width="380" height="560" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="230" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">编码器 Encoder × N=6（看懂源句）</text>

  <!-- encoder input -->
  <rect x="70" y="556" width="320" height="56" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="230" y="576" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">输入：源 token 词嵌入 ⊕ 位置编码</text>
  <text x="230" y="596" text-anchor="middle" font-size="9" fill="#374151">“I” “love” “road” → 各 512 维（⊕ 位置=注入顺序）</text>

  <!-- one encoder layer expanded -->
  <rect x="70" y="120" width="320" height="420" rx="8" fill="#fff" stroke="#7dd3fc" stroke-dasharray="4 3"/>
  <text x="230" y="140" text-anchor="middle" font-size="10" fill="#0369a1">↓ 展开“一层”内部（共 6 层串联）</text>

  <!-- self-attn -->
  <rect x="92" y="150" width="276" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="230" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">多头自注意力（Self-Attention）</text>
  <text x="230" y="187" text-anchor="middle" font-size="8.5" fill="#374151">Q/K/V 都来自源句；h=8 头各 d_k=64</text>
  <text x="230" y="200" text-anchor="middle" font-size="8" fill="#6b7280">源句内部互相看 → 每词吸收上下文</text>

  <rect x="92" y="214" width="276" height="22" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="230" y="229" text-anchor="middle" font-size="9" fill="#6d28d9">Add &amp; Norm（残差 + LayerNorm）</text>

  <!-- ffn -->
  <rect x="92" y="248" width="276" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="230" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">前馈网络 FFN（逐 token）</text>
  <text x="230" y="285" text-anchor="middle" font-size="8.5" fill="#374151">512 → 2048(ReLU) → 512</text>

  <rect x="92" y="306" width="276" height="22" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="230" y="321" text-anchor="middle" font-size="9" fill="#6d28d9">Add &amp; Norm</text>

  <text x="230" y="350" text-anchor="middle" font-size="9" fill="#6b7280">（× 6 层堆叠：上一层输出 = 下一层输入）</text>

  <!-- encoder residual arrows (inside) -->
  <path d="M80 178 L80 225 L90 225" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <path d="M80 273 L80 317 L90 317" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <!-- encoder output memory -->
  <rect x="70" y="362" width="320" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="230" y="381" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">输出：memory（等长上下文向量，3×512）</text>
  <text x="230" y="398" text-anchor="middle" font-size="8.5" fill="#6b7280">只算一次，供解码器每层 / 每步复用</text>

  <line x1="230" y1="556" x2="230" y2="540" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="230" y1="362" x2="230" y2="340" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ===================== DECODER ===================== -->
  <rect x="560" y="70" width="380" height="560" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="750" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">解码器 Decoder × N=6（逐词生成译文）</text>

  <!-- decoder input -->
  <rect x="590" y="556" width="320" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="750" y="576" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">输入：已生成目标前缀（右移）⊕ 位置编码</text>
  <text x="750" y="596" text-anchor="middle" font-size="9" fill="#374151">&lt;BOS&gt; 我 爱 …（训练并行 / 推理自回归喂回）</text>

  <!-- one decoder layer expanded -->
  <rect x="590" y="120" width="320" height="420" rx="8" fill="#fff" stroke="#fcd34d" stroke-dasharray="4 3"/>
  <text x="750" y="138" text-anchor="middle" font-size="10" fill="#92400e">↓ 展开“一层”内部（共 6 层串联）</text>

  <!-- masked self-attn -->
  <rect x="612" y="146" width="276" height="52" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="750" y="165" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">① 掩码自注意力（Masked Self-Attn）</text>
  <text x="750" y="181" text-anchor="middle" font-size="8.5" fill="#374151">Q/K/V=目标自己 + 因果掩码挡未来</text>
  <text x="750" y="193" text-anchor="middle" font-size="8" fill="#6b7280">看“已写出来的”，保自回归不偷看答案</text>

  <rect x="612" y="204" width="276" height="18" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="750" y="217" text-anchor="middle" font-size="8.5" fill="#6d28d9">Add &amp; Norm</text>

  <!-- cross-attn -->
  <rect x="612" y="228" width="276" height="52" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="750" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">② 交叉注意力（Cross-Attention）</text>
  <text x="750" y="263" text-anchor="middle" font-size="8.5" fill="#374151">Q=目标，K/V=编码器 memory</text>
  <text x="750" y="275" text-anchor="middle" font-size="8" fill="#6b7280">看原文、把输出锚定输入（译“路”↔“road”）</text>

  <rect x="612" y="286" width="276" height="18" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="750" y="299" text-anchor="middle" font-size="8.5" fill="#6d28d9">Add &amp; Norm</text>

  <!-- ffn -->
  <rect x="612" y="310" width="276" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="750" y="329" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">③ 前馈网络 FFN（逐 token）</text>
  <text x="750" y="345" text-anchor="middle" font-size="8.5" fill="#374151">512 → 2048 → 512</text>

  <rect x="612" y="360" width="276" height="18" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="750" y="373" text-anchor="middle" font-size="8.5" fill="#6d28d9">Add &amp; Norm　（× 6 层堆叠）</text>

  <!-- decoder head -->
  <rect x="612" y="392" width="276" height="48" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="750" y="411" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">Linear（512→词表3万）→ Softmax</text>
  <text x="750" y="428" text-anchor="middle" font-size="8.5" fill="#374151">输出下一个词概率 → 我 / 爱 / 路 …</text>

  <line x1="750" y1="556" x2="750" y2="540" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- memory -> cross-attn (K/V) big arrow -->
  <path d="M390 385 C 480 385, 500 254, 610 254" fill="none" stroke="#3b82f6" stroke-width="2.4" marker-end="url(#b)"/>
  <rect x="430" y="300" width="120" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="490" y="315" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">memory → K/V</text>
  <text x="490" y="328" text-anchor="middle" font-size="8" fill="#6b7280">喂给交叉注意力</text>

  <!-- output to top -->
  <rect x="612" y="86" width="276" height="22" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="750" y="101" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">译文输出：我 爱 路 &lt;EOS&gt;</text>
  <line x1="750" y1="392" x2="750" y2="110" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ===================== legend / notes ===================== -->
  <rect x="40" y="646" width="900" height="100" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="60" y="668" font-size="11" font-weight="bold" fill="#374151">三种注意力一图对照（区别只在 Q 与 K/V 从哪来）：</text>
  <rect x="60" y="678" width="14" height="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="80" y="690" font-size="9.5" fill="#374151">编码器自注意力：Q/K/V 都来自源句（源内部互看，不掩码）</text>
  <rect x="60" y="700" width="14" height="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="80" y="712" font-size="9.5" fill="#374151">解码器掩码自注意力：Q/K/V 都来自目标（带因果掩码，逐词不偷看未来）</text>
  <rect x="60" y="722" width="14" height="14" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="80" y="734" font-size="9.5" fill="#374151">交叉注意力：Q=目标，K/V=编码器 memory（把译文对齐到源句）</text>

  <text x="520" y="690" font-size="9.5" fill="#374151">· 每个子层都包 <tspan font-weight="bold">Add &amp; Norm</tspan>（残差+LayerNorm）：残差保深层可训、Norm 稳训练</text>
  <text x="520" y="710" font-size="9.5" fill="#374151">· <tspan font-weight="bold">完全并行</tspan>（无循环）、任意两位置一步直连、注意力 O(n²)</text>
  <text x="520" y="730" font-size="9.5" fill="#374151">· 三态：BERT=只编码器；GPT=只解码器(无交叉)；原版/T5=编码器+解码器</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
