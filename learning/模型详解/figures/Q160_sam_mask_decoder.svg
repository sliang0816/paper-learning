<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="'Microsoft YaHei',sans-serif">
  <rect width="960" height="780" fill="#fff"/>
  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q160 SAM 为什么需要 Mask Decoder：撮合"图像内容"与"用户意图"的唯一交汇点</text>

  <!-- ① 两边各瞎一半 -->
  <rect x="20" y="42" width="920" height="130" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="480" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① 根本问题：图像编码器和提示编码器各"瞎"一半</text>
  <rect x="40" y="80" width="420" height="76" rx="5" fill="#fff" stroke="#f87171"/>
  <text x="250" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">Image Encoder(ViT)</text>
  <text x="56" y="120" font-size="9.5" fill="#374151">整图→低分辨率密集特征网格(如64×64)</text>
  <text x="56" y="138" font-size="9.5" fill="#b91c1c">知道"每块大致长什么样"，不知道用户点了哪</text>
  <rect x="500" y="80" width="420" height="76" rx="5" fill="#fff" stroke="#f87171"/>
  <text x="710" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">Prompt Encoder</text>
  <text x="516" y="120" font-size="9.5" fill="#374151">点/框/掩码→一两个向量</text>
  <text x="516" y="138" font-size="9.5" fill="#b91c1c">知道"点了哪个坐标"，不知道周围图像内容</text>

  <!-- ② Mask Decoder内部 -->
  <rect x="20" y="188" width="920" height="330" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="480" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">② Mask Decoder：唯一撮合两者的地方（和Q154 GroundingDINO交叉注意力同源）</text>
  <!-- step1 -->
  <rect x="40" y="224" width="880" height="56" rx="5" fill="#fff" stroke="#60a5fa"/>
  <text x="56" y="244" font-size="10" font-weight="bold" fill="#1e40af">1. 构造 Query：提示编码(点/框向量) + 可学习输出token(类DETR object query，专出掩码+置信度) 拼一起</text>
  <text x="56" y="264" font-size="9.5" fill="#6b7280">输出token不代表任何真实提示，是"名额"，负责最终产出掩码和IoU分数</text>
  <!-- step2 -->
  <rect x="40" y="288" width="880" height="94" rx="5" fill="#fff" stroke="#60a5fa"/>
  <text x="56" y="308" font-size="10" font-weight="bold" fill="#1e40af">2. 双向交叉注意力(two-way attention)：提示/输出token ↔ 图像embedding 来回查</text>
  <text x="56" y="328" font-size="9.5" fill="#374151">Query(提示+输出token)去查图像embedding："我这个点周围哪些区域和我相关"</text>
  <text x="56" y="346" font-size="9.5" fill="#374151">图像embedding反过来也查提示token，来回几轮 → "点"的信息逐渐扩散渗透到对应的整个物体范围</text>
  <text x="56" y="366" font-size="9" fill="#6b7280">与GroundingDINO图文交叉注意力(Q154)同一机制，只是这次是"提示token↔图像token"</text>
  <!-- step3 -->
  <rect x="40" y="390" width="430" height="60" rx="5" fill="#fff" stroke="#60a5fa"/>
  <text x="255" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">3. 上采样成像素级掩码</text>
  <text x="56" y="430" font-size="9.5" fill="#374151">64×64粗糙关联图 → 转置卷积上采样</text>
  <text x="56" y="446" font-size="9.5" fill="#374151">→ 接近原图分辨率的逐像素二值掩码</text>
  <!-- step4 -->
  <rect x="490" y="390" width="430" height="60" rx="5" fill="#fff" stroke="#60a5fa"/>
  <text x="705" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">4. 顺带出置信度</text>
  <text x="506" y="430" font-size="9.5" fill="#374151">每个输出token接一个小头</text>
  <text x="506" y="446" font-size="9.5" fill="#374151">预测该掩码候选的预估IoU(质量分数)</text>
  <text x="480" y="482" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">没有这道工序：图像embedding+提示embedding硬凑不出"逐像素、跟随提示形状"的掩码</text>
  <text x="480" y="502" text-anchor="middle" font-size="9.5" fill="#374151">特征匹配(哪里相关)和分辨率还原(精确到像素)都需要专门的网络结构去做</text>

  <!-- ③ 为什么轻而独立 -->
  <rect x="20" y="530" width="440" height="120" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="240" y="552" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">③ 为什么设计成"轻量独立"模块</text>
  <text x="36" y="576" font-size="9.5" fill="#374151">交互场景：用户点一下、觉得不对、再调整</text>
  <text x="36" y="594" font-size="9.5" fill="#374151">若每次都重跑贵的ViT编码器→体验卡</text>
  <text x="36" y="616" font-size="9.5" fill="#15803d" font-weight="bold">拆分：图像编码器只在换图时跑一次(缓存)</text>
  <text x="36" y="634" font-size="9.5" fill="#15803d" font-weight="bold">Mask Decoder极轻(几十毫秒)，换提示只重算这块</text>

  <!-- ④ 消解歧义 -->
  <rect x="480" y="530" width="460" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="710" y="552" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">④ 消解"一点多解"的天然歧义</text>
  <text x="496" y="576" font-size="9.5" fill="#374151">衬衫纽扣上点一下：想要纽扣/整件衬衫/这个人？</text>
  <text x="496" y="594" font-size="9.5" fill="#374151">三个答案都对——点提示本身有歧义</text>
  <text x="496" y="616" font-size="9.5" fill="#6d28d9" font-weight="bold">解码器一次输出3个不同粒度掩码候选</text>
  <text x="496" y="634" font-size="9.5" fill="#6d28d9" font-weight="bold">(整体/部分/子部分)+各自置信度，供下游选</text>

  <!-- 一句话 -->
  <rect x="20" y="666" width="920" height="94" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="480" y="690" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">一句话：Mask Decoder是唯一"知道图像内容"和"知道用户意图"两者交汇的地方——</text>
  <text x="480" y="712" text-anchor="middle" font-size="9.5" fill="#374151">靠交叉注意力让提示去图像特征里定位相关区域、靠上采样还原成像素级掩码、靠多掩码+置信度头解决点提示的天然歧义；</text>
  <text x="480" y="734" text-anchor="middle" font-size="9.5" fill="#374151">设计得轻而独立，是为了让重的图像编码只跑一次、频繁变化的提示响应能实时重算——这是SAM"交互式实时分割"的工程核心。</text>
</svg>
