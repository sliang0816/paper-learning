<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" font-family="'Microsoft YaHei',sans-serif">
  <rect width="680" height="210" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">SE-Net：通道注意力（Squeeze-Excitation）</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="20"  y="80" width="80" height="56" rx="4" fill="#dbeafe" stroke="#3b82f6"/><text x="60" y="112">特征图</text><text x="60" y="152" fill="#6b7280">C×H×W</text>
    <rect x="140" y="92" width="90" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="185" y="112">① Squeeze</text>
    <rect x="270" y="92" width="100" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="320" y="112">② Excitation</text>
    <rect x="410" y="92" width="90" height="32" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="455" y="112">③ Scale</text>
    <rect x="540" y="80" width="80" height="56" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="580" y="108">重标定</text><text x="580" y="122">特征图</text>
  </g>
  <text x="185" y="142" text-anchor="middle" font-size="9" fill="#0284c7">全局平均池化→C×1×1</text>
  <text x="320" y="142" text-anchor="middle" font-size="9" fill="#b45309">FC→ReLU→FC→Sigmoid</text>
  <text x="455" y="142" text-anchor="middle" font-size="9" fill="#7c3aed">权重逐通道相乘</text>
  <g stroke="#374151" stroke-width="1.6">
    <line x1="100" y1="108" x2="138" y2="108" marker-end="url(#a26)"/>
    <line x1="230" y1="108" x2="268" y2="108" marker-end="url(#a26)"/>
    <line x1="370" y1="108" x2="408" y2="108" marker-end="url(#a26)"/>
    <line x1="500" y1="108" x2="538" y2="108" marker-end="url(#a26)"/>
  </g>
  <text x="340" y="188" text-anchor="middle" font-size="11.5" fill="#6b7280">"看什么特征"：放大重要通道、抑制无关通道。只有通道维 → CBAM 在此基础上加空间维</text>
  <defs><marker id="a26" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
