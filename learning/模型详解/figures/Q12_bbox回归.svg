<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="'Microsoft YaHei',sans-serif">
  <rect width="700" height="290" fill="#fff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">R-CNN 边框回归：学"候选框 P → 真值框 G"的偏移</text>

  <!-- 左：示意图 -->
  <rect x="60" y="70" width="150" height="110" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="135" y="64" text-anchor="middle" font-size="11" fill="#3b82f6">候选框 P</text>
  <circle cx="135" cy="125" r="3" fill="#3b82f6"/>
  <rect x="110" y="95" width="160" height="120" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="228" text-anchor="middle" font-size="11" fill="#16a34a">真值框 G</text>
  <circle cx="190" cy="155" r="3" fill="#16a34a"/>
  <line x1="135" y1="125" x2="190" y2="155" stroke="#ef4444" stroke-width="1.6" marker-end="url(#aq12)"/>
  <text x="150" y="150" font-size="10" fill="#ef4444">中心平移</text>

  <!-- 右：公式 -->
  <rect x="320" y="60" width="360" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="338" y="82" font-size="12" font-weight="bold" fill="#374151">学 4 个偏移量（非绝对坐标）</text>
  <text x="338" y="106" font-size="12" fill="#111827">tx = (Gx − Px) / Pw　　ty = (Gy − Py) / Ph</text>
  <text x="338" y="130" font-size="12" fill="#111827">tw = log(Gw / Pw)　　th = log(Gh / Ph)</text>
  <text x="338" y="154" font-size="10.5" fill="#6b7280">归一化→尺度无关；log→缩放为正、变化平滑</text>
  <text x="338" y="172" font-size="10.5" fill="#6b7280">模型：d(P)=wᵀ·pool5特征(P)，线性回归</text>

  <!-- 底：训练 -->
  <rect x="40" y="200" width="640" height="74" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="58" y="222" font-size="12" font-weight="bold" fill="#b45309">训练（第④阶段，每类一套，在冻结 CNN 特征上）</text>
  <text x="58" y="244" font-size="11.5" fill="#374151">样本：与 GT 的 IoU ≥ 0.6 的候选框（够近才能微调到位）；标签 = 上式算出的 4 个 t</text>
  <text x="58" y="264" font-size="11.5" fill="#374151">损失：带 L2 正则的最小二乘（岭回归）。Fast R-CNN 后并入多任务损失(Smooth L1)端到端训</text>
  <defs><marker id="aq12" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ef4444"/></marker></defs>
</svg>
