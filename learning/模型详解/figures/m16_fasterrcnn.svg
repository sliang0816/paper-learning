<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="'Microsoft YaHei',sans-serif">
  <rect width="700" height="250" fill="#fff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Faster R-CNN：RPN 生成候选框（端到端）</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="20"  y="100" width="90" height="50" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="65" y="130">整图</text>
    <rect x="150" y="100" width="110" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="205" y="122">CNN Backbone</text><text x="205" y="140">共享特征图</text>
    <rect x="320" y="40" width="130" height="46" rx="6" fill="#fff7ed" stroke="#f59e0b"/><text x="385" y="60">RPN</text><text x="385" y="78" font-size="10.5">Anchor→候选框</text>
    <rect x="320" y="160" width="130" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="385" y="182">RoI Pooling</text><text x="385" y="200">+ 检测头</text>
    <rect x="500" y="160" width="120" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="560" y="182">分类 +</text><text x="560" y="200">边框回归</text>
  </g>
  <g stroke="#374151" stroke-width="1.8">
    <line x1="110" y1="125" x2="148" y2="125" marker-end="url(#a10)"/>
    <line x1="260" y1="115" x2="318" y2="70"  marker-end="url(#a10)"/>
    <line x1="260" y1="135" x2="318" y2="185" marker-end="url(#a10)"/>
    <line x1="385" y1="86" x2="385" y2="158" stroke="#f59e0b" marker-end="url(#a10f)"/>
    <line x1="450" y1="185" x2="498" y2="185" marker-end="url(#a10)"/>
  </g>
  <text x="385" y="128" font-size="10.5" fill="#f59e0b">候选框</text>
  <text x="350" y="238" text-anchor="middle" font-size="12" fill="#6b7280">RPN 用神经网络替代 Selective Search，与检测头共享特征 → Anchor 机制成两阶段标准模板</text>
  <defs>
    <marker id="a10" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="a10f" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
