<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'Microsoft YaHei',sans-serif">
  <rect width="960" height="760" fill="#fff"/>
  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q156 区域特征 VLP 三件套：MLM(以图猜词) + MRM(以词猜图) + ITM(图文匹不匹配)</text>

  <!-- MLM -->
  <rect x="20" y="42" width="440" height="210" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="240" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">MLM：遮词，靠"上下文词+图像区域"猜</text>
  <text x="36" y="88" font-size="9.5" font-family="Consolas,monospace" fill="#374151">原句: a man riding a bicycle on street</text>
  <text x="36" y="106" font-size="9.5" font-family="Consolas,monospace" fill="#b91c1c">遮词: a man riding a [MASK] on street</text>
  <text x="36" y="128" font-size="9.5" fill="#374151">输入：[文本token(含MASK)] + [N个区域token]</text>
  <text x="36" y="148" font-size="9.5" fill="#374151">（其中一个区域长得像自行车）</text>
  <text x="36" y="172" font-size="9.5" fill="#1e40af">预测：[MASK]位置最终隐藏向量→线性层</text>
  <text x="52" y="190" font-size="9.5" fill="#1e40af">→词表softmax→目标"bicycle"</text>
  <text x="36" y="214" font-size="9" fill="#15803d">关键：不仅看文本上下文，还能"看到"图里</text>
  <text x="36" y="230" font-size="9" fill="#15803d">那块像自行车 → 逼模型学"词接视觉证据"</text>

  <!-- MRM -->
  <rect x="500" y="42" width="440" height="210" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="720" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">MRM：遮区域(镜像)，靠"文本+其余区域"猜</text>
  <text x="516" y="88" font-size="9.5" fill="#374151">原区域：车轮子区域特征（检测器给的类别</text>
  <text x="516" y="104" font-size="9.5" fill="#374151">分布：bicycle 0.75, motorcycle 0.1,…）</text>
  <text x="516" y="126" font-size="9.5" fill="#b91c1c">遮住：该区域特征替换成 [MASK] 向量</text>
  <text x="516" y="148" font-size="9.5" fill="#374151">输入：[完整文本"...bicycle..."] + [其余</text>
  <text x="516" y="164" font-size="9.5" fill="#374151">区域] + [被遮区域用MASK占位]</text>
  <text x="516" y="188" font-size="9.5" fill="#15803d">预测两种变体：①特征回归(L2重建原始</text>
  <text x="532" y="204" font-size="9.5" fill="#15803d">特征向量) ②类别预测(KL散度逼近检测</text>
  <text x="532" y="220" font-size="9.5" fill="#15803d">器软标签分布)</text>
  <text x="516" y="242" font-size="9" fill="#1e40af">与MLM镜像："以词猜图"，text里写着bicycle</text>

  <!-- ITM -->
  <rect x="20" y="270" width="920" height="190" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="480" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">ITM：图文匹配，判断题（不是补全，是二分类）</text>
  <rect x="40" y="308" width="420" height="60" rx="5" fill="#fff" stroke="#16a34a"/>
  <text x="250" y="328" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">正样本</text>
  <text x="250" y="348" text-anchor="middle" font-size="9.5" fill="#374151">图(自行车) + "a man riding a bicycle" → 匹配(1)</text>
  <rect x="500" y="308" width="420" height="60" rx="5" fill="#fff" stroke="#ef4444"/>
  <text x="710" y="328" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b91c1c">负样本(随机拼接不相关文本)</text>
  <text x="710" y="348" text-anchor="middle" font-size="9.5" fill="#374151">图(自行车) + "a woman cooking dinner" → 不匹配(0)</text>
  <text x="480" y="392" text-anchor="middle" font-size="10.5" font-family="Consolas,monospace" fill="#6d28d9">[CLS] 位置最终隐藏向量 → FC → sigmoid → 匹配概率</text>
  <text x="480" y="414" text-anchor="middle" font-size="9.5" fill="#374151">整体判断"这图文搭不搭"，非局部细节；UNITER 等还加词-区域对齐损失(WRA/最优传输)加强</text>
  <text x="480" y="436" text-anchor="middle" font-size="9" fill="#6b7280">用序列的"pooled token"([CLS]最终向量)，见 Q157</text>

  <!-- 为什么凑一起 -->
  <rect x="20" y="474" width="920" height="184" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="496" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">为什么三个要凑在一起：互补，各补对方短板</text>
  <g font-size="10">
    <text x="40" y="522" font-weight="bold" fill="#1e40af">MLM</text><text x="90" y="522" fill="#374151">以图猜词，细粒度(词级)——只关心某词对不对，不管整体图文相关性</text>
    <text x="40" y="548" font-weight="bold" fill="#15803d">MRM</text><text x="90" y="548" fill="#374151">以词猜图，细粒度(区域级)——同上反方向</text>
    <text x="40" y="574" font-weight="bold" fill="#6d28d9">ITM</text><text x="90" y="574" fill="#374151">整体图文相关，粗粒度(全局)——只判断搭不搭，不逼模型学细节对齐</text>
  </g>
  <text x="480" y="606" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">三损失加权求和、同一batch同时训练（非分阶段）</text>
  <text x="480" y="630" text-anchor="middle" font-size="9.5" fill="#374151">少MLM/MRM→只学"整体像不像"不学"哪个词对哪个物体"；少ITM→缺全局判断力、易被局部巧合误导</text>
  <text x="480" y="650" text-anchor="middle" font-size="9" fill="#6b7280">三者=BERT式"完形填空"在跨模态上的完整版本；对照CLIP只有一个对比学习目标（无需区域标注/检测器）</text>

  <!-- 一句话 -->
  <rect x="20" y="666" width="920" height="70" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="480" y="690" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">一句话：MLM=以图猜词、MRM=以词猜图（一对镜像细粒度任务）、ITM=整体图文搭不搭（粗粒度判断）；</text>
  <text x="480" y="712" text-anchor="middle" font-size="9.5" fill="#374151">三者互补同时训练，让模型既学会局部词↔区域细节对齐、又学会全局图文一致性判断——CLIP只对比、无此三件套。</text>
</svg>
