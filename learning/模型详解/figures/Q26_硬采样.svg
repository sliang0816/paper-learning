<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="330" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">为什么要"硬"采样：易负样本无用且淹没梯度，只留难负</text>

  <!-- 全部负样本 -->
  <text x="120" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">海量负样本（按损失排序）</text>
  <g>
    <rect x="40" y="72" width="160" height="20" fill="#dcfce7" stroke="#86efac"/><text x="120" y="87" text-anchor="middle" font-size="9" fill="#15803d">易负：一眼是背景，loss≈0</text>
    <rect x="40" y="94" width="160" height="20" fill="#dcfce7" stroke="#86efac"/><text x="120" y="109" text-anchor="middle" font-size="9" fill="#15803d">易负 loss≈0</text>
    <rect x="40" y="116" width="160" height="20" fill="#dcfce7" stroke="#86efac"/><text x="120" y="131" text-anchor="middle" font-size="9" fill="#15803d">易负 loss≈0（数量巨大…）</text>
    <rect x="40" y="138" width="160" height="20" fill="#fef9c3" stroke="#ca8a04"/><text x="120" y="153" text-anchor="middle" font-size="9" fill="#a16207">中等</text>
    <rect x="40" y="160" width="160" height="22" fill="#fee2e2" stroke="#ef4444"/><text x="120" y="175" text-anchor="middle" font-size="9" fill="#b91c1c">难负：像目标的背景 loss 高</text>
  </g>
  <text x="120" y="200" text-anchor="middle" font-size="9" fill="#6b7280">↑ 易负数量碾压，但几乎无学习信号</text>

  <!-- 箭头 -->
  <text x="250" y="130" font-size="22" fill="#9ca3af">→</text>
  <text x="250" y="150" font-size="9" fill="#6b7280">排序取top-k</text>

  <!-- 采样后 -->
  <text x="430" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">硬采样后（固定正负比 1:3）</text>
  <g>
    <rect x="330" y="72" width="120" height="22" fill="#dbeafe" stroke="#3b82f6"/><text x="390" y="87" text-anchor="middle" font-size="9" fill="#1d4ed8">正样本 ×1</text>
    <rect x="330" y="100" width="120" height="20" fill="#fee2e2" stroke="#ef4444"/><text x="390" y="114" text-anchor="middle" font-size="9" fill="#b91c1c">难负 ×3（只留最难的）</text>
    <rect x="330" y="124" width="120" height="16" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="3 2"/><text x="390" y="136" text-anchor="middle" font-size="8" fill="#9ca3af">易负：丢弃</text>
  </g>
  <text x="390" y="160" text-anchor="middle" font-size="9" fill="#15803d">梯度由"有用的难例"主导 → 学得动</text>

  <!-- 为什么是"难" -->
  <rect x="480" y="72" width="220" height="120" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="590" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a16207">为什么偏要"难"负样本</text>
  <text x="494" y="112" font-size="9.5" fill="#374151">• 易负已分对，loss/梯度≈0</text>
  <text x="494" y="128" font-size="9.5" fill="#374151">　→ 学不到东西，还稀释梯度</text>
  <text x="494" y="146" font-size="9.5" fill="#374151">• 难负在决策边界（像目标的背景）</text>
  <text x="494" y="162" font-size="9.5" fill="#374151">　→ 正是模型需要学会拒绝的</text>
  <text x="494" y="182" font-size="9" fill="#b45309">练难例最长本事，省算又有效</text>

  <!-- 底注 -->
  <rect x="40" y="220" width="660" height="100" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="242" font-size="11.5" font-weight="bold" fill="#374151">一句话：稠密预测产生海量易分背景（Q25），全用则淹没正样本梯度。硬采样 = 按损失排序，只留最难的负样本、固定正负比。</text>
  <text x="56" y="263" font-size="11" fill="#374151">代表：OHEM（在线难例挖掘）、SSD 难负挖掘（1:3）、R-CNN 难负挖掘（迭代加入误判样本，见 Q11）。</text>
  <text x="56" y="283" font-size="11" fill="#374151">与 Focal Loss 对比：硬采样是<tspan fill="#b91c1c">离散的"扔掉/保留"</tspan>；Focal Loss 是<tspan fill="#16a34a">连续的"给易样本降权"</tspan>——同一问题两种解法。</text>
  <text x="56" y="303" font-size="10.5" fill="#6b7280">Focal Loss 更优雅：不丢样本、不设比例阈值，全自动聚焦难例（见 19 RetinaNet）。</text>
</svg>
