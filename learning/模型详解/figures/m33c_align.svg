<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="340" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">ALIGN：18亿噪声图文对对比学习（Google，2021）</text>

  <!-- ===== LEFT: Data pipeline ===== -->
  <text x="152" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">数据策略：规模 vs 质量</text>
  <rect x="20" y="60" width="264" height="224" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>

  <!-- CLIP -->
  <rect x="36" y="74" width="232" height="52" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="152" y="91" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">CLIP（OpenAI，同期）</text>
  <text x="152" y="106" text-anchor="middle" font-size="9.5" fill="#374151">4 亿对 · 精细语义过滤</text>
  <text x="152" y="120" text-anchor="middle" font-size="9" fill="#6b7280">复杂清洗流水线（相关性筛选）</text>

  <text x="152" y="142" text-anchor="middle" font-size="14" fill="#374151">vs</text>

  <!-- ALIGN -->
  <rect x="36" y="150" width="232" height="52" rx="4" fill="#fde68a" stroke="#d97706"/>
  <text x="152" y="167" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">ALIGN（Google，本文）</text>
  <text x="152" y="182" text-anchor="middle" font-size="9.5" fill="#374151">18 亿对 · 最简过滤</text>
  <text x="152" y="196" text-anchor="middle" font-size="9" fill="#6b7280">只删极短 alt-text &amp; 色情内容</text>

  <!-- Result -->
  <rect x="36" y="212" width="232" height="28" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="152" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">ALIGN 结果：ImageNet 零样本 88.4% Top-1</text>

  <rect x="36" y="248" width="232" height="26" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="152" y="261" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">核心结论：规模 &gt; 精细过滤</text>
  <text x="152" y="274" text-anchor="middle" font-size="9" fill="#374151">噪声样本自然被对比损失淡化</text>

  <!-- ===== CENTER: Architecture ===== -->
  <text x="448" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">双编码器对比学习</text>
  <rect x="296" y="60" width="304" height="224" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>

  <!-- Image path -->
  <rect x="312" y="74" width="110" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="367" y="91" text-anchor="middle" font-size="10">图像 I</text>
  <text x="367" y="105" text-anchor="middle" font-size="8.5" fill="#6b7280">alt-text 配对网络图片</text>

  <line x1="367" y1="112" x2="367" y2="128" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="312" y="128" width="110" height="38" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="367" y="145" text-anchor="middle" font-size="10">EfficientNet-L2</text>
  <text x="367" y="159" text-anchor="middle" font-size="8.5" fill="#6b7280">图像编码器（~480M）</text>

  <line x1="367" y1="166" x2="367" y2="182" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="312" y="182" width="110" height="32" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="367" y="200" text-anchor="middle" font-size="10">图像嵌入 v</text>
  <text x="367" y="213" text-anchor="middle" font-size="8.5" fill="#6b7280">L2 归一化</text>

  <!-- Text path -->
  <rect x="474" y="74" width="110" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="529" y="91" text-anchor="middle" font-size="10">文本 T</text>
  <text x="529" y="105" text-anchor="middle" font-size="8.5" fill="#6b7280">网页 alt-text</text>

  <line x1="529" y1="112" x2="529" y2="128" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="474" y="128" width="110" height="38" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="529" y="145" text-anchor="middle" font-size="10">BERT-Large</text>
  <text x="529" y="159" text-anchor="middle" font-size="8.5" fill="#6b7280">文本编码器（[CLS] token）</text>

  <line x1="529" y1="166" x2="529" y2="182" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>

  <rect x="474" y="182" width="110" height="32" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="529" y="200" text-anchor="middle" font-size="10">文本嵌入 u</text>
  <text x="529" y="213" text-anchor="middle" font-size="8.5" fill="#6b7280">L2 归一化</text>

  <!-- Similarity matrix -->
  <rect x="322" y="228" width="252" height="44" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="448" y="245" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">余弦相似度矩阵 + in-batch softmax</text>
  <text x="448" y="261" text-anchor="middle" font-size="9.5" fill="#374151">L = −½ [Σᵢ log(exp(v·uᵢ/σ) / Σⱼ exp(v·uⱼ/σ)) + 对称项]</text>
  <text x="448" y="275" text-anchor="middle" font-size="8.5" fill="#6b7280">σ = 可学习温度；N=16,384 大 batch</text>

  <line x1="367" y1="214" x2="367" y2="228" stroke="#374151" stroke-width="1.2" stroke-dasharray="3 1"/>
  <line x1="529" y1="214" x2="529" y2="228" stroke="#374151" stroke-width="1.2" stroke-dasharray="3 1"/>

  <!-- ===== RIGHT: Zero-shot + comparison ===== -->
  <text x="692" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">零样本分类</text>
  <rect x="612" y="60" width="188" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a"/>

  <text x="706" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">Zero-shot 流程</text>
  <text x="706" y="96" text-anchor="middle" font-size="9.5" fill="#374151">文本模板：</text>
  <text x="706" y="112" text-anchor="middle" font-size="9.5" fill="#374151">"a photo of a {cls}"</text>
  <text x="706" y="130" text-anchor="middle" font-size="9.5" fill="#374151">→ 计算所有类文本嵌入</text>
  <text x="706" y="146" text-anchor="middle" font-size="9.5" fill="#374151">→ 余弦最近邻分类</text>
  <text x="706" y="165" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c3aed">本项目 CLIP 同样流程</text>
  <text x="706" y="180" text-anchor="middle" font-size="9" fill="#6b7280">（ALIGN 未开源，选 CLIP）</text>

  <!-- Performance comparison -->
  <rect x="612" y="200" width="188" height="84" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="706" y="217" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">主要指标对比</text>
  <g font-size="9.5" text-anchor="middle">
    <text x="680" y="234">指标</text>          <text x="772" y="234">数值</text>
    <text x="680" y="250" fill="#374151">ImageNet ZS Top-1</text>  <text x="772" y="250" fill="#16a34a" font-weight="bold">88.4%</text>
    <text x="680" y="266" fill="#374151">Flickr30k 图搜文 R@1</text><text x="772" y="266" fill="#16a34a" font-weight="bold">95.3%</text>
    <text x="680" y="282" fill="#374151">MS-COCO 图搜文 R@1</text>  <text x="772" y="282" fill="#16a34a" font-weight="bold">88.6%</text>
  </g>

  <!-- Bottom note -->
  <rect x="20" y="298" width="780" height="28" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="314" text-anchor="middle" font-size="9.5" fill="#374151">ALIGN 发布后（Google 未开源）启发了 LAION 社区构建 LAION-400M/5B 开源数据集（5B 对 · 同样最简过滤策略），OpenCLIP 在其上训练，精度接近甚至超越原版 CLIP</text>

  <defs>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <marker id="av" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
