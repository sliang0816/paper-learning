<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Microsoft YaHei',sans-serif">
  <rect width="900" height="440" fill="#fff"/>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q109 什么是 top-1——只看模型给出的"最高分那一个"预测</text>

  <!-- 排序 -->
  <rect x="20" y="44" width="440" height="230" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="240" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">CLIP 相似度从高到低排序（一个 crop）</text>
  <rect x="60" y="82" width="360" height="30" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="102" font-size="11" font-weight="bold" fill="#15803d">glass    0.71　← 排第 1 = top-1 ★</text>
  <rect x="60" y="118" width="360" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="136" font-size="10" fill="#374151">plastic  0.12　排第 2</text>
  <rect x="60" y="150" width="360" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="168" font-size="10" fill="#374151">stone    0.08　排第 3</text>
  <rect x="60" y="182" width="360" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="200" font-size="10" fill="#374151">metal    0.05　排第 4 …</text>
  <text x="240" y="232" text-anchor="middle" font-size="10" fill="#15803d">top-1 预测 = 分数最高的那个类（= glass）</text>
  <text x="240" y="254" text-anchor="middle" font-size="9.5" fill="#374151">若真值就是 glass → 这一样本 top-1 判对</text>

  <!-- 识别率 -->
  <rect x="470" y="44" width="410" height="230" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="675" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">top-1 识别率（top-1 accuracy）</text>
  <text x="486" y="94" font-size="10" fill="#374151">= 所有样本里，"最高分那个正好是正确答案"</text>
  <text x="486" y="112" font-size="10" fill="#374151">　的比例</text>
  <rect x="486" y="128" width="378" height="52" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="675" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">你论文的指标：零样本 top-1 识别率 ≥ 60%</text>
  <text x="675" y="168" text-anchor="middle" font-size="9" fill="#374151">= GL/ME 未训练类的 crop，CLIP 一次猜(取最高分)就对的概率 ≥60%</text>
  <text x="486" y="204" font-size="9.5" fill="#6b7280">"一次就猜对" = 只给一次机会、只取排第 1 的预测</text>
  <text x="486" y="226" font-size="9.5" fill="#6b7280">越高说明零样本能力越强；误判(如 GL→PL)会拉低它</text>
  <text x="486" y="252" font-size="9.5" fill="#15803d">→ 是衡量 CLIP 零样本机制在未见类上准不准的主指标</text>

  <!-- top-1 vs top-5 -->
  <rect x="20" y="288" width="860" height="96" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="450" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">对比 top-5（区分）</text>
  <line x1="300" y1="318" x2="300" y2="376" stroke="#c4b5fd"/>
  <line x1="600" y1="318" x2="600" y2="376" stroke="#c4b5fd"/>
  <text x="160" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">　</text>
  <text x="450" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">判对的标准</text>
  <text x="740" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">严格度</text>
  <text x="160" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">top-1</text>
  <text x="450" y="360" text-anchor="middle" font-size="9.5" fill="#374151">最高分那 1 个就是正确类</text>
  <text x="740" y="360" text-anchor="middle" font-size="9.5" fill="#374151">严（常用）</text>
  <text x="160" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">top-5</text>
  <text x="450" y="378" text-anchor="middle" font-size="9.5" fill="#374151">正确类落在最高分前 5 个里即算对</text>
  <text x="740" y="378" text-anchor="middle" font-size="9.5" fill="#374151">宽松（ImageNet 1000 类常用）</text>

  <!-- 一句话 -->
  <rect x="20" y="398" width="860" height="30" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="450" y="418" text-anchor="middle" font-size="10" fill="#374151">一句话：top-1 = 只认分数最高的那个预测；本项目只有 8 类，用 top-1 比 top-5 更合适、更能说明问题。</text>
</svg>
