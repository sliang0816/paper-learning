<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="340" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Flow Matching vs DDPM：直线路径 → 更少采样步数（SD3/FLUX 核心）</text>

  <!-- ===== LEFT: DDPM curved path ===== -->
  <text x="160" y="52" text-anchor="middle" font-size="11" fill="#ef4444">DDPM（曲线路径，500-1000步）</text>
  <rect x="20" y="60" width="280" height="200" rx="6" fill="#fff5f5" stroke="#ef4444" stroke-dasharray="4 2"/>

  <!-- Curved trajectory illustration -->
  <!-- Noise start (top-left) to data (bottom-right) via curved path -->
  <circle cx="50" cy="90" r="14" fill="#fca5a5" stroke="#ef4444" stroke-width="2"/>
  <text x="50" y="95" text-anchor="middle" font-size="8.5" fill="#7f1d1d">z₀ 噪声</text>

  <!-- Curved path: bezier curve -->
  <path d="M 64 90 Q 100 180 160 140 Q 220 100 270 220" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="0" marker-end="url(#ae)"/>

  <!-- Intermediate points on curve -->
  <circle cx="100" cy="155" r="5" fill="#fca5a5" stroke="#ef4444"/>
  <circle cx="140" cy="142" r="5" fill="#fca5a5" stroke="#ef4444"/>
  <circle cx="180" cy="136" r="5" fill="#fca5a5" stroke="#ef4444"/>
  <circle cx="220" cy="150" r="5" fill="#fca5a5" stroke="#ef4444"/>

  <circle cx="270" cy="210" r="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="270" y="215" text-anchor="middle" font-size="8.5" fill="#7c2d12">z₁ 图像</text>

  <text x="160" y="244" text-anchor="middle" font-size="9.5" fill="#ef4444">弯曲轨迹 = 小步积分才准确</text>
  <text x="160" y="258" text-anchor="middle" font-size="9.5" fill="#ef4444">每步预测噪声 ε（或 v-param）</text>
  <text x="160" y="272" text-anchor="middle" font-size="9.5" fill="#6b7280">50-1000 步才达高质量</text>

  <!-- ===== CENTER: Flow Matching straight path ===== -->
  <text x="460" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Flow Matching（直线路径，8-25步）</text>
  <rect x="320" y="60" width="280" height="200" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>

  <!-- Straight path -->
  <circle cx="350" cy="90" r="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" font-size="8.5" fill="#065f46">x₀ 噪声</text>

  <!-- Straight arrow -->
  <line x1="364" y1="90" x2="556" y2="210" stroke="#16a34a" stroke-width="2.8" marker-end="url(#ag)"/>

  <!-- Intermediate points on straight line -->
  <circle cx="420" cy="130" r="5" fill="#86efac" stroke="#16a34a"/>
  <circle cx="460" cy="155" r="5" fill="#86efac" stroke="#16a34a"/>
  <circle cx="500" cy="180" r="5" fill="#86efac" stroke="#16a34a"/>

  <!-- Velocity vector annotation -->
  <text x="450" y="112" text-anchor="middle" font-size="9.5" fill="#065f46">速度向量 v = x₁ - x₀</text>
  <text x="450" y="126" text-anchor="middle" font-size="9.5" fill="#065f46">（处处恒定！）</text>

  <circle cx="560" cy="210" r="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="215" text-anchor="middle" font-size="8.5" fill="#7c2d12">x₁ 图像</text>

  <text x="460" y="245" text-anchor="middle" font-size="9.5" fill="#16a34a">直线轨迹 = 大步也准确</text>
  <text x="460" y="260" text-anchor="middle" font-size="9.5" fill="#16a34a">训练目标：‖vθ(zt,t) − (x₁−x₀)‖²</text>
  <text x="460" y="274" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">插值：zt = (1-t)x₀ + tx₁</text>

  <!-- ===== RIGHT: Key points ===== -->
  <rect x="614" y="60" width="186" height="200" rx="8" fill="#f9fafb" stroke="#e2e8f0"/>
  <text x="707" y="78" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">关键对比</text>
  <g font-size="9.5" text-anchor="middle">
    <text x="660" y="96" font-weight="bold">DDPM</text>     <text x="772" y="96" font-weight="bold">Flow M.</text>
    <text x="660" y="114" fill="#6b7280">路径</text>       <text x="640" y="114" fill="#ef4444">曲线</text>   <text x="772" y="114" fill="#16a34a">直线</text>
    <text x="660" y="132" fill="#6b7280">步数</text>       <text x="640" y="132" fill="#ef4444">50-1000</text> <text x="772" y="132" fill="#16a34a">8-25</text>
    <text x="660" y="150" fill="#6b7280">预测目标</text>   <text x="640" y="150" fill="#374151">ε 或 v</text>  <text x="772" y="150" fill="#374151">v=x₁-x₀</text>
    <text x="660" y="168" fill="#6b7280">损失权重</text>   <text x="640" y="168" fill="#374151">时变加权</text> <text x="772" y="168" fill="#374151">等权 MSE</text>
    <text x="660" y="186" fill="#6b7280">代表</text>       <text x="640" y="186" fill="#374151">SD1/2</text>   <text x="772" y="186" fill="#7c3aed">SD3/FLUX</text>
    <text x="660" y="204" fill="#6b7280">理论基础</text>   <text x="640" y="204" fill="#374151">Score M.</text> <text x="772" y="204" fill="#374151">最优传输</text>
    <text x="660" y="222" fill="#6b7280">Rectified</text>  <text x="640" y="222" fill="#ef4444">无</text>      <text x="772" y="222" fill="#16a34a">Reflow</text>
  </g>

  <!-- Bottom -->
  <rect x="20" y="276" width="780" height="50" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="410" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">代表模型</text>
  <text x="410" y="312" text-anchor="middle" font-size="9.5" fill="#374151">SD3（2024，Stability AI）= Flow Matching + DiT（Diffusion Transformer） + 三路文本编码器（CLIP-L/G + T5-XXL）</text>
  <text x="410" y="326" text-anchor="middle" font-size="9.5" fill="#374151">FLUX.1（2024，Black Forest Labs）= Flow Matching + 双流 DiT；schnell 版 4 步生成；dev/pro 版最高质量，超越 DALL·E 3</text>

  <defs>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ef4444"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
