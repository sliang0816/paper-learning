<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="800" height="340" fill="#fff"/>
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">ResNeXt：引入 Cardinality — 同参数量，精度更高</text>

  <!-- ResNet bottleneck (left) -->
  <text x="190" y="52" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">ResNet 瓶颈块</text>

  <rect x="130" y="60" width="120" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="190" y="82" text-anchor="middle" font-size="10.5">输入 256ch</text>

  <rect x="130" y="112" width="120" height="34" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="128" text-anchor="middle" font-size="10.5">1×1 conv → 64ch</text>
  <text x="190" y="142" text-anchor="middle" font-size="9" fill="#6b7280">降维</text>

  <rect x="130" y="164" width="120" height="34" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="180" text-anchor="middle" font-size="10.5">3×3 conv × 64</text>
  <text x="190" y="194" text-anchor="middle" font-size="9" fill="#6b7280">空间卷积</text>

  <rect x="130" y="216" width="120" height="34" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="232" text-anchor="middle" font-size="10.5">1×1 conv → 256ch</text>
  <text x="190" y="246" text-anchor="middle" font-size="9" fill="#6b7280">升维</text>

  <rect x="130" y="268" width="120" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="190" y="284" text-anchor="middle" font-size="10.5">⊕ 残差 + ReLU</text>
  <text x="190" y="298" text-anchor="middle" font-size="9" fill="#15803d">输出 256ch</text>

  <!-- arrows left -->
  <g stroke="#374151" stroke-width="1.4" marker-end="url(#a)">
    <line x1="190" y1="94" x2="190" y2="110"/>
    <line x1="190" y1="146" x2="190" y2="162"/>
    <line x1="190" y1="198" x2="190" y2="214"/>
    <line x1="190" y1="250" x2="190" y2="266"/>
  </g>
  <!-- residual skip left -->
  <path d="M120,77 C80,77 80,285 128,285" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2.5" marker-end="url(#ag)"/>

  <!-- divider -->
  <line x1="350" y1="40" x2="350" y2="320" stroke="#e5e7eb" stroke-width="1"/>
  <text x="368" y="52" font-size="11.5" font-weight="bold" fill="#7c3aed">ResNeXt 聚合残差变换（C=32 groups）</text>

  <!-- ResNeXt groups (right) -->
  <rect x="380" y="60" width="130" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="445" y="82" text-anchor="middle" font-size="10.5">输入 256ch</text>

  <!-- 3 representative groups -->
  <g font-size="9.5" text-anchor="middle">
    <rect x="370" y="112" width="82" height="40" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="411" y="129">Group 1</text>
    <text x="411" y="145" fill="#6b7280">1×1→3×3→1×1</text>

    <rect x="462" y="112" width="82" height="40" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="503" y="129">Group 2</text>
    <text x="503" y="145" fill="#6b7280">1×1→3×3→1×1</text>

    <text x="613" y="134" fill="#9ca3af" font-size="14">…</text>
    <text x="670" y="134" font-size="10">×32 groups</text>
  </g>

  <!-- aggregate sum -->
  <rect x="390" y="170" width="170" height="34" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="475" y="186" text-anchor="middle" font-size="10.5" fill="#b45309">Σ 各组求和（聚合）</text>
  <text x="475" y="200" text-anchor="middle" font-size="9" fill="#6b7280">等效 grouped conv，参数≈ResNet</text>

  <rect x="390" y="222" width="170" height="34" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="475" y="238" text-anchor="middle" font-size="10.5">1×1 conv → 256ch</text>

  <rect x="390" y="270" width="170" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="475" y="286" text-anchor="middle" font-size="10.5">⊕ 残差 + ReLU</text>
  <text x="475" y="300" text-anchor="middle" font-size="9" fill="#15803d">输出 256ch</text>

  <!-- arrows right -->
  <g stroke="#374151" stroke-width="1.4" marker-end="url(#a)">
    <line x1="445" y1="94" x2="445" y2="110"/>
    <line x1="411" y1="152" x2="411" y2="168"/>
    <line x1="503" y1="152" x2="503" y2="168"/>
    <line x1="475" y1="204" x2="475" y2="220"/>
    <line x1="475" y1="256" x2="475" y2="268"/>
  </g>
  <!-- residual skip right -->
  <path d="M380,77 C358,77 358,287 388,287" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2.5" marker-end="url(#ag)"/>

  <!-- bottom comparison note -->
  <rect x="20" y="316" width="760" height="18" rx="4" fill="#f0f9ff"/>
  <text x="400" y="329" text-anchor="middle" font-size="10" fill="#0369a1">三维权衡：深度(层数) / 宽度(通道数) / Cardinality(群数)。等参数下提升 Cardinality 比加深/加宽更高效 → 成为 CSPNet/YOLOv4 骨干的理论依据</text>

  <defs>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
