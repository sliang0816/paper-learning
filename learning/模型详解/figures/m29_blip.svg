<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="'Microsoft YaHei',sans-serif">
  <rect width="680" height="230" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">BLIP-2：Q-Former 桥接冻结视觉编码器与 LLM</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="30"  y="90" width="120" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="90" y="112">图像编码器</text><text x="90" y="130" font-size="10" fill="#3b82f6">(ViT, 冻结❄)</text>
    <rect x="200" y="84" width="140" height="68" rx="6" fill="#fde68a" stroke="#d97706"/><text x="270" y="110">Q-Former</text><text x="270" y="128" font-size="10" fill="#7c2d12">可学习query提取信息</text>
    <rect x="390" y="90" width="130" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="455" y="112">大语言模型</text><text x="455" y="130" font-size="10" fill="#6d28d9">(LLM, 冻结❄)</text>
    <rect x="560" y="92" width="100" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="610" y="114">生成文本</text><text x="610" y="132" font-size="10" fill="#16a34a">描述/问答</text>
  </g>
  <g stroke="#374151" stroke-width="1.8">
    <line x1="150" y1="118" x2="198" y2="118" marker-end="url(#a22)"/>
    <line x1="340" y1="118" x2="388" y2="118" marker-end="url(#a22)"/>
    <line x1="520" y1="118" x2="558" y2="118" marker-end="url(#a22)"/>
  </g>
  <text x="270" y="172" text-anchor="middle" font-size="10.5" fill="#b45309">只训练 Q-Former（两端冻结，省算）</text>
  <text x="340" y="205" text-anchor="middle" font-size="11.5" fill="#6b7280">比 CLIP 更强的图文理解+生成；本项目作可选「语义辅助」，主线仍用 CLIP（更轻量）</text>
  <defs><marker id="a22" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
