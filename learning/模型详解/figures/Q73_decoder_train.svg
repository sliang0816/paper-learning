<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" font-family="'Microsoft YaHei',sans-serif">
  <rect width="920" height="690" fill="#fff"/>
  <text x="460" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q73 DETR 解码器纵深：为何重复 L 次 · 自注意力 vs 交叉注意力 · 损失如何精确匹配</text>

  <!-- ===== left: one decoder layer internals ===== -->
  <rect x="20" y="44" width="430" height="300" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="235" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">解码器一层内部（重复 L=6 次）</text>

  <!-- self-attn -->
  <rect x="40" y="76" width="390" height="78" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="235" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">① query 自注意力（互相通气·分工）</text>
  <text x="54" y="115" font-size="9" fill="#374151">Q、K、V <tspan font-weight="bold">全来自同一组 query</tspan>（自己看自己）</text>
  <text x="54" y="131" font-size="9" fill="#374151">→ 各 query 看到别人在认领谁，避让不撞车</text>
  <text x="54" y="146" font-size="8.5" fill="#b91c1c">两个都飘向同一辆车 → 一个退去找别的目标</text>

  <text x="235" y="170" text-anchor="middle" font-size="14" fill="#9ca3af">▼</text>

  <!-- cross-attn -->
  <rect x="40" y="176" width="390" height="92" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="235" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">② 交叉注意力（query 去图里找物体）</text>
  <text x="54" y="215" font-size="9" fill="#374151"><tspan font-weight="bold">Q=query</tspan>，<tspan font-weight="bold">K/V=图像特征</tspan>（不同主体：一问一答）</text>
  <text x="54" y="231" font-size="9" fill="#374151">→ 物体所在区域权重高（亮）、其余≈0</text>
  <text x="54" y="247" font-size="9" fill="#374151">→ 加权求和把那片区域特征“吸”进 query</text>
  <text x="54" y="262" font-size="8.5" fill="#6b7280">“匹配”= 注意力集中到物体那片软区域</text>

  <text x="235" y="285" text-anchor="middle" font-size="14" fill="#9ca3af">▼</text>
  <rect x="40" y="290" width="390" height="44" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="235" y="308" text-anchor="middle" font-size="10" fill="#6d28d9">FFN 更新 query + 参考框（这一层的结果喂给下一层）</text>
  <text x="235" y="324" text-anchor="middle" font-size="8.5" fill="#6b7280">每层都接一个预测头算辅助损失，逐层由粗到细</text>

  <!-- self vs cross判据 -->
  <rect x="20" y="352" width="430" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="235" y="370" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#374151">自/交叉的唯一判据 = Q 与 K/V 从哪来</text>
  <text x="34" y="388" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#b45309">自注意力</tspan>：同一组（query↔query、编码器图像↔图像）</text>
  <text x="34" y="403" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#1e40af">交叉注意力</tspan>：不同两组（query 当Q ← 图像当K/V）= 不同主体</text>

  <!-- why L times arrow -->
  <text x="235" y="430" text-anchor="middle" font-size="9" fill="#6b7280">为何重复 L 次：一次看不准 → 看·猜·纠·再看，逐轮对焦 + 反复协商分工</text>

  <!-- ===== right: L-layer refinement ladder ===== -->
  <rect x="470" y="44" width="430" height="220" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="685" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">L 次迭代精修（看一个 query 的框逐层收紧）</text>
  <!-- layer boxes coarse to fine -->
  <rect x="500" y="80" width="120" height="80" fill="#fff" stroke="#93c5fd"/>
  <rect x="515" y="92" width="80" height="55" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="560" y="174" text-anchor="middle" font-size="9" fill="#374151">第1层：框粗、注意力散</text>
  <text x="640" y="120" font-size="13" fill="#9ca3af">→</text>
  <rect x="660" y="80" width="120" height="80" fill="#fff" stroke="#93c5fd"/>
  <rect x="685" y="98" width="50" height="44" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="720" y="174" text-anchor="middle" font-size="9" fill="#374151">中间层：渐准</text>
  <text x="800" y="120" font-size="13" fill="#9ca3af">→</text>
  <rect x="820" y="80" width="70" height="80" fill="#fff" stroke="#93c5fd"/>
  <rect x="838" y="104" width="34" height="34" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="855" y="174" text-anchor="middle" font-size="9" fill="#15803d">第L层：贴合</text>
  <text x="685" y="200" text-anchor="middle" font-size="9" fill="#374151">第 l 层预测一个参考框 → 第 l+1 层从它出发继续修（DINO/Deformable 显式迭代）</text>
  <text x="685" y="222" text-anchor="middle" font-size="9" fill="#6b7280">query 带着“更准的我是谁/在哪”再问下一层 → 注意力更聚焦 → 框更准</text>
  <text x="685" y="244" text-anchor="middle" font-size="8.5" fill="#b91c1c">类比卷积要分清：卷积核=静态、逐位置滑、出一张特征图、一种模式到处响应；</text>
  <text x="685" y="258" text-anchor="middle" font-size="8.5" fill="#b91c1c">query=动态注意力寻址、一个 query 只认领一个实例、互相竞争（不是滑窗）</text>

  <!-- ===== bottom: training / Hungarian ===== -->
  <rect x="20" y="424" width="880" height="250" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="460" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">随机的 query 如何靠损失最后“精确匹配”——匈牙利一对一 + 梯度自组织</text>

  <text x="40" y="470" font-size="10" fill="#374151"><tspan font-weight="bold">①前向</tspan>：100 个 query → 100 个预测(类别+框)</text>
  <!-- predictions -->
  <rect x="40" y="478" width="180" height="120" rx="6" fill="#fff" stroke="#86efac"/>
  <text x="130" y="494" text-anchor="middle" font-size="9" fill="#6b7280">100 个预测</text>
  <text x="52" y="512" font-size="9" fill="#374151">q7 → 框A, 倾向 car</text>
  <text x="52" y="528" font-size="9" fill="#374151">q41 → 框B, 倾向 person</text>
  <text x="52" y="544" font-size="9" fill="#374151">q88 → 框C, 倾向 truck</text>
  <text x="52" y="560" font-size="9" fill="#9ca3af">q23, q56 … → ∅</text>
  <text x="52" y="584" font-size="8" fill="#6b7280">（q 初始随机，倾向是学出来的）</text>

  <!-- matching arrows -->
  <text x="250" y="524" font-size="10" font-weight="bold" fill="#15803d">②匈牙利</text>
  <text x="246" y="540" font-size="8.5" fill="#374151">代价=分类+L1+GIoU</text>
  <text x="246" y="554" font-size="8.5" fill="#374151">求一对一最优指派</text>
  <line x1="222" y1="510" x2="360" y2="498" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="222" y1="526" x2="360" y2="522" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="222" y1="542" x2="360" y2="546" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- GT -->
  <rect x="362" y="478" width="160" height="100" rx="6" fill="#fff" stroke="#86efac"/>
  <text x="442" y="494" text-anchor="middle" font-size="9" fill="#6b7280">图里 M 个真值(GT)</text>
  <text x="374" y="512" font-size="9" fill="#374151">GT1 car @(..)</text>
  <text x="374" y="528" font-size="9" fill="#374151">GT2 person @(..)</text>
  <text x="374" y="544" font-size="9" fill="#374151">GT3 truck @(..)</text>
  <text x="374" y="566" font-size="8.5" fill="#b91c1c">每个 GT 只配一个 query</text>

  <text x="545" y="500" font-size="10" font-weight="bold" fill="#15803d">③算损失（梯度）</text>
  <text x="545" y="518" font-size="9" fill="#374151">配中的 q：推去预测该 GT 的类别+框</text>
  <text x="545" y="534" font-size="9" fill="#374151">（分类交叉熵 + 框 L1+GIoU 压坐标）</text>
  <text x="545" y="550" font-size="9" fill="#374151">没配中的 q：推向 ∅（无物体）</text>
  <text x="545" y="572" font-size="9" fill="#b91c1c">一物体只奖励一个 q → 一物一框 → 免 NMS</text>

  <line x1="700" y1="588" x2="700" y2="606" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="40" y="610" width="840" height="56" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="460" y="630" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">④反复多张图 → 自组织：本就倾向左下出框的 q 反复被左下 GT 配中 → 梯度强化该倾向 → 学成稳定“专精槽位”</text>
  <text x="460" y="650" text-anchor="middle" font-size="9" fill="#374151">注意：query 不是被焊死到某区域，而是学到“先验/倾向”；推理时靠交叉注意力随实际图像落到真实物体上</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker></defs>
</svg>
