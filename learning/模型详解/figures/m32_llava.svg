<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="'Microsoft YaHei',sans-serif">
  <rect width="680" height="220" fill="#fff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">LLaVA / InternVL：ViT + Projector + LLM</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="80" width="110" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="85" y="102">视觉编码器</text><text x="85" y="120" font-size="10" fill="#6b7280">CLIP ViT</text>
    <rect x="185" y="80" width="110" height="50" rx="6" fill="#fde68a" stroke="#d97706"/><text x="240" y="102">连接器</text><text x="240" y="120" font-size="10" fill="#7c2d12">Projector(MLP)</text>
    <rect x="340" y="80" width="120" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="400" y="102">大语言模型</text><text x="400" y="120" font-size="10" fill="#6d28d9">LLaMA/InternLM</text>
    <rect x="505" y="82" width="120" height="46" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="565" y="104">看图对话</text><text x="565" y="121" font-size="10" fill="#16a34a">问答/推理</text>
  </g>
  <text x="455" y="72" text-anchor="middle" font-size="10" fill="#7c3aed">+ 文本指令 →</text>
  <g stroke="#374151" stroke-width="1.7">
    <line x1="140" y1="105" x2="183" y2="105" marker-end="url(#a25)"/>
    <line x1="295" y1="105" x2="338" y2="105" marker-end="url(#a25)"/>
    <line x1="460" y1="105" x2="503" y2="105" marker-end="url(#a25)"/>
  </g>
  <text x="340" y="170" text-anchor="middle" font-size="11.5" fill="#6b7280">视觉特征经投影对齐到 LLM 输入空间；参数量 7B—70B，需大显存</text>
  <text x="340" y="195" text-anchor="middle" font-size="11" fill="#ef4444">本项目明确不采用（与轻量实时<100ms 目标冲突）；其视觉基座正是 CLIP</text>
  <defs><marker id="a25" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
