<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="340" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">YOLOv1：NMS 去重 + 张量坐标解码到原图</text>

  <!-- 左：NMS -->
  <text x="180" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">① NMS（逐类别）</text>
  <!-- object with 3 boxes -->
  <rect x="70" y="72" width="120" height="90" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="130" y="68" text-anchor="middle" font-size="9.5" fill="#16a34a">保留 0.9</text>
  <rect x="84" y="84" width="120" height="90" fill="none" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="5 3"/><text x="214" y="96" font-size="9" fill="#ef4444">抑0.8</text>
  <rect x="60" y="92" width="110" height="86" fill="none" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="5 3"/><text x="60" y="190" font-size="9" fill="#ef4444">抑0.3</text>
  <text x="180" y="210" text-anchor="middle" font-size="10.5" fill="#374151">①按分数排序 →②取最高(0.9)</text>
  <text x="180" y="226" text-anchor="middle" font-size="10.5" fill="#374151">③删与它 IoU&gt;0.5 的框 →④对剩余重复</text>
  <text x="180" y="244" text-anchor="middle" font-size="10" fill="#6b7280">"保留最自信的，抑制高度重叠的重复框"</text>

  <line x1="370" y1="160" x2="370" y2="60" stroke="#e5e7eb"/>

  <!-- 右：解码 -->
  <text x="540" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b82f6">② 张量坐标解码 → 原图</text>
  <g stroke="#cbd5e1"><rect x="400" y="70" width="120" height="120" fill="#f1f5f9" stroke="#64748b"/>
    <line x1="430" y1="70" x2="430" y2="190"/><line x1="460" y1="70" x2="460" y2="190"/><line x1="490" y1="70" x2="490" y2="190"/>
    <line x1="400" y1="100" x2="520" y2="100"/><line x1="400" y1="130" x2="520" y2="130"/><line x1="400" y1="160" x2="520" y2="160"/></g>
  <rect x="448" y="112" width="40" height="36" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="468" cy="130" r="2.5" fill="#f59e0b"/>
  <text x="460" y="205" text-anchor="middle" font-size="9" fill="#6b7280">(col,row)格 + (tx,ty,tw,th)</text>

  <rect x="540" y="78" width="170" height="104" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="625" y="98" text-anchor="middle" font-size="10" fill="#1d4ed8">解码（数学还原）</text>
  <text x="550" y="118" font-size="9.5" fill="#111827">bx=(col+tx)/S·W</text>
  <text x="550" y="134" font-size="9.5" fill="#111827">by=(row+ty)/S·H</text>
  <text x="550" y="150" font-size="9.5" fill="#111827">bw=tw·W, bh=th·H</text>
  <text x="550" y="168" font-size="9.5" fill="#374151">→ 角点 x1y1x2y2（像素）</text>

  <!-- 底 -->
  <rect x="30" y="262" width="660" height="68" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="48" y="284" font-size="11" fill="#374151">置信度 = P(object)×IoU：P(object)=框内有无目标的概率；训练时有目标框的目标置信度=IoU，无目标=0。</text>
  <text x="48" y="304" font-size="11" fill="#374151">正负平衡：λ_coord=5 放大定位损失、λ_noobj=0.5 压制海量背景框的置信度损失（手动加权）。</text>
  <text x="48" y="323" font-size="11" fill="#b45309">流程：网络输出张量 → 坐标解码(归一化→像素) → 置信度阈值过滤 → NMS → cv2.rectangle 画到原图。</text>
</svg>
