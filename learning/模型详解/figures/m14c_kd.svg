<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="370" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">知识蒸馏（Knowledge Distillation）：软标签传递"暗知识"</text>

  <!-- Teacher model -->
  <rect x="40" y="52" width="220" height="130" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Teacher 模型（大）</text>
  <text x="150" y="92" text-anchor="middle" font-size="10.5" fill="#92400e">ResNet-152 / ViT-L</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#6b7280">参数多、精度高、推理慢</text>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#6b7280">训练完成后冻结</text>
  <text x="150" y="152" text-anchor="middle" font-size="10" fill="#6b7280">（不再更新梯度）</text>

  <!-- Temperature softmax -->
  <rect x="40" y="210" width="220" height="50" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="150" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">softmax(z / τ)</text>
  <text x="150" y="248" text-anchor="middle" font-size="10" fill="#92400e">温度 τ↑ → 软化分布（暗知识更清晰）</text>

  <!-- Teacher arrow to softmax -->
  <line x1="150" y1="182" x2="150" y2="208" stroke="#d97706" stroke-width="1.5" marker-end="url(#at)"/>

  <!-- Soft labels arrow -->
  <line x1="262" y1="235" x2="450" y2="235" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#at)"/>
  <text x="356" y="225" text-anchor="middle" font-size="10" fill="#b45309">软标签（soft labels）</text>

  <!-- Student model -->
  <rect x="452" y="52" width="220" height="130" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="562" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Student 模型（小）</text>
  <text x="562" y="92" text-anchor="middle" font-size="10.5" fill="#1d4ed8">ResNet-18 / MobileNet</text>
  <text x="562" y="110" text-anchor="middle" font-size="10" fill="#6b7280">参数少、需训练</text>
  <text x="562" y="130" text-anchor="middle" font-size="10" fill="#6b7280">目标：学出接近</text>
  <text x="562" y="150" text-anchor="middle" font-size="10" fill="#6b7280">Teacher 的行为</text>

  <!-- Student two outputs -->
  <line x1="562" y1="182" x2="562" y2="208" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Two softmax branches from student -->
  <rect x="452" y="208" width="220" height="32" rx="4" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="562" y="228" text-anchor="middle" font-size="10.5" fill="#0369a1">Student logits z_s</text>

  <!-- Arrow left: soft, τ -->
  <line x1="500" y1="240" x2="470" y2="272" stroke="#d97706" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="452" y="264" font-size="9" fill="#d97706">softmax(z_s/τ)</text>

  <!-- Arrow right: hard, τ=1 -->
  <line x1="620" y1="240" x2="648" y2="272" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="620" y="264" font-size="9" fill="#ef4444">softmax(z_s)</text>

  <!-- KD Loss -->
  <rect x="350" y="272" width="170" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="435" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">L_KD（KL 散度）</text>
  <text x="435" y="309" text-anchor="middle" font-size="10" fill="#6d28d9">τ² × KL(p_T ‖ p_S)</text>

  <!-- CE Loss -->
  <rect x="556" y="272" width="170" height="50" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="641" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">L_CE（交叉熵）</text>
  <text x="641" y="309" text-anchor="middle" font-size="10" fill="#b91c1c">硬标签（one-hot）</text>

  <!-- Arrow from soft labels to KD Loss -->
  <line x1="380" y1="260" x2="400" y2="270" stroke="#d97706" stroke-width="1.3" marker-end="url(#at)"/>

  <!-- Combined loss -->
  <rect x="290" y="336" width="440" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="510" y="354" text-anchor="middle" font-size="11" fill="#065f46">总损失 L = α·L_CE + (1−α)·τ²·L_KD　（典型 α=0.1, τ=4）</text>

  <g stroke="#374151" stroke-width="1.3" marker-end="url(#a)">
    <line x1="435" y1="322" x2="450" y2="334"/>
    <line x1="641" y1="322" x2="570" y2="334"/>
  </g>

  <!-- Shared input -->
  <rect x="340" y="52" width="100" height="40" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="390" y="72" text-anchor="middle" font-size="10">同一批</text>
  <text x="390" y="86" text-anchor="middle" font-size="10">输入数据</text>
  <g stroke="#374151" stroke-width="1.4" marker-end="url(#a)">
    <line x1="338" y1="72" x2="262" y2="72"/>
    <line x1="440" y1="72" x2="452" y2="72"/>
  </g>

  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#374151"/></marker>
    <marker id="at" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d97706"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ef4444"/></marker>
  </defs>
</svg>
