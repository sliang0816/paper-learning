<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="'Microsoft YaHei',sans-serif">
  <rect width="840" height="480" fill="#fff"/>
  <text x="420" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">FCN 怎么上采样：转置卷积（可学习）+ 由粗到细的跳跃融合</text>
  <text x="420" y="46" text-anchor="middle" font-size="11" fill="#6b7280">把粗特征图放大回原图分辨率，做逐像素预测</text>

  <!-- A: transposed conv 1D example -->
  <rect x="20" y="60" width="800" height="158" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="36" y="82" font-size="13" font-weight="bold" fill="#1d4ed8">① 核心：转置卷积（反卷积）——每个输入值"盖"一个核，错位叠加 → 变大（且权重可学）</text>
  <text x="36" y="104" font-size="10.5" fill="#374151">1D 例：输入 [2, 3]，核 [1,2,1]，步长 2 → 输出长度 5</text>
  <g font-size="11" text-anchor="middle">
    <!-- input -->
    <rect x="60" y="116" width="34" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="77" y="134">2</text>
    <rect x="98" y="116" width="34" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="115" y="134">3</text>
    <text x="96" y="158" font-size="9" fill="#6b7280">输入(2个)</text>
  </g>
  <text x="160" y="120" font-size="9.5" fill="#1d4ed8">2 盖核 → [2,4,2] 放在位置 0-2</text>
  <text x="160" y="136" font-size="9.5" fill="#1d4ed8">3 盖核 → [3,6,3] 放在位置 2-4（错开步长2）</text>
  <text x="160" y="152" font-size="9.5" fill="#b91c1c">位置2 重叠相加：2+3=5</text>
  <g font-size="11" text-anchor="middle">
    <rect x="430" y="170" width="34" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="447" y="188">2</text>
    <rect x="468" y="170" width="34" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="485" y="188">4</text>
    <rect x="506" y="170" width="34" height="26" fill="#fde68a" stroke="#ca8a04"/><text x="523" y="188">5</text>
    <rect x="544" y="170" width="34" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="561" y="188">6</text>
    <rect x="582" y="170" width="34" height="26" fill="#bbf7d0" stroke="#16a34a"/><text x="599" y="188">3</text>
    <text x="523" y="212" font-size="9" fill="#374151">输出(5个)：[2,4,5,6,3] —— 2 个 → 5 个，放大了</text>
  </g>
  <text x="640" y="120" font-size="9.5" fill="#374151">等价视角：输入间</text>
  <text x="640" y="135" font-size="9.5" fill="#374151">插零 → 再做普通卷积</text>
  <text x="640" y="158" font-size="9" fill="#16a34a">2D 同理：stride2 转置卷积</text>
  <text x="640" y="173" font-size="9" fill="#16a34a">把 H×W 放大约 2 倍</text>

  <!-- B: bilinear init -->
  <rect x="20" y="226" width="380" height="74" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="36" y="248" font-size="12.5" font-weight="bold" fill="#15803d">② 初始化 = 双线性插值</text>
  <text x="36" y="268" font-size="10" fill="#374151">转置卷积的权重常初始化成"双线性插值核"，</text>
  <text x="36" y="284" font-size="10" fill="#374151">开局就是平滑放大，再让它从数据里继续学。</text>

  <!-- C: alternatives -->
  <rect x="420" y="226" width="400" height="74" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="436" y="248" font-size="12.5" font-weight="bold" fill="#c2410c">③ 其它上采样法</text>
  <text x="436" y="268" font-size="10" fill="#374151">• 双线性/最近邻插值（固定、不学习）</text>
  <text x="436" y="284" font-size="10" fill="#374151">• 反池化 unpooling（记住池化位置再填回，SegNet 用）</text>

  <!-- D: coarse to fine -->
  <rect x="20" y="308" width="800" height="160" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="36" y="330" font-size="13" font-weight="bold" fill="#7c3aed">④ 由粗到细：跳跃融合（FCN-32s → 16s → 8s）——光放大太糊，融合浅层细节才清晰</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="60" y="346" width="80" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="100" y="362">7×7 预测</text><text x="100" y="374" font-size="8">(最深、最粗)</text>
    <!-- 32s -->
    <rect x="200" y="342" width="120" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/><text x="260" y="357">FCN-32s：直接×32</text>
    <text x="200" y="378" font-size="8.5" fill="#b91c1c" text-anchor="start">→ 224×224，很糊、块状</text>
    <!-- 16s -->
    <rect x="200" y="392" width="170" height="20" rx="3" fill="#fef9c3" stroke="#ca8a04"/><text x="285" y="407">FCN-16s：×2 后 + pool4 预测</text>
    <text x="380" y="407" font-size="8.5" fill="#a16207" text-anchor="start">→ 再×16，较细</text>
    <!-- 8s -->
    <rect x="200" y="430" width="220" height="20" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="310" y="445">FCN-8s：再×2 + pool3 预测</text>
    <text x="430" y="445" font-size="8.5" fill="#15803d" text-anchor="start">→ 再×8，最清晰</text>
  </g>
  <text x="560" y="360" font-size="10" fill="#374151">思路：深层"语义强但粗" + 浅层</text>
  <text x="560" y="376" font-size="10" fill="#374151">"分辨率高有边界细节" → 逐级相加融合</text>
  <text x="560" y="396" font-size="10" fill="#7c3aed">和 U-Net 跳跃连接、FPN 多尺度</text>
  <text x="560" y="412" font-size="10" fill="#7c3aed">融合同源（语义+细节）</text>
  <text x="36" y="462" font-size="9.5" fill="#6b7280">小结：先用转置卷积把粗预测放大，再把放大结果与更浅层（pool4/pool3）的预测相加，逐级细化 → 边界清晰的分割图。</text>
</svg>
