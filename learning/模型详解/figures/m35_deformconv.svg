<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="'Microsoft YaHei',sans-serif">
  <rect width="760" height="390" fill="#fff"/>
  <text x="380" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">可变形卷积：采样点位置可学习偏移</text>

  <!-- ── Offset branch architecture (top section) ── -->
  <!-- Input feature map -->
  <rect x="280" y="46" width="200" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="380" y="69" text-anchor="middle" font-size="11">输入特征图</text>

  <!-- Two branches -->
  <line x1="300" y1="82" x2="200" y2="104" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="460" y1="82" x2="560" y2="104" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Offset branch (left) -->
  <rect x="90" y="106" width="210" height="52" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="195" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">并行偏移分支</text>
  <text x="195" y="143" text-anchor="middle" font-size="10" fill="#92400e">3×3 conv → 18 个偏移量 Δpₙ</text>
  <text x="195" y="156" text-anchor="middle" font-size="9.5" fill="#6b7280">（2方向 × 9个采样点）</text>

  <!-- Original grid (right) -->
  <rect x="460" y="106" width="210" height="52" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="565" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">标准采样网格</text>
  <text x="565" y="143" text-anchor="middle" font-size="10" fill="#1d4ed8">规则 3×3（固定 9 点）</text>
  <text x="565" y="156" text-anchor="middle" font-size="9.5" fill="#6b7280">整数位置 pₙ</text>

  <!-- Combine arrow -->
  <line x1="300" y1="132" x2="390" y2="186" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#ay)"/>
  <line x1="460" y1="132" x2="390" y2="186" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#ab)"/>
  <text x="320" y="175" font-size="9.5" fill="#b45309">pₙ + Δpₙ</text>

  <!-- Bilinear interp box -->
  <rect x="240" y="188" width="280" height="44" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="380" y="208" text-anchor="middle" font-size="11" fill="#065f46">双线性插值（Bilinear Interpolation）</text>
  <text x="380" y="224" text-anchor="middle" font-size="10" fill="#6b7280">非整数位置可微采样，支持反向传播</text>

  <!-- Arrow to output -->
  <line x1="380" y1="232" x2="380" y2="248" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="262" text-anchor="middle" font-size="10.5" fill="#374151">偏移后特征输出（采样点自适应贴合目标形状）</text>

  <!-- Divider -->
  <line x1="30" y1="276" x2="730" y2="276" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Grid comparison section (shifted from original) -->
  <text x="185" y="298" text-anchor="middle" font-size="12" fill="#3b82f6">标准卷积（固定 3×3 网格）</text>
  <text x="575" y="298" text-anchor="middle" font-size="12" fill="#16a34a">可变形卷积（+学习偏移 Δp）</text>

  <!-- Regular grid dots -->
  <g fill="#3b82f6">
    <circle cx="130" cy="320" r="6"/><circle cx="185" cy="320" r="6"/><circle cx="240" cy="320" r="6"/>
    <circle cx="130" cy="350" r="6"/><circle cx="185" cy="350" r="6"/><circle cx="240" cy="350" r="6"/>
    <circle cx="130" cy="380" r="6"/><circle cx="185" cy="380" r="6"/><circle cx="240" cy="380" r="6"/>
  </g>

  <!-- Deformed dots (with faint reference) -->
  <g fill="#bbf7d0" opacity="0.55">
    <circle cx="456" cy="320" r="4"/><circle cx="510" cy="320" r="4"/><circle cx="560" cy="320" r="4"/>
    <circle cx="456" cy="352" r="4"/><circle cx="510" cy="352" r="4"/><circle cx="560" cy="352" r="4"/>
    <circle cx="456" cy="380" r="4"/><circle cx="510" cy="380" r="4"/><circle cx="560" cy="380" r="4"/>
  </g>
  <g fill="#16a34a">
    <circle cx="442" cy="312" r="6"/><circle cx="516" cy="328" r="6"/><circle cx="568" cy="314" r="6"/>
    <circle cx="434" cy="355" r="6"/><circle cx="508" cy="348" r="6"/><circle cx="578" cy="360" r="6"/>
    <circle cx="460" cy="385" r="6"/><circle cx="520" cy="374" r="6"/><circle cx="558" cy="388" r="6"/>
  </g>

  <!-- Bottom note -->
  <text x="380" y="407" text-anchor="middle" font-size="10.5" fill="#6b7280">DCN v2 进一步增加调制权重 mₙ∈[0,1]；本项目优先 CBAM（部署更简单，ONNX/TensorRT 支持完善）</text>

  <defs>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d97706"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
