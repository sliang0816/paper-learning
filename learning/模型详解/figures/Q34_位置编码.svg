<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Microsoft YaHei',sans-serif">
  <rect width="780" height="440" fill="#fff"/>
  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">为什么还要位置编码：点积只看"内容相关性"，天生分不清词序</text>

  <!-- 上：问题 -->
  <text x="390" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">问题：自注意力对"打乱顺序"无感（把输入当集合，不是序列）</text>

  <!-- 句1 -->
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#374151">句① "我 爱 你"</text>
  <g font-size="11" text-anchor="middle">
    <rect x="70" y="90" width="46" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="93" y="110">我</text>
    <rect x="127" y="90" width="46" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="150" y="110">爱</text>
    <rect x="184" y="90" width="46" height="30" rx="5" fill="#fce7f3" stroke="#db2777"/><text x="207" y="110">你</text>
  </g>
  <!-- 句2 -->
  <text x="600" y="80" text-anchor="middle" font-size="11" fill="#374151">句② "你 爱 我"</text>
  <g font-size="11" text-anchor="middle">
    <rect x="520" y="90" width="46" height="30" rx="5" fill="#fce7f3" stroke="#db2777"/><text x="543" y="110">你</text>
    <rect x="577" y="90" width="46" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="110">爱</text>
    <rect x="634" y="90" width="46" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="657" y="110">我</text>
  </g>

  <text x="390" y="142" text-anchor="middle" font-size="10.5" fill="#374151">两句用的是<tspan font-weight="bold">同一批 token</tspan>，只是顺序不同。点积 qᵢ·kⱼ 只取决于"我/爱/你"的<tspan font-weight="bold">内容</tspan>，与它们排第几无关——</text>
  <text x="390" y="160" text-anchor="middle" font-size="10.5" fill="#b91c1c">→ 两句算出的注意力权重、每个词的输出表示<tspan font-weight="bold">完全相同</tspan> → 模型分不清"谁爱谁" ✗</text>

  <!-- 公式说明 -->
  <rect x="60" y="174" width="660" height="40" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="76" y="190" font-size="10" fill="#374151">数学上：把输入 token 顺序打乱(置换)，Q/K/V 的行同样打乱，softmax(QKᵀ)V 的输出也只是<tspan font-weight="bold">跟着打乱</tspan>，每个 token 自身的结果不变。</text>
  <text x="76" y="206" font-size="10" fill="#6b7280">这叫"置换等变(permutation-equivariant)"——注意力把输入看成一<tspan font-weight="bold">袋</tspan>词(bag of tokens)，丢失了顺序信息。</text>

  <line x1="60" y1="226" x2="720" y2="226" stroke="#e5e7eb"/>

  <!-- 下：解法 -->
  <text x="390" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">解法：在进入 Q/K/V 之前，给每个 token 加上"位置编码"</text>

  <g font-size="10" text-anchor="middle">
    <rect x="120" y="262" width="90" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="165" y="278">词嵌入</text><text x="165" y="290" font-size="8" fill="#6b7280">"我"的含义</text>
    <text x="222" y="284" font-size="16" fill="#374151">+</text>
    <rect x="234" y="262" width="90" height="34" rx="5" fill="#fff7ed" stroke="#f59e0b"/><text x="279" y="278">位置编码</text><text x="279" y="290" font-size="8" fill="#a16207">"第1位"的向量</text>
    <text x="336" y="284" font-size="16" fill="#374151">=</text>
    <rect x="350" y="262" width="110" height="34" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="405" y="278">带位置的输入 x₁</text><text x="405" y="290" font-size="8" fill="#6b7280">→ 再投影出 q₁/k₁/v₁</text>
  </g>
  <text x="590" y="282" font-size="10" fill="#15803d">现在 q,k 同时携带</text>
  <text x="590" y="296" font-size="10" fill="#15803d">内容 + 位置信息</text>

  <text x="390" y="320" text-anchor="middle" font-size="10.5" fill="#374151">于是 "我"(第1位) 与 "我"(第3位) 的向量不同 → qᵢ·kⱼ 既看内容也看位置 → 两句话可区分 ✓</text>

  <!-- 三种实现 -->
  <rect x="60" y="332" width="660" height="40" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="76" y="348" font-size="10" fill="#374151">常见实现：① <tspan font-weight="bold">正弦位置编码</tspan>(原始 Transformer，sin/cos，支持外推、隐含相对位置)；</text>
  <text x="76" y="364" font-size="10" fill="#374151">② <tspan font-weight="bold">可学习绝对位置</tspan>(BERT/ViT)；③ <tspan font-weight="bold">相对位置 / RoPE 旋转位置</tspan>(现代 LLM，直接编码"相对距离")。</text>

  <!-- 底注 -->
  <rect x="60" y="384" width="660" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="76" y="404" font-size="10.5" fill="#374151">本质：这是<tspan font-weight="bold">并行的代价</tspan>。RNN 按顺序一个个读，顺序天然编码在递推里；Transformer 为了并行(见 Q31)抛弃了递推，</text>
  <text x="76" y="422" font-size="10.5" fill="#374151">也就丢了顺序 → 必须把位置信息<tspan font-weight="bold">显式加回来</tspan>。ViT 同理：图像 patch 也要加位置编码，否则分不清左上和右下。</text>
</svg>
