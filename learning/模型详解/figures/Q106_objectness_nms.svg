<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="640" fill="#fff"/>
  <text x="470" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Q106 objectness 具体怎么 NMS——按分数排序→最高分称王→压掉与它 IoU 超阈值的重复框</text>

  <!-- ① 算法 -->
  <rect x="20" y="44" width="440" height="200" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="240" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">① 贪心 NMS 算法（IoU 阈值如 0.5）</text>
  <text x="36" y="88" font-size="9.5" fill="#374151">1. 所有框按 objectness 从高到低排序</text>
  <text x="36" y="110" font-size="9.5" fill="#374151">2. 取当前分最高的框 M → 放进"保留列表"</text>
  <text x="36" y="132" font-size="9.5" fill="#374151">3. 算 M 与剩下每个框的 IoU：</text>
  <text x="54" y="150" font-size="9.5" fill="#b91c1c">凡 IoU &gt; 0.5 的框全删掉（= M 的重复框）</text>
  <text x="36" y="172" font-size="9.5" fill="#374151">4. 回到 2，在剩下的框里再取分最高，重复</text>
  <text x="36" y="194" font-size="9.5" fill="#374151">5. 直到没框可取 → 保留列表 = 最终输出</text>
  <text x="36" y="220" font-size="9" fill="#15803d">直觉：分最高的框"称王"，把周围重叠太多的</text>
  <text x="36" y="234" font-size="9" fill="#15803d">复制品清掉；再在剩下框里选次高的王，往复</text>

  <!-- ② 例子布局图 -->
  <rect x="480" y="44" width="440" height="200" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="700" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">② 5 个框（两簇 = 两个物体）</text>
  <!-- cluster 1 -->
  <rect x="540" y="90" width="90" height="90" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="545" y="86" font-size="8.5" fill="#15803d">B1 0.95 ★留</text>
  <rect x="548" y="98" width="90" height="82" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="612" y="196" font-size="8" fill="#b91c1c">B2 0.90 ✂</text>
  <rect x="554" y="92" width="92" height="93" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="545" y="196" font-size="8" fill="#b91c1c">B3 0.75 ✂</text>
  <!-- cluster 2 -->
  <rect x="760" y="90" width="90" height="90" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="765" y="86" font-size="8.5" fill="#15803d">B4 0.88 ★留</text>
  <rect x="768" y="99" width="86" height="90" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="795" y="196" font-size="8" fill="#b91c1c">B5 0.70 ✂</text>
  <text x="700" y="222" text-anchor="middle" font-size="9" fill="#374151">绿=各簇最高分保留；红虚=与它 IoU&gt;0.5 被压</text>
  <text x="700" y="238" text-anchor="middle" font-size="9" fill="#15803d">最终输出：B1、B4（两物体各留一个最强框）</text>

  <!-- ③ 逐轮 -->
  <rect x="20" y="254" width="900" height="150" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="470" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">③ 逐轮走一遍（排序：B1 0.95 &gt; B2 0.90 &gt; B4 0.88 &gt; B3 0.75 &gt; B5 0.70）</text>
  <text x="40" y="298" font-size="9.5" fill="#374151"><tspan font-weight="bold">第1轮 取 B1（最高）保留：</tspan>算它与其余的 IoU</text>
  <text x="60" y="316" font-size="9" font-family="monospace" fill="#374151">IoU(B1,B2): 交=95×90=8550, 并=10000+9000−8550=10450 → 8550/10450≈0.82 &gt; 0.5 → 删 B2 ✂</text>
  <text x="60" y="332" font-size="9" font-family="monospace" fill="#374151">IoU(B1,B3)≈0.75 &gt; 0.5 → 删 B3 ✂　　IoU(B1,B4)=0 保留　　IoU(B1,B5)=0 保留</text>
  <text x="40" y="354" font-size="9.5" fill="#374151"><tspan font-weight="bold">第2轮 取 B4（次高 0.88）保留：</tspan></text>
  <text x="60" y="372" font-size="9" font-family="monospace" fill="#374151">IoU(B4,B5)≈0.85 &gt; 0.5 → 删 B5 ✂　　剩下：无 → 结束</text>
  <text x="40" y="394" font-size="9.5" font-weight="bold" fill="#15803d">→ 最终保留 B1、B4。分数负责"谁是代表"，IoU 负责"谁是它的重复"。</text>

  <!-- ④ 两关键点 + YOLOv8 -->
  <rect x="20" y="414" width="440" height="150" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="240" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">④ 两个关键点</text>
  <text x="36" y="458" font-size="9.5" fill="#374151">· objectness 只是"排序分数"，全程不看类别</text>
  <text x="50" y="474" font-size="9" fill="#b91c1c">→ 无类别也能跑 = 类无关 NMS</text>
  <text x="36" y="496" font-size="9.5" fill="#374151">· IoU 阈值是权衡超参：</text>
  <text x="50" y="512" font-size="9" fill="#6b7280">调低(0.3)压太狠→近邻真物体误删</text>
  <text x="50" y="528" font-size="9" fill="#6b7280">调高(0.7)压不净→重复框残留</text>
  <text x="36" y="550" font-size="9" fill="#374151">默认常用 0.5~0.7</text>

  <rect x="480" y="414" width="440" height="150" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="700" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">⑤ 落到 YOLOv8 的细节（要准确）</text>
  <text x="496" y="458" font-size="9.5" fill="#374151">YOLOv8 anchor-free，已去掉独立 objectness</text>
  <text x="496" y="474" font-size="9.5" fill="#374151">分支（经典 v1–v5 才有 objectness=P(物)×IoU）</text>
  <text x="496" y="496" font-size="9.5" fill="#15803d">→ YOLOv8 排序分数 = 各框"最高类别置信度"</text>
  <text x="496" y="518" font-size="9.5" fill="#374151">但算法一模一样，只是把 objectness 换成</text>
  <text x="496" y="534" font-size="9.5" fill="#374151">"最高类分"。都是"给框打总分再压重叠"</text>
  <text x="496" y="556" font-size="9" fill="#6b7280">变体 Soft-NMS：不硬删，按 IoU 给分数打折</text>

  <!-- 一句话 -->
  <rect x="20" y="574" width="900" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="470" y="596" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">一句话：NMS = 按分数排序 → 最高分框称王 → 与它 IoU 超阈值的框当重复删掉 → 在剩下里再选王，循环到空。</text>
  <text x="470" y="614" text-anchor="middle" font-size="9.5" fill="#374151">分数用 objectness（经典 YOLO）还是最高类分（YOLOv8）都行，流程不变。</text>
</svg>
