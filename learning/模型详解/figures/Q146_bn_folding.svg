<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="'Microsoft YaHei',sans-serif">
  <rect width="940" height="640" fill="#fff"/>
  <text x="470" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q146 BN 折叠：推理时 BN=固定仿射 a·x+b，与卷积(也是线性)合并成一个卷积 → 运行时 BN 消失、零成本</text>

  <!-- ① BN塌成常数仿射 -->
  <rect x="20" y="42" width="900" height="130" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="470" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">① 推理时 BN 塌成"每通道固定仿射"（μ/σ²/γ/β 全冻结成常数）</text>
  <text x="470" y="94" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#374151">BN(x) = γ·(x−μ)/√(σ²+ε) + β</text>
  <text x="470" y="122" text-anchor="middle" font-size="13" font-family="Consolas,monospace" font-weight="bold" fill="#15803d">= a·x + b</text>
  <text x="300" y="150" font-size="9.5" font-family="Consolas,monospace" fill="#6d28d9">a = γ/√(σ²+ε)</text>
  <text x="520" y="150" font-size="9.5" font-family="Consolas,monospace" fill="#6d28d9">b = β − γμ/√(σ²+ε)</text>
  <text x="470" y="166" text-anchor="middle" font-size="9" fill="#6b7280">a、b 每通道一对，不随输入变（推理用滑动平均的全局 μ/σ²，训练时它俩每批都变、不算常数）</text>

  <!-- ② 折叠 -->
  <rect x="20" y="184" width="900" height="200" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="470" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">② 卷积也是线性 → 两个线性合成一个卷积</text>
  <text x="40" y="234" font-size="10" font-family="Consolas,monospace" fill="#374151">Conv:  y = W*x + bias</text>
  <text x="40" y="258" font-size="10" font-family="Consolas,monospace" fill="#374151">BN(y) = a·(W*x + bias) + b = (a·W)*x + (a·bias + b)</text>
  <text x="40" y="286" font-size="10.5" font-family="Consolas,monospace" font-weight="bold" fill="#15803d">→ 新卷积：W' = a·W，  bias' = a·bias + b</text>
  <text x="40" y="316" font-size="9.5" fill="#374151">小数字例（某通道 bias=0，BN: μ=2 σ=2 γ=3 β=1）：</text>
  <text x="56" y="338" font-size="9.5" font-family="Consolas,monospace" fill="#6d28d9">a=γ/σ=1.5   b=β−γμ/σ=1−3=−2   →   W'=1.5·W   bias'=−2</text>
  <text x="56" y="362" font-size="9.5" fill="#15803d">新卷积 1.5·(W*x)−2 与原 Conv→BN 输出完全相等 ✓</text>

  <!-- ③ 零成本 -->
  <rect x="20" y="396" width="440" height="150" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="240" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">③ 为什么"零成本"</text>
  <text x="36" y="444" font-size="9.5" fill="#374151">· a、b 是常数 → W'、bias' 也是常数</text>
  <text x="36" y="466" font-size="9.5" fill="#374151">· <tspan font-weight="bold">导出时离线算一次</tspan>，写进卷积权重</text>
  <text x="36" y="488" font-size="9.5" fill="#15803d">· 运行时计算图里<tspan font-weight="bold">根本没有 BN 层了</tspan></text>
  <text x="36" y="510" font-size="9.5" fill="#374151">· 卷积照做一次乘加，BN 已焊进权重</text>
  <text x="36" y="532" font-size="9" fill="#6b7280">ONNX/TensorRT 导出自动做（标准图优化）</text>

  <!-- ④ 只有推理能折 -->
  <rect x="480" y="396" width="440" height="150" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="700" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">④ 只有推理能折、LN 折不了（接 Q144）</text>
  <text x="496" y="444" font-size="9.5" fill="#374151">· <tspan font-weight="bold">训练不能折</tspan>：μ/σ² 从当前 batch 现算、每批变，</text>
  <text x="512" y="462" font-size="9.5" fill="#374151">a、b 非常数 → 无法预合并</text>
  <text x="496" y="488" font-size="9.5" fill="#374151">· <tspan font-weight="bold">LN 折不了</tspan>：推理时均值方差也从当前输入</text>
  <text x="512" y="506" font-size="9.5" fill="#374151">现算（每样本各算，Q143）→ 不是常数</text>
  <text x="496" y="530" font-size="9" fill="#b91c1c">→ BN 推理统计是"死的"(可折)、LN 是"活的"(不可折)</text>

  <!-- 一句话 -->
  <rect x="20" y="558" width="900" height="66" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="470" y="582" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a16207">一句话：推理时 BN=固定仿射 a·x+b（常数），卷积也是线性，两个线性合并成一个卷积（W'=a·W, bias'=a·bias+b）；</text>
  <text x="470" y="602" text-anchor="middle" font-size="9.5" fill="#374151">导出时离线折一次，运行时 BN 层消失、零额外计算 → 这就是 Q144"BN 推理免费"的机制。</text>
  <text x="470" y="620" text-anchor="middle" font-size="9" fill="#6b7280">LN 推理统计随输入现算、不是常数，折不进卷积，每次前向都得实算——这是 BN/LN 的推理成本差异根源。</text>
</svg>
