<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#fff"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">LSTM 单元：细胞状态 + 三个门</text>
  <!-- cell box -->
  <rect x="120" y="60" width="430" height="200" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- cell state highway -->
  <line x1="120" y1="95" x2="550" y2="95" stroke="#16a34a" stroke-width="4"/>
  <text x="135" y="86" font-size="12" fill="#16a34a">C₍ₜ₋₁₎</text>
  <text x="520" y="86" font-size="12" fill="#16a34a">Cₜ</text>
  <!-- forget gate -->
  <circle cx="220" cy="95" r="15" fill="#fee2e2" stroke="#ef4444"/><text x="220" y="100" text-anchor="middle" font-size="14">×</text>
  <text x="220" y="142" text-anchor="middle" font-size="11" fill="#ef4444">遗忘门 fₜ</text>
  <line x1="220" y1="168" x2="220" y2="110" stroke="#ef4444" stroke-width="1.3" marker-end="url(#a2)"/>
  <!-- input gate -->
  <circle cx="330" cy="95" r="15" fill="#dbeafe" stroke="#3b82f6"/><text x="330" y="100" text-anchor="middle" font-size="14">+</text>
  <text x="330" y="142" text-anchor="middle" font-size="11" fill="#3b82f6">输入门 iₜ</text>
  <line x1="330" y1="168" x2="330" y2="110" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#a2)"/>
  <!-- output gate -->
  <circle cx="460" cy="95" r="15" fill="#fef9c3" stroke="#f59e0b"/><text x="460" y="100" text-anchor="middle" font-size="13">×</text>
  <text x="460" y="142" text-anchor="middle" font-size="11" fill="#b45309">输出门 oₜ</text>
  <!-- gate formulas band (4 equations) -->
  <rect x="138" y="174" width="394" height="72" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="335" y="193" text-anchor="middle" font-size="10.5" fill="#4338ca">fₜ = σ(Wf·[h,x])（遗忘门）　　iₜ = σ(Wi·[h,x])（输入门）</text>
  <text x="335" y="211" text-anchor="middle" font-size="10.5" fill="#4338ca">C̃ₜ = tanh(Wc·[h,x])（候选值）　oₜ = σ(Wo·[h,x])（输出门）</text>
  <text x="335" y="230" text-anchor="middle" font-size="10.5" fill="#16a34a">Cₜ = fₜ⊙C_{t-1} + iₜ⊙C̃ₜ（加法更新，梯度高速路）</text>
  <text x="335" y="242" text-anchor="middle" font-size="9.5" fill="#6b7280">简写: h = [h_{t-1}, x_t]</text>
  <!-- inputs/outputs -->
  <text x="60" y="245" font-size="13" fill="#374151">h₍ₜ₋₁₎, xₜ</text>
  <line x1="120" y1="240" x2="160" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="460" y1="110" x2="460" y2="258" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="500" y="267" font-size="12" fill="#b45309">hₜ = oₜ·tanh(Cₜ)</text>
  <text x="330" y="322" text-anchor="middle" font-size="11.5" fill="#6b7280">细胞状态以"加法"更新 → 梯度沿绿色高速路无损回传（缓解梯度消失）</text>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#6b7280">与 ResNet 残差连接同理；CLIP 文本编码器用 Transformer 取代 LSTM</text>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
