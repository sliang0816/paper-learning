<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Microsoft YaHei',sans-serif">
  <rect width="820" height="460" fill="#fff"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">C2f：拆两路 + 每个瓶颈块输出都拼接（比 C3 梯度通路更多、更省）</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#6b7280">C2f = CSP Bottleneck with 2 convs, faster —— YOLOv8 骨干/颈部的核心积木</text>

  <!-- C2f -->
  <text x="410" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">① C2f 数据流</text>
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="92" width="70" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="75" y="113">输入</text>
    <rect x="130" y="92" width="70" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="165" y="108">1×1</text><text x="165" y="121" font-size="8">卷积</text>
    <text x="245" y="86" font-size="9" fill="#6b7280">split 两半</text>
    <!-- branch A kept -->
    <rect x="230" y="92" width="86" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04"/><text x="273" y="111">分支A（直接留）</text>
    <!-- bottlenecks -->
    <rect x="230" y="150" width="74" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="267" y="169">Bottleneck₁</text>
    <rect x="330" y="150" width="74" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="367" y="169">Bottleneck₂</text>
    <rect x="430" y="150" width="74" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="467" y="169">…Bottleneckₙ</text>
    <!-- concat -->
    <rect x="540" y="120" width="84" height="34" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="582" y="137">Concat</text><text x="582" y="149" font-size="8">A,B₁,B₂,…,Bₙ</text>
    <rect x="650" y="120" width="64" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="682" y="135">1×1</text><text x="682" y="148" font-size="8">卷积→输出</text>
  </g>
  <!-- arrows C2f -->
  <g stroke="#16a34a" stroke-width="1.3" fill="none" marker-end="url(#g)">
    <line x1="110" y1="109" x2="128" y2="109"/>
    <line x1="200" y1="105" x2="228" y2="103"/>
    <line x1="200" y1="113" x2="228" y2="160"/>
    <line x1="304" y1="165" x2="328" y2="165"/>
    <line x1="404" y1="165" x2="428" y2="165"/>
  </g>
  <!-- every bottleneck output to concat (dense) -->
  <g stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 2" fill="none" marker-end="url(#p)">
    <line x1="316" y1="107" x2="540" y2="128"/>
    <line x1="267" y1="180" x2="545" y2="140"/>
    <line x1="367" y1="180" x2="548" y2="144"/>
    <line x1="504" y1="160" x2="540" y2="148"/>
  </g>
  <line x1="624" y1="137" x2="648" y2="137" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#p)"/>
  <text x="410" y="200" text-anchor="middle" font-size="9" fill="#7c3aed">关键：每个 Bottleneck 的输出都单独引一份去 Concat（稠密复用，像 DenseNet）</text>

  <!-- Bottleneck detail -->
  <rect x="40" y="216" width="360" height="100" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="220" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">② 一个 Bottleneck 内部</text>
  <text x="56" y="258" font-size="10" fill="#374151">3×3 卷积 → 3×3 卷积，再加残差捷径 +x（见 09 ResNet）</text>
  <text x="56" y="278" font-size="10" fill="#374151">骨干里 shortcut=True（有残差），颈部里 =False</text>
  <text x="56" y="300" font-size="10" fill="#16a34a">残差 = 梯度高速路，利于训练深网络、利于小目标</text>

  <!-- C3 vs C2f -->
  <rect x="416" y="216" width="380" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="606" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">③ 相比 YOLOv5 的 C3 改进在哪</text>
  <text x="432" y="258" font-size="10" fill="#374151">C3：瓶颈分支只把<tspan font-weight="bold">最终结果</tspan>拼一次，且有 3 个卷积</text>
  <text x="432" y="278" font-size="10" fill="#374151">C2f：split 省算 + <tspan font-weight="bold">每个瓶颈输出都拼</tspan> + 少一个卷积</text>
  <text x="432" y="300" font-size="10" fill="#1d4ed8">→ 梯度通路更多、特征复用更足、参数更少、更快（f=faster）</text>

  <!-- bottom -->
  <rect x="40" y="328" width="756" height="118" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="56" y="350" font-size="11" font-weight="bold" fill="#374151">三层来历，正好串起 CNN 几篇：</text>
  <text x="56" y="372" font-size="10.5" fill="#374151">• <tspan font-weight="bold">CSP（跨阶段部分连接）</tspan>：分两路，只一路过重计算再合并 → 省一半算力又不丢梯度流。</text>
  <text x="56" y="392" font-size="10.5" fill="#374151">• <tspan font-weight="bold">Bottleneck 残差</tspan>：两个 3×3 + 捷径（[09 ResNet]）→ 梯度不消失。</text>
  <text x="56" y="412" font-size="10.5" fill="#374151">• <tspan font-weight="bold">稠密拼接</tspan>：保留每个瓶颈中间输出（[10 DenseNet] 的 concat 复用，[Q7] 的通道拼接）。</text>
  <text x="56" y="432" font-size="10" fill="#6b7280">为什么 YOLOv8 用它：丰富梯度流对小目标/难样本友好（呼应本课题小目标抛洒物），且轻量利于实时部署。</text>

  <defs>
    <marker id="g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/></marker>
    <marker id="p" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
