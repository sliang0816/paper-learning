<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="230" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">SSD：在多个尺度特征图上同时预测</text>
  <rect x="20" y="90" width="70" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="55" y="124" text-anchor="middle" font-size="11">输入</text>
  <g font-size="10" text-anchor="middle">
    <rect x="120" y="80" width="56" height="64" fill="#dbeafe" stroke="#3b82f6"/><text x="148" y="116">38²</text><text x="148" y="160" fill="#3b82f6">浅层</text>
    <rect x="206" y="86" width="48" height="52" fill="#dbeafe" stroke="#3b82f6"/><text x="230" y="116">19²</text>
    <rect x="284" y="92" width="40" height="40" fill="#bfdbfe" stroke="#3b82f6"/><text x="304" y="116">10²</text>
    <rect x="354" y="96" width="32" height="32" fill="#bfdbfe" stroke="#3b82f6"/><text x="370" y="116">5²</text>
    <rect x="416" y="100" width="24" height="24" fill="#93c5fd" stroke="#3b82f6"/><text x="428" y="116">3²</text>
    <rect x="470" y="103" width="18" height="18" fill="#93c5fd" stroke="#3b82f6"/><text x="479" y="160" fill="#3b82f6">深层</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.2"><line x1="90" y1="120" x2="118" y2="112"/><line x1="176" y1="112" x2="204" y2="112"/><line x1="254" y1="112" x2="282" y2="112"/><line x1="324" y1="112" x2="352" y2="112"/><line x1="386" y1="112" x2="414" y2="112"/><line x1="440" y1="112" x2="468" y2="112"/></g>
  <!-- detection heads -->
  <g stroke="#16a34a" stroke-width="1.4">
    <line x1="148" y1="144" x2="300" y2="185" marker-end="url(#a13)"/>
    <line x1="304" y1="132" x2="340" y2="185" marker-end="url(#a13)"/>
    <line x1="479" y1="121" x2="400" y2="185" marker-end="url(#a13)"/>
  </g>
  <rect x="300" y="186" width="120" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="360" y="206" text-anchor="middle" font-size="12">多尺度检测结果</text>
  <rect x="520" y="80" width="180" height="74" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="610" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">浅层测小目标</text>
  <text x="610" y="122" text-anchor="middle" font-size="11" fill="#7c2d12">深层测大目标</text>
  <text x="610" y="142" text-anchor="middle" font-size="10" fill="#9ca3af">各层独立预测(无FPN融合)</text>
  <defs><marker id="a13" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker></defs>
</svg>
