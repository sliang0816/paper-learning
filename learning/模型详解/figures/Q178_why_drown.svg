<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="'Microsoft YaHei',sans-serif">
  <rect width="980" height="700" fill="#fff"/>
  <text x="490" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Q178 背景项为什么会"淹没"正样本？——损失/梯度是"求和"，多数派主导更新方向</text>

  <!-- 机制①②③ -->
  <rect x="20" y="42" width="300" height="180" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="170" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">① 损失是"逐框求和"</text>
  <text x="35" y="88" font-size="9.4" fill="#374151">L_total = Σ 每个框的损失</text>
  <text x="35" y="108" font-size="9.4" fill="#374151">98个框，每个都往总损失里加一份</text>
  <text x="35" y="128" font-size="9.4" fill="#374151">背景框加的是 (C−0)² 置信度项</text>
  <text x="35" y="152" font-size="9.4" font-weight="bold" fill="#1e40af">② 梯度也是求和</text>
  <text x="35" y="172" font-size="9.4" fill="#374151">∂L/∂θ = Σ 每个框的梯度</text>
  <text x="35" y="192" font-size="9.4" fill="#374151">优化器只按"总梯度"这一个方向更新参数</text>
  <text x="35" y="212" font-size="9" fill="#6b7280">→ 谁贡献的梯度多，就朝谁的方向走</text>

  <rect x="340" y="42" width="300" height="180" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="490" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">③ 数量碾压：95 vs 3</text>
  <text x="355" y="88" font-size="9.4" fill="#374151">一张图98框，通常只有~3个框有目标</text>
  <text x="355" y="108" font-size="9.4" fill="#374151">→ ~95个背景框，齐声喊"置信度压到0"</text>
  <text x="355" y="128" font-size="9.4" fill="#374151">→ 3个正样本喊"置信度提到高IoU"</text>
  <text x="355" y="150" font-size="9.4" fill="#374151">即使每个背景框的梯度不大，</text>
  <text x="355" y="168" font-size="9.4" font-weight="bold" fill="#b91c1c">95份累加的合力 ≫ 3份正样本的合力</text>
  <text x="355" y="190" font-size="9.4" fill="#374151">总梯度方向被"压低置信度"彻底主导</text>
  <text x="355" y="210" font-size="9" fill="#6b7280">这就是"淹没"：少数派信号只是合力上的微扰</text>

  <rect x="660" y="42" width="300" height="180" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="810" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">④ 网络找到的"偷懒最优解"</text>
  <text x="675" y="88" font-size="9.4" fill="#374151">要最快降低那片巨大的背景损失，</text>
  <text x="675" y="108" font-size="9.4" font-weight="bold" fill="#b45309">最省事的办法=把所有框置信度都压到≈0</text>
  <text x="675" y="130" font-size="9.4" fill="#374151">代价：3个正样本本想要高置信度，被一起压低</text>
  <text x="675" y="150" font-size="9.4" fill="#374151">但正样本太少，牺牲它们对总损失几乎无影响</text>
  <text x="675" y="172" font-size="9.4" fill="#374151">→ 网络漂向"什么都不报"这个数值最优点</text>
  <text x="675" y="194" font-size="9.4" font-weight="bold" fill="#b45309">→ 全部漏检(把一切判成背景)</text>
  <text x="675" y="212" font-size="9" fill="#6b7280">损失确实降了，但检测器废了</text>

  <!-- 数值走一遍 -->
  <rect x="20" y="238" width="940" height="26" rx="6" fill="#0f766e"/>
  <text x="490" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">数值走一遍（假设初始每框预测置信度≈0.5，看总损失被谁主导）</text>

  <rect x="20" y="274" width="460" height="130" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="250" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f766e">不加权时（λ都=1）</text>
  <text x="40" y="320" font-size="9.4" fill="#374151" font-family="monospace">背景项 ≈ 95 × (0.5−0)²  = 95×0.25 ≈ 23.75</text>
  <text x="40" y="342" font-size="9.4" fill="#374151" font-family="monospace">正样本置信度项 ≈ 3 × (0.5−IoU)² ≈ 3×0.05 ≈ 0.15</text>
  <text x="40" y="366" font-size="9.4" font-weight="bold" fill="#b91c1c">背景 : 正样本 ≈ 23.75 : 0.15 ≈ 158 : 1</text>
  <text x="40" y="388" font-size="9" fill="#6b7280">总梯度里背景占99%+，正样本几乎不影响更新方向</text>

  <rect x="500" y="274" width="460" height="130" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="730" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">YOLOv1解法：λ_noobj=0.5 压背景话语权</text>
  <text x="520" y="320" font-size="9.4" fill="#374151" font-family="monospace">背景项 ×0.5 → 23.75×0.5 ≈ 11.9</text>
  <text x="520" y="342" font-size="9.4" fill="#374151" font-family="monospace">λ_coord=5 再放大稀少的定位项</text>
  <text x="520" y="366" font-size="9.4" fill="#374151">比例被人为拉回，正样本梯度不再被完全淹没</text>
  <text x="520" y="388" font-size="9" fill="#6b7280">但仍是"一刀切"降权，未区分难易→Focal Loss更优(Q26)</text>

  <!-- 类比 -->
  <rect x="20" y="418" width="940" height="70" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="490" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#a16207">类比：98人投票决定"网络该往哪走"</text>
  <text x="45" y="464" font-size="9.6" fill="#374151">95票喊"所有框都别报目标(置信度=0)"，3票喊"这几个框要报(置信度=高)"。投票结果(梯度求和)由95票的多数派碾压决定。</text>
  <text x="45" y="482" font-size="9.6" fill="#374151">哪怕每个背景票声音很小(易样本、损失不大)，95个小声音加起来照样盖过3个大声音——数量本身就是话语权。</text>

  <!-- 两层原因 -->
  <rect x="20" y="502" width="940" height="90" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="490" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">"淹没"的两层原因合起来</text>
  <text x="45" y="548" font-size="9.6" fill="#374151">·根因=损失/梯度的"可加性" + "数量悬殊"：优化器只认总梯度这一个合力方向，多数派靠数量主导它。</text>
  <text x="45" y="568" font-size="9.6" fill="#374151">·加剧=背景多为"易样本"(明显是背景)，本可几乎不产生梯度，但架不住数量太大，海量微小梯度累加仍压倒少数正样本。</text>
  <text x="45" y="586" font-size="9.6" font-weight="bold" fill="#15803d">→ 正因如此才要 降权(λ_noobj=0.5, Q27) 或 自适应降权(Focal Loss按难易, Q26) 把比例拉回。</text>

  <!-- 一句话 -->
  <rect x="20" y="606" width="940" height="80" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="490" y="628" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f766e">一句话：损失是所有框损失的"求和"，梯度也是求和，参数只朝"总梯度"一个方向更新；95个背景框的损失合力≈正样本的百倍，</text>
  <text x="490" y="648" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f766e">总梯度被"把置信度压到0"主导，网络于是走向"全判背景"这个数值最优点(总损失最小)——代价是3个正样本被一起压死=全漏检。</text>
  <text x="490" y="672" text-anchor="middle" font-size="9.4" fill="#6b7280">"淹没"= 不是背景框单个多凶，而是它们数量太多、求和后的合力盖过了正样本，把更新方向整个带偏。</text>
</svg>
