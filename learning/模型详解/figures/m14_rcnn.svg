<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="'Microsoft YaHei',sans-serif">
  <rect width="720" height="240" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">R-CNN：候选区域 + CNN（两阶段开山，~47 秒/张）</text>

  <!-- 阶段计数标注 -->
  <text x="75"  y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">整图 ×1</text>
  <text x="225" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">每框 ×~2000 ⚠</text>
  <text x="375" y="58" text-anchor="middle" font-size="11" fill="#b45309">每框 ×~2000</text>
  <text x="525" y="58" text-anchor="middle" font-size="11" fill="#b45309">每框 ×~2000</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="20"  y="72" width="110" height="54" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="75" y="94">① Selective Search</text><text x="75" y="112">→ ~2000 候选框</text>
    <rect x="170" y="72" width="110" height="54" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="225" y="94">② 每框单独过</text><text x="225" y="112">CNN 提特征</text>
    <rect x="320" y="72" width="110" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="375" y="94">③ SVM 分类</text><text x="375" y="112">(轻量)</text>
    <rect x="470" y="72" width="110" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="525" y="94">④ 边框回归</text><text x="525" y="112">(轻量)</text>
  </g>
  <g stroke="#374151" stroke-width="1.8">
    <line x1="130" y1="99" x2="168" y2="99" marker-end="url(#a8)"/>
    <line x1="280" y1="99" x2="318" y2="99" marker-end="url(#a8)"/>
    <line x1="430" y1="99" x2="468" y2="99" marker-end="url(#a8)"/>
  </g>
  <rect x="610" y="72" width="90" height="54" rx="6" fill="#fce7f3" stroke="#db2777"/><text x="655" y="103" text-anchor="middle" font-size="12">检测结果</text>
  <line x1="580" y1="99" x2="608" y2="99" stroke="#374151" stroke-width="1.8" marker-end="url(#a8)"/>

  <!-- ②~④ 的循环框 -->
  <rect x="160" y="64" width="430" height="70" rx="8" fill="none" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="375" y="150" text-anchor="middle" font-size="10.5" fill="#ef4444">虚线框内②③④ 对每个候选框各执行一次（共 ~2000 次）</text>

  <rect x="40" y="170" width="640" height="56" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="360" y="191" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">瓶颈在②：CNN 要跑 ~2000 次前向，候选框大量重叠、像素被反复卷积（重复计算）</text>
  <text x="360" y="212" text-anchor="middle" font-size="11" fill="#374151">→ Fast R-CNN 改为 CNN 整图只跑 1 次 + RoI Pooling，把"CNN ×2000"压成"×1"</text>
  <defs><marker id="a8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
</svg>
